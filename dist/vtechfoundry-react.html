con:"shield",layer:"edge",name:"Web Application Firewall",tagline:{en:"Protect login, cart and checkout",vi:"B\u1EA3o v\u1EC7 \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 thanh to\xE1n"},description:{en:"A web application firewall that blocks injection attacks and abusive automation against login, cart and promotion endpoints, supporting PCI DSS web-application controls.",vi:"T\u01B0\u1EDDng l\u1EEDa \u1EE9ng d\u1EE5ng web ch\u1EB7n t\u1EA5n c\xF4ng injection v\xE0 t\u1EF1 \u0111\u1ED9ng h\xF3a l\u1EA1m d\u1EE5ng nh\u1EAFm v\xE0o c\xE1c \u0111i\u1EC3m \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng, khuy\u1EBFn m\xE3i, h\u1ED7 tr\u1EE3 c\xE1c ki\u1EC3m so\xE1t \u1EE9ng d\u1EE5ng web c\u1EE7a PCI DSS."}},{id:"cdn",icon:"globe",layer:"edge",name:"CDN",tagline:{en:"Faster content delivery across Vietnam",vi:"Ph\xE2n ph\u1ED1i n\u1ED9i dung nhanh tr\xEAn to\xE0n Vi\u1EC7t Nam"},description:{en:"Content delivery network that caches video, images and web assets close to viewers, reducing origin load and buffering during traffic peaks.",vi:"M\u1EA1ng ph\xE2n ph\u1ED1i n\u1ED9i dung l\u01B0u \u0111\u1EC7m video, h\xECnh \u1EA3nh v\xE0 t\xE0i nguy\xEAn web g\u1EA7n ng\u01B0\u1EDDi xem, gi\u1EA3m t\u1EA3i m\xE1y ch\u1EE7 g\u1ED1c v\xE0 h\u1EA1n ch\u1EBF gi\u1EADt lag khi l\u01B0u l\u01B0\u1EE3ng t\u0103ng cao."}},{id:"anti-ddos-waf",icon:"shield-alert",layer:"edge",name:"Anti-DDoS & WAF",tagline:{en:"Keep sites up under attack",vi:"Gi\u1EEF website ho\u1EA1t \u0111\u1ED9ng khi b\u1ECB t\u1EA5n c\xF4ng"},description:{en:"Filters DDoS floods and blocks web application attacks so portals, streaming and content platforms stay available and uncompromised.",vi:"L\u1ECDc t\u1EA5n c\xF4ng DDoS v\xE0 ch\u1EB7n t\u1EA5n c\xF4ng \u1EE9ng d\u1EE5ng web \u0111\u1EC3 c\u1ED5ng th\xF4ng tin, streaming v\xE0 n\u1EC1n t\u1EA3ng n\u1ED9i dung lu\xF4n s\u1EB5n s\xE0ng v\xE0 kh\xF4ng b\u1ECB x\xE2m nh\u1EADp."}},{id:"dlp",icon:"shield-check",layer:"data",name:"Data Loss Prevention",tagline:{en:"360\xB0 insider & leak protection",vi:"Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u 360\xB0"},description:{en:"Full 360-degree monitoring across chat apps, personal webmail, and USB drives. It automatically detects sensitive customer records to stop insider fraud, prevent data leaks, and ensure Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB. T\u1EF1 \u0111\u1ED9ng ph\xE1t hi\u1EC7n h\u1ED3 s\u01A1 kh\xE1ch h\xE0ng nh\u1EA1y c\u1EA3m \u0111\u1EC3 ng\u0103n gian l\u1EADn n\u1ED9i b\u1ED9, r\xF2 r\u1EC9 d\u1EEF li\u1EC7u v\xE0 \u0111\u1EA3m b\u1EA3o tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."}},{id:"database-security",icon:"database",layer:"data",name:"Database Security",tagline:{en:"Query-level control & real-time masking",vi:"Ki\u1EC3m so\xE1t truy v\u1EA5n & che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c"},description:{en:"Direct query-level access control and real-time data masking built for Core Banking systems. It stops privileged admin abuse without slowing down live transactions or overloading systems with junk logs.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c d\xE0nh cho h\u1EC7 th\u1ED1ng Core Banking. Ng\u0103n l\u1EA1m quy\u1EC1n qu\u1EA3n tr\u1ECB m\xE0 kh\xF4ng l\xE0m ch\u1EADm giao d\u1ECBch tr\u1EF1c ti\u1EBFp hay tr\xE0n log r\xE1c."}},{id:"ai-legal",icon:"scale",layer:"ai",name:"AI Legal & Compliance",tagline:{en:"AI assistant for contracts & regulation",vi:"Tr\u1EE3 l\xFD AI cho h\u1EE3p \u0111\u1ED3ng & quy \u0111\u1ECBnh"},description:{en:"A specialized AI assistant trained on State Bank of Vietnam regulations with 95% accuracy. It automates loan and contract reviews to cut routine workload by 42%, with an on-premise option to ensure total data privacy.",vi:"Tr\u1EE3 l\xFD AI chuy\xEAn bi\u1EC7t \u0111\u01B0\u1EE3c hu\u1EA5n luy\u1EC7n tr\xEAn quy \u0111\u1ECBnh c\u1EE7a Ng\xE2n h\xE0ng Nh\xE0 n\u01B0\u1EDBc, \u0111\u1ED9 ch\xEDnh x\xE1c 95%. T\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng t\xEDn d\u1EE5ng, gi\u1EA3m 42% kh\u1ED1i l\u01B0\u1EE3ng c\xF4ng vi\u1EC7c th\u01B0\u1EDDng nh\u1EADt, c\xF3 t\xF9y ch\u1ECDn tri\u1EC3n khai on-premise \u0111\u1EC3 \u0111\u1EA3m b\u1EA3o ri\xEAng t\u01B0 d\u1EEF li\u1EC7u tuy\u1EC7t \u0111\u1ED1i."}}],industries:[{id:"bfsi",icon:"landmark",name:{en:"Finance & Banking",vi:"T\xE0i ch\xEDnh & Ng\xE2n h\xE0ng"},title:{en:"Banking, Financial Services & Insurance",vi:"Ng\xE2n h\xE0ng, D\u1ECBch v\u1EE5 T\xE0i ch\xEDnh & B\u1EA3o hi\u1EC3m"},tagline:{en:"VCLOUD & Email Security, AI Legal & Compliance, Data Loss Prevention and Core Banking Database Security.",vi:"VCLOUD & Email Security, AI Legal & Compliance, Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u Core Banking."},bundle:["email-security","database-security","dlp","ai-legal","ai-agent"],image:"https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80",regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"SBV",vi:"Quy \u0111\u1ECBnh c\u1EE7a NHNN"},{en:"PCI DSS",vi:"PCI DSS"}],story:{context:{title:{en:"Salary day: the core system buckles at peak traffic",vi:"Ng\xE0y tr\u1EA3 l\u01B0\u01A1ng: h\u1EC7 th\u1ED1ng l\xF5i qu\xE1 t\u1EA3i \u1EDF gi\u1EDD cao \u0111i\u1EC3m"},body:{en:"At 8 a.m. transfers and card payments spike while heavy privileged queries and noisy logs hit the same Core Banking database. Transactions time out, the app slows down and the call center fills up with customers asking what happened.",vi:"L\xFAc 8 gi\u1EDD s\xE1ng, giao d\u1ECBch chuy\u1EC3n kho\u1EA3n v\xE0 thanh to\xE1n th\u1EBB t\u0103ng v\u1ECDt, trong khi c\xE1c truy v\u1EA5n \u0111\u1EB7c quy\u1EC1n n\u1EB7ng v\xE0 log r\xE1c c\xF9ng \u0111\u1ED5 v\xE0o c\u01A1 s\u1EDF d\u1EEF li\u1EC7u Core Banking. Giao d\u1ECBch qu\xE1 h\u1EA1n, \u1EE9ng d\u1EE5ng ch\u1EADm l\u1EA1i v\xE0 t\u1ED5ng \u0111\xE0i ng\u1EADp trong cu\u1ED9c g\u1ECDi h\u1ECFi chuy\u1EC7n g\xEC \u0111\xE3 x\u1EA3y ra."}},entry:{title:{en:"Stop the entry point before it reaches the core network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng l\xF5i"},body:{en:"Query-level control keeps unauthorized and junk requests off Core Banking, so live transactions stay fast. AI Agents absorb the customer questions instantly instead of the call center.",vi:"Ki\u1EC3m so\xE1t \u1EDF m\u1EE9c truy v\u1EA5n gi\u1EEF c\xE1c y\xEAu c\u1EA7u tr\xE1i ph\xE9p v\xE0 log r\xE1c kh\u1ECFi Core Banking, nh\u1EDD v\u1EADy giao d\u1ECBch tr\u1EF1c ti\u1EBFp lu\xF4n nhanh. AI Agent tr\u1EA3 l\u1EDDi ngay c\xE2u h\u1ECFi c\u1EE7a kh\xE1ch h\xE0ng thay cho t\u1ED5ng \u0111\xE0i."}}},chapters:[{id:"phishing",persona:{en:"Head of Information Security",vi:"Gi\xE1m \u0111\u1ED1c An ninh th\xF4ng tin"},challenge:{title:{en:"Phishing and Ransomware Through Email",vi:"Phishing v\xE0 Ransomware qua Email"},body:{en:"Email is one of the most common ways attackers enter financial organisations. Phishing emails, fake payment requests, and ransomware can steal employee credentials, trigger fraudulent transfers, and disrupt critical banking operations.",vi:"Email l\xE0 con \u0111\u01B0\u1EDDng ph\u1ED5 bi\u1EBFn nh\u1EA5t \u0111\u1EC3 tin t\u1EB7c x\xE2m nh\u1EADp t\u1ED5 ch\u1EE9c t\xE0i ch\xEDnh. Email phishing, y\xEAu c\u1EA7u thanh to\xE1n gi\u1EA3 m\u1EA1o v\xE0 ransomware c\xF3 th\u1EC3 \u0111\xE1nh c\u1EAFp th\xF4ng tin \u0111\u0103ng nh\u1EADp, k\xEDch ho\u1EA1t chuy\u1EC3n ti\u1EC1n gian l\u1EADn v\xE0 l\xE0m gi\xE1n \u0111o\u1EA1n ho\u1EA1t \u0111\u1ED9ng ng\xE2n h\xE0ng."}},solutions:["email-security"],response:{title:{en:"Stop it before it reaches the inbox",vi:"Ch\u1EB7n t\u1EEB tr\u01B0\u1EDBc khi v\xE0o h\u1ED9p th\u01B0"},body:{en:"Advanced email defense on VCLOUD stops phishing, executive spoofing and ransomware before they reach employees, while your data stays inside Vietnam.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao tr\xEAn VCLOUD ch\u1EB7n phishing, gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o v\xE0 ransomware tr\u01B0\u1EDBc khi t\u1EDBi nh\xE2n vi\xEAn, trong khi d\u1EEF li\u1EC7u v\u1EABn n\u1EB1m t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Blocks phishing and executive spoofing",vi:"Ch\u1EB7n phishing v\xE0 gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"},{en:"Sovereign hosting inside Vietnam",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n ngay t\u1EA1i Vi\u1EC7t Nam"}]}},{id:"fraud",persona:{en:"Head of Operations & Payments",vi:"Gi\xE1m \u0111\u1ED1c V\u1EADn h\xE0nh & Thanh to\xE1n"},challenge:{title:{en:"Fraudulent Payments and Transaction Changes",vi:"Thanh to\xE1n gian l\u1EADn v\xE0 thay \u0111\u1ED5i giao d\u1ECBch"},body:{en:"Online banking and digital payments make it easier for criminals to use stolen identities, submit fraudulent payment requests, or alter transaction information. If not detected early, the bank faces direct financial loss, operational disruption, and customer complaints.",vi:"Ng\xE2n h\xE0ng s\u1ED1 v\xE0 thanh to\xE1n \u0111i\u1EC7n t\u1EED gi\xFAp t\u1ED9i ph\u1EA1m d\u1EC5 d\xF9ng danh t\xEDnh b\u1ECB \u0111\xE1nh c\u1EAFp, g\u1EEDi y\xEAu c\u1EA7u thanh to\xE1n gian l\u1EADn ho\u1EB7c s\u1EEDa th\xF4ng tin giao d\u1ECBch. N\u1EBFu kh\xF4ng ph\xE1t hi\u1EC7n s\u1EDBm, ng\xE2n h\xE0ng ch\u1ECBu t\u1ED5n th\u1EA5t t\xE0i ch\xEDnh tr\u1EF1c ti\u1EBFp, gi\xE1n \u0111o\u1EA1n v\u1EADn h\xE0nh v\xE0 khi\u1EBFu n\u1EA1i c\u1EE7a kh\xE1ch h\xE0ng."}},solutions:["email-security","database-security"],response:{title:{en:"Close both doors: the request and the record",vi:"\u0110\xF3ng c\u1EA3 hai c\u1EEDa: y\xEAu c\u1EA7u v\xE0 d\u1EEF li\u1EC7u"},body:{en:"Spoofed payment requests are filtered at the email layer, and sensitive SQL changes on Core Banking require approval, so a forged instruction cannot quietly become a changed transaction.",vi:"Y\xEAu c\u1EA7u thanh to\xE1n gi\u1EA3 m\u1EA1o b\u1ECB l\u1ECDc \u1EDF l\u1EDBp email, c\xF2n c\xE1c thay \u0111\u1ED5i SQL nh\u1EA1y c\u1EA3m tr\xEAn Core Banking ph\u1EA3i qua ph\xEA duy\u1EC7t, n\xEAn m\u1ED9t ch\u1EC9 th\u1ECB gi\u1EA3 kh\xF4ng th\u1EC3 \xE2m th\u1EA7m bi\u1EBFn th\xE0nh giao d\u1ECBch b\u1ECB s\u1EEDa."},points:[{en:"Filters fake payment requests at the source",vi:"L\u1ECDc y\xEAu c\u1EA7u thanh to\xE1n gi\u1EA3 t\u1EEB ngu\u1ED3n"},{en:"Approval workflow for sensitive SQL",vi:"Quy tr\xECnh ph\xEA duy\u1EC7t cho SQL nh\u1EA1y c\u1EA3m"},{en:"Audit trail for every change",vi:"Nh\u1EADt k\xFD ki\u1EC3m to\xE1n m\u1ECDi thay \u0111\u1ED5i"}]}},{id:"core-access",persona:{en:"Head of Core Banking / DBA Lead",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Core Banking / DBA"},challenge:{title:{en:"Uncontrolled Access to Core Banking Data",vi:"Truy c\u1EADp kh\xF4ng ki\u1EC3m so\xE1t v\xE0o d\u1EEF li\u1EC7u Core Banking"},body:{en:"Core banking databases are accessed by internal teams, administrators, developers, and external service providers. Without clear access control and monitoring, privileged users may view, copy, or change sensitive data without timely detection.",vi:"C\u01A1 s\u1EDF d\u1EEF li\u1EC7u l\xF5i \u0111\u01B0\u1EE3c truy c\u1EADp b\u1EDFi \u0111\u1ED9i n\u1ED9i b\u1ED9, qu\u1EA3n tr\u1ECB vi\xEAn, l\u1EADp tr\xECnh vi\xEAn v\xE0 nh\xE0 cung c\u1EA5p b\xEAn ngo\xE0i. Thi\u1EBFu ki\u1EC3m so\xE1t v\xE0 gi\xE1m s\xE1t r\xF5 r\xE0ng, ng\u01B0\u1EDDi d\xF9ng \u0111\u1EB7c quy\u1EC1n c\xF3 th\u1EC3 xem, sao ch\xE9p ho\u1EB7c s\u1EEDa d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m m\xE0 kh\xF4ng b\u1ECB ph\xE1t hi\u1EC7n k\u1ECBp th\u1EDDi."}},solutions:["database-security"],response:{title:{en:"Every query seen, every secret masked",vi:"M\u1ECDi truy v\u1EA5n \u0111\u1EC1u \u0111\u01B0\u1EE3c th\u1EA5y, m\u1ECDi b\xED m\u1EADt \u0111\u1EC1u \u0111\u01B0\u1EE3c che"},body:{en:"Query-level access control and real-time data masking stop privileged admin abuse without slowing live transactions or flooding systems with junk logs.",vi:"Ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c ng\u0103n l\u1EA1m quy\u1EC1n qu\u1EA3n tr\u1ECB m\xE0 kh\xF4ng l\xE0m ch\u1EADm giao d\u1ECBch hay tr\xE0n log r\xE1c."},points:[{en:"Proxy gateway restricts direct database access",vi:"C\u1ED5ng proxy h\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp CSDL"},{en:"Account numbers and balances masked for unauthorized admins",vi:"S\u1ED1 t\xE0i kho\u1EA3n v\xE0 s\u1ED1 d\u01B0 \u0111\u01B0\u1EE3c che v\u1EDBi qu\u1EA3n tr\u1ECB vi\xEAn kh\xF4ng c\xF3 quy\u1EC1n"},{en:"No impact on live transactions",vi:"Kh\xF4ng \u1EA3nh h\u01B0\u1EDFng giao d\u1ECBch tr\u1EF1c ti\u1EBFp"}]}},{id:"leak",persona:{en:"Chief Compliance Officer",vi:"Gi\xE1m \u0111\u1ED1c Tu\xE2n th\u1EE7"},challenge:{title:{en:"Customer Data Leakage and Compliance Pressure",vi:"R\xF2 r\u1EC9 d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 \xE1p l\u1EF1c tu\xE2n th\u1EE7"},body:{en:"Banks hold highly sensitive data: customer identity, account details, card data, loan records, insurance documents. A single leak can create serious compliance issues under Decree 13, SBV requirements and PCI DSS, and lasting damage to customer trust.",vi:"Ng\xE2n h\xE0ng n\u1EAFm gi\u1EEF d\u1EEF li\u1EC7u c\u1EF1c k\u1EF3 nh\u1EA1y c\u1EA3m: danh t\xEDnh kh\xE1ch h\xE0ng, t\xE0i kho\u1EA3n, th\u1EBB, h\u1ED3 s\u01A1 vay, h\u1EE3p \u0111\u1ED3ng b\u1EA3o hi\u1EC3m. M\u1ED9t v\u1EE5 r\xF2 r\u1EC9 c\xF3 th\u1EC3 g\xE2y vi ph\u1EA1m nghi\xEAm tr\u1ECDng theo Ngh\u1ECB \u0111\u1ECBnh 13, y\xEAu c\u1EA7u c\u1EE7a NHNN v\xE0 PCI DSS, c\xF9ng t\u1ED5n h\u1EA1i l\xE2u d\xE0i \u0111\u1EBFn ni\u1EC1m tin kh\xE1ch h\xE0ng."}},solutions:["dlp"],response:{title:{en:"See sensitive data wherever it tries to leave",vi:"Th\u1EA5y d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m \u1EDF m\u1ECDi n\u01A1i n\xF3 c\u1ED1 r\u1EDDi \u0111i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives detects customer records automatically, stopping insider fraud and leaks while supporting Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 kh\xE1ch h\xE0ng, ng\u0103n gian l\u1EADn n\u1ED9i b\u1ED9 v\xE0 r\xF2 r\u1EC9, h\u1ED7 tr\u1EE3 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects KYC and account records",vi:"T\u1EF1 nh\u1EADn di\u1EC7n d\u1EEF li\u1EC7u KYC v\xE0 t\xE0i kho\u1EA3n"},{en:"Evidence ready for audits",vi:"B\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng cho ki\u1EC3m to\xE1n"}]}},{id:"legal",persona:{en:"Head of Legal & Credit Operations",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Ph\xE1p ch\u1EBF & T\xEDn d\u1EE5ng"},challenge:{title:{en:"Slow Legal and Compliance Reviews",vi:"R\xE0 so\xE1t ph\xE1p l\xFD v\xE0 tu\xE2n th\u1EE7 ch\u1EADm"},body:{en:"Loan agreements, insurance contracts and regulatory documents need detailed manual review. This slows approvals, delays customer service, and makes it harder for legal and compliance teams to keep up with changing regulations.",vi:"H\u1EE3p \u0111\u1ED3ng t\xEDn d\u1EE5ng, h\u1EE3p \u0111\u1ED3ng b\u1EA3o hi\u1EC3m v\xE0 v\u0103n b\u1EA3n quy \u0111\u1ECBnh c\u1EA7n r\xE0 so\xE1t th\u1EE7 c\xF4ng chi ti\u1EBFt. \u0110i\u1EC1u n\xE0y l\xE0m ch\u1EADm ph\xEA duy\u1EC7t, tr\xEC ho\xE3n ph\u1EE5c v\u1EE5 kh\xE1ch h\xE0ng v\xE0 khi\u1EBFn \u0111\u1ED9i ph\xE1p ch\u1EBF kh\xF3 theo k\u1ECBp quy \u0111\u1ECBnh thay \u0111\u1ED5i."}},solutions:["ai-legal"],response:{title:{en:"Review in minutes, not days",vi:"R\xE0 so\xE1t trong v\xE0i ph\xFAt thay v\xEC v\xE0i ng\xE0y"},body:{en:"An AI assistant trained on State Bank of Vietnam regulations automates loan and contract review, with an on-premise option so sensitive documents never leave your walls.",vi:"Tr\u1EE3 l\xFD AI hu\u1EA5n luy\u1EC7n tr\xEAn quy \u0111\u1ECBnh c\u1EE7a Ng\xE2n h\xE0ng Nh\xE0 n\u01B0\u1EDBc t\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng t\xEDn d\u1EE5ng, c\xF3 t\xF9y ch\u1ECDn on-premise \u0111\u1EC3 t\xE0i li\u1EC7u nh\u1EA1y c\u1EA3m kh\xF4ng r\u1EDDi kh\u1ECFi h\u1EC7 th\u1ED1ng c\u1EE7a b\u1EA1n."},points:[{en:"Trained on SBV regulations",vi:"Hu\u1EA5n luy\u1EC7n tr\xEAn quy \u0111\u1ECBnh NHNN"},{en:"On-premise option for total privacy",vi:"T\xF9y ch\u1ECDn on-premise b\u1EA3o m\u1EADt tuy\u1EC7t \u0111\u1ED1i"},{en:"Frees legal teams for high-value work",vi:"Gi\u1EA3i ph\xF3ng \u0111\u1ED9i ph\xE1p ch\u1EBF cho vi\u1EC7c gi\xE1 tr\u1ECB cao"}],metric:{value:"95%",label:{en:"accuracy on SBV regulation",vi:"\u0111\u1ED9 ch\xEDnh x\xE1c theo quy \u0111\u1ECBnh NHNN"}}}}],outcomes:[{title:{en:"Protect Customer Data & Trust",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u & ni\u1EC1m tin kh\xE1ch h\xE0ng"},body:{en:"Protect KYC data, account information and transaction records across email, users, infrastructure and Core Banking, reducing the risk of leakage and unauthorized access.",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u KYC, th\xF4ng tin t\xE0i kho\u1EA3n v\xE0 giao d\u1ECBch tr\xEAn email, ng\u01B0\u1EDDi d\xF9ng, h\u1EA1 t\u1EA7ng v\xE0 Core Banking, gi\u1EA3m r\u1EE7i ro r\xF2 r\u1EC9 v\xE0 truy c\u1EADp tr\xE1i ph\xE9p."}},{title:{en:"Stay Ahead of Compliance",vi:"\u0110i tr\u01B0\u1EDBc y\xEAu c\u1EA7u tu\xE2n th\u1EE7"},body:{en:"VCLOUD infrastructure in Vietnam plus data protection and access controls help institutions prepare for data protection requirements, audits and industry regulations.",vi:"H\u1EA1 t\u1EA7ng VCLOUD t\u1EA1i Vi\u1EC7t Nam c\xF9ng ki\u1EC3m so\xE1t b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u v\xE0 truy c\u1EADp gi\xFAp t\u1ED5 ch\u1EE9c chu\u1EA9n b\u1ECB cho y\xEAu c\u1EA7u b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u, ki\u1EC3m to\xE1n v\xE0 quy \u0111\u1ECBnh ng\xE0nh."}},{title:{en:"Optimize Operations & Cost",vi:"T\u1ED1i \u01B0u v\u1EADn h\xE0nh & chi ph\xED"},body:{en:"Automate security controls, data monitoring and document review to reduce manual work, incident-response cost and IT effort.",vi:"T\u1EF1 \u0111\u1ED9ng h\xF3a ki\u1EC3m so\xE1t an ninh, gi\xE1m s\xE1t d\u1EEF li\u1EC7u v\xE0 r\xE0 so\xE1t t\xE0i li\u1EC7u \u0111\u1EC3 gi\u1EA3m c\xF4ng vi\u1EC7c th\u1EE7 c\xF4ng, chi ph\xED \u1EE9ng ph\xF3 s\u1EF1 c\u1ED1 v\xE0 t\u1EA3i cho IT."}}],faq:[{q:{en:"How does the platform secure core banking databases from privileged internal accounts?",vi:"N\u1EC1n t\u1EA3ng b\u1EA3o v\u1EC7 CSDL core banking kh\u1ECFi t\xE0i kho\u1EA3n n\u1ED9i b\u1ED9 \u0111\u1EB7c quy\u1EC1n nh\u01B0 th\u1EBF n\xE0o?"},a:{en:"DBSAFER DB restricts direct database access through proxy gateways, enforces approval workflows for sensitive SQL queries, and applies DATACRYPTO masking so account numbers and balances are unreadable to unauthorized administrators.",vi:"DBSAFER DB h\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp qua c\u1ED5ng proxy, \xE1p d\u1EE5ng quy tr\xECnh ph\xEA duy\u1EC7t cho truy v\u1EA5n SQL nh\u1EA1y c\u1EA3m v\xE0 che gi\u1EA5u b\u1EB1ng DATACRYPTO \u0111\u1EC3 s\u1ED1 t\xE0i kho\u1EA3n, s\u1ED1 d\u01B0 kh\xF4ng th\u1EC3 \u0111\u1ECDc \u0111\u01B0\u1EE3c v\u1EDBi qu\u1EA3n tr\u1ECB vi\xEAn kh\xF4ng c\xF3 quy\u1EC1n."}},{q:{en:"How does the AI Legal solution reduce compliance processing times?",vi:"Gi\u1EA3i ph\xE1p AI Legal r\xFAt ng\u1EAFn th\u1EDDi gian x\u1EED l\xFD tu\xE2n th\u1EE7 nh\u01B0 th\u1EBF n\xE0o?"},a:{en:"It reviews loan agreements and contracts automatically against State Bank of Vietnam regulations, cutting routine review workload by 42%. An on-premise option keeps all data private.",vi:"Gi\u1EA3i ph\xE1p t\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng t\xEDn d\u1EE5ng theo quy \u0111\u1ECBnh c\u1EE7a Ng\xE2n h\xE0ng Nh\xE0 n\u01B0\u1EDBc, gi\u1EA3m 42% kh\u1ED1i l\u01B0\u1EE3ng r\xE0 so\xE1t th\u01B0\u1EDDng nh\u1EADt. T\xF9y ch\u1ECDn on-premise gi\u1EEF to\xE0n b\u1ED9 d\u1EEF li\u1EC7u ri\xEAng t\u01B0."}}]},{id:"government",icon:"building-2",name:{en:"Government & Public Sector",vi:"Ch\xEDnh ph\u1EE7 & Khu v\u1EF1c c\xF4ng"},title:{en:"Government & Public Sector",vi:"Ch\xEDnh ph\u1EE7 & Khu v\u1EF1c c\xF4ng"},tagline:{en:"Sovereign VCLOUD & Email Security, Data Loss Prevention, Database Security and AI Legal & Compliance for agencies serving citizens.",vi:"VCLOUD & Email Security ch\u1EE7 quy\u1EC1n, Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u, B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 AI Legal & Compliance cho c\u01A1 quan nh\xE0 n\u01B0\u1EDBc ph\u1EE5c v\u1EE5 ng\u01B0\u1EDDi d\xE2n."},bundle:["email-security","dlp","database-security","ai-legal"],image:null,regs:[{en:"Law on Cybersecurity",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"Decree 53/2022",vi:"Ngh\u1ECB \u0111\u1ECBnh 53/2022"},{en:"Decree 13/2023",vi:"Ngh\u1ECB \u0111\u1ECBnh 13/2023"},{en:"Law on Data 2024",vi:"Lu\u1EADt D\u1EEF li\u1EC7u 2024"},{en:"Decree 85/2016 & TCVN 11930",vi:"Ngh\u1ECB \u0111\u1ECBnh 85/2016 & TCVN 11930"}],story:{context:{title:{en:'A fake notice from a "superior agency" opens the door',vi:'M\u1ED9t c\xF4ng v\u0103n gi\u1EA3 danh "c\u01A1 quan c\u1EA5p tr\xEAn" m\u1EDF c\u1EEDa cho k\u1EBB t\u1EA5n c\xF4ng'},body:{en:"An officer opens an urgent notice that appears to come from a higher agency. The attacker gains a foothold, moves toward the citizen database and starts reading records that were never meant to leave the agency.",vi:"M\u1ED9t c\xE1n b\u1ED9 m\u1EDF c\xF4ng v\u0103n kh\u1EA9n c\xF3 v\u1EBB \u0111\u1EBFn t\u1EEB c\u01A1 quan c\u1EA5p tr\xEAn. K\u1EBB t\u1EA5n c\xF4ng c\xF3 ch\u1ED7 \u0111\u1EE9ng trong h\u1EC7 th\u1ED1ng, ti\u1EBFn d\u1EA7n t\u1EDBi c\u01A1 s\u1EDF d\u1EEF li\u1EC7u c\xF4ng d\xE2n v\xE0 \u0111\u1ECDc nh\u1EEFng h\u1ED3 s\u01A1 v\u1ED1n kh\xF4ng \u0111\u01B0\u1EE3c r\u1EDDi kh\u1ECFi c\u01A1 quan."}},entry:{title:{en:"Stop the entry point before it reaches the agency network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng n\u1ED9i b\u1ED9 c\u01A1 quan"},body:{en:"Sovereign email defense filters impersonation at the gateway, while DLP and Database Security protect citizen data if an account is ever compromised.",vi:"B\u1EA3o v\u1EC7 email ch\u1EE7 quy\u1EC1n l\u1ECDc gi\u1EA3 m\u1EA1o ngay t\u1EA1i c\u1ED5ng, c\xF2n DLP v\xE0 B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xF4ng d\xE2n n\u1EBFu c\xF3 t\xE0i kho\u1EA3n b\u1ECB chi\u1EBFm quy\u1EC1n."}}},chapters:[{id:"phishing",persona:{en:"Head of Information Security (agency CISO)",vi:"L\xE3nh \u0111\u1EA1o An to\xE0n th\xF4ng tin c\u1EE7a c\u01A1 quan"},challenge:{title:{en:"Spear-phishing against officials and civil servants",vi:"Email gi\u1EA3 m\u1EA1o nh\u1EAFm v\xE0o l\xE3nh \u0111\u1EA1o v\xE0 c\xE1n b\u1ED9"},body:{en:"Official mail is a favourite entry point: a message that imitates a superior, a ministry or a document circular can steal credentials or drop malware. Once inside one mailbox, attackers move towards shared drives and administrative systems.",vi:"Email c\xF4ng v\u1EE5 l\xE0 c\u1EEDa v\xE0o \u01B0a th\xEDch c\u1EE7a k\u1EBB t\u1EA5n c\xF4ng: m\u1ED9t th\u01B0 gi\u1EA3 danh c\u1EA5p tr\xEAn, b\u1ED9 ng\xE0nh ho\u1EB7c c\xF4ng v\u0103n c\xF3 th\u1EC3 l\u1EA5y c\u1EAFp t\xE0i kho\u1EA3n ho\u1EB7c c\xE0i m\xE3 \u0111\u1ED9c. Khi \u0111\xE3 v\xE0o \u0111\u01B0\u1EE3c m\u1ED9t h\u1ED9p th\u01B0, ch\xFAng d\u1EC5 d\xE0ng di chuy\u1EC3n sang \u1ED5 chia s\u1EBB v\xE0 c\xE1c h\u1EC7 th\u1ED1ng qu\u1EA3n tr\u1ECB."}},solutions:["email-security"],response:{title:{en:"Filter the threat before it reaches the civil servant",vi:"Ch\u1EB7n m\u1ED1i \u0111e d\u1ECDa tr\u01B0\u1EDBc khi t\u1EDBi c\xE1n b\u1ED9"},body:{en:"Advanced email defense on VCLOUD screens phishing, impersonation of leaders and ransomware at the gateway, while mail data stays on infrastructure inside Vietnam.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao tr\xEAn VCLOUD l\u1ECDc phishing, gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o v\xE0 ransomware ngay t\u1EA1i c\u1ED5ng th\u01B0, trong khi d\u1EEF li\u1EC7u th\u01B0 n\u1EB1m tr\xEAn h\u1EA1 t\u1EA7ng \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Blocks phishing and leader impersonation",vi:"Ch\u1EB7n phishing v\xE0 gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng th\u01B0"},{en:"Hosted inside Vietnam",vi:"L\u01B0u tr\u1EEF ngay t\u1EA1i Vi\u1EC7t Nam"}]}},{id:"citizen-data",persona:{en:"Head of Department / Director of Public Service Delivery",vi:"Th\u1EE7 tr\u01B0\u1EDFng \u0111\u01A1n v\u1ECB / Gi\xE1m \u0111\u1ED1c trung t\xE2m ph\u1EE5c v\u1EE5 h\xE0nh ch\xEDnh c\xF4ng"},challenge:{title:{en:"Citizen records leaking and public trust eroding",vi:"H\u1ED3 s\u01A1 c\xF4ng d\xE2n b\u1ECB l\u1ED9, ni\u1EC1m tin x\xE3 h\u1ED9i suy gi\u1EA3m"},body:{en:"Agencies hold identity, tax, health, land and social-insurance records. A single officer copying files to a personal webmail, chat app or USB drive can expose thousands of citizens, trigger public complaints and put leadership accountable.",vi:"C\u01A1 quan nh\xE0 n\u01B0\u1EDBc n\u1EAFm gi\u1EEF d\u1EEF li\u1EC7u \u0111\u1ECBnh danh, thu\u1EBF, y t\u1EBF, \u0111\u1EA5t \u0111ai, b\u1EA3o hi\u1EC3m x\xE3 h\u1ED9i. Ch\u1EC9 m\u1ED9t c\xE1n b\u1ED9 sao ch\xE9p t\u1EC7p sang webmail c\xE1 nh\xE2n, \u1EE9ng d\u1EE5ng chat ho\u1EB7c USB c\u0169ng c\xF3 th\u1EC3 l\xE0m l\u1ED9 th\xF4ng tin h\xE0ng ngh\xECn ng\u01B0\u1EDDi d\xE2n, d\u1EABn \u0111\u1EBFn ph\u1EA3n \xE1nh d\u01B0 lu\u1EADn v\xE0 tr\xE1ch nhi\u1EC7m c\u1EE7a ng\u01B0\u1EDDi \u0111\u1EE9ng \u0111\u1EA7u."}},solutions:["dlp"],response:{title:{en:"See sensitive records wherever they try to leave",vi:"Th\u1EA5y h\u1ED3 s\u01A1 nh\u1EA1y c\u1EA3m \u1EDF b\u1EA5t c\u1EE9 n\u01A1i n\xE0o ch\xFAng c\u1ED1 r\u1EDDi \u0111i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives automatically recognises citizen records and stops leaks, whether accidental or deliberate.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 c\xF4ng d\xE2n v\xE0 ng\u0103n r\xF2 r\u1EC9, d\xF9 v\xF4 \xFD hay c\u1ED1 \xFD."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects personal data",vi:"T\u1EF1 nh\u1EADn di\u1EC7n d\u1EEF li\u1EC7u c\xE1 nh\xE2n"},{en:"Incident evidence for investigation",vi:"B\u1EB1ng ch\u1EE9ng ph\u1EE5c v\u1EE5 \u0111i\u1EC1u tra s\u1EF1 c\u1ED1"}]}},{id:"privileged-access",persona:{en:"Head of IT / Database Administration",vi:"Tr\u01B0\u1EDFng ph\xF2ng CNTT / Qu\u1EA3n tr\u1ECB c\u01A1 s\u1EDF d\u1EEF li\u1EC7u"},challenge:{title:{en:"Who can see the national and sectoral databases?",vi:"Ai \u0111\u01B0\u1EE3c xem c\xE1c c\u01A1 s\u1EDF d\u1EEF li\u1EC7u qu\u1ED1c gia v\xE0 chuy\xEAn ng\xE0nh?"},body:{en:"Administrators, outsourced developers and integration partners often hold broad access to population, tax or licensing databases. Without query-level control, misuse of privileges is hard to detect and harder to prove.",vi:"Qu\u1EA3n tr\u1ECB vi\xEAn, \u0111\u01A1n v\u1ECB ph\xE1t tri\u1EC3n thu\xEA ngo\xE0i v\xE0 \u0111\u1ED1i t\xE1c t\xEDch h\u1EE3p th\u01B0\u1EDDng c\xF3 quy\u1EC1n r\u1ED9ng tr\xEAn c\xE1c c\u01A1 s\u1EDF d\u1EEF li\u1EC7u d\xE2n c\u01B0, thu\u1EBF, c\u1EA5p ph\xE9p. Thi\u1EBFu ki\u1EC3m so\xE1t \u1EDF m\u1EE9c truy v\u1EA5n, vi\u1EC7c l\u1EA1m quy\u1EC1n kh\xF3 ph\xE1t hi\u1EC7n v\xE0 c\xE0ng kh\xF3 ch\u1EE9ng minh."}},solutions:["database-security"],response:{title:{en:"Every query controlled, sensitive fields masked",vi:"Ki\u1EC3m so\xE1t t\u1EEBng truy v\u1EA5n, che gi\u1EA5u tr\u01B0\u1EDDng d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m"},body:{en:"Query-level access control and real-time masking limit what administrators and partners can read or change, without slowing live public services.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c gi\u1EDBi h\u1EA1n nh\u1EEFng g\xEC qu\u1EA3n tr\u1ECB vi\xEAn v\xE0 \u0111\u1ED1i t\xE1c \u0111\u01B0\u1EE3c \u0111\u1ECDc ho\u1EB7c s\u1EEDa, kh\xF4ng l\xE0m ch\u1EADm d\u1ECBch v\u1EE5 c\xF4ng \u0111ang v\u1EADn h\xE0nh."},points:[{en:"Restricts direct database access",vi:"H\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp v\xE0o CSDL"},{en:"Masks ID numbers and personal fields",vi:"Che s\u1ED1 \u0111\u1ECBnh danh v\xE0 tr\u01B0\u1EDDng d\u1EEF li\u1EC7u c\xE1 nh\xE2n"},{en:"Full audit trail of privileged activity",vi:"Nh\u1EADt k\xFD ki\u1EC3m to\xE1n \u0111\u1EA7y \u0111\u1EE7 ho\u1EA1t \u0111\u1ED9ng \u0111\u1EB7c quy\u1EC1n"}]}},{id:"compliance",persona:{en:"CIO / Chief of Office",vi:"Gi\xE1m \u0111\u1ED1c CNTT / Ch\xE1nh V\u0103n ph\xF2ng"},challenge:{title:{en:"Proving compliance with cybersecurity and data law",vi:"Ch\u1EE9ng minh tu\xE2n th\u1EE7 ph\xE1p lu\u1EADt v\u1EC1 an ninh m\u1EA1ng v\xE0 d\u1EEF li\u1EC7u"},body:{en:"Agencies must classify systems by security level (Decree 85/2016, TCVN 11930), protect personal data (Decree 13/2023), and follow data rules under the Law on Cybersecurity, Decree 53/2022 and the Law on Data 2024. Inspectors expect evidence, not intentions.",vi:"C\u01A1 quan ph\u1EA3i x\xE1c \u0111\u1ECBnh c\u1EA5p \u0111\u1ED9 an to\xE0n h\u1EC7 th\u1ED1ng th\xF4ng tin (Ngh\u1ECB \u0111\u1ECBnh 85/2016, TCVN 11930), b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xE1 nh\xE2n (Ngh\u1ECB \u0111\u1ECBnh 13/2023) v\xE0 tu\xE2n th\u1EE7 quy \u0111\u1ECBnh v\u1EC1 d\u1EEF li\u1EC7u theo Lu\u1EADt An ninh m\u1EA1ng, Ngh\u1ECB \u0111\u1ECBnh 53/2022 v\xE0 Lu\u1EADt D\u1EEF li\u1EC7u 2024. \u0110o\xE0n ki\u1EC3m tra c\u1EA7n b\u1EB1ng ch\u1EE9ng ch\u1EE9 kh\xF4ng ch\u1EC9 cam k\u1EBFt."}},solutions:["email-security","dlp"],response:{title:{en:"Data stays in Vietnam, controls leave evidence",vi:"D\u1EEF li\u1EC7u \u1EDF l\u1EA1i Vi\u1EC7t Nam, ki\u1EC3m so\xE1t \u0111\u1EC3 l\u1EA1i b\u1EB1ng ch\u1EE9ng"},body:{en:"VCLOUD keeps data on infrastructure in Vietnam, while data-loss controls and logs give the CIO a record to support audits and Decree 13 obligations. Final classification and certification remain the agency's responsibility.",vi:"VCLOUD gi\u1EEF d\u1EEF li\u1EC7u tr\xEAn h\u1EA1 t\u1EA7ng t\u1EA1i Vi\u1EC7t Nam, c\xF2n c\xE1c ki\u1EC3m so\xE1t ch\u1ED1ng th\u1EA5t tho\xE1t v\xE0 nh\u1EADt k\xFD gi\xFAp CIO c\xF3 h\u1ED3 s\u01A1 ph\u1EE5c v\u1EE5 ki\u1EC3m tra v\xE0 ngh\u0129a v\u1EE5 theo Ngh\u1ECB \u0111\u1ECBnh 13. Vi\u1EC7c x\xE1c \u0111\u1ECBnh c\u1EA5p \u0111\u1ED9 v\xE0 th\u1EA9m \u0111\u1ECBnh cu\u1ED1i c\xF9ng v\u1EABn thu\u1ED9c tr\xE1ch nhi\u1EC7m c\u1EE7a c\u01A1 quan."},points:[{en:"Sovereign hosting inside Vietnam",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n t\u1EA1i Vi\u1EC7t Nam"},{en:"Controls mapped to personal-data duties",vi:"Ki\u1EC3m so\xE1t g\u1EAFn v\u1EDBi ngh\u0129a v\u1EE5 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xE1 nh\xE2n"},{en:"Audit-ready logs and reports",vi:"Nh\u1EADt k\xFD v\xE0 b\xE1o c\xE1o s\u1EB5n s\xE0ng cho ki\u1EC3m tra"}]}},{id:"legal-ops",persona:{en:"Head of Legal & Administrative Affairs",vi:"Tr\u01B0\u1EDFng ph\xF2ng Ph\xE1p ch\u1EBF & H\xE0nh ch\xEDnh"},challenge:{title:{en:"Legal documents multiplying faster than teams can read them",vi:"V\u0103n b\u1EA3n ph\xE1p lu\u1EADt t\u0103ng nhanh h\u01A1n kh\u1EA3 n\u0103ng \u0111\u1ECDc c\u1EE7a \u0111\u1ED9i ng\u0169"},body:{en:"Decrees, circulars and internal procedures change constantly. Reviewing drafts, contracts and administrative decisions by hand is slow, and sending them to public AI tools risks exposing non-public information.",vi:"Ngh\u1ECB \u0111\u1ECBnh, th\xF4ng t\u01B0 v\xE0 quy tr\xECnh n\u1ED9i b\u1ED9 thay \u0111\u1ED5i li\xEAn t\u1EE5c. R\xE0 so\xE1t d\u1EF1 th\u1EA3o, h\u1EE3p \u0111\u1ED3ng v\xE0 quy\u1EBFt \u0111\u1ECBnh h\xE0nh ch\xEDnh th\u1EE7 c\xF4ng r\u1EA5t ch\u1EADm, c\xF2n \u0111\u01B0a t\xE0i li\u1EC7u l\xEAn c\xF4ng c\u1EE5 AI c\xF4ng c\u1ED9ng c\xF3 nguy c\u01A1 l\u1ED9 th\xF4ng tin kh\xF4ng c\xF4ng khai."}},solutions:["ai-legal"],response:{title:{en:"A legal assistant that stays inside your walls",vi:"Tr\u1EE3 l\xFD ph\xE1p l\xFD ch\u1EA1y trong h\u1EC7 th\u1ED1ng c\u1EE7a b\u1EA1n"},body:{en:"The AI Legal assistant supports document and contract review against regulation, with an on-premise option so sensitive documents never leave the agency.",vi:"Tr\u1EE3 l\xFD AI Legal h\u1ED7 tr\u1EE3 r\xE0 so\xE1t v\u0103n b\u1EA3n, h\u1EE3p \u0111\u1ED3ng theo quy \u0111\u1ECBnh hi\u1EC7n h\xE0nh, c\xF3 t\xF9y ch\u1ECDn on-premise \u0111\u1EC3 t\xE0i li\u1EC7u nh\u1EA1y c\u1EA3m kh\xF4ng r\u1EDDi kh\u1ECFi c\u01A1 quan."},points:[{en:"Speeds up routine review",vi:"R\xFAt ng\u1EAFn r\xE0 so\xE1t th\u01B0\u1EDDng nh\u1EADt"},{en:"On-premise option for privacy",vi:"T\xF9y ch\u1ECDn on-premise b\u1EA3o m\u1EADt d\u1EEF li\u1EC7u"},{en:"Frees staff for judgement work",vi:"Gi\u1EA3i ph\xF3ng c\xE1n b\u1ED9 cho c\xF4ng vi\u1EC7c c\u1EA7n ph\xE1n \u0111o\xE1n"}]}}],outcomes:[{title:{en:"Protect Citizen Data & Public Trust",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xF4ng d\xE2n & ni\u1EC1m tin x\xE3 h\u1ED9i"},body:{en:"Cover email, endpoints and databases so citizen and state data is protected from external attack and internal misuse.",vi:"Bao ph\u1EE7 email, thi\u1EBFt b\u1ECB \u0111\u1EA7u cu\u1ED1i v\xE0 c\u01A1 s\u1EDF d\u1EEF li\u1EC7u \u0111\u1EC3 d\u1EEF li\u1EC7u c\xF4ng d\xE2n v\xE0 d\u1EEF li\u1EC7u nh\xE0 n\u01B0\u1EDBc \u0111\u01B0\u1EE3c b\u1EA3o v\u1EC7 tr\u01B0\u1EDBc t\u1EA5n c\xF4ng b\xEAn ngo\xE0i l\u1EABn l\u1EA1m d\u1EE5ng n\u1ED9i b\u1ED9."}},{title:{en:"Be Ready for Inspection",vi:"S\u1EB5n s\xE0ng cho thanh tra, ki\u1EC3m tra"},body:{en:"Hosting in Vietnam, access controls and audit logs help agencies prepare evidence for security-level and data-protection reviews.",vi:"L\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam, ki\u1EC3m so\xE1t truy c\u1EADp v\xE0 nh\u1EADt k\xFD ki\u1EC3m to\xE1n gi\xFAp c\u01A1 quan chu\u1EA9n b\u1ECB h\u1ED3 s\u01A1 cho \u0111\xE1nh gi\xE1 c\u1EA5p \u0111\u1ED9 an to\xE0n v\xE0 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u."}},{title:{en:"Do More with Lean IT Teams",vi:"L\xE0m nhi\u1EC1u h\u01A1n v\u1EDBi \u0111\u1ED9i CNTT tinh g\u1ECDn"},body:{en:"One integrated package from a local partner reduces vendor sprawl, manual review and incident-response effort.",vi:"M\u1ED9t g\xF3i t\xEDch h\u1EE3p t\u1EEB \u0111\u1ED1i t\xE1c trong n\u01B0\u1EDBc gi\xFAp gi\u1EA3m s\u1ED1 nh\xE0 cung c\u1EA5p, r\xE0 so\xE1t th\u1EE7 c\xF4ng v\xE0 c\xF4ng s\u1EE9c x\u1EED l\xFD s\u1EF1 c\u1ED1."}}],faq:[{q:{en:"Does data stay in Vietnam?",vi:"D\u1EEF li\u1EC7u c\xF3 \u0111\u01B0\u1EE3c l\u01B0u t\u1EA1i Vi\u1EC7t Nam kh\xF4ng?"},a:{en:"VCLOUD is hosted on infrastructure in Vietnam, and AI Legal offers an on-premise option. Confirm the exact deployment against your system's security level with the V-Tech Hub team.",vi:"VCLOUD \u0111\u1EB7t tr\xEAn h\u1EA1 t\u1EA7ng t\u1EA1i Vi\u1EC7t Nam, AI Legal c\xF3 t\xF9y ch\u1ECDn on-premise. Vui l\xF2ng x\xE1c nh\u1EADn ph\u01B0\u01A1ng \xE1n tri\u1EC3n khai c\u1EE5 th\u1EC3 theo c\u1EA5p \u0111\u1ED9 an to\xE0n h\u1EC7 th\u1ED1ng c\u1EE7a \u0111\u01A1n v\u1ECB c\xF9ng \u0111\u1ED9i ng\u0169 V-Tech Hub."}},{q:{en:"How does this support Decree 13/2023 on personal data?",vi:"Gi\u1EA3i ph\xE1p h\u1ED7 tr\u1EE3 Ngh\u1ECB \u0111\u1ECBnh 13/2023 v\u1EC1 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xE1 nh\xE2n th\u1EBF n\xE0o?"},a:{en:"Data Loss Prevention detects personal data leaving via chat, webmail and USB, and Database Security masks sensitive fields and logs privileged access. These are technical controls that support, not replace, your own compliance process.",vi:"DLP ph\xE1t hi\u1EC7n d\u1EEF li\u1EC7u c\xE1 nh\xE2n b\u1ECB \u0111\u01B0a ra qua chat, webmail, USB; Database Security che tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m v\xE0 ghi nh\u1EADt k\xFD truy c\u1EADp \u0111\u1EB7c quy\u1EC1n. \u0110\xE2y l\xE0 c\xE1c bi\u1EC7n ph\xE1p k\u1EF9 thu\u1EADt h\u1ED7 tr\u1EE3, kh\xF4ng thay th\u1EBF quy tr\xECnh tu\xE2n th\u1EE7 c\u1EE7a \u0111\u01A1n v\u1ECB."}},{q:{en:"Can the bundle be adopted in stages?",vi:"C\xF3 th\u1EC3 tri\u1EC3n khai theo t\u1EEBng giai \u0111o\u1EA1n kh\xF4ng?"},a:{en:"Yes. Many agencies start with email protection or data-loss prevention and add database security and AI Legal as budgets and priorities allow.",vi:"C\xF3. Nhi\u1EC1u c\u01A1 quan b\u1EAFt \u0111\u1EA7u t\u1EEB b\u1EA3o v\u1EC7 email ho\u1EB7c ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u r\u1ED3i b\u1ED5 sung b\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 AI Legal theo ng\xE2n s\xE1ch v\xE0 m\u1EE9c \u01B0u ti\xEAn."}}]},{id:"healthcare",icon:"heart-pulse",name:{en:"Healthcare",vi:"Y t\u1EBF"},title:{en:"Healthcare: Hospitals, Clinics, Pharma & Health Insurance",vi:"Y t\u1EBF: B\u1EC7nh vi\u1EC7n, Ph\xF2ng kh\xE1m, D\u01B0\u1EE3c ph\u1EA9m & B\u1EA3o hi\u1EC3m s\u1EE9c kh\u1ECFe"},tagline:{en:"VCLOUD & Email Security, Database Security, Data Loss Prevention and AI Legal & Compliance to protect patient records and keep care running.",vi:"VCLOUD & Email Security, B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u, Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 AI Legal & Compliance \u0111\u1EC3 b\u1EA3o v\u1EC7 h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n v\xE0 gi\u1EEF v\u1EADn h\xE0nh kh\xE1m ch\u1EEFa b\u1EC7nh li\xEAn t\u1EE5c."},bundle:["email-security","database-security","dlp","ai-legal"],image:"https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1200&q=80",regs:[{en:"Decree 13/2023",vi:"Ngh\u1ECB \u0111\u1ECBnh 13/2023"},{en:"Law on Data 2024",vi:"Lu\u1EADt D\u1EEF li\u1EC7u 2024"},{en:"Law on Medical Examination and Treatment",vi:"Lu\u1EADt Kh\xE1m b\u1EC7nh, ch\u1EEFa b\u1EC7nh"},{en:"MoH EMR rules",vi:"Quy \u0111\u1ECBnh b\u1EC7nh \xE1n \u0111i\u1EC7n t\u1EED c\u1EE7a B\u1ED9 Y t\u1EBF"}],story:{context:{title:{en:"A phishing email, and patient records leave the hospital",vi:"M\u1ED9t email l\u1EEBa \u0111\u1EA3o, v\xE0 h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n b\u1ECB \u0111\u01B0a ra ngo\xE0i"},body:{en:"A clerk in medical records clicks a fake insurance notice. The attacker signs in with that account and quietly copies patient files while wards fall back to paper charts. The hospital learns about it from the outside, after trust is already damaged.",vi:"M\u1ED9t nh\xE2n vi\xEAn h\u1ED3 s\u01A1 b\u1EC7nh \xE1n b\u1EA5m v\xE0o th\xF4ng b\xE1o b\u1EA3o hi\u1EC3m gi\u1EA3. K\u1EBB t\u1EA5n c\xF4ng \u0111\u0103ng nh\u1EADp b\u1EB1ng t\xE0i kho\u1EA3n \u0111\xF3 v\xE0 \xE2m th\u1EA7m sao ch\xE9p h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n, trong khi c\xE1c khoa ph\u1EA3i quay l\u1EA1i b\u1EC7nh \xE1n gi\u1EA5y. B\u1EC7nh vi\u1EC7n bi\u1EBFt chuy\u1EC7n t\u1EEB b\xEAn ngo\xE0i, khi ni\u1EC1m tin \u0111\xE3 b\u1ECB t\u1ED5n h\u1EA1i."}},entry:{title:{en:"Stop the entry point before it reaches patient records",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi ch\u1EA1m t\u1EDBi h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n"},body:{en:"Email defense blocks the lure at the gateway. Database Security and DLP add a second line, masking sensitive fields and flagging records that try to leave.",vi:"B\u1EA3o v\u1EC7 email ch\u1EB7n m\u1ED3i nh\u1EED ngay t\u1EA1i c\u1ED5ng. B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 DLP t\u1EA1o l\u1EDBp ph\xF2ng th\u1EE7 th\u1EE9 hai, che c\xE1c tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m v\xE0 c\u1EA3nh b\xE1o h\u1ED3 s\u01A1 c\xF3 d\u1EA5u hi\u1EC7u b\u1ECB \u0111\u01B0a ra ngo\xE0i."}}},chapters:[{id:"ransomware",persona:{en:"Hospital CIO / Head of IT",vi:"Gi\xE1m \u0111\u1ED1c CNTT b\u1EC7nh vi\u1EC7n"},challenge:{title:{en:"Ransomware That Stops the Wards",vi:"Ransomware l\xE0m t\xEA li\u1EC7t khoa ph\xF2ng"},body:{en:"One phishing email opened at a reception desk can encrypt servers behind the hospital information system. Registration, lab results and billing stop, staff fall back to paper, and patients wait. Public reports describe Vietnamese hospitals suffering exactly this.",vi:"Ch\u1EC9 m\u1ED9t email phishing \u0111\u01B0\u1EE3c m\u1EDF \u1EDF qu\u1EA7y ti\u1EBFp \u0111\xF3n c\u0169ng c\xF3 th\u1EC3 m\xE3 h\xF3a m\xE1y ch\u1EE7 c\u1EE7a h\u1EC7 th\u1ED1ng th\xF4ng tin b\u1EC7nh vi\u1EC7n. Ti\u1EBFp \u0111\xF3n, k\u1EBFt qu\u1EA3 x\xE9t nghi\u1EC7m v\xE0 vi\u1EC7n ph\xED d\u1EEBng l\u1EA1i, nh\xE2n vi\xEAn quay v\u1EC1 gi\u1EA5y t\u1EDD, ng\u01B0\u1EDDi b\u1EC7nh ph\u1EA3i ch\u1EDD. B\xE1o ch\xED \u0111\xE3 \u0111\u01B0a tin m\u1ED9t s\u1ED1 b\u1EC7nh vi\u1EC7n t\u1EA1i Vi\u1EC7t Nam g\u1EB7p \u0111\xFAng t\xECnh hu\u1ED1ng n\xE0y."}},solutions:["email-security"],response:{title:{en:"Stop the first click, keep data in Vietnam",vi:"Ch\u1EB7n c\xFA click \u0111\u1EA7u ti\xEAn, gi\u1EEF d\u1EEF li\u1EC7u t\u1EA1i Vi\u1EC7t Nam"},body:{en:"Advanced email defense on VCLOUD filters phishing and ransomware attachments before they reach clinical and admin staff, on infrastructure hosted inside Vietnam.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao tr\xEAn VCLOUD l\u1ECDc phishing v\xE0 t\u1EC7p \u0111\xEDnh k\xE8m ransomware tr\u01B0\u1EDBc khi t\u1EDBi nh\xE2n vi\xEAn y t\u1EBF v\xE0 h\xE0nh ch\xEDnh, tr\xEAn h\u1EA1 t\u1EA7ng \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Blocks phishing and spoofed senders",vi:"Ch\u1EB7n phishing v\xE0 gi\u1EA3 m\u1EA1o ng\u01B0\u1EDDi g\u1EEDi"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"},{en:"Sovereign hosting inside Vietnam",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n ngay t\u1EA1i Vi\u1EC7t Nam"}]}},{id:"records-access",persona:{en:"Head of HIS / EMR & DBA Lead",vi:"Tr\u01B0\u1EDFng ph\xF2ng HIS / b\u1EC7nh \xE1n \u0111i\u1EC7n t\u1EED & DBA"},challenge:{title:{en:"Too Many People Can Open the Patient Record",vi:"Qu\xE1 nhi\u1EC1u ng\u01B0\u1EDDi c\xF3 th\u1EC3 m\u1EDF h\u1ED3 s\u01A1 b\u1EC7nh \xE1n"},body:{en:"Electronic medical records are touched by clinicians, administrators, software vendors and outsourced maintenance staff. Without query-level control, a privileged account can read or export diagnoses of staff, officials or public figures and nobody notices until it surfaces online.",vi:"B\u1EC7nh \xE1n \u0111i\u1EC7n t\u1EED \u0111\u01B0\u1EE3c nhi\u1EC1u \u0111\u1ED1i t\u01B0\u1EE3ng truy c\u1EADp: b\xE1c s\u0129, qu\u1EA3n tr\u1ECB vi\xEAn, nh\xE0 cung c\u1EA5p ph\u1EA7n m\u1EC1m v\xE0 \u0111\u01A1n v\u1ECB b\u1EA3o tr\xEC thu\xEA ngo\xE0i. Thi\u1EBFu ki\u1EC3m so\xE1t \u1EDF m\u1EE9c truy v\u1EA5n, m\u1ED9t t\xE0i kho\u1EA3n \u0111\u1EB7c quy\u1EC1n c\xF3 th\u1EC3 \u0111\u1ECDc ho\u1EB7c xu\u1EA5t ch\u1EA9n \u0111o\xE1n c\u1EE7a nh\xE2n vi\xEAn, c\xE1n b\u1ED9 hay ng\u01B0\u1EDDi n\u1ED5i ti\u1EBFng m\xE0 kh\xF4ng ai hay bi\u1EBFt cho \u0111\u1EBFn khi d\u1EEF li\u1EC7u xu\u1EA5t hi\u1EC7n tr\xEAn m\u1EA1ng."}},solutions:["database-security"],response:{title:{en:"Every query seen, every diagnosis masked",vi:"M\u1ECDi truy v\u1EA5n \u0111\u1EC1u \u0111\u01B0\u1EE3c th\u1EA5y, m\u1ECDi ch\u1EA9n \u0111o\xE1n \u0111\u1EC1u \u0111\u01B0\u1EE3c che"},body:{en:"Query-level access control and real-time masking let each role see only what care requires, and leave an audit trail for vendor and admin sessions, without slowing the HIS.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c gi\xFAp m\u1ED7i vai tr\xF2 ch\u1EC9 th\u1EA5y ph\u1EA7n d\u1EEF li\u1EC7u c\u1EA7n cho \u0111i\u1EC1u tr\u1ECB, \u0111\u1ED3ng th\u1EDDi l\u01B0u nh\u1EADt k\xFD cho phi\xEAn c\u1EE7a nh\xE0 cung c\u1EA5p v\xE0 qu\u1EA3n tr\u1ECB vi\xEAn m\xE0 kh\xF4ng l\xE0m ch\u1EADm HIS."},points:[{en:"Proxy gateway restricts direct database access",vi:"C\u1ED5ng proxy h\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp CSDL"},{en:"Patient identity and diagnosis masked for unauthorized users",vi:"Che danh t\xEDnh v\xE0 ch\u1EA9n \u0111o\xE1n v\u1EDBi ng\u01B0\u1EDDi kh\xF4ng c\xF3 quy\u1EC1n"},{en:"Full audit trail of vendor and admin sessions",vi:"Nh\u1EADt k\xFD \u0111\u1EA7y \u0111\u1EE7 phi\xEAn c\u1EE7a nh\xE0 cung c\u1EA5p v\xE0 qu\u1EA3n tr\u1ECB vi\xEAn"}]}},{id:"leak",persona:{en:"Data Protection Officer / Head of Compliance",vi:"C\xE1n b\u1ED9 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u / Tr\u01B0\u1EDFng ph\xF2ng tu\xE2n th\u1EE7"},challenge:{title:{en:"Patient Data Walking Out the Door",vi:"D\u1EEF li\u1EC7u b\u1EC7nh nh\xE2n b\u1ECB mang ra ngo\xE0i"},body:{en:"Lab reports sent by personal chat apps, files copied to USB drives, records forwarded to private webmail: well-meaning staff create leaks daily. Health data is sensitive data under Decree 13/2023, and reported cases of patient records offered for sale show the reputational cost.",vi:"K\u1EBFt qu\u1EA3 x\xE9t nghi\u1EC7m g\u1EEDi qua \u1EE9ng d\u1EE5ng chat c\xE1 nh\xE2n, t\u1EC7p ch\xE9p ra USB, h\u1ED3 s\u01A1 chuy\u1EC3n sang webmail ri\xEAng: nh\xE2n vi\xEAn c\xF3 thi\u1EC7n ch\xED v\u1EABn t\u1EA1o ra r\xF2 r\u1EC9 m\u1ED7i ng\xE0y. D\u1EEF li\u1EC7u s\u1EE9c kh\u1ECFe l\xE0 d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m theo Ngh\u1ECB \u0111\u1ECBnh 13/2023/N\u0110-CP, v\xE0 c\xE1c v\u1EE5 h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n b\u1ECB rao b\xE1n \u0111\u01B0\u1EE3c \u0111\u01B0a tin cho th\u1EA5y thi\u1EC7t h\u1EA1i v\u1EC1 uy t\xEDn."}},solutions:["dlp"],response:{title:{en:"See sensitive records wherever they try to leave",vi:"Th\u1EA5y h\u1ED3 s\u01A1 nh\u1EA1y c\u1EA3m \u1EDF m\u1ECDi n\u01A1i ch\xFAng c\u1ED1 r\u1EDDi \u0111i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives detects patient records automatically, stops insider leaks and supports Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n, ng\u0103n r\xF2 r\u1EC9 t\u1EEB n\u1ED9i b\u1ED9 v\xE0 h\u1ED7 tr\u1EE3 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects patient and insurance records",vi:"T\u1EF1 nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n v\xE0 b\u1EA3o hi\u1EC3m"},{en:"Evidence ready for audits and incident reports",vi:"B\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng cho ki\u1EC3m to\xE1n v\xE0 b\xE1o c\xE1o s\u1EF1 c\u1ED1"}]}},{id:"insurance-docs",persona:{en:"Head of Health Insurance Claims / Legal",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn gi\xE1m \u0111\u1ECBnh b\u1EA3o hi\u1EC3m / Ph\xE1p ch\u1EBF"},challenge:{title:{en:"Claims and Contracts Reviewed by Hand",vi:"H\u1EE3p \u0111\u1ED3ng v\xE0 h\u1ED3 s\u01A1 b\u1ED3i th\u01B0\u1EDDng r\xE0 so\xE1t th\u1EE7 c\xF4ng"},body:{en:"Insurance contracts, supplier agreements and consent forms must be read line by line against changing health, data and insurance rules. The backlog slows reimbursement and puts pressure on a small legal team.",vi:"H\u1EE3p \u0111\u1ED3ng b\u1EA3o hi\u1EC3m, h\u1EE3p \u0111\u1ED3ng nh\xE0 cung c\u1EA5p v\xE0 m\u1EABu \u0111\u1ED3ng \xFD x\u1EED l\xFD d\u1EEF li\u1EC7u ph\u1EA3i \u0111\u1ECDc t\u1EEBng \u0111i\u1EC1u kho\u1EA3n theo quy \u0111\u1ECBnh y t\u1EBF, d\u1EEF li\u1EC7u v\xE0 b\u1EA3o hi\u1EC3m lu\xF4n thay \u0111\u1ED5i. T\u1ED3n \u0111\u1ECDng l\xE0m ch\u1EADm chi tr\u1EA3 v\xE0 t\u1EA1o \xE1p l\u1EF1c l\xEAn \u0111\u1ED9i ph\xE1p ch\u1EBF v\u1ED1n m\u1ECFng."}},solutions:["ai-legal"],response:{title:{en:"Review faster without moving documents out",vi:"R\xE0 so\xE1t nhanh h\u01A1n m\xE0 kh\xF4ng \u0111\u01B0a t\xE0i li\u1EC7u ra ngo\xE0i"},body:{en:"An AI assistant for contract and regulation review, with an on-premise option so sensitive documents stay inside your own environment. Regulatory coverage for health rules should be scoped with V-Tech Hub during assessment.",vi:"Tr\u1EE3 l\xFD AI r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 quy \u0111\u1ECBnh, c\xF3 t\xF9y ch\u1ECDn on-premise \u0111\u1EC3 t\xE0i li\u1EC7u nh\u1EA1y c\u1EA3m n\u1EB1m trong h\u1EC7 th\u1ED1ng c\u1EE7a b\u1EA1n. Ph\u1EA1m vi quy \u0111\u1ECBnh ng\xE0nh y t\u1EBF c\u1EA7n \u0111\u01B0\u1EE3c x\xE1c nh\u1EADn c\xF9ng V-Tech Hub khi kh\u1EA3o s\xE1t."},points:[{en:"Automated contract and clause review",vi:"T\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 \u0111i\u1EC1u kho\u1EA3n"},{en:"On-premise option for total privacy",vi:"T\xF9y ch\u1ECDn on-premise b\u1EA3o m\u1EADt tuy\u1EC7t \u0111\u1ED1i"},{en:"Frees legal staff for complex cases",vi:"Gi\u1EA3i ph\xF3ng ph\xE1p ch\u1EBF cho ca ph\u1EE9c t\u1EA1p"}]}},{id:"sovereignty",persona:{en:"CFO / Board Sponsor",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh / L\xE3nh \u0111\u1EA1o ph\u1EE5 tr\xE1ch"},challenge:{title:{en:"Compliance Cost and Data Residency",vi:"Chi ph\xED tu\xE2n th\u1EE7 v\xE0 v\u1ECB tr\xED l\u01B0u tr\u1EEF d\u1EEF li\u1EC7u"},body:{en:"The Law on Data 2024, Decree 13 and the Law on Medical Examination and Treatment all raise expectations on how health data is stored and protected. Leaders want one accountable partner instead of five vendors, and a clear budget line.",vi:"Lu\u1EADt D\u1EEF li\u1EC7u 2024, Ngh\u1ECB \u0111\u1ECBnh 13 v\xE0 Lu\u1EADt Kh\xE1m b\u1EC7nh, ch\u1EEFa b\u1EC7nh \u0111\u1EC1u n\xE2ng y\xEAu c\u1EA7u v\u1EC1 c\xE1ch l\u01B0u tr\u1EEF v\xE0 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u s\u1EE9c kh\u1ECFe. Ban l\xE3nh \u0111\u1EA1o c\u1EA7n m\u1ED9t \u0111\u1ED1i t\xE1c ch\u1ECBu tr\xE1ch nhi\u1EC7m thay v\xEC n\u0103m nh\xE0 cung c\u1EA5p, v\xE0 m\u1ED9t kho\u1EA3n ng\xE2n s\xE1ch r\xF5 r\xE0ng."}},solutions:["email-security","dlp","database-security"],response:{title:{en:"One integrated package, hosted in Vietnam",vi:"M\u1ED9t g\xF3i t\xEDch h\u1EE3p, \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam"},body:{en:"Email defense, data-loss prevention and database security work together on VCLOUD infrastructure in Vietnam, giving one partner, one audit story and a predictable scope.",vi:"B\u1EA3o v\u1EC7 email, ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 b\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u ph\u1ED1i h\u1EE3p tr\xEAn h\u1EA1 t\u1EA7ng VCLOUD t\u1EA1i Vi\u1EC7t Nam, v\u1EDBi m\u1ED9t \u0111\u1ED1i t\xE1c, m\u1ED9t c\xE2u chuy\u1EC7n ki\u1EC3m to\xE1n v\xE0 ph\u1EA1m vi d\u1EF1 to\xE1n r\xF5 r\xE0ng."},points:[{en:"Single accountable partner",vi:"M\u1ED9t \u0111\u1ED1i t\xE1c ch\u1ECBu tr\xE1ch nhi\u1EC7m"},{en:"Data hosted inside Vietnam",vi:"D\u1EEF li\u1EC7u \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam"},{en:"Consistent evidence across layers",vi:"B\u1EB1ng ch\u1EE9ng nh\u1EA5t qu\xE1n tr\xEAn m\u1ECDi l\u1EDBp"}]}}],outcomes:[{title:{en:"Keep Care Running",vi:"Gi\u1EEF v\u1EADn h\xE0nh kh\xE1m ch\u1EEFa b\u1EC7nh li\xEAn t\u1EE5c"},body:{en:"Cut the most common entry points for ransomware so registration, labs and billing stay available to patients.",vi:"Gi\u1EA3m c\xE1c c\u1EEDa ng\xF5 ph\u1ED5 bi\u1EBFn c\u1EE7a ransomware \u0111\u1EC3 ti\u1EBFp \u0111\xF3n, x\xE9t nghi\u1EC7m v\xE0 vi\u1EC7n ph\xED lu\xF4n s\u1EB5n s\xE0ng ph\u1EE5c v\u1EE5 ng\u01B0\u1EDDi b\u1EC7nh."}},{title:{en:"Protect Patient Trust",vi:"B\u1EA3o v\u1EC7 ni\u1EC1m tin ng\u01B0\u1EDDi b\u1EC7nh"},body:{en:"Control who can see, copy or send patient records across email, devices and databases, with evidence for every access.",vi:"Ki\u1EC3m so\xE1t ai \u0111\u01B0\u1EE3c xem, sao ch\xE9p ho\u1EB7c g\u1EEDi h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n qua email, thi\u1EBFt b\u1ECB v\xE0 c\u01A1 s\u1EDF d\u1EEF li\u1EC7u, c\xF3 b\u1EB1ng ch\u1EE9ng cho m\u1ECDi l\u1EA7n truy c\u1EADp."}},{title:{en:"Prepare for Compliance",vi:"Chu\u1EA9n b\u1ECB cho tu\xE2n th\u1EE7"},body:{en:"Sovereign hosting and data controls help hospitals prepare for Decree 13, the Law on Data and sector audits.",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n v\xE0 c\xE1c ki\u1EC3m so\xE1t d\u1EEF li\u1EC7u gi\xFAp b\u1EC7nh vi\u1EC7n chu\u1EA9n b\u1ECB cho Ngh\u1ECB \u0111\u1ECBnh 13, Lu\u1EADt D\u1EEF li\u1EC7u v\xE0 c\xE1c \u0111\u1EE3t ki\u1EC3m tra ng\xE0nh."}}],faq:[{q:{en:"Is health data really treated as sensitive under Vietnamese law?",vi:"D\u1EEF li\u1EC7u s\u1EE9c kh\u1ECFe c\xF3 th\u1EF1c s\u1EF1 l\xE0 d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m theo ph\xE1p lu\u1EADt Vi\u1EC7t Nam?"},a:{en:"Yes. Decree 13/2023/ND-CP lists health and medical-record information as sensitive personal data, which requires stricter protection measures and impact assessment. Confirm exact obligations with your legal counsel.",vi:"C\xF3. Ngh\u1ECB \u0111\u1ECBnh 13/2023/N\u0110-CP x\u1EBFp th\xF4ng tin s\u1EE9c kh\u1ECFe, t\xECnh tr\u1EA1ng b\u1EC7nh \xE1n l\xE0 d\u1EEF li\u1EC7u c\xE1 nh\xE2n nh\u1EA1y c\u1EA3m, \u0111\xF2i h\u1ECFi bi\u1EC7n ph\xE1p b\u1EA3o v\u1EC7 ch\u1EB7t ch\u1EBD h\u01A1n v\xE0 \u0111\xE1nh gi\xE1 t\xE1c \u0111\u1ED9ng x\u1EED l\xFD d\u1EEF li\u1EC7u. N\xEAn x\xE1c nh\u1EADn ngh\u0129a v\u1EE5 c\u1EE5 th\u1EC3 v\u1EDBi t\u01B0 v\u1EA5n ph\xE1p l\xFD c\u1EE7a \u0111\u01A1n v\u1ECB."}},{q:{en:"How do you protect the HIS and EMR database from vendor and admin accounts?",vi:"L\xE0m sao b\u1EA3o v\u1EC7 CSDL HIS v\xE0 b\u1EC7nh \xE1n \u0111i\u1EC7n t\u1EED tr\u01B0\u1EDBc t\xE0i kho\u1EA3n nh\xE0 cung c\u1EA5p v\xE0 qu\u1EA3n tr\u1ECB vi\xEAn?"},a:{en:"Database Security restricts direct access through a proxy gateway, controls access per query, masks sensitive fields in real time and records every session for audit.",vi:"Gi\u1EA3i ph\xE1p B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u h\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp qua c\u1ED5ng proxy, ki\u1EC3m so\xE1t theo t\u1EEBng truy v\u1EA5n, che gi\u1EA5u tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m theo th\u1EDDi gian th\u1EF1c v\xE0 ghi l\u1EA1i m\u1ECDi phi\xEAn \u0111\u1EC3 ki\u1EC3m to\xE1n."}},{q:{en:"Can patient data stay inside Vietnam?",vi:"D\u1EEF li\u1EC7u b\u1EC7nh nh\xE2n c\xF3 th\u1EC3 n\u1EB1m ho\xE0n to\xE0n t\u1EA1i Vi\u1EC7t Nam kh\xF4ng?"},a:{en:"VCLOUD is hosted in Vietnam, and the AI Legal assistant offers an on-premise option for documents that must not leave your network.",vi:"VCLOUD \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam, v\xE0 tr\u1EE3 l\xFD AI Legal c\xF3 t\xF9y ch\u1ECDn on-premise cho t\xE0i li\u1EC7u kh\xF4ng \u0111\u01B0\u1EE3c r\u1EDDi kh\u1ECFi m\u1EA1ng n\u1ED9i b\u1ED9."}},{q:{en:"Where do we start if budget is limited?",vi:"N\xEAn b\u1EAFt \u0111\u1EA7u t\u1EEB \u0111\xE2u n\u1EBFu ng\xE2n s\xE1ch h\u1EA1n ch\u1EBF?"},a:{en:"Most hospitals start with email defense and the HIS database, the two most exposed layers, then add data-loss prevention. V-Tech Hub can scope a phased plan.",vi:"\u0110a s\u1ED1 b\u1EC7nh vi\u1EC7n b\u1EAFt \u0111\u1EA7u t\u1EEB b\u1EA3o v\u1EC7 email v\xE0 CSDL HIS, hai l\u1EDBp d\u1EC5 b\u1ECB t\u1EA5n c\xF4ng nh\u1EA5t, r\u1ED3i b\u1ED5 sung ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u. V-Tech Hub c\xF3 th\u1EC3 x\xE2y d\u1EF1ng l\u1ED9 tr\xECnh theo giai \u0111o\u1EA1n."}}]},{id:"retail",icon:"shopping-bag",name:{en:"E-Commerce & Retail",vi:"Th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED & B\xE1n l\u1EBB"},title:{en:"Retail & E-Commerce",vi:"B\xE1n l\u1EBB & Th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED"},tagline:{en:"Anti-DDoS & CDN, Web Application Firewall, sovereign VCLOUD, Data Loss Prevention and AI Legal & Compliance for always-on selling.",vi:"Ch\u1ED1ng DDoS & CDN, t\u01B0\u1EDDng l\u1EEDa \u1EE9ng d\u1EE5ng web, VCLOUD ch\u1EE7 quy\u1EC1n, ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 AI Legal & Compliance \u0111\u1EC3 b\xE1n h\xE0ng kh\xF4ng gi\xE1n \u0111o\u1EA1n."},bundle:["anti-ddos-cdn","web-waf","email-security","dlp","ai-legal","ai-agent"],image:"https://images.unsplash.com/photo-1556742049-0a67c5574f73?auto=format&fit=crop&w=1200&q=80",regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"PCI DSS",vi:"PCI DSS"},{en:"Law on Cybersecurity",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"Law on Consumer Protection",vi:"Lu\u1EADt B\u1EA3o v\u1EC7 quy\u1EC1n l\u1EE3i ng\u01B0\u1EDDi ti\xEAu d\xF9ng"}],story:{context:{title:{en:"Flash-sale night: shoppers and bots arrive together",vi:"\u0110\xEAm flash sale: kh\xE1ch mua v\xE0 bot c\xF9ng \u0111\u1ED5 v\u1EC1"},body:{en:'Traffic surges at midnight. Genuine buyers and malicious bots hit login, cart and checkout at the same moment, pages slow down, carts expire and the support inbox fills with "where is my order?".',vi:'L\u01B0u l\u01B0\u1EE3ng t\u0103ng v\u1ECDt l\xFAc n\u1EEDa \u0111\xEAm. Kh\xE1ch mua th\u1EADt v\xE0 bot \u0111\u1ED9c h\u1EA1i c\xF9ng \u0111\u1ED5 v\xE0o \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 thanh to\xE1n, trang ch\u1EADm d\u1EA7n, gi\u1ECF h\xE0ng h\u1EBFt h\u1EA1n v\xE0 h\u1ED9p th\u01B0 h\u1ED7 tr\u1EE3 ng\u1EADp c\xE2u h\u1ECFi "\u0111\u01A1n h\xE0ng c\u1EE7a t\xF4i \u0111\xE2u?".'}},entry:{title:{en:"Stop the entry point at the edge, before it reaches checkout",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 ngay \u1EDF bi\xEAn, tr\u01B0\u1EDBc khi v\xE0o thanh to\xE1n"},body:{en:"Anti-DDoS and CDN absorb the flood, the WAF protects login, cart and checkout, and an AI Agent answers shoppers instantly across channels.",vi:"Anti-DDoS v\xE0 CDN h\u1EA5p th\u1EE5 l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9t bi\u1EBFn, WAF b\u1EA3o v\u1EC7 \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 thanh to\xE1n, c\xF2n AI Agent tr\u1EA3 l\u1EDDi kh\xE1ch ngay l\u1EADp t\u1EE9c tr\xEAn m\u1ECDi k\xEAnh."}}},chapters:[{id:"peak-ddos",persona:{en:"CTO / Head of E-Commerce Platform",vi:"CTO / Gi\xE1m \u0111\u1ED1c n\u1EC1n t\u1EA3ng th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED"},challenge:{title:{en:"Peak-Sale Traffic and DDoS Attacks",vi:"L\u01B0u l\u01B0\u1EE3ng \u0111\u1EC9nh \u0111i\u1EC3m v\xE0 t\u1EA5n c\xF4ng DDoS ng\xE0y sale"},body:{en:"At midnight on a flash-sale day, traffic spikes tenfold. It is hard to tell real shoppers from a DDoS attack aimed at taking you offline while a competitor's campaign runs. Every minute of downtime is lost orders and wasted ad spend.",vi:"\u0110\xFAng 0 gi\u1EDD ng\xE0y flash sale, l\u01B0u l\u01B0\u1EE3ng t\u0103ng v\u1ECDt g\u1EA5p nhi\u1EC1u l\u1EA7n. R\u1EA5t kh\xF3 ph\xE2n bi\u1EC7t kh\xE1ch mua th\u1EADt v\u1EDBi m\u1ED9t \u0111\u1EE3t DDoS nh\u1EB1m \u0111\xE1nh s\u1EADp h\u1EC7 th\u1ED1ng \u0111\xFAng l\xFAc \u0111\u1ED1i th\u1EE7 ch\u1EA1y chi\u1EBFn d\u1ECBch. M\u1ED7i ph\xFAt gi\xE1n \u0111o\u1EA1n l\xE0 \u0111\u01A1n h\xE0ng m\u1EA5t \u0111i v\xE0 ng\xE2n s\xE1ch qu\u1EA3ng c\xE1o \u0111\u1ED5 b\u1ECF."}},solutions:["anti-ddos-cdn"],response:{title:{en:"Absorb the attack, keep selling",vi:"H\u1EA5p th\u1EE5 t\u1EA5n c\xF4ng, b\xE1n h\xE0ng kh\xF4ng ng\u1EEBng"},body:{en:"Anti-DDoS filtering and a CDN sit in front of your storefront, scrubbing malicious traffic and serving images and static content closer to shoppers so the origin stays free for orders.",vi:"L\u1EDBp ch\u1ED1ng DDoS v\xE0 CDN \u0111\u1EB7t tr\u01B0\u1EDBc website b\xE1n h\xE0ng, l\u1ECDc l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9c h\u1EA1i v\xE0 ph\xE2n ph\u1ED1i h\xECnh \u1EA3nh, n\u1ED9i dung t\u0129nh g\u1EA7n ng\u01B0\u1EDDi mua h\u01A1n, \u0111\u1EC3 m\xE1y ch\u1EE7 g\u1ED1c d\xE0nh s\u1EE9c cho vi\u1EC7c x\u1EED l\xFD \u0111\u01A1n h\xE0ng."},points:[{en:"Scrubs attack traffic before it reaches your origin",vi:"L\u1ECDc l\u01B0u l\u01B0\u1EE3ng t\u1EA5n c\xF4ng tr\u01B0\u1EDBc khi t\u1EDBi m\xE1y ch\u1EE7 g\u1ED1c"},{en:"CDN offloads images and static content at peak",vi:"CDN g\xE1nh h\xECnh \u1EA3nh v\xE0 n\u1ED9i dung t\u0129nh l\xFAc cao \u0111i\u1EC3m"},{en:"Stays up while real shoppers keep checking out",vi:"H\u1EC7 th\u1ED1ng v\u1EABn ch\u1EA1y khi kh\xE1ch th\u1EADt ti\u1EBFp t\u1EE5c thanh to\xE1n"}]}},{id:"bots-ato",persona:{en:"Head of Digital & Customer Experience",vi:"Gi\xE1m \u0111\u1ED1c S\u1ED1 & Tr\u1EA3i nghi\u1EC7m kh\xE1ch h\xE0ng"},challenge:{title:{en:"Bots, Account Takeover and Promotion Abuse",vi:"Bot, chi\u1EBFm t\xE0i kho\u1EA3n v\xE0 l\u1EA1m d\u1EE5ng khuy\u1EBFn m\xE3i"},body:{en:"Credential-stuffing bots take over loyalty accounts and drain points, while scripts grab limited stock and vouchers before real customers can. Marketing budget leaks away and loyal shoppers complain.",vi:"Bot d\xF2 m\u1EADt kh\u1EA9u chi\u1EBFm t\xE0i kho\u1EA3n th\xE0nh vi\xEAn v\xE0 r\xFAt \u0111i\u1EC3m th\u01B0\u1EDFng, trong khi script v\xE9t s\u1EA1ch h\xE0ng gi\u1EDBi h\u1EA1n v\xE0 voucher tr\u01B0\u1EDBc khi kh\xE1ch th\u1EADt k\u1ECBp mua. Ng\xE2n s\xE1ch marketing th\u1EA5t tho\xE1t, kh\xE1ch h\xE0ng th\xE2n thi\u1EBFt ph\xE0n n\xE0n."}},solutions:["web-waf"],response:{title:{en:"Stop automated abuse at the edge",vi:"Ch\u1EB7n l\u1EA1m d\u1EE5ng t\u1EF1 \u0111\u1ED9ng ngay t\u1EEB l\u1EDBp ngo\xE0i c\xF9ng"},body:{en:"A web application firewall inspects requests to login, cart and promotion endpoints, blocking injection attacks and abusive automation while letting genuine customers through.",vi:"T\u01B0\u1EDDng l\u1EEDa \u1EE9ng d\u1EE5ng web ki\u1EC3m tra y\xEAu c\u1EA7u v\xE0o c\xE1c \u0111i\u1EC3m \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 khuy\u1EBFn m\xE3i, ch\u1EB7n t\u1EA5n c\xF4ng injection v\xE0 t\u1EF1 \u0111\u1ED9ng h\xF3a l\u1EA1m d\u1EE5ng nh\u01B0ng v\u1EABn cho kh\xE1ch th\u1EADt \u0111i qua."},points:[{en:"Protects login, cart and voucher endpoints",vi:"B\u1EA3o v\u1EC7 \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 voucher"},{en:"Blocks common web attacks such as SQL injection and XSS",vi:"Ch\u1EB7n t\u1EA5n c\xF4ng web ph\u1ED5 bi\u1EBFn nh\u01B0 SQL injection, XSS"},{en:"Rules tuned per campaign without code changes",vi:"\u0110i\u1EC1u ch\u1EC9nh lu\u1EADt theo t\u1EEBng chi\u1EBFn d\u1ECBch, kh\xF4ng s\u1EEDa code"}]}},{id:"customer-data",persona:{en:"Chief Compliance Officer / DPO",vi:"Gi\xE1m \u0111\u1ED1c Tu\xE2n th\u1EE7 / C\xE1n b\u1ED9 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xE1 nh\xE2n"},challenge:{title:{en:"Customer Data and Decree 13 Exposure",vi:"D\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 r\u1EE7i ro theo Ngh\u1ECB \u0111\u1ECBnh 13"},body:{en:"Retailers hold phone numbers, addresses, purchase history and loyalty data across CRM, marketing agencies and store staff. Customer lists exported to personal email or USB are a common leak path, and Decree 13 puts the responsibility on you.",vi:"Doanh nghi\u1EC7p b\xE1n l\u1EBB n\u1EAFm s\u1ED1 \u0111i\u1EC7n tho\u1EA1i, \u0111\u1ECBa ch\u1EC9, l\u1ECBch s\u1EED mua h\xE0ng v\xE0 d\u1EEF li\u1EC7u th\xE0nh vi\xEAn r\u1EA3i kh\u1EAFp CRM, \u0111\u1ED1i t\xE1c marketing v\xE0 nh\xE2n vi\xEAn c\u1EEDa h\xE0ng. Danh s\xE1ch kh\xE1ch h\xE0ng xu\u1EA5t ra email c\xE1 nh\xE2n hay USB l\xE0 \u0111\u01B0\u1EDDng r\xF2 r\u1EC9 r\u1EA5t ph\u1ED5 bi\u1EBFn, v\xE0 Ngh\u1ECB \u0111\u1ECBnh 13 \u0111\u1EB7t tr\xE1ch nhi\u1EC7m l\xEAn doanh nghi\u1EC7p."}},solutions:["dlp"],response:{title:{en:"Know where customer data goes",vi:"Bi\u1EBFt d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng \u0111ang \u0111i \u0111\xE2u"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives automatically detects customer records leaving the company, helping prevent insider leaks and supporting Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 kh\xE1ch h\xE0ng b\u1ECB \u0111\u01B0a ra ngo\xE0i, gi\xFAp ng\u0103n r\xF2 r\u1EC9 n\u1ED9i b\u1ED9 v\xE0 h\u1ED7 tr\u1EE3 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects customer and loyalty records",vi:"T\u1EF1 nh\u1EADn di\u1EC7n d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 th\xE0nh vi\xEAn"},{en:"Evidence ready for audits",vi:"B\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng cho ki\u1EC3m to\xE1n"}]}},{id:"payment-cloud",persona:{en:"CFO / CIO",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh / Gi\xE1m \u0111\u1ED1c CNTT"},challenge:{title:{en:"Payment Data, PCI DSS and Fragile Hosting",vi:"D\u1EEF li\u1EC7u thanh to\xE1n, PCI DSS v\xE0 h\u1EA1 t\u1EA7ng thi\u1EBFu v\u1EEFng ch\u1EAFc"},body:{en:"Card and payment data raises PCI DSS obligations, and phishing mail aimed at finance and procurement teams is a standard route to fraudulent supplier payments. Hosting that cannot scale or keep data in-country adds cost and audit risk.",vi:"D\u1EEF li\u1EC7u th\u1EBB v\xE0 thanh to\xE1n k\xE9o theo ngh\u0129a v\u1EE5 PCI DSS, c\xF2n email phishing nh\u1EAFm v\xE0o k\u1EBF to\xE1n, mua h\xE0ng l\xE0 \u0111\u01B0\u1EDDng quen thu\u1ED9c d\u1EABn t\u1EDBi chuy\u1EC3n ti\u1EC1n nh\u1EA7m cho nh\xE0 cung c\u1EA5p gi\u1EA3 m\u1EA1o. H\u1EA1 t\u1EA7ng kh\xF4ng co gi\xE3n \u0111\u01B0\u1EE3c ho\u1EB7c kh\xF4ng gi\u1EEF d\u1EEF li\u1EC7u trong n\u01B0\u1EDBc l\xE0m t\u0103ng chi ph\xED v\xE0 r\u1EE7i ro ki\u1EC3m to\xE1n."}},solutions:["email-security"],response:{title:{en:"Sovereign cloud with a protected inbox",vi:"\u0110\xE1m m\xE2y ch\u1EE7 quy\u1EC1n c\xF9ng h\u1ED9p th\u01B0 \u0111\u01B0\u1EE3c b\u1EA3o v\u1EC7"},body:{en:"VCLOUD hosts commerce workloads with data kept inside Vietnam, and advanced email defense filters phishing, spoofed supplier invoices and ransomware before they reach your teams.",vi:"VCLOUD l\u01B0u tr\u1EEF h\u1EC7 th\u1ED1ng th\u01B0\u01A1ng m\u1EA1i v\u1EDBi d\u1EEF li\u1EC7u n\u1EB1m t\u1EA1i Vi\u1EC7t Nam, c\xF2n b\u1EA3o v\u1EC7 email n\xE2ng cao l\u1ECDc phishing, h\xF3a \u0111\u01A1n nh\xE0 cung c\u1EA5p gi\u1EA3 m\u1EA1o v\xE0 ransomware tr\u01B0\u1EDBc khi t\u1EDBi nh\xE2n vi\xEAn."},points:[{en:"Sovereign hosting inside Vietnam",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n ngay t\u1EA1i Vi\u1EC7t Nam"},{en:"Filters fake supplier and payment requests",vi:"L\u1ECDc y\xEAu c\u1EA7u thanh to\xE1n, nh\xE0 cung c\u1EA5p gi\u1EA3"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"}]}},{id:"contracts",persona:{en:"Head of Legal & Procurement",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Ph\xE1p ch\u1EBF & Mua h\xE0ng"},challenge:{title:{en:"Supplier, Landlord and Platform Contracts at Scale",vi:"H\u1EE3p \u0111\u1ED3ng nh\xE0 cung c\u1EA5p, m\u1EB7t b\u1EB1ng v\xE0 s\xE0n \u1EDF quy m\xF4 l\u1EDBn"},body:{en:"A retail group manages hundreds of supplier, lease, marketplace and franchise contracts, plus changing rules on consumer protection and personal data. Manual review slows new store openings and vendor onboarding.",vi:"M\u1ED9t t\u1EADp \u0111o\xE0n b\xE1n l\u1EBB ph\u1EA3i qu\u1EA3n l\xFD h\xE0ng tr\u0103m h\u1EE3p \u0111\u1ED3ng nh\xE0 cung c\u1EA5p, thu\xEA m\u1EB7t b\u1EB1ng, s\xE0n th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED v\xE0 nh\u01B0\u1EE3ng quy\u1EC1n, c\xF9ng c\xE1c quy \u0111\u1ECBnh v\u1EC1 b\u1EA3o v\u1EC7 ng\u01B0\u1EDDi ti\xEAu d\xF9ng v\xE0 d\u1EEF li\u1EC7u c\xE1 nh\xE2n lu\xF4n thay \u0111\u1ED5i. R\xE0 so\xE1t th\u1EE7 c\xF4ng l\xE0m ch\u1EADm vi\u1EC7c m\u1EDF c\u1EEDa h\xE0ng m\u1EDBi v\xE0 \u0111\u01B0a nh\xE0 cung c\u1EA5p v\xE0o h\u1EC7 th\u1ED1ng."}},solutions:["ai-legal"],response:{title:{en:"Review contracts in minutes, not days",vi:"R\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng trong v\xE0i ph\xFAt thay v\xEC v\xE0i ng\xE0y"},body:{en:"An AI legal assistant automates contract review and flags risky clauses, with an on-premise option so commercial terms and supplier pricing never leave your walls.",vi:"Tr\u1EE3 l\xFD AI ph\xE1p l\xFD t\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 \u0111\xE1nh d\u1EA5u \u0111i\u1EC1u kho\u1EA3n r\u1EE7i ro, c\xF3 t\xF9y ch\u1ECDn on-premise \u0111\u1EC3 \u0111i\u1EC1u kho\u1EA3n th\u01B0\u01A1ng m\u1EA1i v\xE0 gi\xE1 nh\xE0 cung c\u1EA5p kh\xF4ng r\u1EDDi kh\u1ECFi h\u1EC7 th\u1ED1ng c\u1EE7a b\u1EA1n."},points:[{en:"Automated clause review",vi:"T\u1EF1 \u0111\u1ED9ng r\xE0 so\xE1t \u0111i\u1EC1u kho\u1EA3n"},{en:"On-premise option for total privacy",vi:"T\xF9y ch\u1ECDn on-premise b\u1EA3o m\u1EADt tuy\u1EC7t \u0111\u1ED1i"},{en:"Frees legal teams for high-value work",vi:"Gi\u1EA3i ph\xF3ng \u0111\u1ED9i ph\xE1p ch\u1EBF cho vi\u1EC7c gi\xE1 tr\u1ECB cao"}]}}],outcomes:[{title:{en:"Sell Without Interruption",vi:"B\xE1n h\xE0ng kh\xF4ng gi\xE1n \u0111o\u1EA1n"},body:{en:"Keep the storefront and checkout available during the campaigns that matter most, protected from DDoS and automated abuse.",vi:"Gi\u1EEF website v\xE0 thanh to\xE1n lu\xF4n s\u1EB5n s\xE0ng trong nh\u1EEFng chi\u1EBFn d\u1ECBch quan tr\u1ECDng nh\u1EA5t, \u0111\u01B0\u1EE3c b\u1EA3o v\u1EC7 kh\u1ECFi DDoS v\xE0 l\u1EA1m d\u1EE5ng t\u1EF1 \u0111\u1ED9ng."}},{title:{en:"Protect Customer Trust and Compliance",vi:"B\u1EA3o v\u1EC7 ni\u1EC1m tin kh\xE1ch h\xE0ng v\xE0 tu\xE2n th\u1EE7"},body:{en:"Safeguard customer and payment data across email, users and infrastructure, and be ready for Decree 13 and PCI DSS expectations.",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 thanh to\xE1n tr\xEAn email, ng\u01B0\u1EDDi d\xF9ng v\xE0 h\u1EA1 t\u1EA7ng, s\u1EB5n s\xE0ng cho y\xEAu c\u1EA7u c\u1EE7a Ngh\u1ECB \u0111\u1ECBnh 13 v\xE0 PCI DSS."}},{title:{en:"Lower Risk and Operating Cost",vi:"Gi\u1EA3m r\u1EE7i ro v\xE0 chi ph\xED v\u1EADn h\xE0nh"},body:{en:"One local partner for cloud, edge protection, data and legal automation reduces vendor sprawl, manual work and incident-response effort.",vi:"M\u1ED9t \u0111\u1ED1i t\xE1c trong n\u01B0\u1EDBc cho \u0111\xE1m m\xE2y, b\u1EA3o v\u1EC7 l\u1EDBp ngo\xE0i, d\u1EEF li\u1EC7u v\xE0 t\u1EF1 \u0111\u1ED9ng h\xF3a ph\xE1p ch\u1EBF gi\xFAp gi\u1EA3m s\u1ED1 nh\xE0 cung c\u1EA5p, c\xF4ng vi\u1EC7c th\u1EE7 c\xF4ng v\xE0 n\u1ED7 l\u1EF1c \u1EE9ng ph\xF3 s\u1EF1 c\u1ED1."}}],faq:[{q:{en:"Do we need to move our e-commerce platform to protect it from DDoS?",vi:"Ch\xFAng t\xF4i c\xF3 c\u1EA7n chuy\u1EC3n h\u1EC7 th\u1ED1ng th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED sang n\u01A1i kh\xE1c \u0111\u1EC3 ch\u1ED1ng DDoS kh\xF4ng?"},a:{en:"Not necessarily. Anti-DDoS and CDN protection sits in front of your existing site, wherever it is hosted. VCLOUD is available if you also want sovereign hosting inside Vietnam.",vi:"Kh\xF4ng nh\u1EA5t thi\u1EBFt. L\u1EDBp ch\u1ED1ng DDoS v\xE0 CDN \u0111\u1EB7t ph\xEDa tr\u01B0\u1EDBc website hi\u1EC7n c\xF3, d\xF9 \u0111ang l\u01B0u tr\u1EEF \u1EDF \u0111\xE2u. VCLOUD l\xE0 l\u1EF1a ch\u1ECDn b\u1ED5 sung n\u1EBFu b\u1EA1n mu\u1ED1n l\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n t\u1EA1i Vi\u1EC7t Nam."}},{q:{en:"Does this help with PCI DSS?",vi:"Gi\u1EA3i ph\xE1p c\xF3 h\u1ED7 tr\u1EE3 PCI DSS kh\xF4ng?"},a:{en:"A web application firewall, data monitoring and secure hosting support several PCI DSS control areas. Certification itself depends on your whole payment environment and assessor, so we scope it with you.",vi:"T\u01B0\u1EDDng l\u1EEDa \u1EE9ng d\u1EE5ng web, gi\xE1m s\xE1t d\u1EEF li\u1EC7u v\xE0 h\u1EA1 t\u1EA7ng an to\xE0n h\u1ED7 tr\u1EE3 nhi\u1EC1u nh\xF3m ki\u1EC3m so\xE1t c\u1EE7a PCI DSS. Vi\u1EC7c \u0111\u1EA1t ch\u1EE9ng nh\u1EADn ph\u1EE5 thu\u1ED9c to\xE0n b\u1ED9 m\xF4i tr\u01B0\u1EDDng thanh to\xE1n v\xE0 \u0111\u01A1n v\u1ECB \u0111\xE1nh gi\xE1, n\xEAn ch\xFAng t\xF4i c\xF9ng b\u1EA1n x\xE1c \u0111\u1ECBnh ph\u1EA1m vi."}},{q:{en:"How do we handle customer data under Decree 13?",vi:"L\xE0m th\u1EBF n\xE0o \u0111\u1EC3 x\u1EED l\xFD d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng theo Ngh\u1ECB \u0111\u1ECBnh 13?"},a:{en:"Data Loss Prevention discovers and monitors customer records leaving through chat, webmail and USB, and VCLOUD keeps data inside Vietnam, giving you evidence for audits and incident response.",vi:"Gi\u1EA3i ph\xE1p ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u ph\xE1t hi\u1EC7n v\xE0 gi\xE1m s\xE1t h\u1ED3 s\u01A1 kh\xE1ch h\xE0ng \u0111i ra qua chat, webmail, USB, c\xF2n VCLOUD gi\u1EEF d\u1EEF li\u1EC7u t\u1EA1i Vi\u1EC7t Nam, gi\xFAp b\u1EA1n c\xF3 b\u1EB1ng ch\u1EE9ng cho ki\u1EC3m to\xE1n v\xE0 \u1EE9ng ph\xF3 s\u1EF1 c\u1ED1."}}]},{id:"manufacturing",icon:"factory",name:{en:"Manufacturing",vi:"S\u1EA3n xu\u1EA5t"},title:{en:"Manufacturing & Industrial Supply Chain",vi:"S\u1EA3n xu\u1EA5t & Chu\u1ED7i cung \u1EE9ng c\xF4ng nghi\u1EC7p"},tagline:{en:"VCLOUD & Email Security, Database Security and Data Loss Prevention to keep production lines running and designs protected.",vi:"VCLOUD & Email Security, B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u \u0111\u1EC3 d\xE2y chuy\u1EC1n lu\xF4n ch\u1EA1y v\xE0 b\u1EA3n thi\u1EBFt k\u1EBF lu\xF4n an to\xE0n."},bundle:["email-security","database-security","dlp"],image:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1200&q=80",regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"Cybersecurity Law",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"ISO 27001",vi:"ISO 27001"},{en:"Customer security audits",vi:"\u0110\xE1nh gi\xE1 an ninh c\u1EE7a kh\xE1ch h\xE0ng"}],story:{context:{title:{en:"One supplier invoice, and the production line stops",vi:"M\u1ED9t email h\xF3a \u0111\u01A1n nh\xE0 cung c\u1EA5p, v\xE0 d\xE2y chuy\u1EC1n ng\u1EEBng ch\u1EA1y"},body:{en:"At 7:40 a.m. a planner opens an invoice that looks like it came from a regular supplier. By mid-morning the ransomware has moved from the office network into ERP and MES. Orders freeze, shipments slip and every hour of downtime turns into penalties.",vi:"L\xFAc 7:40 s\xE1ng, nh\xE2n vi\xEAn k\u1EBF ho\u1EA1ch m\u1EDF m\u1ED9t h\xF3a \u0111\u01A1n tr\xF4ng nh\u01B0 c\u1EE7a nh\xE0 cung c\u1EA5p quen thu\u1ED9c. \u0110\u1EBFn gi\u1EEFa bu\u1ED5i, ransomware \u0111\xE3 lan t\u1EEB m\u1EA1ng v\u0103n ph\xF2ng sang ERP v\xE0 MES. \u0110\u01A1n h\xE0ng \u0111\u1EE9ng y\xEAn, l\xF4 h\xE0ng tr\u1EC5 h\u1EA1n v\xE0 m\u1ED7i gi\u1EDD ng\u1EEBng tr\u1EC7 \u0111\u1EC1u tr\u1EDF th\xE0nh ti\u1EC1n ph\u1EA1t."}},entry:{title:{en:"Stop the entry point before it reaches the office network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng v\u0103n ph\xF2ng"},body:{en:"Email defense on sovereign VCLOUD filters spoofed invoices and ransomware at the gateway, so nothing malicious reaches the systems that run the line.",vi:"B\u1EA3o v\u1EC7 email tr\xEAn VCLOUD ch\u1EE7 quy\u1EC1n l\u1ECDc h\xF3a \u0111\u01A1n gi\u1EA3 m\u1EA1o v\xE0 ransomware ngay t\u1EA1i c\u1ED5ng, \u0111\u1EC3 kh\xF4ng g\xEC \u0111\u1ED9c h\u1EA1i ch\u1EA1m t\u1EDBi c\xE1c h\u1EC7 th\u1ED1ng v\u1EADn h\xE0nh d\xE2y chuy\u1EC1n."}}},chapters:[{id:"ransomware",persona:{en:"CIO / Head of IT",vi:"Gi\xE1m \u0111\u1ED1c CNTT"},challenge:{title:{en:"Ransomware That Stops the Line",vi:"Ransomware l\xE0m d\u1EEBng d\xE2y chuy\u1EC1n"},body:{en:"A single phishing email opened in the office network can spread to ERP and production systems. When orders cannot be processed and shipments are delayed, every hour of downtime turns into penalties and lost customer trust.",vi:"Ch\u1EC9 m\u1ED9t email phishing \u0111\u01B0\u1EE3c m\u1EDF tr\xEAn m\u1EA1ng v\u0103n ph\xF2ng c\u0169ng c\xF3 th\u1EC3 lan sang ERP v\xE0 h\u1EC7 th\u1ED1ng s\u1EA3n xu\u1EA5t. Khi \u0111\u01A1n h\xE0ng kh\xF4ng x\u1EED l\xFD \u0111\u01B0\u1EE3c v\xE0 l\xF4 h\xE0ng tr\u1EC5 h\u1EA1n, m\u1ED7i gi\u1EDD ng\u1EEBng tr\u1EC7 \u0111\u1EC1u tr\u1EDF th\xE0nh ti\u1EC1n ph\u1EA1t v\xE0 m\u1EA5t ni\u1EC1m tin c\u1EE7a kh\xE1ch h\xE0ng."}},solutions:["email-security"],response:{title:{en:"Stop the entry point before it reaches the office",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o v\u0103n ph\xF2ng"},body:{en:"Advanced email defense on VCLOUD blocks phishing, spoofed supplier invoices and ransomware at the gateway, while business data is hosted inside Vietnam.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao tr\xEAn VCLOUD ch\u1EB7n phishing, h\xF3a \u0111\u01A1n nh\xE0 cung c\u1EA5p gi\u1EA3 m\u1EA1o v\xE0 ransomware ngay t\u1EA1i c\u1ED5ng, trong khi d\u1EEF li\u1EC7u doanh nghi\u1EC7p \u0111\u01B0\u1EE3c l\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Blocks phishing and executive or supplier spoofing",vi:"Ch\u1EB7n phishing, gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o v\xE0 nh\xE0 cung c\u1EA5p"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"},{en:"Sovereign hosting inside Vietnam",vi:"L\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n ngay t\u1EA1i Vi\u1EC7t Nam"}]}},{id:"ip-leak",persona:{en:"CTO / Head of R&D",vi:"Gi\xE1m \u0111\u1ED1c C\xF4ng ngh\u1EC7 / Tr\u01B0\u1EDFng R&D"},challenge:{title:{en:"Designs and Formulas Walking Out the Door",vi:"B\u1EA3n thi\u1EBFt k\u1EBF, c\xF4ng th\u1EE9c b\u1ECB mang ra ngo\xE0i"},body:{en:"CAD files, process recipes and BOMs are the core value of a plant. They can leave through USB drives, personal webmail or chat apps, whether by a departing engineer or by an honest mistake.",vi:"File CAD, c\xF4ng th\u1EE9c quy tr\xECnh v\xE0 BOM l\xE0 gi\xE1 tr\u1ECB c\u1ED1t l\xF5i c\u1EE7a nh\xE0 m\xE1y. Ch\xFAng c\xF3 th\u1EC3 r\u1EDDi \u0111i qua USB, webmail c\xE1 nh\xE2n ho\u1EB7c \u1EE9ng d\u1EE5ng chat, do k\u1EF9 s\u01B0 ngh\u1EC9 vi\u1EC7c ho\u1EB7c ch\u1EC9 v\xEC s\u01A1 su\u1EA5t."}},solutions:["dlp"],response:{title:{en:"See sensitive files wherever they try to leave",vi:"Th\u1EA5y file nh\u1EA1y c\u1EA3m \u1EDF m\u1ECDi n\u01A1i ch\xFAng c\u1ED1 r\u1EDDi \u0111i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives detects sensitive documents automatically and stops leaks before they reach a competitor.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n t\xE0i li\u1EC7u nh\u1EA1y c\u1EA3m v\xE0 ng\u0103n r\xF2 r\u1EC9 tr\u01B0\u1EDBc khi t\u1EDBi tay \u0111\u1ED1i th\u1EE7."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects sensitive documents",vi:"T\u1EF1 nh\u1EADn di\u1EC7n t\xE0i li\u1EC7u nh\u1EA1y c\u1EA3m"},{en:"Evidence trail for investigations",vi:"B\u1EB1ng ch\u1EE9ng ph\u1EE5c v\u1EE5 \u0111i\u1EC1u tra"}]}},{id:"erp-data",persona:{en:"Head of ERP / MES & DBA",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn ERP / MES & DBA"},challenge:{title:{en:"ERP and MES Data Open to Too Many Hands",vi:"D\u1EEF li\u1EC7u ERP v\xE0 MES qu\xE1 nhi\u1EC1u ng\u01B0\u1EDDi ch\u1EA1m t\u1EDBi"},body:{en:"Production plans, costs, pricing and customer orders sit in ERP and MES databases that administrators, developers and integrators can reach directly. Without query-level control, a mistake or misuse may go unnoticed.",vi:"K\u1EBF ho\u1EA1ch s\u1EA3n xu\u1EA5t, gi\xE1 th\xE0nh, b\xE1o gi\xE1 v\xE0 \u0111\u01A1n h\xE0ng n\u1EB1m trong CSDL ERP, MES m\xE0 qu\u1EA3n tr\u1ECB vi\xEAn, l\u1EADp tr\xECnh vi\xEAn v\xE0 \u0111\u01A1n v\u1ECB t\xEDch h\u1EE3p c\xF3 th\u1EC3 truy c\u1EADp tr\u1EF1c ti\u1EBFp. Thi\u1EBFu ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n, sai s\xF3t ho\u1EB7c l\u1EA1m quy\u1EC1n c\xF3 th\u1EC3 kh\xF4ng b\u1ECB ph\xE1t hi\u1EC7n."}},solutions:["database-security"],response:{title:{en:"Every query seen, every sensitive field masked",vi:"M\u1ECDi truy v\u1EA5n \u0111\u1EC1u \u0111\u01B0\u1EE3c th\u1EA5y, tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m \u0111\u1EC1u \u0111\u01B0\u1EE3c che"},body:{en:"Query-level access control and real-time data masking protect ERP and MES data without slowing live operations.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u ERP, MES m\xE0 kh\xF4ng l\xE0m ch\u1EADm v\u1EADn h\xE0nh."},points:[{en:"Restricts direct database access",vi:"H\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp v\xE0o CSDL"},{en:"Masks costs and pricing from unauthorized admins",vi:"Che gi\xE1 th\xE0nh, b\xE1o gi\xE1 v\u1EDBi qu\u1EA3n tr\u1ECB vi\xEAn kh\xF4ng c\xF3 quy\u1EC1n"},{en:"Audit trail for every change",vi:"Nh\u1EADt k\xFD ki\u1EC3m to\xE1n m\u1ECDi thay \u0111\u1ED5i"}]}},{id:"vendor-access",persona:{en:"Head of IT Infrastructure",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn H\u1EA1 t\u1EA7ng CNTT"},challenge:{title:{en:"Remote Vendors with St
