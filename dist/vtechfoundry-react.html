ttps://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=600&q=80",story:{context:{title:{en:"Salary day: the core system buckles at peak traffic",vi:"Ng\xE0y tr\u1EA3 l\u01B0\u01A1ng: h\u1EC7 th\u1ED1ng l\xF5i qu\xE1 t\u1EA3i \u1EDF gi\u1EDD cao \u0111i\u1EC3m"},body:{en:"At 8 a.m. transfers and card payments spike while heavy privileged queries and noisy logs hit the same Core Banking database. Transactions time out, the app slows down and the call center fills up with customers asking what happened.",vi:"L\xFAc 8 gi\u1EDD s\xE1ng, giao d\u1ECBch chuy\u1EC3n kho\u1EA3n v\xE0 thanh to\xE1n th\u1EBB t\u0103ng v\u1ECDt, trong khi c\xE1c truy v\u1EA5n \u0111\u1EB7c quy\u1EC1n n\u1EB7ng v\xE0 log r\xE1c c\xF9ng \u0111\u1ED5 v\xE0o c\u01A1 s\u1EDF d\u1EEF li\u1EC7u Core Banking. Giao d\u1ECBch qu\xE1 h\u1EA1n, \u1EE9ng d\u1EE5ng ch\u1EADm l\u1EA1i v\xE0 t\u1ED5ng \u0111\xE0i ng\u1EADp trong cu\u1ED9c g\u1ECDi h\u1ECFi chuy\u1EC7n g\xEC \u0111\xE3 x\u1EA3y ra."}},entry:{title:{en:"Stop the entry point before it reaches the core network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng l\xF5i"},body:{en:"Query-level control keeps unauthorized and junk requests off Core Banking, so live transactions stay fast. AI Agents absorb the customer questions instantly instead of the call center.",vi:"Ki\u1EC3m so\xE1t \u1EDF m\u1EE9c truy v\u1EA5n gi\u1EEF c\xE1c y\xEAu c\u1EA7u tr\xE1i ph\xE9p v\xE0 log r\xE1c kh\u1ECFi Core Banking, nh\u1EDD v\u1EADy giao d\u1ECBch tr\u1EF1c ti\u1EBFp lu\xF4n nhanh. AI Agent tr\u1EA3 l\u1EDDi ngay c\xE2u h\u1ECFi c\u1EE7a kh\xE1ch h\xE0ng thay cho t\u1ED5ng \u0111\xE0i."}}},outcomes:[{en:"Protect Customer Data & Trust",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u & ni\u1EC1m tin kh\xE1ch h\xE0ng"},{en:"Stay Ahead of Compliance",vi:"\u0110i tr\u01B0\u1EDBc y\xEAu c\u1EA7u tu\xE2n th\u1EE7"},{en:"Optimize Operations & Cost",vi:"T\u1ED1i \u01B0u v\u1EADn h\xE0nh & chi ph\xED"}]},{id:"government",icon:"building-2",name:{en:"Government & Public Sector",vi:"Ch\xEDnh ph\u1EE7 & Khu v\u1EF1c c\xF4ng"},bundle:["email-security","dlp","database-security","ai-legal"],image:null,story:{context:{title:{en:'A fake notice from a "superior agency" opens the door',vi:'M\u1ED9t c\xF4ng v\u0103n gi\u1EA3 danh "c\u01A1 quan c\u1EA5p tr\xEAn" m\u1EDF c\u1EEDa cho k\u1EBB t\u1EA5n c\xF4ng'},body:{en:"An officer opens an urgent notice that appears to come from a higher agency. The attacker gains a foothold, moves toward the citizen database and starts reading records that were never meant to leave the agency.",vi:"M\u1ED9t c\xE1n b\u1ED9 m\u1EDF c\xF4ng v\u0103n kh\u1EA9n c\xF3 v\u1EBB \u0111\u1EBFn t\u1EEB c\u01A1 quan c\u1EA5p tr\xEAn. K\u1EBB t\u1EA5n c\xF4ng c\xF3 ch\u1ED7 \u0111\u1EE9ng trong h\u1EC7 th\u1ED1ng, ti\u1EBFn d\u1EA7n t\u1EDBi c\u01A1 s\u1EDF d\u1EEF li\u1EC7u c\xF4ng d\xE2n v\xE0 \u0111\u1ECDc nh\u1EEFng h\u1ED3 s\u01A1 v\u1ED1n kh\xF4ng \u0111\u01B0\u1EE3c r\u1EDDi kh\u1ECFi c\u01A1 quan."}},entry:{title:{en:"Stop the entry point before it reaches the agency network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng n\u1ED9i b\u1ED9 c\u01A1 quan"},body:{en:"Sovereign email defense filters impersonation at the gateway, while DLP and Database Security protect citizen data if an account is ever compromised.",vi:"B\u1EA3o v\u1EC7 email ch\u1EE7 quy\u1EC1n l\u1ECDc gi\u1EA3 m\u1EA1o ngay t\u1EA1i c\u1ED5ng, c\xF2n DLP v\xE0 B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xF4ng d\xE2n n\u1EBFu c\xF3 t\xE0i kho\u1EA3n b\u1ECB chi\u1EBFm quy\u1EC1n."}}},outcomes:[{en:"Protect Citizen Data & Public Trust",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xF4ng d\xE2n & ni\u1EC1m tin x\xE3 h\u1ED9i"},{en:"Be Ready for Inspection",vi:"S\u1EB5n s\xE0ng cho thanh tra, ki\u1EC3m tra"},{en:"Do More with Lean IT Teams",vi:"L\xE0m nhi\u1EC1u h\u01A1n v\u1EDBi \u0111\u1ED9i CNTT tinh g\u1ECDn"}]},{id:"healthcare",icon:"heart-pulse",name:{en:"Healthcare",vi:"Y t\u1EBF"},bundle:["email-security","database-security","dlp","ai-legal"],image:"https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80",story:{context:{title:{en:"A phishing email, and patient records leave the hospital",vi:"M\u1ED9t email l\u1EEBa \u0111\u1EA3o, v\xE0 h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n b\u1ECB \u0111\u01B0a ra ngo\xE0i"},body:{en:"A clerk in medical records clicks a fake insurance notice. The attacker signs in with that account and quietly copies patient files while wards fall back to paper charts. The hospital learns about it from the outside, after trust is already damaged.",vi:"M\u1ED9t nh\xE2n vi\xEAn h\u1ED3 s\u01A1 b\u1EC7nh \xE1n b\u1EA5m v\xE0o th\xF4ng b\xE1o b\u1EA3o hi\u1EC3m gi\u1EA3. K\u1EBB t\u1EA5n c\xF4ng \u0111\u0103ng nh\u1EADp b\u1EB1ng t\xE0i kho\u1EA3n \u0111\xF3 v\xE0 \xE2m th\u1EA7m sao ch\xE9p h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n, trong khi c\xE1c khoa ph\u1EA3i quay l\u1EA1i b\u1EC7nh \xE1n gi\u1EA5y. B\u1EC7nh vi\u1EC7n bi\u1EBFt chuy\u1EC7n t\u1EEB b\xEAn ngo\xE0i, khi ni\u1EC1m tin \u0111\xE3 b\u1ECB t\u1ED5n h\u1EA1i."}},entry:{title:{en:"Stop the entry point before it reaches patient records",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi ch\u1EA1m t\u1EDBi h\u1ED3 s\u01A1 b\u1EC7nh nh\xE2n"},body:{en:"Email defense blocks the lure at the gateway. Database Security and DLP add a second line, masking sensitive fields and flagging records that try to leave.",vi:"B\u1EA3o v\u1EC7 email ch\u1EB7n m\u1ED3i nh\u1EED ngay t\u1EA1i c\u1ED5ng. B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 DLP t\u1EA1o l\u1EDBp ph\xF2ng th\u1EE7 th\u1EE9 hai, che c\xE1c tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m v\xE0 c\u1EA3nh b\xE1o h\u1ED3 s\u01A1 c\xF3 d\u1EA5u hi\u1EC7u b\u1ECB \u0111\u01B0a ra ngo\xE0i."}}},outcomes:[{en:"Keep Care Running",vi:"Gi\u1EEF v\u1EADn h\xE0nh kh\xE1m ch\u1EEFa b\u1EC7nh li\xEAn t\u1EE5c"},{en:"Protect Patient Trust",vi:"B\u1EA3o v\u1EC7 ni\u1EC1m tin ng\u01B0\u1EDDi b\u1EC7nh"},{en:"Prepare for Compliance",vi:"Chu\u1EA9n b\u1ECB cho tu\xE2n th\u1EE7"}]},{id:"retail",icon:"shopping-bag",name:{en:"E-Commerce & Retail",vi:"Th\u01B0\u01A1ng m\u1EA1i \u0111i\u1EC7n t\u1EED & B\xE1n l\u1EBB"},bundle:["anti-ddos-cdn","web-waf","email-security","dlp","ai-legal","ai-agent"],image:"https://images.unsplash.com/photo-1556742049-0a67c5574f73?auto=format&fit=crop&w=600&q=80",story:{context:{title:{en:"Flash-sale night: shoppers and bots arrive together",vi:"\u0110\xEAm flash sale: kh\xE1ch mua v\xE0 bot c\xF9ng \u0111\u1ED5 v\u1EC1"},body:{en:'Traffic surges at midnight. Genuine buyers and malicious bots hit login, cart and checkout at the same moment, pages slow down, carts expire and the support inbox fills with "where is my order?".',vi:'L\u01B0u l\u01B0\u1EE3ng t\u0103ng v\u1ECDt l\xFAc n\u1EEDa \u0111\xEAm. Kh\xE1ch mua th\u1EADt v\xE0 bot \u0111\u1ED9c h\u1EA1i c\xF9ng \u0111\u1ED5 v\xE0o \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 thanh to\xE1n, trang ch\u1EADm d\u1EA7n, gi\u1ECF h\xE0ng h\u1EBFt h\u1EA1n v\xE0 h\u1ED9p th\u01B0 h\u1ED7 tr\u1EE3 ng\u1EADp c\xE2u h\u1ECFi "\u0111\u01A1n h\xE0ng c\u1EE7a t\xF4i \u0111\xE2u?".'}},entry:{title:{en:"Stop the entry point at the edge, before it reaches checkout",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 ngay \u1EDF bi\xEAn, tr\u01B0\u1EDBc khi v\xE0o thanh to\xE1n"},body:{en:"Anti-DDoS and CDN absorb the flood, the WAF protects login, cart and checkout, and an AI Agent answers shoppers instantly across channels.",vi:"Anti-DDoS v\xE0 CDN h\u1EA5p th\u1EE5 l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9t bi\u1EBFn, WAF b\u1EA3o v\u1EC7 \u0111\u0103ng nh\u1EADp, gi\u1ECF h\xE0ng v\xE0 thanh to\xE1n, c\xF2n AI Agent tr\u1EA3 l\u1EDDi kh\xE1ch ngay l\u1EADp t\u1EE9c tr\xEAn m\u1ECDi k\xEAnh."}}},outcomes:[{en:"Sell Without Interruption",vi:"B\xE1n h\xE0ng kh\xF4ng gi\xE1n \u0111o\u1EA1n"},{en:"Protect Customer Trust and Compliance",vi:"B\u1EA3o v\u1EC7 ni\u1EC1m tin kh\xE1ch h\xE0ng v\xE0 tu\xE2n th\u1EE7"},{en:"Lower Risk and Operating Cost",vi:"Gi\u1EA3m r\u1EE7i ro v\xE0 chi ph\xED v\u1EADn h\xE0nh"}]},{id:"manufacturing",icon:"factory",name:{en:"Manufacturing",vi:"S\u1EA3n xu\u1EA5t"},bundle:["email-security","database-security","dlp"],image:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=600&q=80",story:{context:{title:{en:"One supplier invoice, and the production line stops",vi:"M\u1ED9t email h\xF3a \u0111\u01A1n nh\xE0 cung c\u1EA5p, v\xE0 d\xE2y chuy\u1EC1n ng\u1EEBng ch\u1EA1y"},body:{en:"At 7:40 a.m. a planner opens an invoice that looks like it came from a regular supplier. By mid-morning the ransomware has moved from the office network into ERP and MES. Orders freeze, shipments slip and every hour of downtime turns into penalties.",vi:"L\xFAc 7:40 s\xE1ng, nh\xE2n vi\xEAn k\u1EBF ho\u1EA1ch m\u1EDF m\u1ED9t h\xF3a \u0111\u01A1n tr\xF4ng nh\u01B0 c\u1EE7a nh\xE0 cung c\u1EA5p quen thu\u1ED9c. \u0110\u1EBFn gi\u1EEFa bu\u1ED5i, ransomware \u0111\xE3 lan t\u1EEB m\u1EA1ng v\u0103n ph\xF2ng sang ERP v\xE0 MES. \u0110\u01A1n h\xE0ng \u0111\u1EE9ng y\xEAn, l\xF4 h\xE0ng tr\u1EC5 h\u1EA1n v\xE0 m\u1ED7i gi\u1EDD ng\u1EEBng tr\u1EC7 \u0111\u1EC1u tr\u1EDF th\xE0nh ti\u1EC1n ph\u1EA1t."}},entry:{title:{en:"Stop the entry point before it reaches the office network",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o m\u1EA1ng v\u0103n ph\xF2ng"},body:{en:"Email defense on sovereign VCLOUD filters spoofed invoices and ransomware at the gateway, so nothing malicious reaches the systems that run the line.",vi:"B\u1EA3o v\u1EC7 email tr\xEAn VCLOUD ch\u1EE7 quy\u1EC1n l\u1ECDc h\xF3a \u0111\u01A1n gi\u1EA3 m\u1EA1o v\xE0 ransomware ngay t\u1EA1i c\u1ED5ng, \u0111\u1EC3 kh\xF4ng g\xEC \u0111\u1ED9c h\u1EA1i ch\u1EA1m t\u1EDBi c\xE1c h\u1EC7 th\u1ED1ng v\u1EADn h\xE0nh d\xE2y chuy\u1EC1n."}}},outcomes:[{en:"Keep Production Running",vi:"Gi\u1EEF s\u1EA3n xu\u1EA5t v\u1EADn h\xE0nh li\xEAn t\u1EE5c"},{en:"Protect Intellectual Property",vi:"B\u1EA3o v\u1EC7 t\xE0i s\u1EA3n tr\xED tu\u1EC7"},{en:"Win and Keep Customers",vi:"Gi\xE0nh v\xE0 gi\u1EEF kh\xE1ch h\xE0ng"}]},{id:"logistics",icon:"truck",name:{en:"Logistics",vi:"Logistics - V\u1EADn t\u1EA3i - Kho v\u1EADn"},bundle:["email-security","database-security","dlp","ai-legal"],image:null,story:{context:{title:{en:'A "changed bank account" email redirects a freight payment',vi:'Email "\u0111\u1ED5i s\u1ED1 t\xE0i kho\u1EA3n" chuy\u1EC3n h\u01B0\u1EDBng kho\u1EA3n thanh to\xE1n c\u01B0\u1EDBc'},body:{en:"In peak season a message from a carrier partner asks finance to update bank details. The payment goes to the wrong account just as tracking systems slow down and drivers wait for dispatch data.",vi:"V\xE0o m\xF9a cao \u0111i\u1EC3m, m\u1ED9t email t\u1EEB \u0111\u1ED1i t\xE1c v\u1EADn t\u1EA3i \u0111\u1EC1 ngh\u1ECB k\u1EBF to\xE1n c\u1EADp nh\u1EADt t\xE0i kho\u1EA3n ng\xE2n h\xE0ng. Kho\u1EA3n thanh to\xE1n chuy\u1EC3n nh\u1EA7m t\xE0i kho\u1EA3n \u0111\xFAng l\xFAc h\u1EC7 th\u1ED1ng theo d\xF5i ch\u1EADm l\u1EA1i v\xE0 t\xE0i x\u1EBF ch\u1EDD d\u1EEF li\u1EC7u \u0111i\u1EC1u ph\u1ED1i."}},entry:{title:{en:"Stop the entry point before it reaches finance and dispatch",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o k\u1EBF to\xE1n v\xE0 \u0111i\u1EC1u ph\u1ED1i"},body:{en:"Email defense on VCLOUD catches spoofed partner messages at the gateway, and Database Security keeps shipment and partner data under query-level control.",vi:"B\u1EA3o v\u1EC7 email tr\xEAn VCLOUD ph\xE1t hi\u1EC7n email gi\u1EA3 m\u1EA1o \u0111\u1ED1i t\xE1c ngay t\u1EA1i c\u1ED5ng, c\xF2n B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u gi\u1EEF d\u1EEF li\u1EC7u v\u1EADn \u0111\u01A1n v\xE0 \u0111\u1ED1i t\xE1c d\u01B0\u1EDBi s\u1EF1 ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n."}}},outcomes:[{en:"Protect Cash and Cargo Flow",vi:"B\u1EA3o v\u1EC7 d\xF2ng ti\u1EC1n v\xE0 d\xF2ng h\xE0ng"},{en:"Protect Customer, Partner and Driver Data",vi:"B\u1EA3o v\u1EC7 d\u
