anding Access",vi:"Nh\xE0 cung c\u1EA5p truy c\u1EADp t\u1EEB xa th\u01B0\u1EDDng tr\u1EF1c"},body:{en:"Machine makers, system integrators and software vendors often need remote access to support the plant. Broad, long-lived access to databases turns a third party into the weakest link.",vi:"H\xE3ng m\xE1y, \u0111\u01A1n v\u1ECB t\xEDch h\u1EE3p v\xE0 nh\xE0 cung c\u1EA5p ph\u1EA7n m\u1EC1m th\u01B0\u1EDDng c\u1EA7n truy c\u1EADp t\u1EEB xa \u0111\u1EC3 h\u1ED7 tr\u1EE3 nh\xE0 m\xE1y. Quy\u1EC1n truy c\u1EADp r\u1ED9ng v\xE0 k\xE9o d\xE0i v\xE0o c\u01A1 s\u1EDF d\u1EEF li\u1EC7u bi\u1EBFn b\xEAn th\u1EE9 ba th\xE0nh m\u1EAFt x\xEDch y\u1EBFu nh\u1EA5t."}},solutions:["database-security","email-security"],response:{title:{en:"Give vendors a controlled door, not a key",vi:"Cho nh\xE0 cung c\u1EA5p m\u1ED9t c\u1EEDa c\xF3 ki\u1EC3m so\xE1t, kh\xF4ng ph\u1EA3i ch\xECa kh\xF3a"},body:{en:"Vendor sessions to databases go through a controlled gateway with approval for sensitive actions, while mail defense filters the invoices and attachments that vendors send in.",vi:"Phi\xEAn truy c\u1EADp CSDL c\u1EE7a nh\xE0 cung c\u1EA5p \u0111i qua c\u1ED5ng ki\u1EC3m so\xE1t v\u1EDBi ph\xEA duy\u1EC7t cho thao t\xE1c nh\u1EA1y c\u1EA3m, c\xF2n l\u1EDBp b\u1EA3o v\u1EC7 email l\u1ECDc h\xF3a \u0111\u01A1n v\xE0 t\u1EC7p \u0111\xEDnh k\xE8m h\u1ECD g\u1EEDi \u0111\u1EBFn."},points:[{en:"Approval workflow for sensitive actions",vi:"Quy tr\xECnh ph\xEA duy\u1EC7t cho thao t\xE1c nh\u1EA1y c\u1EA3m"},{en:"Full record of what vendors did",vi:"Ghi l\u1EA1i \u0111\u1EA7y \u0111\u1EE7 nh\u1EEFng g\xEC nh\xE0 cung c\u1EA5p \u0111\xE3 l\xE0m"},{en:"Filters inbound vendor attachments",vi:"L\u1ECDc t\u1EC7p \u0111\xEDnh k\xE8m t\u1EEB nh\xE0 cung c\u1EA5p"}]}},{id:"audit",persona:{en:"CFO / Compliance Lead",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh / Tr\u01B0\u1EDFng Tu\xE2n th\u1EE7"},challenge:{title:{en:"Customer and Supplier Security Audits",vi:"\u0110\xE1nh gi\xE1 an ninh t\u1EEB kh\xE1ch h\xE0ng v\xE0 \u0111\u1ED1i t\xE1c"},body:{en:"Global customers increasingly audit the security of their suppliers, and Vietnamese law sets duties for personal data and cybersecurity. Failing an audit can put orders at risk, and gaps are costly to fix under time pressure.",vi:"Kh\xE1ch h\xE0ng to\xE0n c\u1EA7u ng\xE0y c\xE0ng \u0111\xE1nh gi\xE1 an ninh c\u1EE7a nh\xE0 cung c\u1EA5p, \u0111\u1ED3ng th\u1EDDi ph\xE1p lu\u1EADt Vi\u1EC7t Nam quy \u0111\u1ECBnh ngh\u0129a v\u1EE5 v\u1EC1 d\u1EEF li\u1EC7u c\xE1 nh\xE2n v\xE0 an ninh m\u1EA1ng. Kh\xF4ng \u0111\u1EA1t \u0111\xE1nh gi\xE1 c\xF3 th\u1EC3 \u1EA3nh h\u01B0\u1EDFng \u0111\u01A1n h\xE0ng, v\xE0 kh\u1EAFc ph\u1EE5c g\u1EA5p r\u1EA5t t\u1ED1n k\xE9m."}},solutions:["dlp","email-security","database-security"],response:{title:{en:"Controls and evidence ready when the auditor arrives",vi:"Ki\u1EC3m so\xE1t v\xE0 b\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng khi \u0111o\xE0n \u0111\xE1nh gi\xE1 \u0111\u1EBFn"},body:{en:"Data monitoring, database access control and in-country hosting give you documented controls and logs to show customers and prepare for Decree 13 and ISO 27001-style requirements.",vi:"Gi\xE1m s\xE1t d\u1EEF li\u1EC7u, ki\u1EC3m so\xE1t truy c\u1EADp CSDL v\xE0 l\u01B0u tr\u1EEF trong n\u01B0\u1EDBc gi\xFAp b\u1EA1n c\xF3 c\xE1c bi\u1EC7n ph\xE1p ki\u1EC3m so\xE1t v\xE0 nh\u1EADt k\xFD \u0111\u01B0\u1EE3c ghi nh\u1EADn \u0111\u1EC3 tr\xECnh kh\xE1ch h\xE0ng, chu\u1EA9n b\u1ECB cho Ngh\u1ECB \u0111\u1ECBnh 13 v\xE0 c\xE1c y\xEAu c\u1EA7u theo ISO 27001."},points:[{en:"Logs and evidence on demand",vi:"Nh\u1EADt k\xFD v\xE0 b\u1EB1ng ch\u1EE9ng khi c\u1EA7n"},{en:"Data stays in Vietnam on VCLOUD",vi:"D\u1EEF li\u1EC7u \u1EDF l\u1EA1i Vi\u1EC7t Nam tr\xEAn VCLOUD"},{en:"One integrated package, one partner",vi:"M\u1ED9t g\xF3i t\xEDch h\u1EE3p, m\u1ED9t \u0111\u1ED1i t\xE1c"}]}}],outcomes:[{title:{en:"Keep Production Running",vi:"Gi\u1EEF s\u1EA3n xu\u1EA5t v\u1EADn h\xE0nh li\xEAn t\u1EE5c"},body:{en:"Block the most common entry points for ransomware and control access to core systems to reduce the risk of line stoppages.",vi:"Ch\u1EB7n c\xE1c c\u1EEDa ng\xF5 ph\u1ED5 bi\u1EBFn c\u1EE7a ransomware v\xE0 ki\u1EC3m so\xE1t truy c\u1EADp v\xE0o h\u1EC7 th\u1ED1ng l\xF5i \u0111\u1EC3 gi\u1EA3m nguy c\u01A1 d\u1EEBng d\xE2y chuy\u1EC1n."}},{title:{en:"Protect Intellectual Property",vi:"B\u1EA3o v\u1EC7 t\xE0i s\u1EA3n tr\xED tu\u1EC7"},body:{en:"Keep designs, formulas and cost data from leaving through users, vendors or databases.",vi:"Ng\u0103n b\u1EA3n thi\u1EBFt k\u1EBF, c\xF4ng th\u1EE9c v\xE0 d\u1EEF li\u1EC7u gi\xE1 th\xE0nh r\u1EDDi \u0111i qua ng\u01B0\u1EDDi d\xF9ng, nh\xE0 cung c\u1EA5p ho\u1EB7c c\u01A1 s\u1EDF d\u1EEF li\u1EC7u."}},{title:{en:"Win and Keep Customers",vi:"Gi\xE0nh v\xE0 gi\u1EEF kh\xE1ch h\xE0ng"},body:{en:"Show documented controls and evidence in customer audits and prepare for data protection requirements in Vietnam.",vi:"Ch\u1EE9ng minh c\xE1c bi\u1EC7n ph\xE1p ki\u1EC3m so\xE1t v\xE0 b\u1EB1ng ch\u1EE9ng trong \u0111\xE1nh gi\xE1 c\u1EE7a kh\xE1ch h\xE0ng, \u0111\u1ED3ng th\u1EDDi chu\u1EA9n b\u1ECB cho y\xEAu c\u1EA7u b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u t\u1EA1i Vi\u1EC7t Nam."}}],faq:[{q:{en:"Do we need to replace our existing ERP or MES?",vi:"Ch\xFAng t\xF4i c\xF3 ph\u1EA3i thay ERP ho\u1EB7c MES hi\u1EC7n c\xF3 kh\xF4ng?"},a:{en:"No. Database security and data monitoring sit around your existing systems. Scope and integration are assessed with the V-Tech Hub team for each plant.",vi:"Kh\xF4ng. B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u v\xE0 gi\xE1m s\xE1t d\u1EEF li\u1EC7u \u0111\u01B0\u1EE3c \u0111\u1EB7t quanh h\u1EC7 th\u1ED1ng hi\u1EC7n c\xF3. Ph\u1EA1m vi v\xE0 c\xE1ch t\xEDch h\u1EE3p \u0111\u01B0\u1EE3c \u0111\xE1nh gi\xE1 c\xF9ng \u0111\u1ED9i ng\u0169 V-Tech Hub cho t\u1EEBng nh\xE0 m\xE1y."}},{q:{en:"Can this help with customer security questionnaires and audits?",vi:"Gi\u1EA3i ph\xE1p c\xF3 h\u1ED7 tr\u1EE3 b\u1EA3ng c\xE2u h\u1ECFi v\xE0 \u0111\u1EE3t \u0111\xE1nh gi\xE1 an ninh c\u1EE7a kh\xE1ch h\xE0ng kh\xF4ng?"},a:{en:"It provides access controls, monitoring and logs that you can document as evidence. Certification outcomes depend on your overall program.",vi:"Gi\u1EA3i ph\xE1p cung c\u1EA5p ki\u1EC3m so\xE1t truy c\u1EADp, gi\xE1m s\xE1t v\xE0 nh\u1EADt k\xFD \u0111\u1EC3 b\u1EA1n l\xE0m b\u1EB1ng ch\u1EE9ng. K\u1EBFt qu\u1EA3 ch\u1EE9ng nh\u1EADn c\xF2n ph\u1EE5 thu\u1ED9c v\xE0o ch\u01B0\u01A1ng tr\xECnh an ninh t\u1ED5ng th\u1EC3 c\u1EE7a doanh nghi\u1EC7p."}},{q:{en:"How do we handle remote access by machine and software vendors?",vi:"L\xE0m sao qu\u1EA3n l\xFD truy c\u1EADp t\u1EEB xa c\u1EE7a h\xE3ng m\xE1y v\xE0 nh\xE0 cung c\u1EA5p ph\u1EA7n m\u1EC1m?"},a:{en:"Database access is routed through a controlled gateway with approval for sensitive queries and a full audit trail, so vendors get only what they need.",vi:"Truy c\u1EADp CSDL \u0111\u01B0\u1EE3c \u0111i qua c\u1ED5ng ki\u1EC3m so\xE1t v\u1EDBi ph\xEA duy\u1EC7t cho truy v\u1EA5n nh\u1EA1y c\u1EA3m v\xE0 nh\u1EADt k\xFD ki\u1EC3m to\xE1n \u0111\u1EA7y \u0111\u1EE7, nh\xE0 cung c\u1EA5p ch\u1EC9 nh\u1EADn \u0111\xFAng quy\u1EC1n c\u1EA7n thi\u1EBFt."}}]},{id:"logistics",icon:"truck",name:{en:"Logistics",vi:"Logistics - V\u1EADn t\u1EA3i - Kho v\u1EADn"},title:{en:"Logistics: Freight Forwarding, Warehousing, Last Mile & Ports",vi:"Logistics: Giao nh\u1EADn, Kho v\u1EADn, Ch\u1EB7ng cu\u1ED1i & C\u1EA3ng"},tagline:{en:"VCLOUD & Email Security, Database Security, Data Loss Prevention and AI Legal & Compliance for supply chains that cannot stop moving.",vi:"VCLOUD & Email Security, B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u, Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 AI Legal & Compliance cho chu\u1ED7i cung \u1EE9ng kh\xF4ng \u0111\u01B0\u1EE3c ph\xE9p d\u1EEBng."},bundle:["email-security","database-security","dlp","ai-legal"],image:null,regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"Cybersecurity Law",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"Data Law",vi:"Lu\u1EADt D\u1EEF li\u1EC7u"},{en:"Customs Law",vi:"Lu\u1EADt H\u1EA3i quan"}],story:{context:{title:{en:'A "changed bank account" email redirects a freight payment',vi:'Email "\u0111\u1ED5i s\u1ED1 t\xE0i kho\u1EA3n" chuy\u1EC3n h\u01B0\u1EDBng kho\u1EA3n thanh to\xE1n c\u01B0\u1EDBc'},body:{en:"In peak season a message from a carrier partner asks finance to update bank details. The payment goes to the wrong account just as tracking systems slow down and drivers wait for dispatch data.",vi:"V\xE0o m\xF9a cao \u0111i\u1EC3m, m\u1ED9t email t\u1EEB \u0111\u1ED1i t\xE1c v\u1EADn t\u1EA3i \u0111\u1EC1 ngh\u1ECB k\u1EBF to\xE1n c\u1EADp nh\u1EADt t\xE0i kho\u1EA3n ng\xE2n h\xE0ng. Kho\u1EA3n thanh to\xE1n chuy\u1EC3n nh\u1EA7m t\xE0i kho\u1EA3n \u0111\xFAng l\xFAc h\u1EC7 th\u1ED1ng theo d\xF5i ch\u1EADm l\u1EA1i v\xE0 t\xE0i x\u1EBF ch\u1EDD d\u1EEF li\u1EC7u \u0111i\u1EC1u ph\u1ED1i."}},entry:{title:{en:"Stop the entry point before it reaches finance and dispatch",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi v\xE0o k\u1EBF to\xE1n v\xE0 \u0111i\u1EC1u ph\u1ED1i"},body:{en:"Email defense on VCLOUD catches spoofed partner messages at the gateway, and Database Security keeps shipment and partner data under query-level control.",vi:"B\u1EA3o v\u1EC7 email tr\xEAn VCLOUD ph\xE1t hi\u1EC7n email gi\u1EA3 m\u1EA1o \u0111\u1ED1i t\xE1c ngay t\u1EA1i c\u1ED5ng, c\xF2n B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u gi\u1EEF d\u1EEF li\u1EC7u v\u1EADn \u0111\u01A1n v\xE0 \u0111\u1ED1i t\xE1c d\u01B0\u1EDBi s\u1EF1 ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n."}}},chapters:[{id:"bec",persona:{en:"CFO / Head of Finance",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh (CFO) / K\u1EBF to\xE1n tr\u01B0\u1EDFng"},challenge:{title:{en:"Fake Shipping and Invoice Emails Divert Payments",vi:"Email gi\u1EA3 m\u1EA1o h\xE3ng t\xE0u, h\xF3a \u0111\u01A1n chuy\u1EC3n h\u01B0\u1EDBng thanh to\xE1n"},body:{en:"Forwarders handle a constant flow of freight invoices, booking confirmations and bank-detail updates. An email that imitates a carrier, agent or supplier and asks to pay a new account is easy to miss in a busy week, and a transfer is hard to recall once sent.",vi:"Doanh nghi\u1EC7p giao nh\u1EADn x\u1EED l\xFD li\xEAn t\u1EE5c h\xF3a \u0111\u01A1n c\u01B0\u1EDBc, x\xE1c nh\u1EADn booking v\xE0 th\xF4ng b\xE1o \u0111\u1ED5i t\xE0i kho\u1EA3n ng\xE2n h\xE0ng. M\u1ED9t email gi\u1EA3 danh h\xE3ng t\xE0u, \u0111\u1EA1i l\xFD hay nh\xE0 cung c\u1EA5p y\xEAu c\u1EA7u chuy\u1EC3n ti\u1EC1n sang t\xE0i kho\u1EA3n m\u1EDBi r\u1EA5t d\u1EC5 l\u1ECDt qua trong nh\u1EEFng tu\u1EA7n cao \u0111i\u1EC3m, v\xE0 khi ti\u1EC1n \u0111\xE3 chuy\u1EC3n \u0111i th\xEC r\u1EA5t kh\xF3 thu h\u1ED3i."}},solutions:["email-security"],response:{title:{en:"Stop the fake request before finance sees it",vi:"Ch\u1EB7n y\xEAu c\u1EA7u gi\u1EA3 tr\u01B0\u1EDBc khi \u0111\u1EBFn tay k\u1EBF to\xE1n"},body:{en:"Advanced email defense on VCLOUD filters phishing, executive and partner spoofing and ransomware before they reach employees, with data hosted inside Vietnam.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao tr\xEAn VCLOUD l\u1ECDc phishing, gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o v\xE0 \u0111\u1ED1i t\xE1c c\xF9ng ransomware tr\u01B0\u1EDBc khi t\u1EDBi nh\xE2n vi\xEAn, d\u1EEF li\u1EC7u \u0111\u01B0\u1EE3c l\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Blocks spoofed invoices and payment-change requests",vi:"Ch\u1EB7n h\xF3a \u0111\u01A1n v\xE0 y\xEAu c\u1EA7u \u0111\u1ED5i t\xE0i kho\u1EA3n gi\u1EA3 m\u1EA1o"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"},{en:"Pair with a call-back rule for any bank-detail change",vi:"K\u1EBFt h\u1EE3p quy t\u1EAFc g\u1ECDi x\xE1c minh v\u1EDBi m\u1ECDi thay \u0111\u1ED5i t\xE0i kho\u1EA3n"}]}},{id:"uptime",persona:{en:"CIO / Head of IT Operations",vi:"Gi\xE1m \u0111\u1ED1c C\xF4ng ngh\u1EC7 th\xF4ng tin (CIO) / Tr\u01B0\u1EDFng v\u1EADn h\xE0nh IT"},challenge:{title:{en:"Tracking, WMS and TMS Cannot Afford to Go Dark",vi:"Tracking, WMS v\xE0 TMS kh\xF4ng th\u1EC3 ng\u1EEBng ho\u1EA1t \u0111\u1ED9ng"},body:{en:"When the tracking portal, warehouse system or transport management system is down, trucks queue, pickers idle and customers call for status. Ransomware or an unmanaged server across several depots and sites turns an IT problem into a delivery problem.",vi:"Khi c\u1ED5ng tracking, h\u1EC7 th\u1ED1ng kho hay h\u1EC7 th\u1ED1ng qu\u1EA3n l\xFD v\u1EADn t\u1EA3i ng\u1EEBng, xe ph\u1EA3i x\u1EBFp h\xE0ng ch\u1EDD, nh\xE2n vi\xEAn kho \u0111\u1EE9ng ch\u1EDD v\xE0 kh\xE1ch h\xE0ng g\u1ECDi h\u1ECFi t\xECnh tr\u1EA1ng. Ransomware ho\u1EB7c m\u1ED9t m\xE1y ch\u1EE7 thi\u1EBFu qu\u1EA3n l\xFD \u1EDF nhi\u1EC1u kho, nhi\u1EC1u \u0111i\u1EC3m khi\u1EBFn s\u1EF1 c\u1ED1 IT tr\u1EDF th\xE0nh s\u1EF1 c\u1ED1 giao h\xE0ng."}},solutions:["email-security"],response:{title:{en:"Run core systems on sovereign cloud, keep the front door clean",vi:"V\u1EADn h\xE0nh h\u1EC7 th\u1ED1ng l\xF5i tr\xEAn \u0111\xE1m m\xE2y ch\u1EE7 quy\u1EC1n, gi\u1EEF c\u1EEDa v\xE0o s\u1EA1ch"},body:{en:"VCLOUD hosts business-critical applications inside Vietnam, while email defense closes the most common route for ransomware into your sites. Sizing and service levels are agreed with your V-Tech Hub team.",vi:"VCLOUD l\u01B0u tr\u1EEF c\xE1c \u1EE9ng d\u1EE5ng tr\u1ECDng y\u1EBFu ngay t\u1EA1i Vi\u1EC7t Nam, c\xF2n b\u1EA3o v\u1EC7 email ch\u1EB7n \u0111\u01B0\u1EDDng x\xE2m nh\u1EADp ph\u1ED5 bi\u1EBFn nh\u1EA5t c\u1EE7a ransomware v\xE0o c\xE1c \u0111i\u1EC3m c\u1EE7a b\u1EA1n. Quy m\xF4 v\xE0 m\u1EE9c d\u1ECBch v\u1EE5 \u0111\u01B0\u1EE3c th\u1ED1ng nh\u1EA5t c\xF9ng \u0111\u1ED9i ng\u0169 V-Tech Hub."},points:[{en:"Sovereign cloud hosting in Vietnam",vi:"\u0110\xE1m m\xE2y ch\u1EE7 quy\u1EC1n \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam"},{en:"Ransomware blocked at the mail gateway",vi:"Ransomware b\u1ECB ch\u1EB7n t\u1EA1i c\u1ED5ng email"},{en:"One provider for hosting and email security",vi:"M\u1ED9t \u0111\u1EA7u m\u1ED1i cho h\u1EA1 t\u1EA7ng v\xE0 b\u1EA3o m\u1EADt email"}]}},{id:"core-data",persona:{en:"Head of Warehouse / Transport Systems",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn H\u1EC7 th\u1ED1ng Kho v\u1EADn"},challenge:{title:{en:"Too Many Hands on WMS and TMS Databases",vi:"Qu\xE1 nhi\u1EC1u ng\u01B0\u1EDDi c\xF3 quy\u1EC1n tr\xEAn CSDL WMS v\xE0 TMS"},body:{en:"Administrators, developers, integration partners and customer-system vendors all touch order, inventory and rate data. Without query-level control, a privileged account can read tariffs, change a consignee or alter stock records without anyone noticing in time.",vi:"Qu\u1EA3n tr\u1ECB vi\xEAn, l\u1EADp tr\xECnh vi\xEAn, \u0111\u1ED1i t\xE1c t\xEDch h\u1EE3p v\xE0 nh\xE0 cung c\u1EA5p h\u1EC7 th\u1ED1ng c\u1EE7a kh\xE1ch h\xE0ng \u0111\u1EC1u ch\u1EA1m v\xE0o d\u1EEF li\u1EC7u \u0111\u01A1n h\xE0ng, t\u1ED3n kho v\xE0 b\u1EA3ng gi\xE1. Thi\u1EBFu ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n, m\u1ED9t t\xE0i kho\u1EA3n \u0111\u1EB7c quy\u1EC1n c\xF3 th\u1EC3 xem b\u1EA3ng gi\xE1, \u0111\u1ED5i ng\u01B0\u1EDDi nh\u1EADn ho\u1EB7c s\u1EEDa t\u1ED3n kho m\xE0 kh\xF4ng ai k\u1ECBp ph\xE1t hi\u1EC7n."}},solutions:["database-security"],response:{title:{en:"Every query controlled, sensitive fields masked",vi:"M\u1ECDi truy v\u1EA5n \u0111\u01B0\u1EE3c ki\u1EC3m so\xE1t, tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m \u0111\u01B0\u1EE3c che"},body:{en:"Query-level access control and real-time masking restrict who can see or change operational data, without slowing live order and dispatch transactions.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c h\u1EA1n ch\u1EBF ai \u0111\u01B0\u1EE3c xem ho\u1EB7c s\u1EEDa d\u1EEF li\u1EC7u v\u1EADn h\xE0nh, m\xE0 kh\xF4ng l\xE0m ch\u1EADm giao d\u1ECBch \u0111\u01A1n h\xE0ng v\xE0 \u0111i\u1EC1u ph\u1ED1i tr\u1EF1c ti\u1EBFp."},points:[{en:"Proxy gateway limits direct database access",vi:"C\u1ED5ng proxy h\u1EA1n ch\u1EBF truy c\u1EADp tr\u1EF1c ti\u1EBFp CSDL"},{en:"Tariffs and customer details masked for unauthorized admins",vi:"B\u1EA3ng gi\xE1, th\xF4ng tin kh\xE1ch che v\u1EDBi qu\u1EA3n tr\u1ECB vi\xEAn kh\xF4ng c\xF3 quy\u1EC1n"},{en:"Audit trail of every change",vi:"Nh\u1EADt k\xFD ki\u1EC3m to\xE1n m\u1ECDi thay \u0111\u1ED5i"}]}},{id:"partner-data",persona:{en:"Chief Compliance / Data Protection Officer",vi:"Gi\xE1m \u0111\u1ED1c Tu\xE2n th\u1EE7 / Ph\u1EE5 tr\xE1ch b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u"},challenge:{title:{en:"Partner, Driver and Customer Data Leaking Out",vi:"D\u1EEF li\u1EC7u \u0111\u1ED1i t\xE1c, t\xE0i x\u1EBF v\xE0 kh\xE1ch h\xE0ng b\u1ECB th\u1EA5t tho\xE1t"},body:{en:"Consignee addresses and phone numbers, driver records, customer lists and rate cards circulate through chat apps, personal webmail, USB drives and partner apps. A departing sales or operations employee can take a customer base with them, and a leak raises Decree 13 questions.",vi:"\u0110\u1ECBa ch\u1EC9, s\u1ED1 \u0111i\u1EC7n tho\u1EA1i ng\u01B0\u1EDDi nh\u1EADn, h\u1ED3 s\u01A1 t\xE0i x\u1EBF, danh s\xE1ch kh\xE1ch h\xE0ng v\xE0 b\u1EA3ng gi\xE1 l\u01B0u chuy\u1EC3n qua \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n, USB v\xE0 \u1EE9ng d\u1EE5ng c\u1EE7a \u0111\u1ED1i t\xE1c. Nh\xE2n vi\xEAn kinh doanh hay v\u1EADn h\xE0nh ngh\u1EC9 vi\u1EC7c c\xF3 th\u1EC3 mang theo c\u1EA3 t\u1EC7p kh\xE1ch h\xE0ng, v\xE0 m\u1ED9t v\u1EE5 l\u1ED9 d\u1EEF li\u1EC7u k\xE9o theo v\u1EA5n \u0111\u1EC1 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."}},solutions:["dlp"],response:{title:{en:"See sensitive data wherever it tries to leave",vi:"Th\u1EA5y d\u1EEF li\u1EC7u nh\u1EA1y c\u1EA3m \u1EDF m\u1ECDi n\u01A1i n\xF3 c\u1ED1 r\u1EDDi \u0111i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives detects customer and personal records automatically, helping stop insider leaks and supporting Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 kh\xE1ch h\xE0ng v\xE0 d\u1EEF li\u1EC7u c\xE1 nh\xE2n, gi\xFAp ng\u0103n r\xF2 r\u1EC9 n\u1ED9i b\u1ED9 v\xE0 h\u1ED7 tr\u1EE3 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."},points:[{en:"Covers chat, webmail and USB",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Auto-detects customer and personal data",vi:"T\u1EF1 nh\u1EADn di\u1EC7n d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 c\xE1 nh\xE2n"},{en:"Evidence ready for audits and disputes",vi:"B\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng cho ki\u1EC3m to\xE1n v\xE0 tranh ch\u1EA5p"}]}},{id:"contracts",persona:{en:"Head of Legal / Customs & Documentation",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Ph\xE1p ch\u1EBF / Ch\u1EE9ng t\u1EEB & H\u1EA3i quan"},challenge:{title:{en:"Contracts and Customs Documents Reviewed by Hand",vi:"H\u1EE3p \u0111\u1ED3ng v\xE0 ch\u1EE9ng t\u1EEB h\u1EA3i quan r\xE0 so\xE1t th\u1EE7 c\xF4ng"},body:{en:"Freight contracts, carrier and warehouse agreements, bills of lading and customs declarations all need careful checking for liability clauses, terms and inconsistencies. Manual review slows quoting and clearance, and errors can mean penalties or disputes.",vi:"H\u1EE3p \u0111\u1ED3ng v\u1EADn chuy\u1EC3n, h\u1EE3p \u0111\u1ED3ng v\u1EDBi h\xE3ng t\xE0u v\xE0 kho, v\u1EADn \u0111\u01A1n v\xE0 t\u1EDD khai h\u1EA3i quan \u0111\u1EC1u c\u1EA7n ki\u1EC3m tra k\u1EF9 \u0111i\u1EC1u kho\u1EA3n tr\xE1ch nhi\u1EC7m, \u0111i\u1EC1u ki\u1EC7n v\xE0 \u0111i\u1EC3m kh\xF4ng nh\u1EA5t qu\xE1n. R\xE0 so\xE1t th\u1EE7 c\xF4ng l\xE0m ch\u1EADm b\xE1o gi\xE1 v\xE0 th\xF4ng quan, c\xF2n sai s\xF3t c\xF3 th\u1EC3 d\u1EABn t\u1EDBi ph\u1EA1t ho\u1EB7c tranh ch\u1EA5p."}},solutions:["ai-legal"],response:{title:{en:"Faster first-pass review, with people in control",vi:"R\xE0 so\xE1t v\xF2ng \u0111\u1EA7u nhanh h\u01A1n, con ng\u01B0\u1EDDi v\u1EABn quy\u1EBFt \u0111\u1ECBnh"},body:{en:"A specialized AI assistant reviews contracts and regulatory documents to flag clauses and gaps for your legal team, with an on-premise option so commercial documents stay in your environment. Scope for logistics and customs content is confirmed with V-Tech Hub during assessment.",vi:"Tr\u1EE3 l\xFD AI chuy\xEAn bi\u1EC7t r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 v\u0103n b\u1EA3n quy \u0111\u1ECBnh, \u0111\xE1nh d\u1EA5u \u0111i\u1EC1u kho\u1EA3n v\xE0 \u0111i\u1EC3m thi\u1EBFu cho \u0111\u1ED9i ph\xE1p ch\u1EBF, c\xF3 t\xF9y ch\u1ECDn on-premise \u0111\u1EC3 t\xE0i li\u1EC7u th\u01B0\u01A1ng m\u1EA1i n\u1EB1m trong m\xF4i tr\u01B0\u1EDDng c\u1EE7a b\u1EA1n. Ph\u1EA1m vi \xE1p d\u1EE5ng cho n\u1ED9i dung logistics v\xE0 h\u1EA3i quan \u0111\u01B0\u1EE3c x\xE1c nh\u1EADn c\xF9ng V-Tech Hub khi kh\u1EA3o s\xE1t."},points:[{en:"Automates routine contract review",vi:"T\u1EF1 \u0111\u1ED9ng h\xF3a r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng th\u01B0\u1EDDng nh\u1EADt"},{en:"On-premise option for total privacy",vi:"T\xF9y ch\u1ECDn on-premise b\u1EA3o m\u1EADt tuy\u1EC7t \u0111\u1ED1i"},{en:"Frees legal and documentation staff for exceptions",vi:"Gi\u1EA3i ph\xF3ng ph\xE1p ch\u1EBF v\xE0 ch\u1EE9ng t\u1EEB cho c\xE1c tr\u01B0\u1EDDng h\u1EE3p ngo\u1EA1i l\u1EC7"}]}}],outcomes:[{title:{en:"Protect Cash and Cargo Flow",vi:"B\u1EA3o v\u1EC7 d\xF2ng ti\u1EC1n v\xE0 d\xF2ng h\xE0ng"},body:{en:"Block fake invoices and ransomware at the email layer and keep core systems on sovereign cloud, so payments and shipments keep moving.",vi:"Ch\u1EB7n h\xF3a \u0111\u01A1n gi\u1EA3 v\xE0 ransomware \u1EDF l\u1EDBp email, gi\u1EEF h\u1EC7 th\u1ED1ng l\xF5i tr\xEAn \u0111\xE1m m\xE2y ch\u1EE7 quy\u1EC1n \u0111\u1EC3 thanh to\xE1n v\xE0 v\u1EADn chuy\u1EC3n kh\xF4ng b\u1ECB gi\xE1n \u0111o\u1EA1n."}},{title:{en:"Protect Customer, Partner and Driver Data",vi:"B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng, \u0111\u1ED1i t\xE1c v\xE0 t\xE0i x\u1EBF"},body:{en:"Control database access and monitor data leaving through chat, webmail and USB, reducing leak risk and helping prepare for Decree 13.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp CSDL v\xE0 gi\xE1m s\xE1t d\u1EEF li\u1EC7u r\u1EDDi \u0111i qua chat, webmail, USB, gi\u1EA3m r\u1EE7i ro r\xF2 r\u1EC9 v\xE0 gi\xFAp chu\u1EA9n b\u1ECB cho Ngh\u1ECB \u0111\u1ECBnh 13."}},{title:{en:"Cut Manual Document Work",vi:"Gi\u1EA3m c\xF4ng vi\u1EC7c ch\u1EE9ng t\u1EEB th\u1EE7 c\xF4ng"},body:{en:"Automate first-pass contract and document review so legal and operations teams spend time on exceptions, not routine checking.",vi:"T\u1EF1 \u0111\u1ED9ng h\xF3a r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 ch\u1EE9ng t\u1EEB v\xF2ng \u0111\u1EA7u \u0111\u1EC3 \u0111\u1ED9i ph\xE1p ch\u1EBF v\xE0 v\u1EADn h\xE0nh t\u1EADp trung v\xE0o ngo\u1EA1i l\u1EC7 thay v\xEC ki\u1EC3m tra l\u1EB7p l\u1EA1i."}}],faq:[{q:{en:"How do we reduce the risk of paying a fake freight invoice?",vi:"L\xE0m sao gi\u1EA3m r\u1EE7i ro thanh to\xE1n nh\u1EA7m h\xF3a \u0111\u01A1n c\u01B0\u1EDBc gi\u1EA3?"},a:{en:"Email defense on VCLOUD filters spoofed carrier, partner and executive emails before they reach staff. We also recommend a process control: verify any bank-detail change by calling a known number.",vi:"B\u1EA3o v\u1EC7 email tr\xEAn VCLOUD l\u1ECDc email gi\u1EA3 danh h\xE3ng t\xE0u, \u0111\u1ED1i t\xE1c v\xE0 l\xE3nh \u0111\u1EA1o tr\u01B0\u1EDBc khi \u0111\u1EBFn nh\xE2n vi\xEAn. Ch\xFAng t\xF4i c\u0169ng khuy\u1EBFn ngh\u1ECB th\xEAm ki\u1EC3m so\xE1t quy tr\xECnh: m\u1ECDi thay \u0111\u1ED5i t\xE0i kho\u1EA3n ng\xE2n h\xE0ng ph\u1EA3i \u0111\u01B0\u1EE3c x\xE1c minh qua s\u1ED1 \u0111i\u1EC7n tho\u1EA1i \u0111\xE3 bi\u1EBFt."}},{q:{en:"Can we keep logistics data inside Vietnam?",vi:"Ch\xFAng t\xF4i c\xF3 th\u1EC3 gi\u1EEF d\u1EEF li\u1EC7u logistics trong n\u01B0\u1EDBc kh\xF4ng?"},a:{en:"Yes. VCLOUD hosts applications and email inside Vietnam, which supports data localization expectations under Vietnamese law. Your legal team should confirm the exact obligations for your data types.",vi:"C\xF3. VCLOUD l\u01B0u tr\u1EEF \u1EE9ng d\u1EE5ng v\xE0 email t\u1EA1i Vi\u1EC7t Nam, \u0111\xE1p \u1EE9ng k\u1EF3 v\u1ECDng v\u1EC1 l\u01B0u tr\u1EEF d\u1EEF li\u1EC7u trong n\u01B0\u1EDBc theo ph\xE1p lu\u1EADt Vi\u1EC7t Nam. \u0110\u1ED9i ph\xE1p ch\u1EBF n\xEAn x\xE1c nh\u1EADn ngh\u0129a v\u1EE5 c\u1EE5 th\u1EC3 cho t\u1EEBng lo\u1EA1i d\u1EEF li\u1EC7u c\u1EE7a doanh nghi\u1EC7p."}},{q:{en:"How is sensitive operational data protected from privileged admins and vendors?",vi:"D\u1EEF li\u1EC7u v\u1EADn h\xE0nh nh\u1EA1y c\u1EA3m \u0111\u01B0\u1EE3c b\u1EA3o v\u1EC7 kh\u1ECFi qu\u1EA3n tr\u1ECB vi\xEAn v\xE0 nh\xE0 cung c\u1EA5p c\xF3 \u0111\u1EB7c quy\u1EC1n nh\u01B0 th\u1EBF n\xE0o?"},a:{en:"Database Security applies query-level access control, approval for sensitive changes and real-time masking, while DLP monitors chat, webmail and USB for customer and personal data leaving the company.",vi:"B\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u \xE1p d\u1EE5ng ki\u1EC3m so\xE1t m\u1EE9c truy v\u1EA5n, ph\xEA duy\u1EC7t thay \u0111\u1ED5i nh\u1EA1y c\u1EA3m v\xE0 che gi\u1EA5u th\u1EDDi gian th\u1EF1c, c\xF2n DLP gi\xE1m s\xE1t chat, webmail, USB \u0111\u1EC3 ph\xE1t hi\u1EC7n d\u1EEF li\u1EC7u kh\xE1ch h\xE0ng v\xE0 c\xE1 nh\xE2n b\u1ECB \u0111\u01B0a ra ngo\xE0i."}},{q:{en:"Does the AI Legal assistant handle customs documents?",vi:"Tr\u1EE3 l\xFD AI Legal c\xF3 x\u1EED l\xFD ch\u1EE9ng t\u1EEB h\u1EA3i quan kh\xF4ng?"},a:{en:"It is built for contract and regulatory document review. Coverage of customs and freight document types is scoped with V-Tech Hub in a pilot, and an on-premise option keeps documents private.",vi:"Gi\u1EA3i ph\xE1p \u0111\u01B0\u1EE3c x\xE2y d\u1EF1ng cho r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng v\xE0 v\u0103n b\u1EA3n quy \u0111\u1ECBnh. Ph\u1EA1m vi v\u1EDBi c\xE1c lo\u1EA1i ch\u1EE9ng t\u1EEB h\u1EA3i quan v\xE0 v\u1EADn t\u1EA3i \u0111\u01B0\u1EE3c x\xE1c \u0111\u1ECBnh c\xF9ng V-Tech Hub trong giai \u0111o\u1EA1n th\u1EED nghi\u1EC7m, v\xE0 t\xF9y ch\u1ECDn on-premise gi\u1EEF t\xE0i li\u1EC7u ri\xEAng t\u01B0."}}]},{id:"media",icon:"clapperboard",name:{en:"Media & Digital Content",vi:"Truy\u1EC1n th\xF4ng & N\u1ED9i dung s\u1ED1"},title:{en:"Media & Digital Content: News, Streaming, Publishing and Gaming",vi:"Truy\u1EC1n th\xF4ng & N\u1ED9i dung s\u1ED1: B\xE1o \u0111i\u1EC7n t\u1EED, Streaming, Xu\u1EA5t b\u1EA3n v\xE0 Game"},tagline:{en:"CDN and Anti-DDoS/WAF for live events, Email Security on VCLOUD, Data Loss Prevention for content and subscriber data, and AI Legal for contract review.",vi:"CDN v\xE0 Anti-DDoS/WAF cho s\u1EF1 ki\u1EC7n tr\u1EF1c ti\u1EBFp, Email Security tr\xEAn VCLOUD, Ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u cho n\u1ED9i dung v\xE0 d\u1EEF li\u1EC7u thu\xEA bao, c\xF9ng AI Legal r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng."},bundle:["cdn","anti-ddos-waf","email-security","dlp","ai-legal"],image:null,regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"Law on Cybersecurity",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"Intellectual Property Law",vi:"Lu\u1EADt S\u1EDF h\u1EEFu tr\xED tu\u1EC7"}],story:{context:{title:{en:"The live broadcast peaks and the site goes down",vi:"Ph\xE1t s\xF3ng tr\u1EF1c ti\u1EBFp l\xEAn \u0111\u1EC9nh, v\xE0 website s\u1EADp"},body:{en:"A major live event brings the biggest audience of the year. A flood of requests, some of it malicious, arrives at the same moment. Streams buffer, the site stops responding and viewers move to a competitor.",vi:"M\u1ED9t s\u1EF1 ki\u1EC7n tr\u1EF1c ti\u1EBFp l\u1EDBn mang l\u1EA1i l\u01B0\u1EE3ng ng\u01B0\u1EDDi xem cao nh\u1EA5t n\u0103m. M\u1ED9t l\u01B0\u1EE3ng y\xEAu c\u1EA7u kh\u1ED5ng l\u1ED3, trong \u0111\xF3 c\xF3 c\u1EA3 l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9c h\u1EA1i, \u1EADp \u0111\u1EBFn c\xF9ng l\xFAc. Lu\u1ED3ng ph\xE1t gi\u1EADt lag, website ng\u1EEBng ph\u1EA3n h\u1ED3i v\xE0 kh\xE1n gi\u1EA3 chuy\u1EC3n sang \u0111\u1ED1i th\u1EE7."}},entry:{title:{en:"Stop the entry point at the edge, before it reaches the origin",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 \u1EDF bi\xEAn, tr\u01B0\u1EDBc khi t\u1EDBi m\xE1y ch\u1EE7 g\u1ED1c"},body:{en:"Anti-DDoS and WAF filter the flood while the CDN serves content close to viewers, so the origin and the broadcast stay up.",vi:"Anti-DDoS v\xE0 WAF l\u1ECDc l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9t bi\u1EBFn, trong khi CDN ph\xE2n ph\u1ED1i n\u1ED9i dung g\u1EA7n ng\u01B0\u1EDDi xem, gi\xFAp m\xE1y ch\u1EE7 g\u1ED1c v\xE0 bu\u1ED5i ph\xE1t s\xF3ng lu\xF4n ho\u1EA1t \u0111\u1ED9ng."}}},chapters:[{id:"live-ddos",persona:{en:"CTO / Head of Platform",vi:"Gi\xE1m \u0111\u1ED1c C\xF4ng ngh\u1EC7 / Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn N\u1EC1n t\u1EA3ng"},challenge:{title:{en:"Traffic Spikes and DDoS During Live Events",vi:"L\u01B0u l\u01B0\u1EE3ng t\u0103ng v\u1ECDt v\xE0 t\u1EA5n c\xF4ng DDoS trong s\u1EF1 ki\u1EC7n tr\u1EF1c ti\u1EBFp"},body:{en:"A live broadcast or breaking-news peak is exactly when the site must not fail. Genuine surges and malicious floods look alike, and downtime during the event means lost viewers, advertisers and brand trust.",vi:"Ph\xE1t s\xF3ng tr\u1EF1c ti\u1EBFp hay \u0111\u1EC9nh tin n\xF3ng ch\xEDnh l\xE0 l\xFAc h\u1EC7 th\u1ED1ng kh\xF4ng \u0111\u01B0\u1EE3c ph\xE9p gi\xE1n \u0111o\u1EA1n. L\u01B0\u1EE3ng truy c\u1EADp th\u1EADt t\u0103ng \u0111\u1ED9t bi\u1EBFn v\xE0 l\u01B0u l\u01B0\u1EE3ng t\u1EA5n c\xF4ng tr\xF4ng r\u1EA5t gi\u1ED1ng nhau; website s\u1EADp \u0111\xFAng l\xFAc s\u1EF1 ki\u1EC7n \u0111\u1ED3ng ngh\u0129a m\u1EA5t ng\u01B0\u1EDDi xem, nh\xE0 qu\u1EA3ng c\xE1o v\xE0 uy t\xEDn th\u01B0\u01A1ng hi\u1EC7u."}},solutions:["anti-ddos-waf"],response:{title:{en:"Absorb the flood, keep the show on air",vi:"H\u1EA5p th\u1EE5 \u0111\xF2n t\u1EA5n c\xF4ng, gi\u1EEF ch\u01B0\u01A1ng tr\xECnh l\xEAn s\xF3ng"},body:{en:"Anti-DDoS filtering separates real viewers from attack traffic before it reaches your origin, so the platform stays available through the peak.",vi:"L\u1EDBp ch\u1ED1ng DDoS l\u1ECDc t\xE1ch ng\u01B0\u1EDDi xem th\u1EADt kh\u1ECFi l\u01B0u l\u01B0\u1EE3ng t\u1EA5n c\xF4ng tr\u01B0\u1EDBc khi ch\u1EA1m t\u1EDBi m\xE1y ch\u1EE7 g\u1ED1c, gi\xFAp n\u1EC1n t\u1EA3ng lu\xF4n s\u1EB5n s\xE0ng su\u1ED1t gi\u1EDD cao \u0111i\u1EC3m."},points:[{en:"Filters attack traffic away from the origin",vi:"L\u1ECDc l\u01B0u l\u01B0\u1EE3ng t\u1EA5n c\xF4ng tr\u01B0\u1EDBc khi t\u1EDBi m\xE1y ch\u1EE7 g\u1ED1c"},{en:"Keeps legitimate viewers connected",vi:"Gi\u1EEF k\u1EBFt n\u1ED1i cho ng\u01B0\u1EDDi xem h\u1EE3p l\u1EC7"},{en:"Plan capacity ahead of major events",vi:"Chu\u1EA9n b\u1ECB n\u0103ng l\u1EF1c tr\u01B0\u1EDBc c\xE1c s\u1EF1 ki\u1EC7n l\u1EDBn"}]}},{id:"latency",persona:{en:"Head of Streaming / Digital Product",vi:"Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Streaming / S\u1EA3n ph\u1EA9m s\u1ED1"},challenge:{title:{en:"Slow Delivery and Buffering for Viewers",vi:"T\u1EA3i ch\u1EADm v\xE0 gi\u1EADt lag v\u1EDBi ng\u01B0\u1EDDi xem"},body:{en:"Viewers leave quickly when video buffers or pages load slowly, especially on mobile and across provinces. Serving everything from a single origin raises cost and degrades experience as the audience grows.",vi:"Ng\u01B0\u1EDDi xem r\u1EDDi \u0111i r\u1EA5t nhanh khi video gi\u1EADt ho\u1EB7c trang t\u1EA3i ch\u1EADm, nh\u1EA5t l\xE0 tr\xEAn di \u0111\u1ED9ng v\xE0 \u1EDF c\xE1c t\u1EC9nh th\xE0nh. Ph\u1EE5c v\u1EE5 m\u1ECDi th\u1EE9 t\u1EEB m\u1ED9t m\xE1y ch\u1EE7 g\u1ED1c v\u1EEBa \u0111\u1EA9y chi ph\xED l\xEAn v\u1EEBa l\xE0m tr\u1EA3i nghi\u1EC7m x\u1EA5u \u0111i khi l\u01B0\u1EE3ng ng\u01B0\u1EDDi xem t\u0103ng."}},solutions:["cdn"],response:{title:{en:"Bring content closer to the audience",vi:"\u0110\u01B0a n\u1ED9i dung \u0111\u1EBFn g\u1EA7n kh\xE1n gi\u1EA3 h\u01A1n"},body:{en:"A CDN caches and delivers video, images and pages from edge locations, reducing load on your origin and improving speed for users in Vietnam.",vi:"CDN l\u01B0u \u0111\u1EC7m v\xE0 ph\xE2n ph\u1ED1i video, h\xECnh \u1EA3nh, trang web t\u1EEB c\xE1c \u0111i\u1EC3m bi\xEAn, gi\u1EA3m t\u1EA3i cho m\xE1y ch\u1EE7 g\u1ED1c v\xE0 c\u1EA3i thi\u1EC7n t\u1ED1c \u0111\u1ED9 cho ng\u01B0\u1EDDi d\xF9ng t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"Caches video, images and web assets at the edge",vi:"L\u01B0u \u0111\u1EC7m video, h\xECnh \u1EA3nh v\xE0 t\xE0i nguy\xEAn web t\u1EA1i \u0111i\u1EC3m bi\xEAn"},{en:"Lightens the load on origin servers",vi:"Gi\u1EA3m t\u1EA3i cho m\xE1y ch\u1EE7 g\u1ED1c"},{en:"Works together with Anti-DDoS protection",vi:"K\u1EBFt h\u1EE3p c\xF9ng l\u1EDBp ch\u1ED1ng DDoS"}]}},{id:"takeover",persona:{en:"Editor-in-Chief / Head of IT Security",vi:"T\u1ED5ng bi\xEAn t\u1EADp / Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn An ninh th\xF4ng tin"},challenge:{title:{en:"Site Defacement and Account Takeover",vi:"Deface website v\xE0 chi\u1EBFm quy\u1EC1n t\xE0i kho\u1EA3n"},body:{en:"A defaced homepage or a hijacked editorial or social account can publish false content under your brand within minutes. Attackers often get in through a phishing email to a journalist or admin, or through a web application flaw.",vi:"Trang ch\u1EE7 b\u1ECB deface hay t\xE0i kho\u1EA3n bi\xEAn t\u1EADp, m\u1EA1ng x\xE3 h\u1ED9i b\u1ECB chi\u1EBFm quy\u1EC1n c\xF3 th\u1EC3 \u0111\u0103ng tin sai l\u1EC7ch d\u01B0\u1EDBi t\xEAn th\u01B0\u01A1ng hi\u1EC7u c\u1EE7a b\u1EA1n ch\u1EC9 trong v\xE0i ph\xFAt. Tin t\u1EB7c th\u01B0\u1EDDng v\xE0o qua email phishing g\u1EEDi ph\xF3ng vi\xEAn, qu\u1EA3n tr\u1ECB vi\xEAn, ho\u1EB7c qua l\u1ED7 h\u1ED5ng \u1EE9ng d\u1EE5ng web."}},solutions:["anti-ddos-waf","email-security"],response:{title:{en:"Protect the front door and the inbox",vi:"B\u1EA3o v\u1EC7 c\u1EA3 c\u1ED5ng web v\xE0 h\u1ED9p th\u01B0"},body:{en:"A web application firewall blocks common attacks on the CMS and portal, while email defense on VCLOUD stops the phishing that steals editorial credentials.",vi:"T\u01B0\u1EDDng l\u1EEDa \u1EE9ng d\u1EE5ng web ch\u1EB7n c\xE1c \u0111\xF2n t\u1EA5n c\xF4ng ph\u1ED5 bi\u1EBFn v\xE0o CMS v\xE0 c\u1ED5ng th\xF4ng tin, c\xF2n b\u1EA3o v\u1EC7 email tr\xEAn VCLOUD ch\u1EB7n phishing \u0111\xE1nh c\u1EAFp th\xF4ng tin \u0111\u0103ng nh\u1EADp c\u1EE7a b\u1ED9 ph\u1EADn bi\xEAn t\u1EADp."},points:[{en:"WAF shields the CMS and portal from web attacks",vi:"WAF che ch\u1EAFn CMS v\xE0 c\u1ED5ng th\xF4ng tin kh\u1ECFi t\u1EA5n c\xF4ng web"},{en:"Blocks phishing aimed at newsroom accounts",vi:"Ch\u1EB7n phishing nh\u1EAFm v\xE0o t\xE0i kho\u1EA3n t\xF2a so\u1EA1n"},{en:"Hosting inside Vietnam on VCLOUD",vi:"L\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam tr\xEAn VCLOUD"}]}},{id:"leaks",persona:{en:"Chief Content Officer / Head of Production",vi:"Gi\xE1m \u0111\u1ED1c N\u1ED9i dung / Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn S\u1EA3n xu\u1EA5t"},challenge:{title:{en:"Pre-release Leaks and Content Piracy",vi:"R\xF2 r\u1EC9 n\u1ED9i dung tr\u01B0\u1EDBc ng\xE0y ph\xE1t h\xE0nh v\xE0 vi ph\u1EA1m b\u1EA3n quy\u1EC1n"},body:{en:"Unreleased episodes, scripts, game builds or exclusive stories move between production partners, freelancers and staff. One copy sent to personal webmail, chat or a USB drive can destroy the value of a premiere.",vi:"T\u1EADp phim ch\u01B0a ph\xE1t h\xE0nh, k\u1ECBch b\u1EA3n, b\u1EA3n build game hay tin \u0111\u1ED9c quy\u1EC1n lu\xE2n chuy\u1EC3n gi\u1EEFa \u0111\u1ED1i t\xE1c s\u1EA3n xu\u1EA5t, c\u1ED9ng t\xE1c vi\xEAn v\xE0 nh\xE2n vi\xEAn. Ch\u1EC9 m\u1ED9t b\u1EA3n sao g\u1EEDi qua webmail c\xE1 nh\xE2n, \u1EE9ng d\u1EE5ng chat hay USB c\u0169ng \u0111\u1EE7 l\xE0m m\u1EA5t gi\xE1 tr\u1ECB c\u1EE7a bu\u1ED5i ra m\u1EAFt."}},solutions:["dlp"],response:{title:{en:"Know where pre-release content goes",vi:"Bi\u1EBFt n\u1ED9i dung ch\u01B0a ph\xE1t h\xE0nh \u0111i v\u1EC1 \u0111\xE2u"},body:{en:"Data loss prevention monitors chat apps, personal webmail and USB drives, detects sensitive files and leaves an audit trail to stop insider leaks.",vi:"Gi\u1EA3i ph\xE1p ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u gi\xE1m s\xE1t \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB, nh\u1EADn di\u1EC7n t\u1EC7p nh\u1EA1y c\u1EA3m v\xE0 l\u01B0u v\u1EBFt ki\u1EC3m to\xE1n \u0111\u1EC3 ng\u0103n r\xF2 r\u1EC9 t\u1EEB b\xEAn trong."},points:[{en:"Covers chat, webmail and USB channels",vi:"Bao ph\u1EE7 chat, webmail v\xE0 USB"},{en:"Detects sensitive files automatically",vi:"T\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n t\u1EC7p nh\u1EA1y c\u1EA3m"},{en:"Evidence trail for investigations",vi:"D\u1EA5u v\u1EBFt b\u1EB1ng ch\u1EE9ng ph\u1EE5c v\u1EE5 \u0111i\u1EC1u tra"}]}},{id:"data-legal",persona:{en:"CFO / Head of Legal & Data Protection",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh / Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn Ph\xE1p ch\u1EBF & B\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u"},challenge:{title:{en:"Subscriber Data and Copyright Contract Load",vi:"D\u1EEF li\u1EC7u thu\xEA bao v\xE0 kh\u1ED1i l\u01B0\u1EE3ng h\u1EE3p \u0111\u1ED3ng b\u1EA3n quy\u1EC1n"},body:{en:"Subscriptions, payments and viewing habits make subscriber data subject to Decree 13, while licensing, talent and distribution contracts pile up for legal to review. Slow reviews delay deals, and a data incident hurts trust and finances.",vi:"\u0110\u0103ng k\xFD, thanh to\xE1n v\xE0 th\xF3i quen xem khi\u1EBFn d\u1EEF li\u1EC7u thu\xEA bao thu\u1ED9c ph\u1EA1m vi Ngh\u1ECB \u0111\u1ECBnh 13, trong khi h\u1EE3p \u0111\u1ED3ng b\u1EA3n quy\u1EC1n, ngh\u1EC7 s\u0129 v\xE0 ph\xE1t h\xE0nh d\u1ED3n v\u1EC1 ph\xE1p ch\u1EBF. R\xE0 so\xE1t ch\u1EADm l\xE0m tr\u1EC5 th\u01B0\u01A1ng v\u1EE5, c\xF2n s\u1EF1 c\u1ED1 d\u1EEF li\u1EC7u \u1EA3nh h\u01B0\u1EDFng \u0111\u1EBFn ni\u1EC1m tin v\xE0 t\xE0i ch\xEDnh."}},solutions:["ai-legal","dlp","email-security"],response:{title:{en:"Faster contract review, safer subscriber data",vi:"R\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng nhanh h\u01A1n, d\u1EEF li\u1EC7u thu\xEA bao an to\xE0n h\u01A1n"},body:{en:"An AI assistant supports first-pass contract review with an on-premise option, while DLP and sovereign VCLOUD hosting help keep subscriber data under control inside Vietnam.",vi:"Tr\u1EE3 l\xFD AI h\u1ED7 tr\u1EE3 r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng b\u01B0\u1EDBc \u0111\u1EA7u, c\xF3 t\xF9y ch\u1ECDn on-premise; DLP v\xE0 l\u01B0u tr\u1EEF ch\u1EE7 quy\u1EC1n tr\xEAn VCLOUD gi\xFAp ki\u1EC3m so\xE1t d\u1EEF li\u1EC7u thu\xEA bao ngay t\u1EA1i Vi\u1EC7t Nam."},points:[{en:"AI-assisted first-pass contract review",vi:"AI h\u1ED7 tr\u1EE3 r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng b\u01B0\u1EDBc \u0111\u1EA7u"},{en:"On-premise option keeps documents private",vi:"T\xF9y ch\u1ECDn on-premise gi\u1EEF t\xE0i li\u1EC7u ri\xEAng t\u01B0"},{en:"Detects subscriber records leaving the company",vi:"Ph\xE1t hi\u1EC7n h\u1ED3 s\u01A1 thu\xEA bao r\u1EDDi kh\u1ECFi doanh nghi\u1EC7p"}]}}],outcomes:[{title:{en:"Stay Online When It Counts",vi:"Lu\xF4n tr\u1EF1c tuy\u1EBFn v\xE0o l\xFAc quan tr\u1ECDng"},body:{en:"Combine CDN and Anti-DDoS/WAF so live events, premieres and breaking news run smoothly and your site resists attack.",vi:"K\u1EBFt h\u1EE3p CDN v\xE0 Anti-DDoS/WAF \u0111\u1EC3 s\u1EF1 ki\u1EC7n tr\u1EF1c ti\u1EBFp, ng\xE0y ra m\u1EAFt v\xE0 tin n\xF3ng v\u1EADn h\xE0nh m\u01B0\u1EE3t m\xE0, website \u0111\u1EE7 s\u1EE9c ch\u1ED1ng t\u1EA5n c\xF4ng."}},{title:{en:"Protect Content and Brand Trust",vi:"B\u1EA3o v\u1EC7 n\u1ED9i dung v\xE0 uy t\xEDn th\u01B0\u01A1ng hi\u1EC7u"},body:{en:"Reduce the risk of leaks, hijacked accounts and defaced pages that damage your editorial credibility and content value.",vi:"Gi\u1EA3m r\u1EE7i ro r\xF2 r\u1EC9, chi\u1EBFm t\xE0i kho\u1EA3n v\xE0 deface l\xE0m t\u1ED5n h\u1EA1i uy t\xEDn bi\xEAn t\u1EADp c\u0169ng nh\u01B0 gi\xE1 tr\u1ECB n\u1ED9i dung."}},{title:{en:"Compliance and Efficiency",vi:"Tu\xE2n th\u1EE7 v\xE0 hi\u1EC7u qu\u1EA3 v\u1EADn h\xE0nh"},body:{en:"Keep subscriber data in Vietnam on VCLOUD, support Decree 13 readiness and free legal teams from routine contract review.",vi:"L\u01B0u tr\u1EEF d\u1EEF li\u1EC7u thu\xEA bao t\u1EA1i Vi\u1EC7t Nam tr\xEAn VCLOUD, h\u1ED7 tr\u1EE3 chu\u1EA9n b\u1ECB tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13 v\xE0 gi\u1EA3i ph\xF3ng ph\xE1p ch\u1EBF kh\u1ECFi r\xE0 so\xE1t h\u1EE3p \u0111\u1ED3ng th\u01B0\u1EDDng nh\u1EADt."}}],faq:[{q:{en:"Why combine CDN and Anti-DDoS rather than buy them separately?",vi:"V\xEC sao n\xEAn k\u1EBFt h\u1EE3p CDN v\xE0 Anti-DDoS thay v\xEC mua ri\xEAng?"},a:{en:"A CDN speeds up delivery and absorbs legitimate load, while Anti-DDoS filters malicious traffic. Together, with one partner, they keep the platform fast and available during peaks.",vi:"CDN t\u0103ng t\u1ED1c ph\xE2n ph\u1ED1i v\xE0 g\xE1nh t\u1EA3i h\u1EE3p l\u1EC7, c\xF2n Anti-DDoS l\u1ECDc l\u01B0u l\u01B0\u1EE3ng \u0111\u1ED9c h\u1EA1i. Khi k\u1EBFt h\u1EE3p c\xF9ng m\u1ED9t \u0111\u1ED1i t\xE1c, n\u1EC1n t\u1EA3ng v\u1EEBa nhanh v\u1EEBa s\u1EB5n s\xE0ng trong gi\u1EDD cao \u0111i\u1EC3m."}},{q:{en:"How can we reduce the risk of pre-release content leaking?",vi:"L\xE0m sao gi\u1EA3m r\u1EE7i ro r\xF2 r\u1EC9 n\u1ED9i dung tr\u01B0\u1EDBc ng\xE0y ph\xE1t h\xE0nh?"},a:{en:"Use DLP to monitor chat, personal webmail and USB channels, detect sensitive files and keep an audit trail, alongside access policies for production partners.",vi:"D\xF9ng DLP gi\xE1m s\xE1t k\xEAnh chat, webmail c\xE1 nh\xE2n v\xE0 USB, nh\u1EADn di\u1EC7n t\u1EC7p nh\u1EA1y c\u1EA3m v\xE0 l\u01B0u v\u1EBFt ki\u1EC3m to\xE1n, k\u1EBFt h\u1EE3p ch\xEDnh s\xE1ch truy c\u1EADp cho \u0111\u1ED1i t\xE1c s\u1EA3n xu\u1EA5t."}},{q:{en:"Is subscriber data covered by Vietnamese data protection rules?",vi:"D\u1EEF li\u1EC7u thu\xEA bao c\xF3 thu\u1ED9c quy \u0111\u1ECBnh b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\u1EE7a Vi\u1EC7t Nam kh\xF4ng?"},a:{en:"Yes. Decree 13 on personal data protection applies to subscriber information. Hosting in Vietnam and controlling data movement help you prepare; confirm obligations with your legal counsel.",vi:"C\xF3. Ngh\u1ECB \u0111\u1ECBnh 13 v\u1EC1 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u c\xE1 nh\xE2n \xE1p d\u1EE5ng cho th\xF4ng tin thu\xEA bao. L\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam v\xE0 ki\u1EC3m so\xE1t lu\u1ED3ng d\u1EEF li\u1EC7u gi\xFAp b\u1EA1n chu\u1EA9n b\u1ECB; n\xEAn x\xE1c nh\u1EADn ngh\u0129a v\u1EE5 c\u1EE5 th\u1EC3 v\u1EDBi c\u1ED1 v\u1EA5n ph\xE1p l\xFD."}}]},{id:"education",icon:"graduation-cap",name:{en:"Education",vi:"Gi\xE1o d\u1EE5c"},title:{en:"Education: Universities, K-12 Groups and E-learning",vi:"Gi\xE1o d\u1EE5c: \u0110\u1EA1i h\u1ECDc, H\u1EC7 th\u1ED1ng ph\u1ED5 th\xF4ng v\xE0 \u0110\xE0o t\u1EA1o tr\u1EF1c tuy\u1EBFn"},tagline:{en:"Sovereign VCLOUD hosting, email defense, Data Loss Prevention and Database Security for campuses that cannot afford downtime or a student-data leak.",vi:"H\u1EA1 t\u1EA7ng VCLOUD ch\u1EE7 quy\u1EC1n, b\u1EA3o m\u1EADt email, ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u v\xE0 b\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u cho c\xE1c c\u01A1 s\u1EDF \u0111\xE0o t\u1EA1o kh\xF4ng th\u1EC3 gi\xE1n \u0111o\u1EA1n hay l\u1ED9 d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc."},bundle:["email-security","dlp","database-security"],image:null,regs:[{en:"Decree 13",vi:"Ngh\u1ECB \u0111\u1ECBnh 13"},{en:"Law on Cybersecurity",vi:"Lu\u1EADt An ninh m\u1EA1ng"},{en:"MOET",vi:"B\u1ED9 GD&\u0110T"}],story:{context:{title:{en:"Enrollment day: the portal crowds and a student file circulates",vi:"Ng\xE0y nh\u1EADp h\u1ECDc: c\u1ED5ng qu\xE1 t\u1EA3i v\xE0 h\u1ED3 s\u01A1 sinh vi\xEAn b\u1ECB lan truy\u1EC1n"},body:{en:"Thousands of applicants log in on the same morning while a spreadsheet of student records is forwarded through chat and personal webmail. The campus faces downtime and a data leak on the busiest day of the term.",vi:"H\xE0ng ngh\xECn th\xED sinh \u0111\u0103ng nh\u1EADp trong c\xF9ng m\u1ED9t bu\u1ED5i s\xE1ng, trong khi b\u1EA3ng t\xEDnh h\u1ED3 s\u01A1 sinh vi\xEAn b\u1ECB chuy\u1EC3n ti\u1EBFp qua chat v\xE0 webmail c\xE1 nh\xE2n. Nh\xE0 tr\u01B0\u1EDDng v\u1EEBa \u0111\u1ED1i m\u1EB7t v\u1EDBi gi\xE1n \u0111o\u1EA1n v\u1EEBa \u0111\u1ED1i m\u1EB7t v\u1EDBi r\xF2 r\u1EC9 d\u1EEF li\u1EC7u v\xE0o ng\xE0y b\u1EADn r\u1ED9n nh\u1EA5t c\u1EE7a h\u1ECDc k\u1EF3."}},entry:{title:{en:"Stop the entry point before it reaches student data",vi:"Ch\u1EB7n c\u1EEDa ng\xF5 tr\u01B0\u1EDBc khi ch\u1EA1m t\u1EDBi d\u1EEF li\u1EC7u sinh vi\xEAn"},body:{en:"Sovereign VCLOUD hosting keeps the portal available, email defense stops phishing at the gateway and DLP detects student records on their way out.",vi:"L\u01B0u tr\u1EEF VCLOUD ch\u1EE7 quy\u1EC1n gi\u1EEF c\u1ED5ng th\xF4ng tin lu\xF4n s\u1EB5n s\xE0ng, b\u1EA3o v\u1EC7 email ch\u1EB7n phishing t\u1EA1i c\u1ED5ng v\xE0 DLP ph\xE1t hi\u1EC7n h\u1ED3 s\u01A1 sinh vi\xEAn khi ch\xFAng b\u1ECB \u0111\u01B0a ra ngo\xE0i."}}},chapters:[{id:"peak-availability",persona:{en:"CIO / Head of IT",vi:"Gi\xE1m \u0111\u1ED1c CNTT"},challenge:{title:{en:"Enrollment and Exam Peaks Hit the LMS Hardest",vi:"Cao \u0111i\u1EC3m tuy\u1EC3n sinh v\xE0 thi c\u1EED \u0111\xE8 n\u1EB7ng l\xEAn LMS"},body:{en:"Application deadlines, course registration and online exams send traffic from a quiet baseline to a spike within hours. An on-premise server room sized for the average day slows down or fails exactly when thousands of students and parents are watching.",vi:"H\u1EA1n n\u1ED9p h\u1ED3 s\u01A1, \u0111\u0103ng k\xFD h\u1ECDc ph\u1EA7n v\xE0 thi tr\u1EF1c tuy\u1EBFn khi\u1EBFn l\u01B0u l\u01B0\u1EE3ng t\u0103ng v\u1ECDt trong v\xE0i gi\u1EDD so v\u1EDBi ng\xE0y th\u01B0\u1EDDng. Ph\xF2ng m\xE1y ch\u1EE7 t\u1EA1i ch\u1ED7 \u0111\u01B0\u1EE3c thi\u1EBFt k\u1EBF cho ng\xE0y b\xECnh th\u01B0\u1EDDng s\u1EBD ch\u1EADm ho\u1EB7c s\u1EADp \u0111\xFAng l\xFAc h\xE0ng ngh\xECn sinh vi\xEAn v\xE0 ph\u1EE5 huynh \u0111ang theo d\xF5i."}},solutions:["email-security"],response:{title:{en:"Run critical academic systems on VCLOUD",vi:"\u0110\u01B0a h\u1EC7 th\u1ED1ng h\u1ECDc v\u1EE5 tr\u1ECDng y\u1EBFu l\xEAn VCLOUD"},body:{en:"Hosting the admissions portal, LMS and registration systems on VCLOUD, a secure cloud inside Vietnam, replaces a fixed server room with infrastructure you can plan around peak periods, while data stays in the country.",vi:"\u0110\u1EB7t c\u1ED5ng tuy\u1EC3n sinh, LMS v\xE0 h\u1EC7 th\u1ED1ng \u0111\u0103ng k\xFD h\u1ECDc ph\u1EA7n tr\xEAn VCLOUD, \u0111\xE1m m\xE2y b\u1EA3o m\u1EADt \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam, thay cho ph\xF2ng m\xE1y c\u1ED1 \u0111\u1ECBnh b\u1EB1ng h\u1EA1 t\u1EA7ng c\xF3 th\u1EC3 ho\u1EA1ch \u0111\u1ECBnh theo m\xF9a cao \u0111i\u1EC3m, trong khi d\u1EEF li\u1EC7u v\u1EABn \u1EDF trong n\u01B0\u1EDBc."},points:[{en:"Hosting inside Vietnam for academic and student systems",vi:"L\u01B0u tr\u1EEF t\u1EA1i Vi\u1EC7t Nam cho h\u1EC7 th\u1ED1ng h\u1ECDc v\u1EE5 v\xE0 d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc"},{en:"Capacity planned around enrollment and exam calendars",vi:"N\u0103ng l\u1EF1c h\u1EA1 t\u1EA7ng ho\u1EA1ch \u0111\u1ECBnh theo l\u1ECBch tuy\u1EC3n sinh, thi c\u1EED"},{en:"Less on-premise hardware to buy and maintain",vi:"Gi\u1EA3m ph\u1EA7n c\u1EE9ng t\u1EA1i ch\u1ED7 ph\u1EA3i mua s\u1EAFm v\xE0 b\u1EA3o tr\xEC"}]}},{id:"phishing",persona:{en:"Head of Information Security",vi:"Gi\xE1m \u0111\u1ED1c An ninh th\xF4ng tin"},challenge:{title:{en:"Phishing Aimed at Staff and Students",vi:"Phishing nh\u1EAFm v\xE0o c\xE1n b\u1ED9, gi\u1EA3ng vi\xEAn v\xE0 sinh vi\xEAn"},body:{en:"Campus email is open, widely known and used by tens of thousands of people with uneven security awareness. Fake scholarship notices, tuition payment requests and spoofed messages from the president or finance office are an easy way to steal accounts and reach internal systems.",vi:"Email c\u1EE7a tr\u01B0\u1EDDng l\xE0 k\xEAnh m\u1EDF, nhi\u1EC1u ng\u01B0\u1EDDi bi\u1EBFt v\xE0 c\xF3 h\xE0ng ch\u1EE5c ngh\xECn ng\u01B0\u1EDDi d\xF9ng v\u1EDBi m\u1EE9c nh\u1EADn th\u1EE9c an to\xE0n kh\xF4ng \u0111\u1ED3ng \u0111\u1EC1u. Th\xF4ng b\xE1o h\u1ECDc b\u1ED5ng gi\u1EA3, y\xEAu c\u1EA7u \u0111\xF3ng h\u1ECDc ph\xED gi\u1EA3 hay th\u01B0 m\u1EA1o danh hi\u1EC7u tr\u01B0\u1EDFng, ph\xF2ng t\xE0i ch\xEDnh l\xE0 c\xE1ch d\u1EC5 d\xE0ng \u0111\u1EC3 chi\u1EBFm t\xE0i kho\u1EA3n v\xE0 \u0111i s\xE2u v\xE0o h\u1EC7 th\u1ED1ng n\u1ED9i b\u1ED9."}},solutions:["email-security"],response:{title:{en:"Filter the threat before it reaches the inbox",vi:"L\u1ECDc m\u1ED1i \u0111e d\u1ECDa tr\u01B0\u1EDBc khi t\u1EDBi h\u1ED9p th\u01B0"},body:{en:"Advanced email defense stops phishing, executive spoofing and ransomware at the gateway, so protection does not depend on every student and lecturer spotting the trap.",vi:"B\u1EA3o v\u1EC7 email n\xE2ng cao ch\u1EB7n phishing, gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o v\xE0 ransomware ngay t\u1EA1i c\u1ED5ng, \u0111\u1EC3 an to\xE0n kh\xF4ng ph\u1EE5 thu\u1ED9c v\xE0o vi\u1EC7c m\u1ECDi sinh vi\xEAn, gi\u1EA3ng vi\xEAn \u0111\u1EC1u t\u1EF1 nh\u1EADn ra b\u1EABy."},points:[{en:"Blocks phishing and impersonation of leadership",vi:"Ch\u1EB7n phishing v\xE0 gi\u1EA3 m\u1EA1o l\xE3nh \u0111\u1EA1o nh\xE0 tr\u01B0\u1EDDng"},{en:"Stops ransomware at the mail gateway",vi:"Ng\u0103n ransomware ngay t\u1EA1i c\u1ED5ng email"},{en:"Hosted on sovereign cloud in Vietnam",vi:"Tri\u1EC3n khai tr\xEAn \u0111\xE1m m\xE2y ch\u1EE7 quy\u1EC1n t\u1EA1i Vi\u1EC7t Nam"}]}},{id:"student-data",persona:{en:"Data Protection Officer / Registrar",vi:"C\xE1n b\u1ED9 b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u / Tr\u01B0\u1EDFng ph\xF2ng \u0110\xE0o t\u1EA1o"},challenge:{title:{en:"Student and Minors' Data Under Decree 13",vi:"D\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc v\xE0 tr\u1EBB em theo Ngh\u1ECB \u0111\u1ECBnh 13"},body:{en:"Enrollment files, ID numbers, grades, health notes and family details sit in spreadsheets, chat groups and personal mailboxes across many departments. Decree 13 sets stricter handling for children's data, so one forwarded file can become a compliance incident.",vi:"H\u1ED3 s\u01A1 nh\u1EADp h\u1ECDc, s\u1ED1 \u0111\u1ECBnh danh, \u0111i\u1EC3m s\u1ED1, th\xF4ng tin s\u1EE9c kh\u1ECFe v\xE0 ho\xE0n c\u1EA3nh gia \u0111\xECnh n\u1EB1m r\u1EA3i r\xE1c trong b\u1EA3ng t\xEDnh, nh\xF3m chat v\xE0 h\u1ED9p th\u01B0 c\xE1 nh\xE2n \u1EDF nhi\u1EC1u ph\xF2ng ban. Ngh\u1ECB \u0111\u1ECBnh 13 \u0111\u1EB7t ra y\xEAu c\u1EA7u ch\u1EB7t ch\u1EBD h\u01A1n v\u1EDBi d\u1EEF li\u1EC7u c\u1EE7a tr\u1EBB em, n\xEAn ch\u1EC9 m\u1ED9t t\u1EC7p b\u1ECB chuy\u1EC3n ti\u1EBFp c\u0169ng c\xF3 th\u1EC3 th\xE0nh s\u1EF1 c\u1ED1 tu\xE2n th\u1EE7."}},solutions:["dlp"],response:{title:{en:"Know where student data goes, and stop it leaving",vi:"Bi\u1EBFt d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc \u0111i \u0111\xE2u v\xE0 ch\u1EB7n khi b\u1ECB \u0111\u01B0a ra ngo\xE0i"},body:{en:"360-degree monitoring across chat apps, personal webmail and USB drives automatically detects sensitive records, helping stop leaks and supporting Decree 13 compliance.",vi:"Gi\xE1m s\xE1t 360\xB0 tr\xEAn \u1EE9ng d\u1EE5ng chat, webmail c\xE1 nh\xE2n v\xE0 USB t\u1EF1 \u0111\u1ED9ng nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 nh\u1EA1y c\u1EA3m, gi\xFAp ng\u0103n r\xF2 r\u1EC9 v\xE0 h\u1ED7 tr\u1EE3 tu\xE2n th\u1EE7 Ngh\u1ECB \u0111\u1ECBnh 13."},points:[{en:"Covers chat, webmail and USB channels",vi:"Bao ph\u1EE7 k\xEAnh chat, webmail v\xE0 USB"},{en:"Auto-detects personal and student records",vi:"T\u1EF1 nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 c\xE1 nh\xE2n v\xE0 h\u1ED3 s\u01A1 ng\u01B0\u1EDDi h\u1ECDc"},{en:"Evidence ready for audits and incident reviews",vi:"B\u1EB1ng ch\u1EE9ng s\u1EB5n s\xE0ng cho ki\u1EC3m to\xE1n v\xE0 r\xE0 so\xE1t s\u1EF1 c\u1ED1"}]}},{id:"records-research",persona:{en:"Vice President for Research / Head of Student Information Systems",vi:"Ph\xF3 hi\u1EC7u tr\u01B0\u1EDFng ph\u1EE5 tr\xE1ch nghi\xEAn c\u1EE9u / Tr\u01B0\u1EDFng b\u1ED9 ph\u1EADn h\u1EC7 th\u1ED1ng th\xF4ng tin sinh vi\xEAn"},challenge:{title:{en:"Grades, Records and Research IP in Too Many Hands",vi:"\u0110i\u1EC3m s\u1ED1, h\u1ED3 s\u01A1 v\xE0 t\xE0i s\u1EA3n tr\xED tu\u1EC7 nghi\xEAn c\u1EE9u qua qu\xE1 nhi\u1EC1u tay"},body:{en:"Student information and research databases are touched by administrators, developers, outsourced vendors and visiting researchers. Without query-level control, altered grades or copied research data may go unnoticed until a complaint or a dispute surfaces.",vi:"C\u01A1 s\u1EDF d\u1EEF li\u1EC7u sinh vi\xEAn v\xE0 d\u1EEF li\u1EC7u nghi\xEAn c\u1EE9u \u0111\u01B0\u1EE3c qu\u1EA3n tr\u1ECB vi\xEAn, l\u1EADp tr\xECnh vi\xEAn, nh\xE0 th\u1EA7u ngo\xE0i v\xE0 nh\xE0 nghi\xEAn c\u1EE9u kh\xE1ch truy c\u1EADp. Thi\u1EBFu ki\u1EC3m so\xE1t \u1EDF m\u1EE9c truy v\u1EA5n, \u0111i\u1EC3m b\u1ECB s\u1EEDa hay d\u1EEF li\u1EC7u nghi\xEAn c\u1EE9u b\u1ECB sao ch\xE9p c\xF3 th\u1EC3 kh\xF4ng ai bi\u1EBFt cho \u0111\u1EBFn khi c\xF3 khi\u1EBFu n\u1EA1i ho\u1EB7c tranh ch\u1EA5p."}},solutions:["database-security","dlp"],response:{title:{en:"Control who touches the record, and mask what they see",vi:"Ki\u1EC3m so\xE1t ai ch\u1EA1m v\xE0o d\u1EEF li\u1EC7u v\xE0 che nh\u1EEFng g\xEC h\u1ECD nh\xECn th\u1EA5y"},body:{en:"Query-level access control and real-time masking limit privileged and vendor access to student and research databases, while data loss prevention watches for copies leaving through everyday channels.",vi:"Ki\u1EC3m so\xE1t truy c\u1EADp m\u1EE9c truy v\u1EA5n v\xE0 che gi\u1EA5u d\u1EEF li\u1EC7u th\u1EDDi gian th\u1EF1c gi\u1EDBi h\u1EA1n quy\u1EC1n c\u1EE7a qu\u1EA3n tr\u1ECB vi\xEAn v\xE0 nh\xE0 th\u1EA7u tr\xEAn CSDL sinh vi\xEAn, nghi\xEAn c\u1EE9u; ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u theo d\xF5i c\xE1c b\u1EA3n sao b\u1ECB \u0111\u01B0a ra qua k\xEAnh th\u01B0\u1EDDng ng\xE0y."},points:[{en:"Restricts and audits privileged and vendor access",vi:"H\u1EA1n ch\u1EBF v\xE0 ki\u1EC3m to\xE1n quy\u1EC1n \u0111\u1EB7c quy\u1EC1n, quy\u1EC1n nh\xE0 th\u1EA7u"},{en:"Masks sensitive fields from unauthorized admins",vi:"Che tr\u01B0\u1EDDng nh\u1EA1y c\u1EA3m v\u1EDBi qu\u1EA3n tr\u1ECB vi\xEAn kh\xF4ng c\xF3 quy\u1EC1n"},{en:"Flags research files copied out via chat, webmail or USB",vi:"C\u1EA3nh b\xE1o t\u1EC7p nghi\xEAn c\u1EE9u b\u1ECB sao ch\xE9p qua chat, webmail, USB"}]}},{id:"budget-sovereignty",persona:{en:"CFO / Vice President of Finance",vi:"Gi\xE1m \u0111\u1ED1c T\xE0i ch\xEDnh / Ph\xF3 hi\u1EC7u tr\u01B0\u1EDFng ph\u1EE5 tr\xE1ch t\xE0i ch\xEDnh"},challenge:{title:{en:"Tight Budgets and the Question of Where Data Lives",vi:"Ng\xE2n s\xE1ch eo h\u1EB9p v\xE0 c\xE2u h\u1ECFi d\u1EEF li\u1EC7u \u0111\u1EB7t \u1EDF \u0111\xE2u"},body:{en:"Tuition-funded budgets leave little room for separate security tools or for rebuilding a data center. At the same time the board asks where student data is stored and who can reach it, and a patchwork of vendors makes that hard to answer.",vi:"Ng\xE2n s\xE1ch ch\u1EE7 y\u1EBFu t\u1EEB h\u1ECDc ph\xED kh\xF3 c\xF3 d\u01B0 \u0111\u1ECBa cho t\u1EEBng c\xF4ng c\u1EE5 an ninh ri\xEAng l\u1EBB hay x\xE2y l\u1EA1i trung t\xE2m d\u1EEF li\u1EC7u. Trong khi \u0111\xF3 h\u1ED9i \u0111\u1ED3ng tr\u01B0\u1EDDng h\u1ECFi d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc l\u01B0u \u1EDF \u0111\xE2u, ai truy c\u1EADp \u0111\u01B0\u1EE3c, v\xE0 m\u1ED9t m\u1EDB nh\xE0 cung c\u1EA5p r\u1EDDi r\u1EA1c khi\u1EBFn c\xE2u tr\u1EA3 l\u1EDDi kh\xF3 th\u1ED1ng nh\u1EA5t."}},solutions:["email-security","dlp","database-security"],response:{title:{en:"One integrated, sovereign stack instead of scattered tools",vi:"M\u1ED9t b\u1ED9 gi\u1EA3i ph\xE1p t\xEDch h\u1EE3p, ch\u1EE7 quy\u1EC1n thay v\xEC c\xF4ng c\u1EE5 r\u1EDDi r\u1EA1c"},body:{en:"VCLOUD hosting in Vietnam combined with email, data and database protection from one alliance gives finance a single partner and cost line, and gives the board a clear answer on data location.",vi:"H\u1EA1 t\u1EA7ng VCLOUD t\u1EA1i Vi\u1EC7t Nam k\u1EBFt h\u1EE3p b\u1EA3o v\u1EC7 email, d\u1EEF li\u1EC7u v\xE0 c\u01A1 s\u1EDF d\u1EEF li\u1EC7u t\u1EEB c\xF9ng m\u1ED9t li\xEAn minh gi\xFAp kh\u1ED1i t\xE0i ch\xEDnh l\xE0m vi\u1EC7c v\u1EDBi m\u1ED9t \u0111\u1EA7u m\u1ED1i, m\u1ED9t kho\u1EA3n chi, v\xE0 gi\xFAp h\u1ED9i \u0111\u1ED3ng tr\u01B0\u1EDDng c\xF3 c\xE2u tr\u1EA3 l\u1EDDi r\xF5 r\xE0ng v\u1EC1 n\u01A1i l\u01B0u tr\u1EEF d\u1EEF li\u1EC7u."},points:[{en:"Operating-cost model instead of heavy upfront hardware",vi:"M\xF4 h\xECnh chi ph\xED v\u1EADn h\xE0nh thay v\xEC \u0111\u1EA7u t\u01B0 ph\u1EA7n c\u1EE9ng l\u1EDBn ban \u0111\u1EA7u"},{en:"Data kept inside Vietnam",vi:"D\u1EEF li\u1EC7u \u0111\u01B0\u1EE3c gi\u1EEF t\u1EA1i Vi\u1EC7t Nam"},{en:"One accountable partner across the stack",vi:"M\u1ED9t \u0111\u1ED1i t\xE1c ch\u1ECBu tr\xE1ch nhi\u1EC7m xuy\xEAn su\u1ED1t"}]}}],outcomes:[{title:{en:"Keep Learning Running",vi:"Gi\u1EEF vi\u1EC7c d\u1EA1y v\xE0 h\u1ECDc kh\xF4ng gi\xE1n \u0111o\u1EA1n"},body:{en:"Run admissions, LMS and exam systems on infrastructure planned for peak periods, so critical dates are not lost to downtime.",vi:"V\u1EADn h\xE0nh tuy\u1EC3n sinh, LMS v\xE0 thi c\u1EED tr\xEAn h\u1EA1 t\u1EA7ng \u0111\u01B0\u1EE3c ho\u1EA1ch \u0111\u1ECBnh cho m\xF9a cao \u0111i\u1EC3m, \u0111\u1EC3 nh\u1EEFng m\u1ED1c th\u1EDDi gian quan tr\u1ECDng kh\xF4ng b\u1ECB m\u1EA5t v\xEC gi\xE1n \u0111o\u1EA1n."}},{title:{en:"Protect Students and Meet Decree 13",vi:"B\u1EA3o v\u1EC7 ng\u01B0\u1EDDi h\u1ECDc v\xE0 \u0111\xE1p \u1EE9ng Ngh\u1ECB \u0111\u1ECBnh 13"},body:{en:"Reduce the risk of phishing, leaks and unauthorized access to student and minors' data, with audit evidence when regulators or parents ask.",vi:"Gi\u1EA3m r\u1EE7i ro phishing, r\xF2 r\u1EC9 v\xE0 truy c\u1EADp tr\xE1i ph\xE9p v\xE0o d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc, tr\u1EBB em, k\xE8m b\u1EB1ng ch\u1EE9ng ki\u1EC3m to\xE1n khi c\u01A1 quan qu\u1EA3n l\xFD ho\u1EB7c ph\u1EE5 huynh y\xEAu c\u1EA7u."}},{title:{en:"Spend Smarter, Keep Data Sovereign",vi:"Chi ti\xEAu hi\u1EC7u qu\u1EA3, gi\u1EEF ch\u1EE7 quy\u1EC1n d\u1EEF li\u1EC7u"},body:{en:"Replace scattered tools and server rooms with one integrated stack hosted in Vietnam, easier to budget and to explain to the board.",vi:"Thay c\xE1c c\xF4ng c\u1EE5 r\u1EDDi r\u1EA1c v\xE0 ph\xF2ng m\xE1y ch\u1EE7 b\u1EB1ng m\u1ED9t b\u1ED9 gi\u1EA3i ph\xE1p t\xEDch h\u1EE3p \u0111\u1EB7t t\u1EA1i Vi\u1EC7t Nam, d\u1EC5 l\u1EADp ng\xE2n s\xE1ch v\xE0 d\u1EC5 gi\u1EA3i tr\xECnh v\u1EDBi h\u1ED9i \u0111\u1ED3ng tr\u01B0\u1EDDng."}}],faq:[{q:{en:"Why host the LMS and admissions portal on a Vietnam-based cloud?",vi:"V\xEC sao n\xEAn \u0111\u1EB7t LMS v\xE0 c\u1ED5ng tuy\u1EC3n sinh tr\xEAn \u0111\xE1m m\xE2y t\u1EA1i Vi\u1EC7t Nam?"},a:{en:"VCLOUD keeps student data inside Vietnam and lets you plan capacity around enrollment and exam peaks instead of sizing a server room for them. Specific capacity and SLA terms are agreed per project with the V-Tech Hub team.",vi:"VCLOUD gi\u1EEF d\u1EEF li\u1EC7u ng\u01B0\u1EDDi h\u1ECDc trong n\u01B0\u1EDBc v\xE0 cho ph\xE9p ho\u1EA1ch \u0111\u1ECBnh n\u0103ng l\u1EF1c theo \u0111\u1EE3t tuy\u1EC3n sinh, thi c\u1EED thay v\xEC thi\u1EBFt k\u1EBF ph\xF2ng m\xE1y cho \u0111\xFAng \u0111\u1EC9nh t\u1EA3i. N\u0103ng l\u1EF1c v\xE0 cam k\u1EBFt d\u1ECBch v\u1EE5 c\u1EE5 th\u1EC3 \u0111\u01B0\u1EE3c th\u1ED1ng nh\u1EA5t theo t\u1EEBng d\u1EF1 \xE1n c\xF9ng \u0111\u1ED9i ng\u0169 V-Tech Hub."}},{q:{en:"How does the stack help with children's data under Decree 13?",vi:"B\u1ED9 gi\u1EA3i ph\xE1p h\u1ED7 tr\u1EE3 th\u1EBF n\xE0o v\u1EDBi d\u1EEF li\u1EC7u tr\u1EBB em theo Ngh\u1ECB \u0111\u1ECBnh 13?"},a:{en:"Data Loss Prevention detects sensitive student records across chat, webmail and USB, and Database Security controls and masks access to records at the source. Together they provide visibility and audit evidence; legal obligations such as consent remain the institution's responsibility.",vi:"Gi\u1EA3i ph\xE1p ch\u1ED1ng th\u1EA5t tho\xE1t d\u1EEF li\u1EC7u nh\u1EADn di\u1EC7n h\u1ED3 s\u01A1 nh\u1EA1y c\u1EA3m tr\xEAn chat, webmail, USB, c\xF2n b\u1EA3o m\u1EADt c\u01A1 s\u1EDF d\u1EEF li\u1EC7u ki\u1EC3m so\xE1t v\xE0 che gi\u1EA5u truy c\u1EADp ngay t\u1EA1i ngu\u1ED3n. C\xF9ng nhau ch\xFAng t\u1EA1o kh\u1EA3 n\u0103ng quan s\xE1t v\xE0 b\u1EB1ng ch\u1EE9ng ki\u1EC3m to\xE1n; c\xE1c ngh\u0129a v\u1EE5 ph\xE1p l\xFD nh\u01B0 s\u1EF1 \u0111\u1ED3ng \xFD c\u1EE7a ch\u1EE7 th\u1EC3 d\u1EEF li\u1EC7u v\u1EABn thu\u1ED9c tr\xE1ch nhi\u1EC7m c\u1EE7a nh\xE0 tr\u01B0\u1EDDng."}},{q:{en:"Can a school start small given limited budget?",vi:"Tr\u01B0\u1EDDng c\xF3 ng\xE2n s\xE1ch h\u1EA1n ch\u1EBF c\xF3 th\u1EC3 b\u1EAFt \u0111\u1EA7u nh\u1ECF kh\xF4ng?"},a:{en:"Yes. Many institutions begin with email defense and VCLOUD hosting for the most exposed systems, then add data and database protection in phases. Scope and pricing are assessed with the V-Tech Hub team.",vi:"C\xF3. Nhi\u1EC1u \u0111\u01A1n v\u1ECB b\u1EAFt \u0111\u1EA7u t\u1EEB b\u1EA3o v\u1EC7 email v\xE0 VCLOUD cho c\xE1c h\u1EC7 th\u1ED1ng d\u1EC5 b\u1ECB t\u1EA5n c\xF4ng nh\u1EA5t, sau \u0111\xF3 b\u1ED5 sung b\u1EA3o v\u1EC7 d\u1EEF li\u1EC7u v\xE0 c\u01A1 s\u1EDF d\u1EEF li\u1EC7u theo t\u1EEBng giai \u0111o\u1EA1n. Ph\u1EA1m vi v\xE0 chi ph\xED \u0111\u01B0\u1EE3c \u0111\xE1nh gi\xE1 c\xF9ng \u0111\u1ED9i ng\u0169 V-Tech Hub."}}]}],signing:{srcs:["/images/vpbank-vnetwork-signing.jpg","https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=1200&q=80"]},experts:[{id:"duc-anh",initials:"DA",photo:null,name:{en:"Mr. Nguyen Duc Anh",vi:"\xD4ng Nguy\u1EC5n \u0110\u1EE9c Anh"},role:{en:"Founder & CEO, DatumBridge",vi:"Nh\xE0 s\xE1ng l\u1EADp & CEO, DatumBridge"},domain:null,bio:{en:"Mr Duc Anh has 16+ years of experience in technology, product development, and digital transformation. He leads product vision and strategy at DatumBridge, building practical and scalable AI solutions for real-world business needs.",vi:"\xD4ng \u0110\u1EE9c Anh c\xF3 h\u01A1n 16 n\u0103m kinh nghi\u1EC7m trong l\u0129nh v\u1EF1c c\xF4ng ngh\u1EC7, ph\xE1t tri\u1EC3n s\u1EA3n ph\u1EA9m v\xE0 chuy\u1EC3n \u0111\u1ED5i s\u1ED1. \xD4ng \u0111\u1ECBnh h\u01B0\u1EDBng t\u1EA7m nh\xECn v\xE0 chi\u1EBFn l\u01B0\u1EE3c s\u1EA3n ph\u1EA9m t\u1EA1i DatumBridge, t\u1EADp trung x\xE2y d\u1EF1ng c\xE1c gi\u1EA3i ph\xE1p AI th\u1EF1c ti\u1EC5n, d\u1EC5 tri\u1EC3n khai v\xE0 c\xF3 kh\u1EA3 n\u0103ng m\u1EDF r\u1ED9ng cho nhu c\u1EA7u v\u1EADn h\xE0nh c\u1EE7a doanh nghi\u1EC7p."}},{id:"tuan-anh",initials:"TA",photo:null,name:{en:"Mr. Hoang Tuan Anh",vi:"\xD4ng Ho\xE0ng Tu\u1EA5n Anh"},role:{en:"Country Director \u2013 SearchInform",vi:"Gi\xE1m \u0111\u1ED1c qu\u1ED1c gia \u2013 SearchInform"},domain:{en:"Data Loss Prevention (DLP) & Insider Risk Management",vi:"Ch\u1ED1ng r\xF2 r\u1EC9 d\u1EEF li\u1EC7u (DLP) & Qu\u1EA3n tr\u1ECB r\u1EE7i ro n\u1ED9i b\u1ED9"},bio:{en:"With over 15 years of experience in technology, telecommunications, and data security at leading corporations in Vietnam, he specializes in business development and building enterprise partnerships, and leads the expansion of Data Loss Prevention (DLP) and Insider Risk Management solutions in the country.",vi:"Chuy\xEAn gia v\u1EDBi h\u01A1n 15 n\u0103m kinh nghi\u1EC7m trong l\u0129nh v\u1EF1c c\xF4ng ngh\u1EC7, vi\u1EC5n th\xF4ng v\xE0 b\u1EA3o m\u1EADt d\u1EEF li\u1EC7u t\u1EA1i c\xE1c t\u1EADp \u0111o\xE0n h\xE0ng \u0111\u1EA7u Vi\u1EC7t Nam, chuy\xEAn v\u1EC1 ph\xE1t tri\u1EC3n kinh doanh v\xE0 x\xE2y d\u1EF1ng quan h\u1EC7 \u0111\u1ED1i t\xE1c v\u1EDBi doanh nghi\u1EC7p. \xD4ng d\u1EABn d\u1EAFt vi\u1EC7c m\u1EDF r\u1ED9ng c\xE1c gi\u1EA3i ph\xE1p ch\u1ED1ng r\xF2 r\u1EC9 d\u1EEF li\u1EC7u (DLP) v\xE0 qu\u1EA3n tr\u1ECB r\u1EE7i ro n\u1ED9i b\u1ED9 t\u1EA1i Vi\u1EC7t Nam."}},{id:"hau",initials:"H",photo:null,name:{en:"Ms. Hau",vi:"Ch\u1ECB H\u1EADu"},profile:null,role:null,domain:null,bio:null}]},xa={landmark:se,"building-2":O,"heart-pulse":ie,"shopping-bag":ge,factory:ee,truck:ye,clapperboard:J,"graduation-cap":oe,"mail-check":re,scale:fe,"shield-c
