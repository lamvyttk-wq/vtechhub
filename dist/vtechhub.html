 đến nhân viên. Chúng tôi cũng khuyến nghị thêm kiểm soát quy trình: mọi thay đổi tài khoản ngân hàng phải được xác minh qua số điện thoại đã biết."}},{"q":{"en":"Can we keep logistics data inside Vietnam?","vi":"Chúng tôi có thể giữ dữ liệu logistics trong nước không?"},"a":{"en":"Yes. VCLOUD hosts applications and email inside Vietnam, which supports data localization expectations under Vietnamese law. Your legal team should confirm the exact obligations for your data types.","vi":"Có. VCLOUD lưu trữ ứng dụng và email tại Việt Nam, đáp ứng kỳ vọng về lưu trữ dữ liệu trong nước theo pháp luật Việt Nam. Đội pháp chế nên xác nhận nghĩa vụ cụ thể cho từng loại dữ liệu của doanh nghiệp."}},{"q":{"en":"How is sensitive operational data protected from privileged admins and vendors?","vi":"Dữ liệu vận hành nhạy cảm được bảo vệ khỏi quản trị viên và nhà cung cấp có đặc quyền như thế nào?"},"a":{"en":"Database Security applies query-level access control, approval for sensitive changes and real-time masking, while DLP monitors chat, webmail and USB for customer and personal data leaving the company.","vi":"Bảo mật cơ sở dữ liệu áp dụng kiểm soát mức truy vấn, phê duyệt thay đổi nhạy cảm và che giấu thời gian thực, còn DLP giám sát chat, webmail, USB để phát hiện dữ liệu khách hàng và cá nhân bị đưa ra ngoài."}},{"q":{"en":"Does the AI Legal assistant handle customs documents?","vi":"Trợ lý AI Legal có xử lý chứng từ hải quan không?"},"a":{"en":"It is built for contract and regulatory document review. Coverage of customs and freight document types is scoped with V-Tech Foundry in a pilot, and an on-premise option keeps documents private.","vi":"Giải pháp được xây dựng cho rà soát hợp đồng và văn bản quy định. Phạm vi với các loại chứng từ hải quan và vận tải được xác định cùng V-Tech Foundry trong giai đoạn thử nghiệm, và tùy chọn on-premise giữ tài liệu riêng tư."}}],"newSolutions":[],"sources":["data/solutions.json (V-Tech Foundry solution registry)","data/industries/bfsi.json (structure reference)","Web research not performed; regulations cited by public name: Decree 13/2023/ND-CP, Law on Cybersecurity 2018, Law on Data 2024, Customs Law 54/2014/QH13"]},{"id":"manufacturing","order":5,"icon":"factory","name":{"en":"Manufacturing","vi":"Sản xuất"},"title":{"en":"Manufacturing & Industrial Supply Chain","vi":"Sản xuất & Chuỗi cung ứng công nghiệp"},"tagline":{"en":"VCLOUD & Email Security, Database Security and Data Loss Prevention to keep production lines running and designs protected.","vi":"VCLOUD & Email Security, Bảo mật cơ sở dữ liệu và Chống thất thoát dữ liệu để dây chuyền luôn chạy và bản thiết kế luôn an toàn."},"bundle":["email-security","database-security","dlp"],"regulations":["Decree 13","Cybersecurity Law","ISO 27001","Customer security audits"],"challengesIntro":{"en":"As factories connect machines, ERP and MES to the network and to suppliers, IT and operations are no longer separate worlds. For FDI plants and export suppliers, a single security incident can halt a line, expose product designs, or cost a contract when a customer audit finds gaps.","vi":"Khi máy móc, ERP và MES được kết nối vào mạng và với nhà cung cấp, IT và vận hành sản xuất không còn tách biệt. Với nhà máy FDI và doanh nghiệp xuất khẩu, một sự cố an ninh có thể dừng cả dây chuyền, lộ bản thiết kế hoặc làm mất đơn hàng khi khách hàng đánh giá phát hiện lỗ hổng."},"chapters":[{"id":"ransomware","persona":{"en":"CIO / Head of IT","vi":"Giám đốc CNTT"},"challenge":{"title":{"en":"Ransomware That Stops the Line","vi":"Ransomware làm dừng dây chuyền"},"body":{"en":"A single phishing email opened in the office network can spread to ERP and production systems. When orders cannot be processed and shipments are delayed, every hour of downtime turns into penalties and lost customer trust.","vi":"Chỉ một email phishing được mở trên mạng văn phòng cũng có thể lan sang ERP và hệ thống sản xuất. Khi đơn hàng không xử lý được và lô hàng trễ hạn, mỗi giờ ngừng trệ đều trở thành tiền phạt và mất niềm tin của khách hàng."}},"solutions":["email-security"],"response":{"title":{"en":"Stop the entry point before it reaches the office","vi":"Chặn cửa ngõ trước khi vào văn phòng"},"body":{"en":"Advanced email defense on VCLOUD blocks phishing, spoofed supplier invoices and ransomware at the gateway, while business data is hosted inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD chặn phishing, hóa đơn nhà cung cấp giả mạo và ransomware ngay tại cổng, trong khi dữ liệu doanh nghiệp được lưu trữ tại Việt Nam."},"points":[{"en":"Blocks phishing and executive or supplier spoofing","vi":"Chặn phishing, giả mạo lãnh đạo và nhà cung cấp"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"}]},"scenario":{"en":"Monday, 06:10. The first shift opens a supplier email on the office network, and ERP and the production line are one click away.","vi":"Sáng thứ Hai, 6:10. Ca đầu tiên mở một email của nhà cung cấp trên mạng văn phòng, và ERP cùng dây chuyền sản xuất chỉ cách một cú nhấp chuột."},"scene":{"kind":"gate","dest":{"en":"Plant & office mail","vi":"Hộp thư nhà máy"},"src":{"en":"Incoming mail","vi":"Thư gửi đến"},"bad":[{"en":"Fake supplier invoice","vi":"Hoá đơn NCC giả"},{"en":"Ransomware attachment","vi":"Tệp đính kèm ransomware"},{"en":"Credential phishing","vi":"Phishing lấy mật khẩu"}],"good":[{"en":"Purchase order","vi":"Đơn đặt hàng"},{"en":"Shipping notice","vi":"Thông báo giao hàng"},{"en":"Quality report","vi":"Báo cáo chất lượng"}],"before":{"en":"Exposed","vi":"Phơi nhiễm"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"ip-leak","persona":{"en":"CTO / Head of R&D","vi":"Giám đốc Công nghệ / Trưởng R&D"},"challenge":{"title":{"en":"Designs and Formulas Walking Out the Door","vi":"Bản thiết kế, công thức bị mang ra ngoài"},"body":{"en":"CAD files, process recipes and BOMs are the core value of a plant. They can leave through USB drives, personal webmail or chat apps, whether by a departing engineer or by an honest mistake.","vi":"File CAD, công thức quy trình và BOM là giá trị cốt lõi của nhà máy. Chúng có thể rời đi qua USB, webmail cá nhân hoặc ứng dụng chat, do kỹ sư nghỉ việc hoặc chỉ vì sơ suất."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive files wherever they try to leave","vi":"Thấy file nhạy cảm ở mọi nơi chúng cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects sensitive documents automatically and stops leaks before they reach a competitor.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện tài liệu nhạy cảm và ngăn rò rỉ trước khi tới tay đối thủ."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects sensitive documents","vi":"Tự nhận diện tài liệu nhạy cảm"},{"en":"Evidence trail for investigations","vi":"Bằng chứng phục vụ điều tra"}]},"scenario":{"en":"Friday, 17:30. An engineer who has just resigned copies the latest CAD files to a personal drive on the way out.","vi":"Chiều thứ Sáu, 17:30. Một kỹ sư vừa nộp đơn nghỉ việc chép các file CAD mới nhất vào ổ cá nhân trước khi ra về."},"scene":{"kind":"perimeter","asset":{"en":"CAD files & recipes","vi":"File CAD & công thức"},"channels":[{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"Chat apps","vi":"Ứng dụng chat","icon":"message-circle"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"erp-data","persona":{"en":"Head of ERP / MES & DBA","vi":"Trưởng bộ phận ERP / MES & DBA"},"challenge":{"title":{"en":"ERP and MES Data Open to Too Many Hands","vi":"Dữ liệu ERP và MES quá nhiều người chạm tới"},"body":{"en":"Production plans, costs, pricing and customer orders sit in ERP and MES databases that administrators, developers and integrators can reach directly. Without query-level control, a mistake or misuse may go unnoticed.","vi":"Kế hoạch sản xuất, giá thành, báo giá và đơn hàng nằm trong CSDL ERP, MES mà quản trị viên, lập trình viên và đơn vị tích hợp có thể truy cập trực tiếp. Thiếu kiểm soát mức truy vấn, sai sót hoặc lạm quyền có thể không bị phát hiện."}},"solutions":["database-security"],"response":{"title":{"en":"Every query seen, every sensitive field masked","vi":"Mọi truy vấn đều được thấy, trường nhạy cảm đều được che"},"body":{"en":"Query-level access control and real-time data masking protect ERP and MES data without slowing live operations.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực bảo vệ dữ liệu ERP, MES mà không làm chậm vận hành."},"points":[{"en":"Restricts direct database access","vi":"Hạn chế truy cập trực tiếp vào CSDL"},{"en":"Masks costs and pricing from unauthorized admins","vi":"Che giá thành, báo giá với quản trị viên không có quyền"},{"en":"Audit trail for every change","vi":"Nhật ký kiểm toán mọi thay đổi"}]},"scenario":{"en":"Month-end, 22:30. An integrator's account queries the whole costing table in the ERP database while the plant runs its night shift.","vi":"Cuối tháng, 22:30. Tài khoản của đơn vị tích hợp truy vấn toàn bộ bảng giá thành trong CSDL ERP khi nhà máy đang chạy ca đêm."},"scene":{"kind":"mask","table":{"en":"ERP · costing & orders","vi":"ERP · giá thành & đơn hàng"},"actor":{"en":"Integrator account","vi":"Tài khoản tích hợp"},"rows":[{"k":{"en":"Product","vi":"Sản phẩm"},"v":"Bracket A-100"},{"k":{"en":"Unit cost","vi":"Giá thành"},"v":"31,500 ₫","s":1},{"k":{"en":"Price quote","vi":"Báo giá"},"v":"46,200 ₫","s":1},{"k":{"en":"Customer PO","vi":"Đơn khách hàng"},"v":"PO-0001","s":1}],"before":{"en":"Unwatched","vi":"Không kiểm soát"},"after":{"en":"Controlled","vi":"Được kiểm soát"}}},{"id":"vendor-access","persona":{"en":"Head of IT Infrastructure","vi":"Trưởng bộ phận Hạ tầng CNTT"},"challenge":{"title":{"en":"Remote Vendors with Standing Access","vi":"Nhà cung cấp truy cập từ xa thường trực"},"body":{"en":"Machine makers, system integrators and software vendors often need remote access to support the plant. Broad, long-lived access to databases turns a third party into the weakest link.","vi":"Hãng máy, đơn vị tích hợp và nhà cung cấp phần mềm thường cần truy cập từ xa để hỗ trợ nhà máy. Quyền truy cập rộng và kéo dài vào cơ sở dữ liệu biến bên thứ ba thành mắt xích yếu nhất."}},"solutions":["database-security","email-security"],"response":{"title":{"en":"Give vendors a controlled door, not a key","vi":"Cho nhà cung cấp một cửa có kiểm soát, không phải chìa khóa"},"body":{"en":"Vendor sessions to databases go through a controlled gateway with approval for sensitive actions, while mail defense filters the invoices and attachments that vendors send in.","vi":"Phiên truy cập CSDL của nhà cung cấp đi qua cổng kiểm soát với phê duyệt cho thao tác nhạy cảm, còn lớp bảo vệ email lọc hóa đơn và tệp đính kèm họ gửi đến."},"points":[{"en":"Approval workflow for sensitive actions","vi":"Quy trình phê duyệt cho thao tác nhạy cảm"},{"en":"Full record of what vendors did","vi":"Ghi lại đầy đủ những gì nhà cung cấp đã làm"},{"en":"Filters inbound vendor attachments","vi":"Lọc tệp đính kèm từ nhà cung cấp"}]},"scenario":{"en":"Tuesday, 14:20. A machine maker's engineer logs in remotely to fix a line fault, and the same session can reach far more than the machine.","vi":"Chiều thứ Ba, 14:20. Kỹ sư của hãng máy đăng nhập từ xa để xử lý lỗi dây chuyền, và cùng phiên đó có thể chạm tới nhiều hơn chiếc máy cần sửa."},"scene":{"kind":"mask","table":{"en":"MES · line database","vi":"MES · CSDL dây chuyền"},"actor":{"en":"Remote vendor","vi":"Nhà cung cấp từ xa"},"approved":{"en":"Time-boxed · masked","vi":"Có thời hạn · đã che"},"rows":[{"k":{"en":"Machine","vi":"Máy"},"v":"Press line 3"},{"k":{"en":"Recipe","vi":"Công thức"},"v":"RCP-0001","s":1},{"k":{"en":"Customer PO","vi":"Đơn khách hàng"},"v":"PO-0001","s":1},{"k":{"en":"Unit cost","vi":"Giá thành"},"v":"31,500 ₫","s":1}],"before":{"en":"Unwatched","vi":"Không kiểm soát"},"after":{"en":"Controlled","vi":"Được kiểm soát"}}},{"id":"audit","persona":{"en":"CFO / Compliance Lead","vi":"Giám đốc Tài chính / Trưởng Tuân thủ"},"challenge":{"title":{"en":"Customer and Supplier Security Audits","vi":"Đánh giá an ninh từ khách hàng và đối tác"},"body":{"en":"Global customers increasingly audit the security of their suppliers, and Vietnamese law sets duties for personal data and cybersecurity. Failing an audit can put orders at risk, and gaps are costly to fix under time pressure.","vi":"Khách hàng toàn cầu ngày càng đánh giá an ninh của nhà cung cấp, đồng thời pháp luật Việt Nam quy định nghĩa vụ về dữ liệu cá nhân và an ninh mạng. Không đạt đánh giá có thể ảnh hưởng đơn hàng, và khắc phục gấp rất tốn kém."}},"solutions":["dlp","email-security","database-security"],"response":{"title":{"en":"Controls and evidence ready when the auditor arrives","vi":"Kiểm soát và bằng chứng sẵn sàng khi đoàn đánh giá đến"},"body":{"en":"Data monitoring, database access control and in-country hosting give you documented controls and logs to show customers and prepare for Decree 13 and ISO 27001-style requirements.","vi":"Giám sát dữ liệu, kiểm soát truy cập CSDL và lưu trữ trong nước giúp bạn có các biện pháp kiểm soát và nhật ký được ghi nhận để trình khách hàng, chuẩn bị cho Nghị định 13 và các yêu cầu theo ISO 27001."},"points":[{"en":"Logs and evidence on demand","vi":"Nhật ký và bằng chứng khi cần"},{"en":"Data stays in Vietnam on VCLOUD","vi":"Dữ liệu ở lại Việt Nam trên VCLOUD"},{"en":"One integrated package, one partner","vi":"Một gói tích hợp, một đối tác"}]},"scenario":{"en":"Quarter-end. A global customer's auditor arrives, asking how the plant keeps its drawings and order data from leaving through USB, personal mail or chat.","vi":"Cuối quý. Đoàn đánh giá của một khách hàng toàn cầu đến nhà máy và hỏi bằng cách nào bản vẽ, dữ liệu đơn hàng của họ không bị mang ra ngoài qua USB, thư cá nhân hay ứng dụng chat."},"scene":{"kind":"perimeter","asset":{"en":"Customer drawings","vi":"Bản vẽ của khách hàng"},"channels":[{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"Chat apps","vi":"Ứng dụng chat","icon":"message-circle"}],"before":{"en":"At risk","vi":"Rủi ro"},"after":{"en":"Audit-ready","vi":"Sẵn sàng"}}}],"outcomes":[{"title":{"en":"Keep Production Running","vi":"Giữ sản xuất vận hành liên tục"},"body":{"en":"Block the most common entry points for ransomware and control access to core systems to reduce the risk of line stoppages.","vi":"Chặn các cửa ngõ phổ biến của ransomware và kiểm soát truy cập vào hệ thống lõi để giảm nguy cơ dừng dây chuyền."}},{"title":{"en":"Protect Intellectual Property","vi":"Bảo vệ tài sản trí tuệ"},"body":{"en":"Keep designs, formulas and cost data from leaving through users, vendors or databases.","vi":"Ngăn bản thiết kế, công thức và dữ liệu giá thành rời đi qua người dùng, nhà cung cấp hoặc cơ sở dữ liệu."}},{"title":{"en":"Win and Keep Customers","vi":"Giành và giữ khách hàng"},"body":{"en":"Show documented controls and evidence in customer audits and prepare for data protection requirements in Vietnam.","vi":"Chứng minh các biện pháp kiểm soát và bằng chứng trong đánh giá của khách hàng, đồng thời chuẩn bị cho yêu cầu bảo vệ dữ liệu tại Việt Nam."}}],"faq":[{"q":{"en":"Do we need to replace our existing ERP or MES?","vi":"Chúng tôi có phải thay ERP hoặc MES hiện có không?"},"a":{"en":"No. Database security and data monitoring sit around your existing systems. Scope and integration are assessed with the V-Tech Foundry team for each plant.","vi":"Không. Bảo mật cơ sở dữ liệu và giám sát dữ liệu được đặt quanh hệ thống hiện có. Phạm vi và cách tích hợp được đánh giá cùng đội ngũ V-Tech Foundry cho từng nhà máy."}},{"q":{"en":"Can this help with customer security questionnaires and audits?","vi":"Giải pháp có hỗ trợ bảng câu hỏi và đợt đánh giá an ninh của khách hàng không?"},"a":{"en":"It provides access controls, monitoring and logs that you can document as evidence. Certification outcomes depend on your overall program.","vi":"Giải pháp cung cấp kiểm soát truy cập, giám sát và nhật ký để bạn làm bằng chứng. Kết quả chứng nhận còn phụ thuộc vào chương trình an ninh tổng thể của doanh nghiệp."}},{"q":{"en":"How do we handle remote access by machine and software vendors?","vi":"Làm sao quản lý truy cập từ xa của hãng máy và nhà cung cấp phần mềm?"},"a":{"en":"Database access is routed through a controlled gateway with approval for sensitive queries and a full audit trail, so vendors get only what they need.","vi":"Truy cập CSDL được đi qua cổng kiểm soát với phê duyệt cho truy vấn nhạy cảm và nhật ký kiểm toán đầy đủ, nhà cung cấp chỉ nhận đúng quyền cần thiết."}}],"newSolutions":[],"sources":["Web access to vnetwork.vn was blocked; copy is based on existing V-Tech Foundry solution registry and BFSI example. Regulation references: Law on Cybersecurity 2018, Decree 13/2023/ND-CP."]},{"id":"media","order":7,"icon":"clapperboard","name":{"en":"Media & Digital Content","vi":"Truyền thông & Nội dung số"},"title":{"en":"Media & Digital Content: News, Streaming, Publishing and Gaming","vi":"Truyền thông & Nội dung số: Báo điện tử, Streaming, Xuất bản và Game"},"tagline":{"en":"CDN and Anti-DDoS/WAF for live events, Email Security on VCLOUD, Data Loss Prevention for content and subscriber data, and AI Legal for contract review.","vi":"CDN và Anti-DDoS/WAF cho sự kiện trực tiếp, Email Security trên VCLOUD, Chống thất thoát dữ liệu cho nội dung và dữ liệu thuê bao, cùng AI Legal rà soát hợp đồng."},"bundle":["cdn","anti-ddos-waf","email-security","dlp","ai-legal"],"regulations":["Decree 13","Law on Cybersecurity","Intellectual Property Law"],"challengesIntro":{"en":"For media businesses, the audience arrives all at once: a live match, a breaking story or a premiere can multiply traffic within minutes, and attackers know it. Meanwhile unreleased content, editorial accounts and subscriber data are valuable targets. Leadership must keep the platform fast, trusted and compliant at the moments that matter most.","vi":"Với doanh nghiệp truyền thông, khán giả thường đổ về cùng một lúc: một trận đấu trực tiếp, một tin nóng hay một buổi ra mắt có thể làm lưu lượng tăng vọt chỉ trong vài phút, và tin tặc cũng biết điều đó. Trong khi đó, nội dung chưa công bố, tài khoản biên tập và dữ liệu thuê bao là mục tiêu giá trị. Ban lãnh đạo cần giữ nền tảng nhanh, đáng tin và tuân thủ đúng vào những thời điểm quan trọng nhất."},"chapters":[{"id":"live-ddos","persona":{"en":"CTO / Head of Platform","vi":"Giám đốc Công nghệ / Trưởng bộ phận Nền tảng"},"challenge":{"title":{"en":"Traffic Spikes and DDoS During Live Events","vi":"Lưu lượng tăng vọt và tấn công DDoS trong sự kiện trực tiếp"},"body":{"en":"A live broadcast or breaking-news peak is exactly when the site must not fail. Genuine surges and malicious floods look alike, and downtime during the event means lost viewers, advertisers and brand trust.","vi":"Phát sóng trực tiếp hay đỉnh tin nóng chính là lúc hệ thống không được phép gián đoạn. Lượng truy cập thật tăng đột biến và lưu lượng tấn công trông rất giống nhau; website sập đúng lúc sự kiện đồng nghĩa mất người xem, nhà quảng cáo và uy tín thương hiệu."}},"solutions":["anti-ddos-waf"],"response":{"title":{"en":"Absorb the flood, keep the show on air","vi":"Hấp thụ đòn tấn công, giữ chương trình lên sóng"},"body":{"en":"Anti-DDoS filtering separates real viewers from attack traffic before it reaches your origin, so the platform stays available through the peak.","vi":"Lớp chống DDoS lọc tách người xem thật khỏi lưu lượng tấn công trước khi chạm tới máy chủ gốc, giúp nền tảng luôn sẵn sàng suốt giờ cao điểm."},"points":[{"en":"Filters attack traffic away from the origin","vi":"Lọc lưu lượng tấn công trước khi tới máy chủ gốc"},{"en":"Keeps legitimate viewers connected","vi":"Giữ kết nối cho người xem hợp lệ"},{"en":"Plan capacity ahead of major events","vi":"Chuẩn bị năng lực trước các sự kiện lớn"}]},"scenario":{"en":"Saturday, 19:58. The final starts in two minutes, viewers are flooding in, and the platform team cannot tell real fans from attack traffic.","vi":"Tối thứ Bảy, 19:58. Hai phút nữa trận chung kết bắt đầu, người xem đổ về ào ạt, và đội nền tảng không thể phân biệt người hâm mộ thật với lưu lượng tấn công."},"scene":{"kind":"wave","capacity":{"en":"Capacity","vi":"Công suất"},"down":{"en":"Stream down","vi":"Mất sóng"},"edge":{"en":"Edge nodes absorb the live peak","vi":"Điểm biên gánh đỉnh tải trực tiếp"},"before":{"en":"Overloaded","vi":"Quá tải"},"after":{"en":"Online","vi":"Ổn định"}}},{"id":"latency","persona":{"en":"Head of Streaming / Digital Product","vi":"Trưởng bộ phận Streaming / Sản phẩm số"},"challenge":{"title":{"en":"Slow Delivery and Buffering for Viewers","vi":"Tải chậm và giật lag với người xem"},"body":{"en":"Viewers leave quickly when video buffers or pages load slowly, especially on mobile and across provinces. Serving everything from a single origin raises cost and degrades experience as the audience grows.","vi":"Người xem rời đi rất nhanh khi video giật hoặc trang tải chậm, nhất là trên di động và ở các tỉnh thành. Phục vụ mọi thứ từ một máy chủ gốc vừa đẩy chi phí lên vừa làm trải nghiệm xấu đi khi lượng người xem tăng."}},"solutions":["cdn"],"response":{"title":{"en":"Bring content closer to the audience","vi":"Đưa nội dung đến gần khán giả hơn"},"body":{"en":"A CDN caches and delivers video, images and pages from edge locations, reducing load on your origin and improving speed for users in Vietnam.","vi":"CDN lưu đệm và phân phối video, hình ảnh, trang web từ các điểm biên, giảm tải cho máy chủ gốc và cải thiện tốc độ cho người dùng tại Việt Nam."},"points":[{"en":"Caches video, images and web assets at the edge","vi":"Lưu đệm video, hình ảnh và tài nguyên web tại điểm biên"},{"en":"Lightens the load on origin servers","vi":"Giảm tải cho máy chủ gốc"},{"en":"Works together with Anti-DDoS protection","vi":"Kết hợp cùng lớp chống DDoS"}]},"scenario":{"en":"Sunday, 21:15. Viewers in the provinces are watching the premiere on their phones, the video keeps buffering, and they start to drop off.","vi":"Tối Chủ nhật, 21:15. Người xem ở các tỉnh theo dõi buổi ra mắt trên điện thoại, video liên tục giật lag và họ bắt đầu rời đi."},"scene":{"kind":"wave","capacity":{"en":"Bandwidth","vi":"Băng thông"},"down":{"en":"Buffering","vi":"Giật lag"},"edge":{"en":"Edge caches close to viewers","vi":"Bộ đệm biên gần người xem"},"before":{"en":"Buffering","vi":"Giật lag"},"after":{"en":"Smooth","vi":"Mượt mà"}}},{"id":"takeover","persona":{"en":"Editor-in-Chief / Head of IT Security","vi":"Tổng biên tập / Trưởng bộ phận An ninh thông tin"},"challenge":{"title":{"en":"Site Defacement and Account Takeover","vi":"Deface website và chiếm quyền tài khoản"},"body":{"en":"A defaced homepage or a hijacked editorial or social account can publish false content under your brand within minutes. Attackers often get in through a phishing email to a journalist or admin, or through a web application flaw.","vi":"Trang chủ bị deface hay tài khoản biên tập, mạng xã hội bị chiếm quyền có thể đăng tin sai lệch dưới tên thương hiệu của bạn chỉ trong vài phút. Tin tặc thường vào qua email phishing gửi phóng viên, quản trị viên, hoặc qua lỗ hổng ứng dụng web."}},"solutions":["anti-ddos-waf","email-security"],"response":{"title":{"en":"Protect the front door and the inbox","vi":"Bảo vệ cả cổng web và hộp thư"},"body":{"en":"A web application firewall blocks common attacks on the CMS and portal, while email defense on VCLOUD stops the phishing that steals editorial credentials.","vi":"Tường lửa ứng dụng web chặn các đòn tấn công phổ biến vào CMS và cổng thông tin, còn bảo vệ email trên VCLOUD chặn phishing đánh cắp thông tin đăng nhập của bộ phận biên tập."},"points":[{"en":"WAF shields the CMS and portal from web attacks","vi":"WAF che chắn CMS và cổng thông tin khỏi tấn công web"},{"en":"Blocks phishing aimed at newsroom accounts","vi":"Chặn phishing nhắm vào tài khoản tòa soạn"},{"en":"Hosting inside Vietnam on VCLOUD","vi":"Lưu trữ tại Việt Nam trên VCLOUD"}]},"scenario":{"en":"Tuesday, 06:05. The homepage shows a headline nobody wrote, and the editor-in-chief cannot log in to take it down.","vi":"Sáng thứ Ba, 6:05. Trang chủ hiện một tiêu đề không ai viết, còn Tổng biên tập không thể đăng nhập để gỡ xuống."},"scene":{"kind":"gate","dest":{"en":"Newsroom CMS","vi":"CMS tòa soạn"},"src":{"en":"Web traffic","vi":"Truy cập web"},"bad":[{"en":"Defacement attempt","vi":"Cố tình deface trang"},{"en":"Credential-stuffing bot","vi":"Bot dò mật khẩu"},{"en":"CMS exploit attempt","vi":"Khai thác lỗ hổng CMS"}],"good":[{"en":"Reader visit","vi":"Độc giả truy cập"},{"en":"Editor login","vi":"Biên tập viên đăng nhập"},{"en":"Story upload","vi":"Đăng bài mới"}],"before":{"en":"Exposed","vi":"Bỏ ngỏ"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"leaks","persona":{"en":"Chief Content Officer / Head of Production","vi":"Giám đốc Nội dung / Trưởng bộ phận Sản xuất"},"challenge":{"title":{"en":"Pre-release Leaks and Content Piracy","vi":"Rò rỉ nội dung trước ngày phát hành và vi phạm bản quyền"},"body":{"en":"Unreleased episodes, scripts, game builds or exclusive stories move between production partners, freelancers and staff. One copy sent to personal webmail, chat or a USB drive can destroy the value of a premiere.","vi":"Tập phim chưa phát hành, kịch bản, bản build game hay tin độc quyền luân chuyển giữa đối tác sản xuất, cộng tác viên và nhân viên. Chỉ một bản sao gửi qua webmail cá nhân, ứng dụng chat hay USB cũng đủ làm mất giá trị của buổi ra mắt."}},"solutions":["dlp"],"response":{"title":{"en":"Know where pre-release content goes","vi":"Biết nội dung chưa phát hành đi về đâu"},"body":{"en":"Data loss prevention monitors chat apps, personal webmail and USB drives, detects sensitive files and leaves an audit trail to stop insider leaks.","vi":"Giải pháp chống thất thoát dữ liệu giám sát ứng dụng chat, webmail cá nhân và USB, nhận diện tệp nhạy cảm và lưu vết kiểm toán để ngăn rò rỉ từ bên trong."},"points":[{"en":"Covers chat, webmail and USB channels","vi":"Bao phủ chat, webmail và USB"},{"en":"Detects sensitive files automatically","vi":"Tự động nhận diện tệp nhạy cảm"},{"en":"Evidence trail for investigations","vi":"Dấu vết bằng chứng phục vụ điều tra"}]},"scenario":{"en":"Thursday, 22:30. Three days before the premiere, an unreleased episode is copied from a freelancer's laptop to a personal drive.","vi":"Tối thứ Năm, 22:30. Ba ngày trước buổi ra mắt, một tập phim chưa phát hành bị sao chép từ máy tính của cộng tác viên sang ổ cá nhân."},"scene":{"kind":"perimeter","asset":{"en":"Unreleased episode","vi":"Tập phim chưa chiếu"},"channels":[{"en":"Chat apps","vi":"Ứng dụng chat","icon":"message-circle"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"data-legal","persona":{"en":"CFO / Head of Legal & Data Protection","vi":"Giám đốc Tài chính / Trưởng bộ phận Pháp chế & Bảo vệ dữ liệu"},"challenge":{"title":{"en":"Subscriber Data and Copyright Contract Load","vi":"Dữ liệu thuê bao và khối lượng hợp đồng bản quyền"},"body":{"en":"Subscriptions, payments and viewing habits make subscriber data subject to Decree 13, while licensing, talent and distribution contracts pile up for legal to review. Slow reviews delay deals, and a data incident hurts trust and finances.","vi":"Đăng ký, thanh toán và thói quen xem khiến dữ liệu thuê bao thuộc phạm vi Nghị định 13, trong khi hợp đồng bản quyền, nghệ sĩ và phát hành dồn về pháp chế. Rà soát chậm làm trễ thương vụ, còn sự cố dữ liệu ảnh hưởng đến niềm tin và tài chính."}},"solutions":["ai-legal","dlp","email-security"],"response":{"title":{"en":"Faster contract review, safer subscriber data","vi":"Rà soát hợp đồng nhanh hơn, dữ liệu thuê bao an toàn hơn"},"body":{"en":"An AI assistant supports first-pass contract review with an on-premise option, while DLP and sovereign VCLOUD hosting help keep subscriber data under control inside Vietnam.","vi":"Trợ lý AI hỗ trợ rà soát hợp đồng bước đầu, có tùy chọn on-premise; DLP và lưu trữ chủ quyền trên VCLOUD giúp kiểm soát dữ liệu thuê bao ngay tại Việt Nam."},"points":[{"en":"AI-assisted first-pass contract review","vi":"AI hỗ trợ rà soát hợp đồng bước đầu"},{"en":"On-premise option keeps documents private","vi":"Tùy chọn on-premise giữ tài liệu riêng tư"},{"en":"Detects subscriber records leaving the company","vi":"Phát hiện hồ sơ thuê bao rời khỏi doanh nghiệp"}]},"scenario":{"en":"Quarter-end week. A pile of licensing and talent contracts waits for legal sign-off, and a distribution deal is stalled behind it.","vi":"Tuần cuối quý. Một chồng hợp đồng bản quyền và nghệ sĩ đang chờ pháp chế ký duyệt, và một thương vụ phát hành bị kẹt phía sau."},"scene":{"kind":"scan","doc":{"en":"Licensing contract","vi":"Hợp đồng bản quyền"},"flags":[{"en":"Exclusivity term","vi":"Thời hạn độc quyền"},{"en":"Territory gap","vi":"Sót lãnh thổ"},{"en":"Rights expiry","vi":"Hết hạn bản quyền"}],"timeBefore":{"en":"Days","vi":"Nhiều ngày"},"timeAfter":{"en":"Minutes","vi":"Vài phút"},"perDoc":{"en":"per licence review","vi":"mỗi hợp đồng"},"before":{"en":"Manual","vi":"Thủ công"},"after":{"en":"Automated","vi":"Tự động"}}}],"outcomes":[{"title":{"en":"Stay Online When It Counts","vi":"Luôn trực tuyến vào lúc quan trọng"},"body":{"en":"Combine CDN and Anti-DDoS/WAF so live events, premieres and breaking news run smoothly and your site resists attack.","vi":"Kết hợp CDN và Anti-DDoS/WAF để sự kiện trực tiếp, ngày ra mắt và tin nóng vận hành mượt mà, website đủ sức chống tấn công."}},{"title":{"en":"Protect Content and Brand Trust","vi":"Bảo vệ nội dung và uy tín thương hiệu"},"body":{"en":"Reduce the risk of leaks, hijacked accounts and defaced pages that damage your editorial credibility and content value.","vi":"Giảm rủi ro rò rỉ, chiếm tài khoản và deface làm tổn hại uy tín biên tập cũng như giá trị nội dung."}},{"title":{"en":"Compliance and Efficiency","vi":"Tuân thủ và hiệu quả vận hành"},"body":{"en":"Keep subscriber data in Vietnam on VCLOUD, support Decree 13 readiness and free legal teams from routine contract review.","vi":"Lưu trữ dữ liệu thuê bao tại Việt Nam trên VCLOUD, hỗ trợ chuẩn bị tuân thủ Nghị định 13 và giải phóng pháp chế khỏi rà soát hợp đồng thường nhật."}}],"faq":[{"q":{"en":"Why combine CDN and Anti-DDoS rather than buy them separately?","vi":"Vì sao nên kết hợp CDN và Anti-DDoS thay vì mua riêng?"},"a":{"en":"A CDN speeds up delivery and absorbs legitimate load, while Anti-DDoS filters malicious traffic. Together, with one partner, they keep the platform fast and available during peaks.","vi":"CDN tăng tốc phân phối và gánh tải hợp lệ, còn Anti-DDoS lọc lưu lượng độc hại. Khi kết hợp cùng một đối tác, nền tảng vừa nhanh vừa sẵn sàng trong giờ cao điểm."}},{"q":{"en":"How can we reduce the risk of pre-release content leaking?","vi":"Làm sao giảm rủi ro rò rỉ nội dung trước ngày phát hành?"},"a":{"en":"Use DLP to monitor chat, personal webmail and USB channels, detect sensitive files and keep an audit trail, alongside access policies for production partners.","vi":"Dùng DLP giám sát kênh chat, webmail cá nhân và USB, nhận diện tệp nhạy cảm và lưu vết kiểm toán, kết hợp chính sách truy cập cho đối tác sản xuất."}},{"q":{"en":"Is subscriber data covered by Vietnamese data protection rules?","vi":"Dữ liệu thuê bao có thuộc quy định bảo vệ dữ liệu của Việt Nam không?"},"a":{"en":"Yes. Decree 13 on personal data protection applies to subscriber information. Hosting in Vietnam and controlling data movement help you prepare; confirm obligations with your legal counsel.","vi":"Có. Nghị định 13 về bảo vệ dữ liệu cá nhân áp dụng cho thông tin thuê bao. Lưu trữ tại Việt Nam và kiểm soát luồng dữ liệu giúp bạn chuẩn bị; nên xác nhận nghĩa vụ cụ thể với cố vấn pháp lý."}}],"newSolutions":[{"id":"cdn","icon":"globe","name":"CDN","tagline":{"en":"Faster content delivery across Vietnam","vi":"Phân phối nội dung nhanh trên toàn Việt Nam"},"description":{"en":"Content delivery network that caches video, images and web assets close to viewers, reducing origin load and buffering during traffic peaks.","vi":"Mạng phân phối nội dung lưu đệm video, hình ảnh và tài nguyên web gần người xem, giảm tải máy chủ gốc và hạn chế giật lag khi lưu lượng tăng cao."}},{"id":"anti-ddos-waf","icon":"shield-alert","name":"Anti-DDoS & WAF","tagline":{"en":"Keep sites up under attack","vi":"Giữ website hoạt động khi bị tấn công"},"description":{"en":"Filters DDoS floods and blocks web application attacks so portals, streaming and content platforms stay available and uncompromised.","vi":"Lọc tấn công DDoS và chặn tấn công ứng dụng web để cổng thông tin, streaming và nền tảng nội dung luôn sẵn sàng và không bị xâm nhập."}}],"sources":["Web access to vnetwork.vn blocked in this environment; based on data/solutions.json and general public knowledge that VNETWORK offers CDN and Anti-DDoS/WAF (verify product names/scope with VNETWORK)"]},{"id":"retail","order":4,"icon":"shopping-bag","name":{"en":"Retail & E-Commerce","vi":"Bán lẻ & Thương mại điện tử"},"title":{"en":"Retail & E-Commerce","vi":"Bán lẻ & Thương mại điện tử"},"tagline":{"en":"Anti-DDoS & CDN, Web Application Firewall, sovereign VCLOUD, Data Loss Prevention and AI Legal & Compliance for always-on selling.","vi":"Chống DDoS & CDN, tường lửa ứng dụng web, VCLOUD chủ quyền, chống thất thoát dữ liệu và AI Legal & Compliance để bán hàng không gián đoạn."},"bundle":["anti-ddos-cdn","web-waf","email-security","dlp","ai-legal"],"regulations":["Decree 13","PCI DSS","Law on Cybersecurity","Law on Consumer Protection"],"challengesIntro":{"en":"Retail revenue now concentrates into a few high-stakes moments: flash sales, double-date campaigns and holiday peaks. In those hours a slow page, a failed checkout or a leaked customer list turns directly into lost revenue and lost trust, while attackers and bots target exactly the same moments.","vi":"Doanh thu bán lẻ ngày càng dồn vào vài thời điểm quyết định: flash sale, các đợt khuyến mãi ngày đôi và mùa lễ. Chỉ cần trang web chậm, thanh toán lỗi hoặc danh sách khách hàng bị lộ trong những giờ đó là mất doanh thu và niềm tin ngay lập tức, trong khi tin tặc và bot cũng nhắm đúng vào các thời điểm này."},"chapters":[{"id":"peak-ddos","persona":{"en":"CTO / Head of E-Commerce Platform","vi":"CTO / Giám đốc nền tảng thương mại điện tử"},"challenge":{"title":{"en":"Peak-Sale Traffic and DDoS Attacks","vi":"Lưu lượng đỉnh điểm và tấn công DDoS ngày sale"},"body":{"en":"At midnight on a flash-sale day, traffic spikes tenfold. It is hard to tell real shoppers from a DDoS attack aimed at taking you offline while a competitor's campaign runs. Every minute of downtime is lost orders and wasted ad spend.","vi":"Đúng 0 giờ ngày flash sale, lưu lượng tăng vọt gấp nhiều lần. Rất khó phân biệt khách mua thật với một đợt DDoS nhằm đánh sập hệ thống đúng lúc đối thủ chạy chiến dịch. Mỗi phút gián đoạn là đơn hàng mất đi và ngân sách quảng cáo đổ bỏ."}},"solutions":["anti-ddos-cdn"],"response":{"title":{"en":"Absorb the attack, keep selling","vi":"Hấp thụ tấn công, bán hàng không ngừng"},"body":{"en":"Anti-DDoS filtering and a CDN sit in front of your storefront, scrubbing malicious traffic and serving images and static content closer to shoppers so the origin stays free for orders.","vi":"Lớp chống DDoS và CDN đặt trước website bán hàng, lọc lưu lượng độc hại và phân phối hình ảnh, nội dung tĩnh gần người mua hơn, để máy chủ gốc dành sức cho việc xử lý đơn hàng."},"points":[{"en":"Scrubs attack traffic before it reaches your origin","vi":"Lọc lưu lượng tấn công trước khi tới máy chủ gốc"},{"en":"CDN offloads images and static content at peak","vi":"CDN gánh hình ảnh và nội dung tĩnh lúc cao điểm"},{"en":"Stays up while real shoppers keep checking out","vi":"Hệ thống vẫn chạy khi khách thật tiếp tục thanh toán"}]},"scenario":{"en":"00:00, flash-sale night. Traffic jumps tenfold and nobody can tell shoppers from an attack while the checkout slows to a crawl.","vi":"0 giờ đêm flash sale. Lưu lượng tăng vọt và không ai phân biệt được khách mua với đợt tấn công, trong khi trang thanh toán chậm dần."},"scene":{"kind":"wave","capacity":{"en":"Checkout","vi":"Thanh toán"},"down":{"en":"Checkout down","vi":"Thanh toán lỗi"},"edge":{"en":"Edge nodes shield your storefront","vi":"Điểm biên che chắn website bán hàng"},"before":{"en":"Overloaded","vi":"Quá tải"},"after":{"en":"Selling","vi":"Vẫn bán hàng"}}},{"id":"bots-ato","persona":{"en":"Head of Digital & Customer Experience","vi":"Giám đốc Số & Trải nghiệm khách hàng"},"challenge":{"title":{"en":"Bots, Account Takeover and Promotion Abuse","vi":"Bot, chiếm tài khoản và lạm dụng khuyến mãi"},"body":{"en":"Credential-stuffing bots take over loyalty accounts and drain points, while scripts grab limited stock and vouchers before real customers can. Marketing budget leaks away and loyal shoppers complain.","vi":"Bot dò mật khẩu chiếm tài khoản thành viên và rút điểm thưởng, trong khi script vét sạch hàng giới hạn và voucher trước khi khách thật kịp mua. Ngân sách marketing thất thoát, khách hàng thân thiết phàn nàn."}},"solutions":["web-waf"],"response":{"title":{"en":"Stop automated abuse at the edge","vi":"Chặn lạm dụng tự động ngay từ lớp ngoài cùng"},"body":{"en":"A web application firewall inspects requests to login, cart and promotion endpoints, blocking injection attacks and abusive automation while letting genuine customers through.","vi":"Tường lửa ứng dụng web kiểm tra yêu cầu vào các điểm đăng nhập, giỏ hàng và khuyến mãi, chặn tấn công injection và tự động hóa lạm dụng nhưng vẫn cho khách thật đi qua."},"points":[{"en":"Protects login, cart and voucher endpoints","vi":"Bảo vệ đăng nhập, giỏ hàng và voucher"},{"en":"Blocks common web attacks such as SQL injection and XSS","vi":"Chặn tấn công web phổ biến như SQL injection, XSS"},{"en":"Rules tuned per campaign without code changes","vi":"Điều chỉnh luật theo từng chiến dịch, không sửa code"}]},"scenario":{"en":"Tuesday, 12:00. A limited voucher drop goes live and scripts empty the stock while loyal members find their points gone.","vi":"Thứ Ba, 12:00. Đợt voucher giới hạn vừa mở, script vét sạch hàng còn khách thân thiết thì phát hiện điểm thưởng đã bị rút."},"scene":{"kind":"gate","dest":{"en":"Login, cart & vouchers","vi":"Đăng nhập & giỏ hàng"},"src":{"en":"Web & app requests","vi":"Yêu cầu web & app"},"bad":[{"en":"Credential-stuffing bot","vi":"Bot dò mật khẩu"},{"en":"Voucher grab script","vi":"Script vét voucher"},{"en":"Points-drain login","vi":"Đăng nhập rút điểm"}],"good":[{"en":"Member login","vi":"Thành viên đăng nhập"},{"en":"Add to cart","vi":"Thêm vào giỏ hàng"},{"en":"Voucher redeem","vi":"Dùng voucher"}],"before":{"en":"Exposed","vi":"Phơi nhiễm"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"customer-data","persona":{"en":"Chief Compliance Officer / DPO","vi":"Giám đốc Tuân thủ / Cán bộ bảo vệ dữ liệu cá nhân"},"challenge":{"title":{"en":"Customer Data and Decree 13 Exposure","vi":"Dữ liệu khách hàng và rủi ro theo Nghị định 13"},"body":{"en":"Retailers hold phone numbers, addresses, purchase history and loyalty data across CRM, marketing agencies and store staff. Customer lists exported to personal email or USB are a common leak path, and Decree 13 puts the responsibility on you.","vi":"Doanh nghiệp bán lẻ nắm số điện thoại, địa chỉ, lịch sử mua hàng và dữ liệu thành viên rải khắp CRM, đối tác marketing và nhân viên cửa hàng. Danh sách khách hàng xuất ra email cá nhân hay USB là đường rò rỉ rất phổ biến, và Nghị định 13 đặt trách nhiệm lên doanh nghiệp."}},"solutions":["dlp"],"response":{"title":{"en":"Know where customer data goes","vi":"Biết dữ liệu khách hàng đang đi đâu"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives automatically detects customer records leaving the company, helping prevent insider leaks and supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ khách hàng bị đưa ra ngoài, giúp ngăn rò rỉ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects customer and loyalty records","vi":"Tự nhận diện dữ liệu khách hàng và thành viên"},{"en":"Evidence ready for audits","vi":"Bằng chứng sẵn sàng cho kiểm toán"}]},"scenario":{"en":"Friday, 17:40. A store manager exports the loyalty member list to a personal mailbox to work on it over the weekend.","vi":"Chiều thứ Sáu, 17:40. Một quản lý cửa hàng xuất danh sách hội viên sang hộp thư cá nhân để làm việc cuối tuần."},"scene":{"kind":"perimeter","asset":{"en":"Loyalty member list","vi":"Danh sách hội viên"},"channels":[{"en":"Chat apps","vi":"Ứng dụng chat","icon":"message-circle"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"payment-cloud","persona":{"en":"CFO / CIO","vi":"Giám đốc Tài chính / Giám đốc CNTT"},"challenge":{"title":{"en":"Payment Data, PCI DSS and Fragile Hosting","vi":"Dữ liệu thanh toán, PCI DSS và hạ tầng thiếu vững chắc"},"body":{"en":"Card and payment data raises PCI DSS obligations, and phishing mail aimed at finance and procurement teams is a standard route to fraudulent supplier payments. Hosting that cannot scale or keep data in-country adds cost and audit risk.","vi":"Dữ liệu thẻ và thanh toán kéo theo nghĩa vụ PCI DSS, còn email phishing nhắm vào kế toán, mua hàng là đường quen thuộc dẫn tới chuyển tiền nhầm cho nhà cung cấp giả mạo. Hạ tầng không co giãn được hoặc không giữ dữ liệu trong nước làm tăng chi phí và rủi ro kiểm toán."}},"solutions":["email-security"],"response":{"title":{"en":"Sovereign cloud with a protected inbox","vi":"Đám mây chủ quyền cùng hộp thư được bảo vệ"},"body":{"en":"VCLOUD hosts commerce workloads with data kept inside Vietnam, and advanced email defense filters phishing, spoofed supplier invoices and ransomware before they reach your teams.","vi":"VCLOUD lưu trữ hệ thống thương mại với dữ liệu nằm tại Việt Nam, còn bảo vệ email nâng cao lọc phishing, hóa đơn nhà cung cấp giả mạo và ransomware trước khi tới nhân viên."},"points":[{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"},{"en":"Filters fake supplier and payment requests","vi":"Lọc yêu cầu thanh toán, nhà cung cấp giả"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"}]},"scenario":{"en":"Month-end, 16:20. An email from a familiar supplier asks accounts payable to pay an invoice into a new bank account before the audit.","vi":"Cuối tháng, 16:20. Email từ một nhà cung cấp quen thuộc nhờ kế toán thanh toán hoá đơn vào tài khoản mới trước kỳ kiểm toán."},"scene":{"kind":"gate","dest":{"en":"Finance & AP inbox","vi":"Hộp thư kế toán"},"src":{"en":"Incoming email","vi":"Email gửi đến"},"bad":[{"en":"Fake supplier invoice","vi":"Hoá đơn NCC giả mạo"},{"en":"New bank account","vi":"Đổi tài khoản nhận tiền"},{"en":"Ransomware attachment","vi":"Tệp đính kèm ransomware"}],"good":[{"en":"Supplier statement","vi":"Đối chiếu công nợ NCC"},{"en":"Purchase order","vi":"Đơn đặt hàng"},{"en":"Auditor request","vi":"Thư từ kiểm toán"}],"before":{"en":"Exposed","vi":"Phơi nhiễm"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"contracts","persona":{"en":"Head of Legal & Procurement","vi":"Trưởng bộ phận Pháp chế & Mua hàng"},"challenge":{"title":{"en":"Supplier, Landlord and Platform Contracts at Scale","vi":"Hợp đồng nhà cung cấp, mặt bằng và sàn ở quy mô lớn"},"body":{"en":"A retail group manages hundreds of supplier, lease, marketplace and franchise contracts, plus changing rules on consumer protection and personal data. Manual review slows new store openings and vendor onboarding.","vi":"Một tập đoàn bán lẻ phải quản lý hàng trăm hợp đồng nhà cung cấp, thuê mặt bằng, sàn thương mại điện tử và nhượng quyền, cùng các quy định về bảo vệ người tiêu dùng và dữ liệu cá nhân luôn thay đổi. Rà soát thủ công làm chậm việc mở cửa hàng mới và đưa nhà cung cấp vào hệ thống."}},"solutions":["ai-legal"],"response":{"title":{"en":"Review contracts in minutes, not days","vi":"Rà soát hợp đồng trong vài phút thay vì vài ngày"},"body":{"en":"An AI legal assistant automates contract review and flags risky clauses, with an on-premise option so commercial terms and supplier pricing never leave your walls.","vi":"Trợ lý AI pháp lý tự động rà soát hợp đồng và đánh dấu điều khoản rủi ro, có tùy chọn on-premise để điều khoản thương mại và giá nhà cung cấp không rời khỏi hệ thống của bạn."},"points":[{"en":"Automated clause review","vi":"Tự động rà soát điều khoản"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal teams for high-value work","vi":"Giải phóng đội pháp chế cho việc giá trị cao"}]},"scenario":{"en":"Wednesday, 09:00. A lease for a new store and a stack of supplier contracts wait for legal review while the opening date is fixed.","vi":"Sáng thứ Tư, 9:00. Hợp đồng thuê mặt bằng cho cửa hàng mới và một chồng hợp đồng nhà cung cấp chờ pháp chế rà soát, trong khi ngày khai trương đã chốt."},"scene":{"kind":"scan","doc":{"en":"Store lease","vi":"Hợp đồng thuê mặt bằng"},"flags":[{"en":"Exclusivity clause","vi":"Cam kết độc quyền"},{"en":"Auto-renewal","vi":"Tự động gia hạn"},{"en":"Penalty terms","vi":"Điều khoản phạt"}],"timeBefore":{"en":"Days","vi":"Nhiều ngày"},"timeAfter":{"en":"Minutes","vi":"Vài phút"},"perDoc":{"en":"per contract review","vi":"mỗi lần rà soát"},"before":{"en":"Manual","vi":"Thủ công"},"after":{"en":"Automated","vi":"Tự động"}}}],"outcomes":[{"title":{"en":"Sell Without Interruption","vi":"Bán hàng không gián đoạn"},"body":{"en":"Keep the storefront and checkout available during the campaigns that matter most, protected from DDoS and automated abuse.","vi":"Giữ website và thanh toán luôn sẵn sàng trong những chiến dịch quan trọng nhất, được bảo vệ khỏi DDoS và lạm dụng tự động."}},{"title":{"en":"Protect Customer Trust and Compliance","vi":"Bảo vệ niềm tin khách hàng và tuân thủ"},"body":{"en":"Safeguard customer and payment data across email, users and infrastructure, and be ready for Decree 13 and PCI DSS expectations.","vi":"Bảo vệ dữ liệu khách hàng và thanh toán trên email, người dùng và hạ tầng, sẵn sàng cho yêu cầu của Nghị định 13 và PCI DSS."}},{"title":{"en":"Lower Risk and Operating Cost","vi":"Giảm rủi ro và chi phí vận hành"},"body":{"en":"One local partner for cloud, edge protection, data and legal automation reduces vendor sprawl, manual work and incident-response effort.","vi":"Một đối tác trong nước cho đám mây, bảo vệ lớp ngoài, dữ liệu và tự động hóa pháp chế giúp giảm số nhà cung cấp, công việc thủ công và nỗ lực ứng phó sự cố."}}],"faq":[{"q":{"en":"Do we need to move our e-commerce platform to protect it from DDoS?","vi":"Chúng tôi có cần chuyển hệ thống thương mại điện tử sang nơi khác để chống DDoS không?"},"a":{"en":"Not necessarily. Anti-DDoS and CDN protection sits in front of your existing site, wherever it is hosted. VCLOUD is available if you also want sovereign hosting inside Vietnam.","vi":"Không nhất thiết. Lớp chống DDoS và CDN đặt phía trước website hiện có, dù đang lưu trữ ở đâu. VCLOUD là lựa chọn bổ sung nếu bạn muốn lưu trữ chủ quyền tại Việt Nam."}},{"q":{"en":"Does this help with PCI DSS?","vi":"Giải pháp có hỗ trợ PCI DSS không?"},"a":{"en":"A web application firewall, data monitoring and secure hosting support several PCI DSS control areas. Certification itself depends on your whole payment environment and assessor, so we scope it with you.","vi":"Tường lửa ứng dụng web, giám sát dữ liệu và hạ tầng an toàn hỗ trợ nhiều nhóm kiểm soát của PCI DSS. Việc đạt chứng nhận phụ thuộc toàn bộ môi trường thanh toán và đơn vị đánh giá, nên chúng tôi cùng bạn xác định phạm vi."}},{"q":{"en":"How do we handle customer data under Decree 13?","vi":"Làm thế nào để xử lý dữ liệu khách hàng theo Nghị định 13?"},"a":{"en":"Data Loss Prevention discovers and monitors customer records leaving through chat, webmail and USB, and VCLOUD keeps data inside Vietnam, giving you evidence for audits and incident response.","vi":"Giải pháp chống thất thoát dữ liệu phát hiện và giám sát hồ sơ khách hàng đi ra qua chat, webmail, USB, còn VCLOUD giữ dữ liệu tại Việt Nam, giúp bạn có bằng chứng cho kiểm toán và ứng phó sự cố."}}],"newSolutions":[{"id":"anti-ddos-cdn","icon":"zap","name":"Anti-DDoS & CDN","tagline":{"en":"Stay online at peak traffic","vi":"Luôn trực tuyến khi lưu lượng đỉnh điểm"},"description":{"en":"Anti-DDoS filtering and content delivery network that absorb attack traffic and speed up content delivery, keeping storefronts and checkout available during flash sales and campaigns.","vi":"Lớp lọc chống DDoS và mạng phân phối nội dung (CDN) hấp thụ lưu lượng tấn công và tăng tốc phân phối nội dung, giữ website bán hàng và thanh toán sẵn sàng trong flash sale và các chiến dịch."}},{"id":"web-waf","icon":"shield","name":"Web Application Firewall","tagline":{"en":"Protect login, cart and checkout","vi":"Bảo vệ đăng nhập, giỏ hàng và thanh toán"},"description":{"en":"A web application firewall that blocks injection attacks and abusive automation against login, cart and promotion endpoints, supporting PCI DSS web-application controls.","vi":"Tường lửa ứng dụng web chặn tấn công injection và tự động hóa lạm dụng nhắm vào các điểm đăng nhập, giỏ hàng, khuyến mãi, hỗ trợ các kiểm soát ứng dụng web của PCI DSS."}}],"sources":["Decree 13/2023/ND-CP on personal data protection","PCI Security Standards Council, PCI DSS","Law on Cybersecurity 2018 (24/2018/QH14)","vnetwork.vn (not reachable from this environment; product names to be confirmed)"]}]};</script>

function setProgress() {

}
function bindStory() {

/* ---------------------------------------------------------------- auto-play: the story plays itself

function apRange() {

}
function apSpeed(y) {

function apStart() {

function apStop(finished = false) {

['wheel', 'touchstart', 'keydown', 'mousedown'].forEach((ev) => addEventListener(ev, (e) => {

/* adaptive quality: if the device can't hold ~30fps while the visitor scrolls, drop to "lite" (no backdrop blur / text blur) and remember it */
const setLite = (on, persist) => { document.documentElement.classList.toggle('lite', on); if (persist) store.set('vth-lite', on ? '1' : '0'); };
if (store.get('vth-lite') === '1' || navigator.connection?.saveData) setLite(true);
(function governor() {
  let last = 0, n = 0, sum = 0, skip = 6;

function bindForm() {
  const form = $('#lead'); if (!form) return;
  let mode = 'book';
  $$('.tabs button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    $$('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    $('#need-wrap').hidden = mode === 'brief';
    $('#send span').textContent = u(mode === 'brief' ? 'cta.sendBrief' : 'cta.sendBook');
  }));
  const validate = () => {
    let ok = true;
    $$('.field', form).forEach((f) => {
      const i = $('input,select', f); const em = $('.em', f);
      if (!i || !i.required) return;
      let msg = '';
      if (!i.value.trim()) msg = u('cta.required');
      else if (i.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.value)) msg = u('cta.badEmail');
      f.classList.toggle('err', !!msg); if (em) em.textContent = msg; if (msg) ok = false;

    if (!form.consent.checked) ok = false;

  };

    if (!validate()) { ($('.err input', form) || form.consent).focus(); return; }

    if (state.ctx) payload.context = { chapter: state.ctx.k + 1, title: state.ctx.title, solutions: state.ctx.sols };

/* ---------------------------------------------------------------- motion */
function initLenis() {

}
function countUp(el, tl, at) {

  if (!m) return;
  const target = parseFloat(m[2].replace(',', '.')); const dec = (m[2].split(/[.,]/)[1] || '').length;

}
function initMotion() {

    });

}
/* ---------------------------------------------------------------- lifecycle */

loadData().then(() => { render(); }).catch((e) => {
