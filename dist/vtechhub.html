"body":{"en":"Query-level access control and real-time masking let each role see only what care requires, and leave an audit trail for vendor and admin sessions, without slowing the HIS.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực giúp mỗi vai trò chỉ thấy phần dữ liệu cần cho điều trị, đồng thời lưu nhật ký cho phiên của nhà cung cấp và quản trị viên mà không làm chậm HIS."},"points":[{"en":"Proxy gateway restricts direct database access","vi":"Cổng proxy hạn chế truy cập trực tiếp CSDL"},{"en":"Patient identity and diagnosis masked for unauthorized users","vi":"Che danh tính và chẩn đoán với người không có quyền"},{"en":"Full audit trail of vendor and admin sessions","vi":"Nhật ký đầy đủ phiên của nhà cung cấp và quản trị viên"}]}},{"id":"leak","persona":{"en":"Data Protection Officer / Head of Compliance","vi":"Cán bộ bảo vệ dữ liệu / Trưởng phòng tuân thủ"},"challenge":{"title":{"en":"Patient Data Walking Out the Door","vi":"Dữ liệu bệnh nhân bị mang ra ngoài"},"body":{"en":"Lab reports sent by personal chat apps, files copied to USB drives, records forwarded to private webmail: well-meaning staff create leaks daily. Health data is sensitive data under Decree 13/2023, and reported cases of patient records offered for sale show the reputational cost.","vi":"Kết quả xét nghiệm gửi qua ứng dụng chat cá nhân, tệp chép ra USB, hồ sơ chuyển sang webmail riêng: nhân viên có thiện chí vẫn tạo ra rò rỉ mỗi ngày. Dữ liệu sức khỏe là dữ liệu nhạy cảm theo Nghị định 13/2023/NĐ-CP, và các vụ hồ sơ bệnh nhân bị rao bán được đưa tin cho thấy thiệt hại về uy tín."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive records wherever they try to leave","vi":"Thấy hồ sơ nhạy cảm ở mọi nơi chúng cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects patient records automatically, stops insider leaks and supports Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ bệnh nhân, ngăn rò rỉ từ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects patient and insurance records","vi":"Tự nhận diện hồ sơ bệnh nhân và bảo hiểm"},{"en":"Evidence ready for audits and incident reports","vi":"Bằng chứng sẵn sàng cho kiểm toán và báo cáo sự cố"}]}},{"id":"insurance-docs","persona":{"en":"Head of Health Insurance Claims / Legal","vi":"Trưởng bộ phận giám định bảo hiểm / Pháp chế"},"challenge":{"title":{"en":"Claims and Contracts Reviewed by Hand","vi":"Hợp đồng và hồ sơ bồi thường rà soát thủ công"},"body":{"en":"Insurance contracts, supplier agreements and consent forms must be read line by line against changing health, data and insurance rules. The backlog slows reimbursement and puts pressure on a small legal team.","vi":"Hợp đồng bảo hiểm, hợp đồng nhà cung cấp và mẫu đồng ý xử lý dữ liệu phải đọc từng điều khoản theo quy định y tế, dữ liệu và bảo hiểm luôn thay đổi. Tồn đọng làm chậm chi trả và tạo áp lực lên đội pháp chế vốn mỏng."}},"solutions":["ai-legal"],"response":{"title":{"en":"Review faster without moving documents out","vi":"Rà soát nhanh hơn mà không đưa tài liệu ra ngoài"},"body":{"en":"An AI assistant for contract and regulation review, with an on-premise option so sensitive documents stay inside your own environment. Regulatory coverage for health rules should be scoped with V-Tech Foundry during assessment.","vi":"Trợ lý AI rà soát hợp đồng và quy định, có tùy chọn on-premise để tài liệu nhạy cảm nằm trong hệ thống của bạn. Phạm vi quy định ngành y tế cần được xác nhận cùng V-Tech Foundry khi khảo sát."},"points":[{"en":"Automated contract and clause review","vi":"Tự động rà soát hợp đồng và điều khoản"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal staff for complex cases","vi":"Giải phóng pháp chế cho ca phức tạp"}]}},{"id":"sovereignty","persona":{"en":"CFO / Board Sponsor","vi":"Giám đốc Tài chính / Lãnh đạo phụ trách"},"challenge":{"title":{"en":"Compliance Cost and Data Residency","vi":"Chi phí tuân thủ và vị trí lưu trữ dữ liệu"},"body":{"en":"The Law on Data 2024, Decree 13 and the Law on Medical Examination and Treatment all raise expectations on how health data is stored and protected. Leaders want one accountable partner instead of five vendors, and a clear budget line.","vi":"Luật Dữ liệu 2024, Nghị định 13 và Luật Khám bệnh, chữa bệnh đều nâng yêu cầu về cách lưu trữ và bảo vệ dữ liệu sức khỏe. Ban lãnh đạo cần một đối tác chịu trách nhiệm thay vì năm nhà cung cấp, và một khoản ngân sách rõ ràng."}},"solutions":["email-security","dlp","database-security"],"response":{"title":{"en":"One integrated package, hosted in Vietnam","vi":"Một gói tích hợp, đặt tại Việt Nam"},"body":{"en":"Email defense, data-loss prevention and database security work together on VCLOUD infrastructure in Vietnam, giving one partner, one audit story and a predictable scope.","vi":"Bảo vệ email, chống thất thoát dữ liệu và bảo mật cơ sở dữ liệu phối hợp trên hạ tầng VCLOUD tại Việt Nam, với một đối tác, một câu chuyện kiểm toán và phạm vi dự toán rõ ràng."},"points":[{"en":"Single accountable partner","vi":"Một đối tác chịu trách nhiệm"},{"en":"Data hosted inside Vietnam","vi":"Dữ liệu đặt tại Việt Nam"},{"en":"Consistent evidence across layers","vi":"Bằng chứng nhất quán trên mọi lớp"}]}}],"outcomes":[{"title":{"en":"Keep Care Running","vi":"Giữ vận hành khám chữa bệnh liên tục"},"body":{"en":"Cut the most common entry points for ransomware so registration, labs and billing stay available to patients.","vi":"Giảm các cửa ngõ phổ biến của ransomware để tiếp đón, xét nghiệm và viện phí luôn sẵn sàng phục vụ người bệnh."}},{"title":{"en":"Protect Patient Trust","vi":"Bảo vệ niềm tin người bệnh"},"body":{"en":"Control who can see, copy or send patient records across email, devices and databases, with evidence for every access.","vi":"Kiểm soát ai được xem, sao chép hoặc gửi hồ sơ bệnh nhân qua email, thiết bị và cơ sở dữ liệu, có bằng chứng cho mọi lần truy cập."}},{"title":{"en":"Prepare for Compliance","vi":"Chuẩn bị cho tuân thủ"},"body":{"en":"Sovereign hosting and data controls help hospitals prepare for Decree 13, the Law on Data and sector audits.","vi":"Lưu trữ chủ quyền và các kiểm soát dữ liệu giúp bệnh viện chuẩn bị cho Nghị định 13, Luật Dữ liệu và các đợt kiểm tra ngành."}}],"faq":[{"q":{"en":"Is health data really treated as sensitive under Vietnamese law?","vi":"Dữ liệu sức khỏe có thực sự là dữ liệu nhạy cảm theo pháp luật Việt Nam?"},"a":{"en":"Yes. Decree 13/2023/NĐ-CP lists health and medical-record information as sensitive personal data, which requires stricter protection measures and impact assessment. Confirm exact obligations with your legal counsel.","vi":"Có. Nghị định 13/2023/NĐ-CP xếp thông tin sức khỏe, tình trạng bệnh án là dữ liệu cá nhân nhạy cảm, đòi hỏi biện pháp bảo vệ chặt chẽ hơn và đánh giá tác động xử lý dữ liệu. Nên xác nhận nghĩa vụ cụ thể với tư vấn pháp lý của đơn vị."}},{"q":{"en":"How do you protect the HIS and EMR database from vendor and admin accounts?","vi":"Làm sao bảo vệ CSDL HIS và bệnh án điện tử trước tài khoản nhà cung cấp và quản trị viên?"},"a":{"en":"Database Security restricts direct access through a proxy gateway, controls access per query, masks sensitive fields in real time and records every session for audit.","vi":"Giải pháp Bảo mật cơ sở dữ liệu hạn chế truy cập trực tiếp qua cổng proxy, kiểm soát theo từng truy vấn, che giấu trường nhạy cảm theo thời gian thực và ghi lại mọi phiên để kiểm toán."}},{"q":{"en":"Can patient data stay inside Vietnam?","vi":"Dữ liệu bệnh nhân có thể nằm hoàn toàn tại Việt Nam không?"},"a":{"en":"VCLOUD is hosted in Vietnam, and the AI Legal assistant offers an on-premise option for documents that must not leave your network.","vi":"VCLOUD đặt tại Việt Nam, và trợ lý AI Legal có tùy chọn on-premise cho tài liệu không được rời khỏi mạng nội bộ."}},{"q":{"en":"Where do we start if budget is limited?","vi":"Nên bắt đầu từ đâu nếu ngân sách hạn chế?"},"a":{"en":"Most hospitals start with email defense and the HIS database, the two most exposed layers, then add data-loss prevention. V-Tech Foundry can scope a phased plan.","vi":"Đa số bệnh viện bắt đầu từ bảo vệ email và CSDL HIS, hai lớp dễ bị tấn công nhất, rồi bổ sung chống thất thoát dữ liệu. V-Tech Foundry có thể xây dựng lộ trình theo giai đoạn."}}],"newSolutions":[],"sources":["https://vietnamnet.vn/nhieu-benh-vien-lon-bi-tan-cong-mang-du-lieu-benh-nhan-bi-rao-ban-2447913.html","https://redhotcyber.com/en/post/vietnam-hong-ngoc-hospital-on-breach-forums-112621-patient-and-doctor-profiles-compromised","Decree 13/2023/ND-CP (public text)","Law on Data 2024; Law on Medical Examination and Treatment 2023 (public text)"]},{"id":"logistics","order":6,"icon":"truck","name":{"en":"Logistics","vi":"Logistics - Vận tải - Kho vận"},"title":{"en":"Logistics: Freight Forwarding, Warehousing, Last Mile & Ports","vi":"Logistics: Giao nhận, Kho vận, Chặng cuối & Cảng"},"tagline":{"en":"VCLOUD & Email Security, Database Security, Data Loss Prevention and AI Legal & Compliance for supply chains that cannot stop moving.","vi":"VCLOUD & Email Security, Bảo mật cơ sở dữ liệu, Chống thất thoát dữ liệu và AI Legal & Compliance cho chuỗi cung ứng không được phép dừng."},"bundle":["email-security","database-security","dlp","ai-legal"],"regulations":["Decree 13","Cybersecurity Law","Data Law","Customs Law"],"challengesIntro":{"en":"Logistics runs on a chain of handoffs: shippers, forwarders, carriers, warehouses, ports, customs and drivers, all exchanging documents and payment instructions by email and apps. One forged invoice, one stalled tracking or WMS/TMS system, or one leaked customer list can stop cargo and cash at the same time.","vi":"Logistics vận hành bằng chuỗi bàn giao giữa chủ hàng, hãng giao nhận, hãng vận tải, kho, cảng, hải quan và tài xế, tất cả trao đổi chứng từ và chỉ thị thanh toán qua email và ứng dụng. Một hóa đơn giả, một hệ thống tracking hay WMS/TMS bị đình trệ, hoặc một danh sách khách hàng bị lộ đều có thể làm đứt cả dòng hàng lẫn dòng tiền."},"chapters":[{"id":"bec","persona":{"en":"CFO / Head of Finance","vi":"Giám đốc Tài chính (CFO) / Kế toán trưởng"},"challenge":{"title":{"en":"Fake Shipping and Invoice Emails Divert Payments","vi":"Email giả mạo hãng tàu, hóa đơn chuyển hướng thanh toán"},"body":{"en":"Forwarders handle a constant flow of freight invoices, booking confirmations and bank-detail updates. An email that imitates a carrier, agent or supplier and asks to pay a new account is easy to miss in a busy week, and a transfer is hard to recall once sent.","vi":"Doanh nghiệp giao nhận xử lý liên tục hóa đơn cước, xác nhận booking và thông báo đổi tài khoản ngân hàng. Một email giả danh hãng tàu, đại lý hay nhà cung cấp yêu cầu chuyển tiền sang tài khoản mới rất dễ lọt qua trong những tuần cao điểm, và khi tiền đã chuyển đi thì rất khó thu hồi."}},"solutions":["email-security"],"response":{"title":{"en":"Stop the fake request before finance sees it","vi":"Chặn yêu cầu giả trước khi đến tay kế toán"},"body":{"en":"Advanced email defense on VCLOUD filters phishing, executive and partner spoofing and ransomware before they reach employees, with data hosted inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD lọc phishing, giả mạo lãnh đạo và đối tác cùng ransomware trước khi tới nhân viên, dữ liệu được lưu trữ tại Việt Nam."},"points":[{"en":"Blocks spoofed invoices and payment-change requests","vi":"Chặn hóa đơn và yêu cầu đổi tài khoản giả mạo"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Pair with a call-back rule for any bank-detail change","vi":"Kết hợp quy tắc gọi xác minh với mọi thay đổi tài khoản"}]}},{"id":"uptime","persona":{"en":"CIO / Head of IT Operations","vi":"Giám đốc Công nghệ thông tin (CIO) / Trưởng vận hành IT"},"challenge":{"title":{"en":"Tracking, WMS and TMS Cannot Afford to Go Dark","vi":"Tracking, WMS và TMS không thể ngừng hoạt động"},"body":{"en":"When the tracking portal, warehouse system or transport management system is down, trucks queue, pickers idle and customers call for status. Ransomware or an unmanaged server across several depots and sites turns an IT problem into a delivery problem.","vi":"Khi cổng tracking, hệ thống kho hay hệ thống quản lý vận tải ngừng, xe phải xếp hàng chờ, nhân viên kho đứng chờ và khách hàng gọi hỏi tình trạng. Ransomware hoặc một máy chủ thiếu quản lý ở nhiều kho, nhiều điểm khiến sự cố IT trở thành sự cố giao hàng."}},"solutions":["email-security"],"response":{"title":{"en":"Run core systems on sovereign cloud, keep the front door clean","vi":"Vận hành hệ thống lõi trên đám mây chủ quyền, giữ cửa vào sạch"},"body":{"en":"VCLOUD hosts business-critical applications inside Vietnam, while email defense closes the most common route for ransomware into your sites. Sizing and service levels are agreed with your V-Tech Foundry team.","vi":"VCLOUD lưu trữ các ứng dụng trọng yếu ngay tại Việt Nam, còn bảo vệ email chặn đường xâm nhập phổ biến nhất của ransomware vào các điểm của bạn. Quy mô và mức dịch vụ được thống nhất cùng đội ngũ V-Tech Foundry."},"points":[{"en":"Sovereign cloud hosting in Vietnam","vi":"Đám mây chủ quyền đặt tại Việt Nam"},{"en":"Ransomware blocked at the mail gateway","vi":"Ransomware bị chặn tại cổng email"},{"en":"One provider for hosting and email security","vi":"Một đầu mối cho hạ tầng và bảo mật email"}]}},{"id":"core-data","persona":{"en":"Head of Warehouse / Transport Systems","vi":"Trưởng bộ phận Hệ thống Kho vận"},"challenge":{"title":{"en":"Too Many Hands on WMS and TMS Databases","vi":"Quá nhiều người có quyền trên CSDL WMS và TMS"},"body":{"en":"Administrators, developers, integration partners and customer-system vendors all touch order, inventory and rate data. Without query-level control, a privileged account can read tariffs, change a consignee or alter stock records without anyone noticing in time.","vi":"Quản trị viên, lập trình viên, đối tác tích hợp và nhà cung cấp hệ thống của khách hàng đều chạm vào dữ liệu đơn hàng, tồn kho và bảng giá. Thiếu kiểm soát mức truy vấn, một tài khoản đặc quyền có thể xem bảng giá, đổi người nhận hoặc sửa tồn kho mà không ai kịp phát hiện."}},"solutions":["database-security"],"response":{"title":{"en":"Every query controlled, sensitive fields masked","vi":"Mọi truy vấn được kiểm soát, trường nhạy cảm được che"},"body":{"en":"Query-level access control and real-time masking restrict who can see or change operational data, without slowing live order and dispatch transactions.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực hạn chế ai được xem hoặc sửa dữ liệu vận hành, mà không làm chậm giao dịch đơn hàng và điều phối trực tiếp."},"points":[{"en":"Proxy gateway limits direct database access","vi":"Cổng proxy hạn chế truy cập trực tiếp CSDL"},{"en":"Tariffs and customer details masked for unauthorized admins","vi":"Bảng giá, thông tin khách che với quản trị viên không có quyền"},{"en":"Audit trail of every change","vi":"Nhật ký kiểm toán mọi thay đổi"}]}},{"id":"partner-data","persona":{"en":"Chief Compliance / Data Protection Officer","vi":"Giám đốc Tuân thủ / Phụ trách bảo vệ dữ liệu"},"challenge":{"title":{"en":"Partner, Driver and Customer Data Leaking Out","vi":"Dữ liệu đối tác, tài xế và khách hàng bị thất thoát"},"body":{"en":"Consignee addresses and phone numbers, driver records, customer lists and rate cards circulate through chat apps, personal webmail, USB drives and partner apps. A departing sales or operations employee can take a customer base with them, and a leak raises Decree 13 questions.","vi":"Địa chỉ, số điện thoại người nhận, hồ sơ tài xế, danh sách khách hàng và bảng giá lưu chuyển qua ứng dụng chat, webmail cá nhân, USB và ứng dụng của đối tác. Nhân viên kinh doanh hay vận hành nghỉ việc có thể mang theo cả tệp khách hàng, và một vụ lộ dữ liệu kéo theo vấn đề tuân thủ Nghị định 13."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive data wherever it tries to leave","vi":"Thấy dữ liệu nhạy cảm ở mọi nơi nó cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects customer and personal records automatically, helping stop insider leaks and supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ khách hàng và dữ liệu cá nhân, giúp ngăn rò rỉ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects customer and personal data","vi":"Tự nhận diện dữ liệu khách hàng và cá nhân"},{"en":"Evidence ready for audits and disputes","vi":"Bằng chứng sẵn sàng cho kiểm toán và tranh chấp"}]}},{"id":"contracts","persona":{"en":"Head of Legal / Customs & Documentation","vi":"Trưởng bộ phận Pháp chế / Chứng từ & Hải quan"},"challenge":{"title":{"en":"Contracts and Customs Documents Reviewed by Hand","vi":"Hợp đồng và chứng từ hải quan rà soát thủ công"},"body":{"en":"Freight contracts, carrier and warehouse agreements, bills of lading and customs declarations all need careful checking for liability clauses, terms and inconsistencies. Manual review slows quoting and clearance, and errors can mean penalties or disputes.","vi":"Hợp đồng vận chuyển, hợp đồng với hãng tàu và kho, vận đơn và tờ khai hải quan đều cần kiểm tra kỹ điều khoản trách nhiệm, điều kiện và điểm không nhất quán. Rà soát thủ công làm chậm báo giá và thông quan, còn sai sót có thể dẫn tới phạt hoặc tranh chấp."}},"solutions":["ai-legal"],"response":{"title":{"en":"Faster first-pass review, with people in control","vi":"Rà soát vòng đầu nhanh hơn, con người vẫn quyết định"},"body":{"en":"A specialized AI assistant reviews contracts and regulatory documents to flag clauses and gaps for your legal team, with an on-premise option so commercial documents stay in your environment. Scope for logistics and customs content is confirmed with V-Tech Foundry during assessment.","vi":"Trợ lý AI chuyên biệt rà soát hợp đồng và văn bản quy định, đánh dấu điều khoản và điểm thiếu cho đội pháp chế, có tùy chọn on-premise để tài liệu thương mại nằm trong môi trường của bạn. Phạm vi áp dụng cho nội dung logistics và hải quan được xác nhận cùng V-Tech Foundry khi khảo sát."},"points":[{"en":"Automates routine contract review","vi":"Tự động hóa rà soát hợp đồng thường nhật"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal and documentation staff for exceptions","vi":"Giải phóng pháp chế và chứng từ cho các trường hợp ngoại lệ"}]}}],"outcomes":[{"title":{"en":"Protect Cash and Cargo Flow","vi":"Bảo vệ dòng tiền và dòng hàng"},"body":{"en":"Block fake invoices and ransomware at the email layer and keep core systems on sovereign cloud, so payments and shipments keep moving.","vi":"Chặn hóa đơn giả và ransomware ở lớp email, giữ hệ thống lõi trên đám mây chủ quyền để thanh toán và vận chuyển không bị gián đoạn."}},{"title":{"en":"Protect Customer, Partner and Driver Data","vi":"Bảo vệ dữ liệu khách hàng, đối tác và tài xế"},"body":{"en":"Control database access and monitor data leaving through chat, webmail and USB, reducing leak risk and helping prepare for Decree 13.","vi":"Kiểm soát truy cập CSDL và giám sát dữ liệu rời đi qua chat, webmail, USB, giảm rủi ro rò rỉ và giúp chuẩn bị cho Nghị định 13."}},{"title":{"en":"Cut Manual Document Work","vi":"Giảm công việc chứng từ thủ công"},"body":{"en":"Automate first-pass contract and document review so legal and operations teams spend time on exceptions, not routine checking.","vi":"Tự động hóa rà soát hợp đồng và chứng từ vòng đầu để đội pháp chế và vận hành tập trung vào ngoại lệ thay vì kiểm tra lặp lại."}}],"faq":[{"q":{"en":"How do we reduce the risk of paying a fake freight invoice?","vi":"Làm sao giảm rủi ro thanh toán nhầm hóa đơn cước giả?"},"a":{"en":"Email defense on VCLOUD filters spoofed carrier, partner and executive emails before they reach staff. We also recommend a process control: verify any bank-detail change by calling a known number.","vi":"Bảo vệ email trên VCLOUD lọc email giả danh hãng tàu, đối tác và lãnh đạo trước khi đến nhân viên. Chúng tôi cũng khuyến nghị thêm kiểm soát quy trình: mọi thay đổi tài khoản ngân hàng phải được xác minh qua số điện thoại đã biết."}},{"q":{"en":"Can we keep logistics data inside Vietnam?","vi":"Chúng tôi có thể giữ dữ liệu logistics trong nước không?"},"a":{"en":"Yes. VCLOUD hosts applications and email inside Vietnam, which supports data localization expectations under Vietnamese law. Your legal team should confirm the exact obligations for your data types.","vi":"Có. VCLOUD lưu trữ ứng dụng và email tại Việt Nam, đáp ứng kỳ vọng về lưu trữ dữ liệu trong nước theo pháp luật Việt Nam. Đội pháp chế nên xác nhận nghĩa vụ cụ thể cho từng loại dữ liệu của doanh nghiệp."}},{"q":{"en":"How is sensitive operational data protected from privileged admins and vendors?","vi":"Dữ liệu vận hành nhạy cảm được bảo vệ khỏi quản trị viên và nhà cung cấp có đặc quyền như thế nào?"},"a":{"en":"Database Security applies query-level access control, approval for sensitive changes and real-time masking, while DLP monitors chat, webmail and USB for customer and personal data leaving the company.","vi":"Bảo mật cơ sở dữ liệu áp dụng kiểm soát mức truy vấn, phê duyệt thay đổi nhạy cảm và che giấu thời gian thực, còn DLP giám sát chat, webmail, USB để phát hiện dữ liệu khách hàng và cá nhân bị đưa ra ngoài."}},{"q":{"en":"Does the AI Legal assistant handle customs documents?","vi":"Trợ lý AI Legal có xử lý chứng từ hải quan không?"},"a":{"en":"It is built for contract and regulatory document review. Coverage of customs and freight document types is scoped with V-Tech Foundry in a pilot, and an on-premise option keeps documents private.","vi":"Giải pháp được xây dựng cho rà soát hợp đồng và văn bản quy định. Phạm vi với các loại chứng từ hải quan và vận tải được xác định cùng V-Tech Foundry trong giai đoạn thử nghiệm, và tùy chọn on-premise giữ tài liệu riêng tư."}}],"newSolutions":[],"sources":["data/solutions.json (V-Tech Foundry solution registry)","data/industries/bfsi.json (structure reference)","Web research not performed; regulations cited by public name: Decree 13/2023/ND-CP, Law on Cybersecurity 2018, Law on Data 2024, Customs Law 54/2014/QH13"]},{"id":"manufacturing","order":5,"icon":"factory","name":{"en":"Manufacturing","vi":"Sản xuất"},"title":{"en":"Manufacturing & Industrial Supply Chain","vi":"Sản xuất & Chuỗi cung ứng công nghiệp"},"tagline":{"en":"VCLOUD & Email Security, Database Security and Data Loss Prevention to keep production lines running and designs protected.","vi":"VCLOUD & Email Security, Bảo mật cơ sở dữ liệu và Chống thất thoát dữ liệu để dây chuyền luôn chạy và bản thiết kế luôn an toàn."},"bundle":["email-security","database-security","dlp"],"regulations":["Decree 13","Cybersecurity Law","ISO 27001","Customer security audits"],"challengesIntro":{"en":"As factories connect machines, ERP and MES to the network and to suppliers, IT and operations are no longer separate worlds. For FDI plants and export suppliers, a single security incident can halt a line, expose product designs, or cost a contract when a customer audit finds gaps.","vi":"Khi máy móc, ERP và MES được kết nối vào mạng và với nhà cung cấp, IT và vận hành sản xuất không còn tách biệt. Với nhà máy FDI và doanh nghiệp xuất khẩu, một sự cố an ninh có thể dừng cả dây chuyền, lộ bản thiết kế hoặc làm mất đơn hàng khi khách hàng đánh giá phát hiện lỗ hổng."},"chapters":[{"id":"ransomware","persona":{"en":"CIO / Head of IT","vi":"Giám đốc CNTT"},"challenge":{"title":{"en":"Ransomware That Stops the Line","vi":"Ransomware làm dừng dây chuyền"},"body":{"en":"A single phishing email opened in the office network can spread to ERP and production systems. When orders cannot be processed and shipments are delayed, every hour of downtime turns into penalties and lost customer trust.","vi":"Chỉ một email phishing được mở trên mạng văn phòng cũng có thể lan sang ERP và hệ thống sản xuất. Khi đơn hàng không xử lý được và lô hàng trễ hạn, mỗi giờ ngừng trệ đều trở thành tiền phạt và mất niềm tin của khách hàng."}},"solutions":["email-security"],"response":{"title":{"en":"Stop the entry point before it reaches the office","vi":"Chặn cửa ngõ trước khi vào văn phòng"},"body":{"en":"Advanced email defense on VCLOUD blocks phishing, spoofed supplier invoices and ransomware at the gateway, while business data is hosted inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD chặn phishing, hóa đơn nhà cung cấp giả mạo và ransomware ngay tại cổng, trong khi dữ liệu doanh nghiệp được lưu trữ tại Việt Nam."},"points":[{"en":"Blocks phishing and executive or supplier spoofing","vi":"Chặn phishing, giả mạo lãnh đạo và nhà cung cấp"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"}]}},{"id":"ip-leak","persona":{"en":"CTO / Head of R&D","vi":"Giám đốc Công nghệ / Trưởng R&D"},"challenge":{"title":{"en":"Designs and Formulas Walking Out the Door","vi":"Bản thiết kế, công thức bị mang ra ngoài"},"body":{"en":"CAD files, process recipes and BOMs are the core value of a plant. They can leave through USB drives, personal webmail or chat apps, whether by a departing engineer or by an honest mistake.","vi":"File CAD, công thức quy trình và BOM là giá trị cốt lõi của nhà máy. Chúng có thể rời đi qua USB, webmail cá nhân hoặc ứng dụng chat, do kỹ sư nghỉ việc hoặc chỉ vì sơ suất."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive files wherever they try to leave","vi":"Thấy file nhạy cảm ở mọi nơi chúng cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects sensitive documents automatically and stops leaks before they reach a competitor.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện tài liệu nhạy cảm và ngăn rò rỉ trước khi tới tay đối thủ."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects sensitive documents","vi":"Tự nhận diện tài liệu nhạy cảm"},{"en":"Evidence trail for investigations","vi":"Bằng chứng phục vụ điều tra"}]}},{"id":"erp-data","persona":{"en":"Head of ERP / MES & DBA","vi":"Trưởng bộ phận ERP / MES & DBA"},"challenge":{"title":{"en":"ERP and MES Data Open to Too Many Hands","vi":"Dữ liệu ERP và MES quá nhiều người chạm tới"},"body":{"en":"Production plans, costs, pricing and customer orders sit in ERP and MES databases that administrators, developers and integrators can reach directly. Without query-level control, a mistake or misuse may go unnoticed.","vi":"Kế hoạch sản xuất, giá thành, báo giá và đơn hàng nằm trong CSDL ERP, MES mà quản trị viên, lập trình viên và đơn vị tích hợp có thể truy cập trực tiếp. Thiếu kiểm soát mức truy vấn, sai sót hoặc lạm quyền có thể không bị phát hiện."}},"solutions":["database-security"],"response":{"title":{"en":"Every query seen, every sensitive field masked","vi":"Mọi truy vấn đều được thấy, trường nhạy cảm đều được che"},"body":{"en":"Query-level access control and real-time data masking protect ERP and MES data without slowing live operations.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực bảo vệ dữ liệu ERP, MES mà không làm chậm vận hành."},"points":[{"en":"Restricts direct database access","vi":"Hạn chế truy cập trực tiếp vào CSDL"},{"en":"Masks costs and pricing from unauthorized admins","vi":"Che giá thành, báo giá với quản trị viên không có quyền"},{"en":"Audit trail for every change","vi":"Nhật ký kiểm toán mọi thay đổi"}]}},{"id":"vendor-access","persona":{"en":"Head of IT Infrastructure","vi":"Trưởng bộ phận Hạ tầng CNTT"},"challenge":{"title":{"en":"Remote Vendors with Standing Access","vi":"Nhà cung cấp truy cập từ xa thường trực"},"body":{"en":"Machine makers, system integrators and software vendors often need remote access to support the plant. Broad, long-lived access to databases turns a third party into the weakest link.","vi":"Hãng máy, đơn vị tích hợp và nhà cung cấp phần mềm thường cần truy cập từ xa để hỗ trợ nhà máy. Quyền truy cập rộng và kéo dài vào cơ sở dữ liệu biến bên thứ ba thành mắt xích yếu nhất."}},"solutions":["database-security","email-security"],"response":{"title":{"en":"Give vendors a controlled door, not a key","vi":"Cho nhà cung cấp một cửa có kiểm soát, không phải chìa khóa"},"body":{"en":"Vendor sessions to databases go through a controlled gateway with approval for sensitive actions, while mail defense filters the invoices and attachments that vendors send in.","vi":"Phiên truy cập CSDL của nhà cung cấp đi qua cổng kiểm soát với phê duyệt cho thao tác nhạy cảm, còn lớp bảo vệ email lọc hóa đơn và tệp đính kèm họ gửi đến."},"points":[{"en":"Approval workflow for sensitive actions","vi":"Quy trình phê duyệt cho thao tác nhạy cảm"},{"en":"Full record of what vendors did","vi":"Ghi lại đầy đủ những gì nhà cung cấp đã làm"},{"en":"Filters inbound vendor attachments","vi":"Lọc tệp đính kèm từ nhà cung cấp"}]}},{"id":"audit","persona":{"en":"CFO / Compliance Lead","vi":"Giám đốc Tài chính / Trưởng Tuân thủ"},"challenge":{"title":{"en":"Customer and Supplier Security Audits","vi":"Đánh giá an ninh từ khách hàng và đối tác"},"body":{"en":"Global customers increasingly audit the security of their suppliers, and Vietnamese law sets duties for personal data and cybersecurity. Failing an audit can put orders at risk, and gaps are costly to fix under time pressure.","vi":"Khách hàng toàn cầu ngày càng đánh giá an ninh của nhà cung cấp, đồng thời pháp luật Việt Nam quy định nghĩa vụ về dữ liệu cá nhân và an ninh mạng. Không đạt đánh giá có thể ảnh hưởng đơn hàng, và khắc phục gấp rất tốn kém."}},"solutions":["dlp","email-security","database-security"],"response":{"title":{"en":"Controls and evidence ready when the auditor arrives","vi":"Kiểm soát và bằng chứng sẵn sàng khi đoàn đánh giá đến"},"body":{"en":"Data monitoring, database access control and in-country hosting give you documented controls and logs to show customers and prepare for Decree 13 and ISO 27001-style requirements.","vi":"Giám sát dữ liệu, kiểm soát truy cập CSDL và lưu trữ trong nước giúp bạn có các biện pháp kiểm soát và nhật ký được ghi nhận để trình khách hàng, chuẩn bị cho Nghị định 13 và các yêu cầu theo ISO 27001."},"points":[{"en":"Logs and evidence on demand","vi":"Nhật ký và bằng chứng khi cần"},{"en":"Data stays in Vietnam on VCLOUD","vi":"Dữ liệu ở lại Việt Nam trên VCLOUD"},{"en":"One integrated package, one partner","vi":"Một gói tích hợp, một đối tác"}]}}],"outcomes":[{"title":{"en":"Keep Production Running","vi":"Giữ sản xuất vận hành liên tục"},"body":{"en":"Block the most common entry points for ransomware and control access to core systems to reduce the risk of line stoppages.","vi":"Chặn các cửa ngõ phổ biến của ransomware và kiểm soát truy cập vào hệ thống lõi để giảm nguy cơ dừng dây chuyền."}},{"title":{"en":"Protect Intellectual Property","vi":"Bảo vệ tài sản trí tuệ"},"body":{"en":"Keep designs, formulas and cost data from leaving through users, vendors or databases.","vi":"Ngăn bản thiết kế, công thức và dữ liệu giá thành rời đi qua người dùng, nhà cung cấp hoặc cơ sở dữ liệu."}},{"title":{"en":"Win and Keep Customers","vi":"Giành và giữ khách hàng"},"body":{"en":"Show documented controls and evidence in customer audits and prepare for data protection requirements in Vietnam.","vi":"Chứng minh các biện pháp kiểm soát và bằng chứng trong đánh giá của khách hàng, đồng thời chuẩn bị cho yêu cầu bảo vệ dữ liệu tại Việt Nam."}}],"faq":[{"q":{"en":"Do we need to replace our existing ERP or MES?","vi":"Chúng tôi có phải thay ERP hoặc MES hiện có không?"},"a":{"en":"No. Database security and data monitoring sit around your existing systems. Scope and integration are assessed with the V-Tech Foundry team for each plant.","vi":"Không. Bảo mật cơ sở dữ liệu và giám sát dữ liệu được đặt quanh hệ thống hiện có. Phạm vi và cách tích hợp được đánh giá cùng đội ngũ V-Tech Foundry cho từng nhà máy."}},{"q":{"en":"Can this help with customer security questionnaires and audits?","vi":"Giải pháp có hỗ trợ bảng câu hỏi và đợt đánh giá an ninh của khách hàng không?"},"a":{"en":"It provides access controls, monitoring and logs that you can document as evidence. Certification outcomes depend on your overall program.","vi":"Giải pháp cung cấp kiểm soát truy cập, giám sát và nhật ký để bạn làm bằng chứng. Kết quả chứng nhận còn phụ thuộc vào chương trình an ninh tổng thể của doanh nghiệp."}},{"q":{"en":"How do we handle remote access by machine and software vendors?","vi":"Làm sao quản lý truy cập từ xa của hãng máy và nhà cung cấp phần mềm?"},"a":{"en":"Database access is routed through a controlled gateway with approval for sensitive queries and a full audit trail, so vendors get only what they need.","vi":"Truy cập CSDL được đi qua cổng kiểm soát với phê duyệt cho truy vấn nhạy cảm và nhật ký kiểm toán đầy đủ, nhà cung cấp chỉ nhận đúng quyền cần thiết."}}],"newSolutions":[],"sources":["Web access to vnetwork.vn was blocked; copy is based on existing V-Tech Foundry solution registry and BFSI example. Regulation references: Law on Cybersecurity 2018, Decree 13/2023/ND-CP."]},{"id":"media","order":7,"icon":"clapperboard","name":{"en":"Media & Digital Content","vi":"Truyền thông & Nội dung số"},"title":{"en":"Media & Digital Content: News, Streaming, Publishing and Gaming","vi":"Truyền thông & Nội dung số: Báo điện tử, Streaming, Xuất bản và Game"},"tagline":{"en":"CDN and Anti-DDoS/WAF for live events, Email Security on VCLOUD, Data Loss Prevention for content and subscriber data, and AI Legal for contract review.","vi":"CDN và Anti-DDoS/WAF cho sự kiện trực tiếp, Email Security trên VCLOUD, Chống thất thoát dữ liệu cho nội dung và dữ liệu thuê bao, cùng AI Legal rà soát hợp đồng."},"bundle":["cdn","anti-ddos-waf","email-security","dlp","ai-legal"],"regulations":["Decree 13","Law on Cybersecurity","Intellectual Property Law"],"challengesIntro":{"en":"For media businesses, the audience arrives all at once: a live match, a breaking story or a premiere can multiply traffic within minutes, and attackers know it. Meanwhile unreleased content, editorial accounts and subscriber data are valuable targets. Leadership must keep the platform fast, trusted and compliant at the moments that matter most.","vi":"Với doanh nghiệp truyền thông, khán giả thường đổ về cùng một lúc: một trận đấu trực tiếp, một tin nóng hay một buổi ra mắt có thể làm lưu lượng tăng vọt chỉ trong vài phút, và tin tặc cũng biết điều đó. Trong khi đó, nội dung chưa công bố, tài khoản biên tập và dữ liệu thuê bao là mục tiêu giá trị. Ban lãnh đạo cần giữ nền tảng nhanh, đáng tin và tuân thủ đúng vào những thời điểm quan trọng nhất."},"chapters":[{"id":"live-ddos","persona":{"en":"CTO / Head of Platform","vi":"Giám đốc Công nghệ / Trưởng bộ phận Nền tảng"},"challenge":{"title":{"en":"Traffic Spikes and DDoS During Live Events","vi":"Lưu lượng tăng vọt và tấn công DDoS trong sự kiện trực tiếp"},"body":{"en":"A live broadcast or breaking-news peak is exactly when the site must not fail. Genuine surges and malicious floods look alike, and downtime during the event means lost viewers, advertisers and brand trust.","vi":"Phát sóng trực tiếp hay đỉnh tin nóng chính là lúc hệ thống không được phép gián đoạn. Lượng truy cập thật tăng đột biến và lưu lượng tấn công trông rất giống nhau; website sập đúng lúc sự kiện đồng nghĩa mất người xem, nhà quảng cáo và uy tín thương hiệu."}},"solutions":["anti-ddos-waf"],"response":{"title":{"en":"Absorb the flood, keep the show on air","vi":"Hấp thụ đòn tấn công, giữ chương trình lên sóng"},"body":{"en":"Anti-DDoS filtering separates real viewers from attack traffic before it reaches your origin, so the platform stays available through the peak.","vi":"Lớp chống DDoS lọc tách người xem thật khỏi lưu lượng tấn công trước khi chạm tới máy chủ gốc, giúp nền tảng luôn sẵn sàng suốt giờ cao điểm."},"points":[{"en":"Filters attack traffic away from the origin","vi":"Lọc lưu lượng tấn công trước khi tới máy chủ gốc"},{"en":"Keeps legitimate viewers connected","vi":"Giữ kết nối cho người xem hợp lệ"},{"en":"Plan capacity ahead of major events","vi":"Chuẩn bị năng lực trước các sự kiện lớn"}]}},{"id":"latency","persona":{"en":"Head of Streaming / Digital Product","vi":"Trưởng bộ phận Streaming / Sản phẩm số"},"challenge":{"title":{"en":"Slow Delivery and Buffering for Viewers","vi":"Tải chậm và giật lag với người xem"},"body":{"en":"Viewers leave quickly when video buffers or pages load slowly, especially on mobile and across provinces. Serving everything from a single origin raises cost and degrades experience as the audience grows.","vi":"Người xem rời đi rất nhanh khi video giật hoặc trang tải chậm, nhất là trên di động và ở các tỉnh thành. Phục vụ mọi thứ từ một máy chủ gốc vừa đẩy chi phí lên vừa làm trải nghiệm xấu đi khi lượng người xem tăng."}},"solutions":["cdn"],"response":{"title":{"en":"Bring content closer to the audience","vi":"Đưa nội dung đến gần khán giả hơn"},"body":{"en":"A CDN caches and delivers video, images and pages from edge locations, reducing load on your origin and improving speed for users in Vietnam.","vi":"CDN lưu đệm và phân phối video, hình ảnh, trang web từ các điểm biên, giảm tải cho máy chủ gốc và cải thiện tốc độ cho người dùng tại Việt Nam."},"points":[{"en":"Caches video, images and web assets at the edge","vi":"Lưu đệm video, hình ảnh và tài nguyên web tại điểm biên"},{"en":"Lightens the load on origin servers","vi":"Giảm tải cho máy chủ gốc"},{"en":"Works together with Anti-DDoS protection","vi":"Kết hợp cùng lớp chống DDoS"}]}},{"id":"takeover","persona":{"en":"Editor-in-Chief / Head of IT Security","vi":"Tổng biên tập / Trưởng bộ phận An ninh thông tin"},"challenge":{"title":{"en":"Site Defacement and Account Takeover","vi":"Deface website và chiếm quyền tài khoản"},"body":{"en":"A defaced homepage or a hijacked editorial or social account can publish false content under your brand within minutes. Attackers often get in through a phishing email to a journalist or admin, or through a web application flaw.","vi":"Trang chủ bị deface hay tài khoản biên tập, mạng xã hội bị chiếm quyền có thể đăng tin sai lệch dưới tên thương hiệu của bạn chỉ trong vài phút. Tin tặc thường vào qua email phishing gửi phóng viên, quản trị viên, hoặc qua lỗ hổng ứng dụng web."}},"solutions":["anti-ddos-waf","email-security"],"response":{"title":{"en":"Protect the front door and the inbox","vi":"Bảo vệ cả cổng web và hộp thư"},"body":{"en":"A web application firewall blocks common attacks on the CMS and portal, while email defense on VCLOUD stops the phishing that steals editorial credentials.","vi":"Tường lửa ứng dụng web chặn các đòn tấn công phổ biến vào CMS và cổng thông tin, còn bảo vệ email trên VCLOUD chặn phishing đánh cắp thông tin đăng nhập của bộ phận biên tập."},"points":[{"en":"WAF shields the CMS and portal from web attacks","vi":"WAF che chắn CMS và cổng thông tin khỏi tấn công web"},{"en":"Blocks phishing aimed at newsroom accounts","vi":"Chặn phishing nhắm vào tài khoản tòa soạn"},{"en":"Hosting inside Vietnam on VCLOUD","vi":"Lưu trữ tại Việt Nam trên VCLOUD"}]}},{"id":"leaks","persona":{"en":"Chief Content Officer / Head of Production","vi":"Giám đốc Nội dung / Trưởng bộ phận Sản xuất"},"challenge":{"title":{"en":"Pre-release Leaks and Content Piracy","vi":"Rò rỉ nội dung trước ngày phát hành và vi phạm bản quyền"},"body":{"en":"Unreleased episodes, scripts, game builds or exclusive stories move between production partners, freelancers and staff. One copy sent to personal webmail, chat or a USB drive can destroy the value of a premiere.","vi":"Tập phim chưa phát hành, kịch bản, bản build game hay tin độc quyền luân chuyển giữa đối tác sản xuất, cộng tác viên và nhân viên. Chỉ một bản sao gửi qua webmail cá nhân, ứng dụng chat hay USB cũng đủ làm mất giá trị của buổi ra mắt."}},"solutions":["dlp"],"response":{"title":{"en":"Know where pre-release content goes","vi":"Biết nội dung chưa phát hành đi về đâu"},"body":{"en":"Data loss prevention monitors chat apps, personal webmail and USB drives, detects sensitive files and leaves an audit trail to stop insider leaks.","vi":"Giải pháp chống thất thoát dữ liệu giám sát ứng dụng chat, webmail cá nhân và USB, nhận diện tệp nhạy cảm và lưu vết kiểm toán để ngăn rò rỉ từ bên trong."},"points":[{"en":"Covers chat, webmail and USB channels","vi":"Bao phủ chat, webmail và USB"},{"en":"Detects sensitive files automatically","vi":"Tự động nhận diện tệp nhạy cảm"},{"en":"Evidence trail for investigations","vi":"Dấu vết bằng chứng phục vụ điều tra"}]}},{"id":"data-legal","persona":{"en":"CFO / Head of Legal & Data Protection","vi":"Giám đốc Tài chính / Trưởng bộ phận Pháp chế & Bảo vệ dữ liệu"},"challenge":{"title":{"en":"Subscriber Data and Copyright Contract Load","vi":"Dữ liệu thuê bao và khối lượng hợp đồng bản quyền"},"body":{"en":"Subscriptions, payments and viewing habits make subscriber data subject to Decree 13, while licensing, talent and distribution contracts pile up for legal to review. Slow reviews delay deals, and a data incident hurts trust and finances.","vi":"Đăng ký, thanh toán và thói quen xem khiến dữ liệu thuê bao thuộc phạm vi Nghị định 13, trong khi hợp đồng bản quyền, nghệ sĩ và phát hành dồn về pháp chế. Rà soát chậm làm trễ thương vụ, còn sự cố dữ liệu ảnh hưởng đến niềm tin và tài chính."}},"solutions":["ai-legal","dlp","email-security"],"response":{"title":{"en":"Faster contract review, safer subscriber data","vi":"Rà soát hợp đồng nhanh hơn, dữ liệu thuê bao an toàn hơn"},"body":{"en":"An AI assistant supports first-pass contract review with an on-premise option, while DLP and sovereign VCLOUD hosting help keep subscriber data under control inside Vietnam.","vi":"Trợ lý AI hỗ trợ rà soát hợp đồng bước đầu, có tùy chọn on-premise; DLP và lưu trữ chủ quyền trên VCLOUD giúp kiểm soát dữ liệu thuê bao ngay tại Việt Nam."},"points":[{"en":"AI-assisted first-pass contract review","vi":"AI hỗ trợ rà soát hợp đồng bước đầu"},{"en":"On-premise option keeps documents private","vi":"Tùy chọn on-premise giữ tài liệu riêng tư"},{"en":"Detects subscriber records leaving the company","vi":"Phát hiện hồ sơ thuê bao rời khỏi doanh nghiệp"}]}}],"outcomes":[{"title":{"en":"Stay Online When It Counts","vi":"Luôn trực tuyến vào lúc quan trọng"},"body":{"en":"Combine CDN and Anti-DDoS/WAF so live events, premieres and breaking news run smoothly and your site resists attack.","vi":"Kết hợp CDN và Anti-DDoS/WAF để sự kiện trực tiếp, ngày ra mắt và tin nóng vận hành mượt mà, website đủ sức chống tấn công."}},{"title":{"en":"Protect Content and Brand Trust","vi":"Bảo vệ nội dung và uy tín thương hiệu"},"body":{"en":"Reduce the risk of leaks, hijacked accounts and defaced pages that damage your editorial credibility and content value.","vi":"Giảm rủi ro rò rỉ, chiếm tài khoản và deface làm tổn hại uy tín biên tập cũng như giá trị nội dung."}},{"title":{"en":"Compliance and Efficiency","vi":"Tuân thủ và hiệu quả vận hành"},"body":{"en":"Keep subscriber data in Vietnam on VCLOUD, support Decree 13 readiness and free legal teams from routine contract review.","vi":"Lưu trữ dữ liệu thuê bao tại Việt Nam trên VCLOUD, hỗ trợ chuẩn bị tuân thủ Nghị định 13 và giải phóng pháp chế khỏi rà soát hợp đồng thường nhật."}}],"faq":[{"q":{"en":"Why combine CDN and Anti-DDoS rather than buy them separately?","vi":"Vì sao nên kết hợp CDN và Anti-DDoS thay vì mua riêng?"},"a":{"en":"A CDN speeds up delivery and absorbs legitimate load, while Anti-DDoS filters malicious traffic. Together, with one partner, they keep the platform fast and available during peaks.","vi":"CDN tăng tốc phân phối và gánh tải hợp lệ, còn Anti-DDoS lọc lưu lượng độc hại. Khi kết hợp cùng một đối tác, nền tảng vừa nhanh vừa sẵn sàng trong giờ cao điểm."}},{"q":{"en":"How can we reduce the risk of pre-release content leaking?","vi":"Làm sao giảm rủi ro rò rỉ nội dung trước ngày phát hành?"},"a":{"en":"Use DLP to monitor chat, personal webmail and USB channels, detect sensitive files and keep an audit trail, alongside access policies for production partners.","vi":"Dùng DLP giám sát kênh chat, webmail cá nhân và USB, nhận diện tệp nhạy cảm và lưu vết kiểm toán, kết hợp chính sách truy cập cho đối tác sản xuất."}},{"q":{"en":"Is subscriber data covered by Vietnamese data protection rules?","vi":"Dữ liệu thuê bao có thuộc quy định bảo vệ dữ liệu của Việt Nam không?"},"a":{"en":"Yes. Decree 13 on personal data protection applies to subscriber information. Hosting in Vietnam and controlling data movement help you prepare; confirm obligations with your legal counsel.","vi":"Có. Nghị định 13 về bảo vệ dữ liệu cá nhân áp dụng cho thông tin thuê bao. Lưu trữ tại Việt Nam và kiểm soát luồng dữ liệu giúp bạn chuẩn bị; nên xác nhận nghĩa vụ cụ thể với cố vấn pháp lý."}}],"newSolutions":[{"id":"anti-ddos-waf","icon":"shield-alert","name":"Anti-DDoS & WAF","tagline":{"en":"Keep sites up under attack","vi":"Giữ website hoạt động khi bị tấn công"},"description":{"en":"Filters DDoS floods and blocks web application attacks so portals, streaming and content platforms stay available and uncompromised.","vi":"Lọc tấn công DDoS và chặn tấn công ứng dụng web để cổng thông tin, streaming và nền tảng nội dung luôn sẵn sàng và không bị xâm nhập."}}],"sources":["Web access to vnetwork.vn blocked in this environment; based on data/solutions.json and general public knowledge that VNETWORK offers CDN and Anti-DDoS/WAF (verify product names/scope with VNETWORK)"]},{"id":"retail","order":4,"icon":"shopping-bag","name":{"en":"Retail & E-Commerce","vi":"Bán lẻ & Thương mại điện tử"},"title":{"en":"Retail & E-Commerce","vi":"Bán lẻ & Thương mại điện tử"},"tagline":{"en":"Anti-DDoS & CDN, Web Application Firewall, sovereign VCLOUD, Data Loss Prevention and AI Legal & Compliance for always-on selling.","vi":"Chống DDoS & CDN, tường lửa ứng dụng web, VCLOUD chủ quyền, chống thất thoát dữ liệu và AI Legal & Compliance để bán hàng không gián đoạn."},"bundle":["anti-ddos-cdn","web-waf","email-security","dlp","ai-legal"],"regulations":["Decree 13","PCI DSS","Law on Cybersecurity","Law on Consumer Protection"],"challengesIntro":{"en":"Retail revenue now concentrates into a few high-stakes moments: flash sales, double-date campaigns and holiday peaks. In those hours a slow page, a failed checkout or a leaked customer list turns directly into lost revenue and lost trust, while attackers and bots target exactly the same moments.","vi":"Doanh thu bán lẻ ngày càng dồn vào vài thời điểm quyết định: flash sale, các đợt khuyến mãi ngày đôi và mùa lễ. Chỉ cần trang web chậm, thanh toán lỗi hoặc danh sách khách hàng bị lộ trong những giờ đó là mất doanh thu và niềm tin ngay lập tức, trong khi tin tặc và bot cũng nhắm đúng vào các thời điểm này."},"chapters":[{"id":"peak-ddos","persona":{"en":"CTO / Head of E-Commerce Platform","vi":"CTO / Giám đốc nền tảng thương mại điện tử"},"challenge":{"title":{"en":"Peak-Sale Traffic and DDoS Attacks","vi":"Lưu lượng đỉnh điểm và tấn công DDoS ngày sale"},"body":{"en":"At midnight on a flash-sale day, traffic spikes tenfold. It is hard to tell real shoppers from a DDoS attack aimed at taking you offline while a competitor's campaign runs. Every minute of downtime is lost orders and wasted ad spend.","vi":"Đúng 0 giờ ngày flash sale, lưu lượng tăng vọt gấp nhiều lần. Rất khó phân biệt khách mua thật với một đợt DDoS nhằm đánh sập hệ thống đúng lúc đối thủ chạy chiến dịch. Mỗi phút gián đoạn là đơn hàng mất đi và ngân sách quảng cáo đổ bỏ."}},"solutions":["anti-ddos-cdn"],"response":{"title":{"en":"Absorb the attack, keep selling","vi":"Hấp thụ tấn công, bán hàng không ngừng"},"body":{"en":"Anti-DDoS filtering and a CDN sit in front of your storefront, scrubbing malicious traffic and serving images and static content closer to shoppers so the origin stays free for orders.","vi":"Lớp chống DDoS và CDN đặt trước website bán hàng, lọc lưu lượng độc hại và phân phối hình ảnh, nội dung tĩnh gần người mua hơn, để máy chủ gốc dành sức cho việc xử lý đơn hàng."},"points":[{"en":"Scrubs attack traffic before it reaches your origin","vi":"Lọc lưu lượng tấn công trước khi tới máy chủ gốc"},{"en":"CDN offloads images and static content at peak","vi":"CDN gánh hình ảnh và nội dung tĩnh lúc cao điểm"},{"en":"Stays up while real shoppers keep checking out","vi":"Hệ thống vẫn chạy khi khách thật tiếp tục thanh toán"}]}},{"id":"bots-ato","persona":{"en":"Head of Digital & Customer Experience","vi":"Giám đốc Số & Trải nghiệm khách hàng"},"challenge":{"title":{"en":"Bots, Account Takeover and Promotion Abuse","vi":"Bot, chiếm tài khoản và lạm dụng khuyến mãi"},"body":{"en":"Credential-stuffing bots take over loyalty accounts and drain points, while scripts grab limited stock and vouchers before real customers can. Marketing budget leaks away and loyal shoppers complain.","vi":"Bot dò mật khẩu chiếm tài khoản thành viên và rút điểm thưởng, trong khi script vét sạch hàng giới hạn và voucher trước khi khách thật kịp mua. Ngân sách marketing thất thoát, khách hàng thân thiết phàn nàn."}},"solutions":["web-waf"],"response":{"title":{"en":"Stop automated abuse at the edge","vi":"Chặn lạm dụng tự động ngay từ lớp ngoài cùng"},"body":{"en":"A web application firewall inspects requests to login, cart and promotion endpoints, blocking injection attacks and abusive automation while letting genuine customers through.","vi":"Tường lửa ứng dụng web kiểm tra yêu cầu vào các điểm đăng nhập, giỏ hàng và khuyến mãi, chặn tấn công injection và tự động hóa lạm dụng nhưng vẫn cho khách thật đi qua."},"points":[{"en":"Protects login, cart and voucher endpoints","vi":"Bảo vệ đăng nhập, giỏ hàng và voucher"},{"en":"Blocks common web attacks such as SQL injection and XSS","vi":"Chặn tấn công web phổ biến như SQL injection, XSS"},{"en":"Rules tuned per campaign without code changes","vi":"Điều chỉnh luật theo từng chiến dịch, không sửa code"}]}},{"id":"customer-data","persona":{"en":"Chief Compliance Officer / DPO","vi":"Giám đốc Tuân thủ / Cán bộ bảo vệ dữ liệu cá nhân"},"challenge":{"title":{"en":"Customer Data and Decree 13 Exposure","vi":"Dữ liệu khách hàng và rủi ro theo Nghị định 13"},"body":{"en":"Retailers hold phone numbers, addresses, purchase history and loyalty data across CRM, marketing agencies and store staff. Customer lists exported to personal email or USB are a common leak path, and Decree 13 puts the responsibility on you.","vi":"Doanh nghiệp bán lẻ nắm số điện thoại, địa chỉ, lịch sử mua hàng và dữ liệu thành viên rải khắp CRM, đối tác marketing và nhân viên cửa hàng. Danh sách khách hàng xuất ra email cá nhân hay USB là đường rò rỉ rất phổ biến, và Nghị định 13 đặt trách nhiệm lên doanh nghiệp."}},"solutions":["dlp"],"response":{"title":{"en":"Know where customer data goes","vi":"Biết dữ liệu khách hàng đang đi đâu"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives automatically detects customer records leaving the company, helping prevent insider leaks and supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ khách hàng bị đưa ra ngoài, giúp ngăn rò rỉ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects customer and loyalty records","vi":"Tự nhận diện dữ liệu khách hàng và thành viên"},{"en":"Evidence ready for audits","vi":"Bằng chứng sẵn sàng cho kiểm toán"}]}},{"id":"payment-cloud","persona":{"en":"CFO / CIO","vi":"Giám đốc Tài chính / Giám đốc CNTT"},"challenge":{"title":{"en":"Payment Data, PCI DSS and Fragile Hosting","vi":"Dữ liệu thanh toán, PCI DSS và hạ tầng thiếu vững chắc"},"body":{"en":"Card and payment data raises PCI DSS obligations, and phishing mail aimed at finance and procurement teams is a standard route to fraudulent supplier payments. Hosting that cannot scale or keep data in-country adds cost and audit risk.","vi":"Dữ liệu thẻ và thanh toán kéo theo nghĩa vụ PCI DSS, còn email phishing nhắm vào kế toán, mua hàng là đường quen thuộc dẫn tới chuyển tiền nhầm cho nhà cung cấp giả mạo. Hạ tầng không co giãn được hoặc không giữ dữ liệu trong nước làm tăng chi phí và rủi ro kiểm toán."}},"solutions":["email-security"],"response":{"title":{"en":"Sovereign cloud with a protected inbox","vi":"Đám mây chủ quyền cùng hộp thư được bảo vệ"},"body":{"en":"VCLOUD hosts commerce workloads with data kept inside Vietnam, and advanced email defense filters phishing, spoofed supplier invoices and ransomware before they reach your teams.","vi":"VCLOUD lưu trữ hệ thống thương mại với dữ liệu nằm tại Việt Nam, còn bảo vệ email nâng cao lọc phishing, hóa đơn nhà cung cấp giả mạo và ransomware trước khi tới nhân viên."},"points":[{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"},{"en":"Filters fake supplier and payment requests","vi":"Lọc yêu cầu thanh toán, nhà cung cấp giả"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"}]}},{"id":"contracts","persona":{"en":"Head of Legal & Procurement","vi":"Trưởng bộ phận Pháp chế & Mua hàng"},"challenge":{"title":{"en":"Supplier, Landlord and Platform Contracts at Scale","vi":"Hợp đồng nhà cung cấp, mặt bằng và sàn ở quy mô lớn"},"body":{"en":"A retail group manages hundreds of supplier, lease, marketplace and franchise contracts, plus changing rules on consumer protection and personal data. Manual review slows new store openings and vendor onboarding.","vi":"Một tập đoàn bán lẻ phải quản lý hàng trăm hợp đồng nhà cung cấp, thuê mặt bằng, sàn thương mại điện tử và nhượng quyền, cùng các quy định về bảo vệ người tiêu dùng và dữ liệu cá nhân luôn thay đổi. Rà soát thủ công làm chậm việc mở cửa hàng mới và đưa nhà cung cấp vào hệ thống."}},"solutions":["ai-legal"],"response":{"title":{"en":"Review contracts in minutes, not days","vi":"Rà soát hợp đồng trong vài phút thay vì vài ngày"},"body":{"en":"An AI legal assistant automates contract review and flags risky clauses, with an on-premise option so commercial terms and supplier pricing never leave your walls.","vi":"Trợ lý AI pháp lý tự động rà soát hợp đồng và đánh dấu điều khoản rủi ro, có tùy chọn on-premise để điều khoản thương mại và giá nhà cung cấp không rời khỏi hệ thống của bạn."},"points":[{"en":"Automated clause review","vi":"Tự động rà soát điều khoản"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal teams for high-value work","vi":"Giải phóng đội pháp chế cho việc giá trị cao"}]}}],"outcomes":[{"title":{"en":"Sell Without Interruption","vi":"Bán hàng không gián đoạn"},"body":{"en":"Keep the storefront and checkout available during the campaigns that matter most, protected from DDoS and automated abuse.","vi":"Giữ website và thanh toán luôn sẵn sàng trong những chiến dịch quan trọng nhất, được bảo vệ khỏi DDoS và lạm dụng tự động."}},{"title":{"en":"Protect Customer Trust and Compliance","vi":"Bảo vệ niềm tin khách hàng và tuân thủ"},"body":{"en":"Safeguard customer and payment data across email, users and infrastructure, and be ready for Decree 13 and PCI DSS expectations.","vi":"Bảo vệ dữ liệu khách hàng và thanh toán trên email, người dùng và hạ tầng, sẵn sàng cho yêu cầu của Nghị định 13 và PCI DSS."}},{"title":{"en":"Lower Risk and Operating Cost","vi":"Giảm rủi ro và chi phí vận hành"},"body":{"en":"One local partner for cloud, edge protection, data and legal automation reduces vendor sprawl, manual work and incident-response effort.","vi":"Một đối tác trong nước cho đám mây, bảo vệ lớp ngoài, dữ liệu và tự động hóa pháp chế giúp giảm số nhà cung cấp, công việc thủ công và nỗ lực ứng phó sự cố."}}],"faq":[{"q":{"en":"Do we need to move our e-commerce platform to protect it from DDoS?","vi":"Chúng tôi có cần chuyển hệ thống thương mại điện tử sang nơi khác để chống DDoS không?"},"a":{"en":"Not necessarily. Anti-DDoS and CDN protection sits in front of your existing site, wherever it is hosted. VCLOUD is available if you also want sovereign hosting inside Vietnam.","vi":"Không nhất thiết. Lớp chống DDoS và CDN đặt phía trước website hiện có, dù đang lưu trữ ở đâu. VCLOUD là lựa chọn bổ sung nếu bạn muốn lưu trữ chủ quyền tại Việt Nam."}},{"q":{"en":"Does this help with PCI DSS?","vi":"Giải pháp có hỗ trợ PCI DSS không?"},"a":{"en":"A web application firewall, data monitoring and secure hosting support several PCI DSS control areas. Certification itself depends on your whole payment environment and assessor, so we scope it with you.","vi":"Tường lửa ứng dụng web, giám sát dữ liệu và hạ tầng an toàn hỗ trợ nhiều nhóm kiểm soát của PCI DSS. Việc đạt chứng nhận phụ thuộc toàn bộ môi trường thanh toán và đơn vị đánh giá, nên chúng tôi cùng bạn xác định phạm vi."}},{"q":{"en":"How do we handle customer data under Decree 13?","vi":"Làm thế nào để xử lý dữ liệu khách hàng theo Nghị định 13?"},"a":{"en":"Data Loss Prevention discovers and monitors customer records leaving through chat, webmail and USB, and VCLOUD keeps data inside Vietnam, giving you evidence for audits and incident response.","vi":"Giải pháp chống thất thoát dữ liệu phát hiện và giám sát hồ sơ khách hàng đi ra qua chat, webmail, USB, còn VCLOUD giữ dữ liệu tại Việt Nam, giúp bạn có bằng chứng cho kiểm toán và ứng phó sự cố."}}],"newSolutions":[{"id":"anti-ddos-cdn","icon":"zap","name":"Anti-DDoS & CDN","tagline":{"en":"Stay online at peak traffic","vi":"Luôn trực tuyến khi lưu lượng đỉnh điểm"},"description":{"en":"Anti-DDoS filtering and content delivery network that absorb attack traffic and speed up content delivery, keeping storefronts and checkout available during flash sales and campaigns.","vi":"Lớp lọc chống DDoS và mạng phân phối nội dung (CDN) hấp thụ lưu lượng tấn công và tăng tốc phân phối nội dung, giữ website bán hàng và thanh toán sẵn sàng trong flash sale và các chiến dịch."}},{"id":"web-waf","icon":"shield","name":"Web Application Firewall","tagline":{"en":"Protect login, cart and checkout","vi":"Bảo vệ đăng nhập, giỏ hàng và thanh toán"},"description":{"en":"A web application firewall that blocks injection attacks and abusive automation against login, cart and promotion endpoints, supporting PCI DSS web-application controls.","vi":"Tường lửa ứng dụng web chặn tấn công injection và tự động hóa lạm dụng nhắm vào các điểm đăng nhập, giỏ hàng, khuyến mãi, hỗ trợ các kiểm soát ứng dụng web của PCI DSS."}}],"sources":["Decree 13/2023/ND-CP on personal data protection","PCI Security Standards Council, PCI DSS","Law on Cybersecurity 2018 (24/2018/QH14)","vnetwork.vn (not reachable from this environment; product names to be confirmed)"]}]};</script>

// Original illustrations in the VNETWORK visual language: white "server" stacks with red bands, a red glass badge, soft lavender floor.
// Pure SVG strings (no image assets, no network). scene(kind, iconMarkup, id) -> <svg> markup. `kind`: 'cloud' (home) or 'tile' (industry / solution).
// Gradient ids are prefixed per instance so several scenes can share a page.

function stack(g, cx, base, w, tiers, scale = 1) {
  const rx = w / 2, ry = w * 0.13, bh = 26 * scale, rh = 7 * scale;
  let out = '';
  let y = base;
  for (let i = 0; i < tiers; i++) {
    // red band under each disc
    out += `<rect x="${cx - rx}" y="${y - rh}" width="${w}" height="${rh}" fill="url(#${g}r)"/><ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${g}r)"/>`;
    y -= rh;
    // white disc
    out += `<rect x="${cx - rx}" y="${y - bh}" width="${w}" height="${bh}" fill="url(#${g}w)"/><ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${g}w)"/>`;
    y -= bh;
  }
  out += `<ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${g}t)"/>`;
  return { svg: out, top: y - ry };
}

function scene(kind, iconMarkup = '', id = 'a') {
  const g = `g${id}`;
  const big = stack(g, 372, 262, 118, 5);
  const mid = stack(g, 214, 282, 92, 4, .92);
  const small = stack(g, 468, 292, 70, 3, .8);
  const badge = kind === 'cloud'
    ? `<g transform="translate(70 46)"><path d="M62 100c-24 0-42-15-42-36 0-19 14-34 33-36 6-18 23-28 43-28 25 0 44 16 47 38 17 3 30 17 30 33 0 18-16 29-36 29z" fill="url(#${g}c)"/>
        <path d="M62 100c-24 0-42-15-42-36 0-19 14-34 33-36" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/></g>`
    : `<g transform="translate(118 40)"><rect width="128" height="128" rx="34" fill="url(#${g}c)"/>
        <rect x="2" y="2" width="124" height="124" rx="32" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
        <g transform="translate(34 34) scale(2.4)" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#fff">${iconMarkup}</g></g>`;
  return `<svg class="art" viewBox="0 0 560 360" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="${g}w" x1="0" x2="1"><stop offset="0" stop-color="#e9ecf8"/><stop offset=".35" stop-color="#fff"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#dfe3f3"/></linearGradient>
    <linearGradient id="${g}t" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1f3fb"/></linearGradient>
    <linearGradient id="${g}r" x1="0" x2="1"><stop offset="0" stop-color="#c81f12"/><stop offset=".45" stop-color="#f23a26"/><stop offset="1" stop-color="#cf2a1a"/></linearGradient>
    <linearGradient id="${g}c" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff6a52"/><stop offset=".55" stop-color="#e32f1e"/><stop offset="1" stop-color="#b3180e"/></linearGradient>
    <radialGradient id="${g}f" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e7e9f7" stop-opacity="0"/></radialGradient>
    <filter id="${g}s" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <ellipse cx="290" cy="300" rx="270" ry="52" fill="url(#${g}f)"/>
  <ellipse cx="290" cy="300" rx="226" ry="38" fill="none" stroke="#e32f1e" stroke-opacity=".16" stroke-width="1.5"/>
  <ellipse cx="290" cy="300" rx="170" ry="27" fill="none" stroke="#e32f1e" stroke-opacity=".22" stroke-width="1.5"/>
  <ellipse cx="372" cy="268" rx="70" ry="13" fill="#2a1f50" opacity=".16" filter="url(#${g}s)"/>
  <ellipse cx="214" cy="288" rx="56" ry="11" fill="#2a1f50" opacity=".14" filter="url(#${g}s)"/>
  <path d="M244 200v34M244 234h-30" stroke="#e32f1e" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
  ${small.svg}${mid.svg}${big.svg}
  <path d="M184 184V150M184 150h0" stroke="#e32f1e" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
  ${badge}
  <g fill="#fff" stroke="#e32f1e" stroke-opacity=".3"><circle cx="470" cy="116" r="5"/><circle cx="96" cy="250" r="4"/><circle cx="520" cy="196" r="3"/></g>
</svg>`;
}

function chip(icon, x, y, n) {

}

  return `<svg class="art banner-art" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" focusable="false">

// square thumbnail for a solution card
function thumb(iconMarkup = '', id = 't', variant = 0, wide = false) {

  const s1 = stack(g, 150, 214, 62, 3, .8), s2 = stack(g, 205, 220, 40, 2, .7);
  return `<svg class="art thumb-art" viewBox="${wide ? '0 26 240 190' : '0 0 240 240'}" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" focusable="false">

    <linearGradient id="${g}w" x1="0" x2="1"><stop offset="0" stop-color="#e6e9f8"/><stop offset=".4" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#d9def2"/></linearGradient>

const $ = (s, r = document) => r.querySelector(s);

/* ---------------------------------------------------------------- routing */
function parseRoute() {
  const h = (location.hash || '').replace(/^#/, '');
  const m = h.match(/^(industry|solution)-([\w-]+)$/);
  return m ? { page: m[1], id: m[2] } : { page: 'home', id: '' };
}
const hashOf = (r) => (r.page === 'home' ? 'home' : `${r.page}-${r.id}`);
function go(hash, after) {
  const h = hash.replace(/^#/, '');
  const m = h.match(/^(industry|solution)-([\w-]+)$/);
  state.route = m ? { page: m[1], id: m[2] } : { page: 'home', id: '' };
  try { history.replaceState(null, '', '#' + hashOf(state.route)); } catch { /* sandboxed frame */ }
  teardownMotion(); render(); window.scrollTo(0, 0);
  if (after) setTimeout(() => scrollToEl($(after)), 450);
}
addEventListener('hashchange', () => {

/* ---------------------------------------------------------------- photography (Unsplash, with resilient fallback)
   Every photo sits on top of an always-rendered fallback layer (mesh gradient + pattern + icon, or a supplied illustration).
   The <img> stays transparent until it has really loaded, tries the next candidate URL on error, and is removed if all fail,
   so a broken-image icon or an empty/black frame can never show. */
const fbArt = (icon) => `<svg class="ph-pat" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="phg" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1d2140" stroke-opacity=".07"/></pattern></defs>
  <rect width="400" height="240" fill="url(#phg)"/><g fill="none" stroke="#e32f1e" stroke-opacity=".28" stroke-width="1.4"><circle cx="300" cy="70" r="90"/><circle cx="300" cy="70" r="140" stroke-opacity=".16"/><path d="M0 190c80-40 150 30 230-10s120-10 170-50"/></g></svg>${ic(icon || 'building-2', 'ph-ic')}`;
function photo(key, o = {}) {
  const im = state.images[key];
  const fb = o.fb || fbArt(im?.icon);
  if (!im || !im.src?.length) return `<figure class="ph fail ${o.cls || ''}" ${o.ratio ? `style="aspect-ratio:${o.ratio}"` : ''}><div class="ph-fb">${fb}</div></figure>`;
  const srcs = im.src.map((x) => x.replace('{w}', o.w || 1200));
  const local = /^(data:|assets\/)/.test(srcs[0]); // inline/own-file photos cannot be slow, so show them without waiting for the load event
  return `<figure class="ph${local ? ' ok' : ''} ${o.cls || ''}" ${o.ratio ? `style="aspect-ratio:${o.ratio}"` : ''}><div class="ph-fb">${fb}</div>
    <img class="ph-img" ${im.pos ? `style="object-position:${esc(im.pos)}"` : ''} src="${esc(srcs[0])}" data-srcs="${esc(srcs.slice(1).join('|'))}" alt="${esc(t(im.alt))}" loading="${o.eager ? 'eager' : 'lazy'}" decoding="async" referrerpolicy="no-referrer">
    ${o.nocap ? '' : `<figcaption>${ic(im.icon)}<span>${esc(t(o.caption ?? im.caption))}</span></figcaption>`}</figure>`;
}
const aura = (inner, cls = '') => `<div class="aura ${cls}">${inner}</div>`;
function phLoaded(img) { img.closest('.ph')?.classList.add('ok'); }
function phFailed(img) {
  const rest = (img.dataset.srcs || '').split('|').filter(Boolean);
  if (rest.length) { img.dataset.srcs = rest.slice(1).join('|'); img.src = rest[0]; return; }
  const f = img.closest('.ph'); f?.classList.remove('ok'); f?.classList.add('fail'); img.remove();
}
// error/load do not bubble, so listen in the capture phase once for the whole document
document.addEventListener('error', (e) => { if (e.target?.classList?.contains('ph-img')) phFailed(e.target); }, true);
document.addEventListener('load', (e) => { if (e.target?.classList?.contains('ph-img')) phLoaded(e.target); }, true);
function phCheck() { $$('.ph-img').forEach((i) => { if (i.complete) { if (i.naturalWidth) phLoaded(i); else phFailed(i); } }); }

/* ---------------------------------------------------------------- behaviour */
function bindChrome() {
  const hdr = $('#hdr');
  const onScroll = () => hdr.classList.toggle('solid', scrollY > 24);
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  const dds = $$('.dd');
  const closeAll = () => dds.forEach((d) => { d.classList.remove('open'); $('.nav-btn', d).setAttribute('aria-expanded', 'false'); });
  const hoverable = () => matchMedia('(hover:hover) and (min-width:961px)').matches;
  dds.forEach((d) => {
    const b = $('.nav-btn', d);
    const set = (o) => { closeAll(); d.classList.toggle('open', o); b.setAttribute('aria-expanded', String(o)); };
    b.addEventListener('click', (e) => { e.stopPropagation(); set(!d.classList.contains('open')); });
    d.addEventListener('mouseenter', () => hoverable() && set(true));
    d.addEventListener('mouseleave', () => hoverable() && set(false));
  });
  $('#burger').addEventListener('click', (e) => { const o = $('#nav').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', String(o)); });
  $$('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
  state.closeAll = closeAll;
}
// one delegated handler for the whole document (links, smooth scroll, copy buttons, dismissals)
document.addEventListener('click', (e) => {
  if (!e.target.closest('.dd')) state.closeAll?.();
  const nav = e.target.closest('[data-go]');
  if (nav) { e.preventDefault(); state.closeAll?.(); $('#nav')?.classList.remove('open'); go(nav.dataset.go); return; }
  const a = e.target.closest('[data-scroll]');
  if (a) {
    const target = $(a.dataset.scroll); if (!target) return;
    e.preventDefault(); $('#nav')?.classList.remove('open'); state.closeAll?.();
    if (a.dataset.prefill === 'poc') { const nn = $('#f-need'); if (nn && !nn.value) nn.value = 'PoC sandbox'; }
    scrollToEl(target); return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const done = () => { const s = $('span', cp); s.textContent = u('cta.copied'); setTimeout(() => { s.textContent = u('cta.copy'); }, 1400); };
    const sel = () => { const v = cp.previousElementSibling?.querySelector('.v'); if (v) { const r = document.createRange(); r.selectNodeContents(v); getSelection().removeAllRanges(); getSelection().addRange(r); } done(); };
    (navigator.clipboard?.writeText(cp.dataset.copy) ?? Promise.reject()).then(done, sel);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') state.closeAll?.(); });

function scrollToEl(el, offset) {
  if (!el) return;
  const hdr = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 78;
  const off = offset ?? hdr + ($('#lnav') ? $('#lnav').offsetHeight : 0) + 16;
  scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + scrollY - off), behavior: motionOK ? 'smooth' : 'auto' });
}

function bindForm() {
  const form = $('#lead'); if (!form) return;
  let mode = 'book';
  $$('.tabs button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    $$('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    $('#need-wrap').hidden = mode === 'brief';
    $('#send span').textContent = u(mode === 'brief' ? 'cta.sendBrief' : 'cta.sendBook');
  }));
  const validate = () => {
    let ok = true;
    $$('.field', form).forEach((f) => {
      const i = $('input,select', f); const em = $('.em', f);
      if (!i || !i.required) return;
      let msg = '';
      if (!i.value.trim()) msg = u('cta.required');
      else if (i.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i.value)) msg = u('cta.badEmail');
      f.classList.toggle('err', !!msg); if (em) em.textContent = msg; if (msg) ok = false;
    });
    if (!form.consent.checked) ok = false;
    return ok;
  };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (form.website.value) return; // honeypot
    if (!validate()) { ($('.err input', form) || form.consent).focus(); return; }
    const payload = { mode, lang: state.lang, page: hashOf(state.route), ts: new Date().toISOString(), ...Object.fromEntries(new FormData(form).entries()) };
    delete payload.website;
    const btn = $('#send'); btn.disabled = true;
    try {
      if (CONFIG.leadEndpoint) {
        const r = await fetch(CONFIG.leadEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error(r.status);
      } else console.info('[lead: no endpoint configured]', payload);
      $('#cbox').classList.add('sent');
    } catch (err) { btn.disabled = false; const note = $('.demo-note', form) || btn.parentElement; note.textContent = u('cta.errorT'); }
  });
}

/* ---------------------------------------------------------------- motion */
// Everything here is time-based and fires once when an element enters the viewport (IntersectionObserver).
// Nothing is tied to scroll position, nothing is pinned, and the browser's own scrolling is left alone.
function countUp(el) {
  const m = String(el.dataset.count).match(/^([^\d]*)([\d.,]+)(.*)$/);
  if (!m) return;
  const target = parseFloat(m[2].replace(',', '.')); const dec = (m[2].split(/[.,]/)[1] || '').length;
  const t0 = performance.now(); const dur = 1100;
  el.textContent = m[1] + (0).toFixed(dec) + m[3];
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = m[1] + (target * (1 - Math.pow(1 - k, 3))).toFixed(dec) + m[3];
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function watch(els, opts, cb) {
  if (!els.length) return;
  const io = new IntersectionObserver((entries) => cb(entries.filter((e) => e.isIntersecting), io), opts);
  els.forEach((e) => io.observe(e));
  cleanups.push(() => io.disconnect());
}

function initMotion(instant) {
  const root = document.documentElement;
  root.classList.toggle('motion', motionOK && !!window.IntersectionObserver);
  if (!motionOK || !window.IntersectionObserver) return;
  if (instant) { $$('.rv, .chapter').forEach((e) => e.classList.add('in')); $$('[data-count]').forEach((e) => { e.textContent = e.dataset.count; }); }

  // 1. generic reveal: fade + rise, a short stagger between siblings that arrive together
  watch($$('.rv:not(.in)'), { rootMargin: '0px 0px -6% 0px', threshold: .08 }, (hits, io) => {
    hits.forEach((e, i) => {
      const el = e.target; const d = i * 90;
      el.style.transitionDelay = `${d}ms`; el.classList.add('in'); io.unobserve(el);
      setTimeout(() => { el.style.transitionDelay = ''; }, d + 1100);
    });
  });
  // 2. story chapters: challenge appears, then the answer resolves (one timed sequence per chapter)
  watch($$('.chapter:not(.in)'), { rootMargin: '0px 0px -18% 0px', threshold: .2 }, (hits, io) => {
    hits.forEach((e) => {
      e.target.classList.add('in'); io.unobserve(e.target);
      const c = $('[data-count]', e.target); if (c) setTimeout(() => countUp(c), 1300);
    });
  });
  $$('.chapter:not(.in) [data-count]').forEach((c) => { c.textContent = c.dataset.count.replace(/[\d.,]+/, '0'); });
}

// sticky local nav (industry page): highlights the section on screen, like Apple's product sub-nav
function initLocalNav() {
  const links = $$('[data-spy]'); if (!links.length || !window.IntersectionObserver) return;
  const map = new Map(links.map((a) => [a.dataset.spy, a]));
  const on = (id) => links.forEach((a) => a.classList.toggle('on', a.dataset.spy === id));
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) on(map.has(e.target.id) ? e.target.id : null); }), { rootMargin: '-35% 0px -60% 0px' });
  [...map.keys(), 'others', 'contact'].forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
  cleanups.push(() => io.disconnect());
  const nav = $('#lnav'); const bar = () => nav.classList.toggle('stuck', nav.getBoundingClientRect().top <= (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 78) + 1);
  addEventListener('scroll', bar, { passive: true }); bar();
  cleanups.push(() => removeEventListener('scroll', bar));
  // the chapter picker in the intro jumps straight to the matching chapter
  $$('[data-goto]').forEach((b) => b.addEventListener('click', () => scrollToEl($(`#ch-${b.dataset.goto}`))));
}

// FAQ: height eases open/closed instead of snapping
function initFaq() {
  $$('.faq details').forEach((d) => {
    const sum = $('summary', d); const body = $('.a', d);
    sum.addEventListener('click', (e) => {
      if (!motionOK || !d.animate) return;
      e.preventDefault();
      d.style.overflow = 'hidden';
      const opening = !d.open;
      const from = d.offsetHeight;
      if (opening) d.open = true;
      const to = opening ? sum.offsetHeight + body.offsetHeight : sum.offsetHeight;
      const a = d.animate({ height: [`${from}px`, `${to}px`] }, { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
      a.onfinish = () => { if (!opening) d.open = false; d.style.overflow = ''; };
    });
  });
}

/* ---------------------------------------------------------------- lifecycle */
function teardownMotion() {
  cleanups.forEach((f) => f()); cleanups = [];
}

  const { page, id } = state.route;
  const d = page === 'industry' ? industryOf(id) : null;
  const s = page === 'solution' ? state.solutions.get(id) : null;
  document.title = d ? `${t(d.name)} | V-TECH FOUNDRY` : s ? `${s.name} | V-TECH FOUNDRY` : 'V-TECH FOUNDRY';
  const body = page === 'industry' ? industryPage() : page === 'solution' ? solutionPage() : homePage();
  $('#app').innerHTML = `<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div><div class="grain" aria-hidden="true"></div>${header()}<main>${body}</main>${footer()}`;
  bindChrome(); bindForm(); initLocalNav(); initFaq();
  initMotion(instant);
  phCheck();
}

function setLang(l) {
  if (l === state.lang) return;
  state.lang = l; store.set('vth-lang', l);
  const y = scrollY; teardownMotion(); render(true); scrollTo(0, y);
}

loadData().then(() => { render(); }).catch((e) => {
  $('#app').innerHTML = '<section class="hero"><div class="wrap"><h1 class="display">Unable to load content</h1><p class="lede">Serve this folder over HTTP (for example <code>python3 -m http.server</code>); JSON cannot be fetched from file://.</p></div></section>';
  console.error(e);
});

</script>
