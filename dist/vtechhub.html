ecree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB. Tự động phát hiện hồ sơ khách hàng nhạy cảm để ngăn gian lận nội bộ, rò rỉ dữ liệu và đảm bảo tuân thủ Nghị định 13."}},{"id":"database-security","icon":"database","name":"Database Security","tagline":{"en":"Query-level control & real-time masking","vi":"Kiểm soát truy vấn & che giấu dữ liệu thời gian thực"},"description":{"en":"Direct query-level access control and real-time data masking built for Core Banking systems. It stops privileged admin abuse without slowing down live transactions or overloading systems with junk logs.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực dành cho hệ thống Core Banking. Ngăn lạm quyền quản trị mà không làm chậm giao dịch trực tiếp hay tràn log rác."}}],"industries":[{"id":"bfsi","order":1,"icon":"landmark","name":{"en":"BFSI","vi":"Ngân hàng - Tài chính - Bảo hiểm"},"title":{"en":"Banking, Financial Services & Insurance","vi":"Ngân hàng, Dịch vụ Tài chính & Bảo hiểm"},"tagline":{"en":"VCLOUD & Email Security, AI Legal & Compliance, Data Loss Prevention and Core Banking Database Security.","vi":"VCLOUD & Email Security, AI Legal & Compliance, Chống thất thoát dữ liệu và Bảo mật cơ sở dữ liệu Core Banking."},"bundle":["email-security","database-security","dlp","ai-legal"],"regulations":["Decree 13","SBV","PCI DSS"],"challengesIntro":{"en":"Digital transformation is expanding the attack surface and compliance burden for banks, financial institutions, and insurers. IT and security teams must keep operations secure and uninterrupted while protecting sensitive data, supporting fast-moving business, and answering increasingly sophisticated internal and external threats.","vi":"Chuyển đổi số mở rộng bề mặt tấn công và gánh nặng tuân thủ của ngân hàng, tổ chức tài chính và bảo hiểm. Đội ngũ IT và an ninh phải đảm bảo vận hành an toàn, liên tục, bảo vệ dữ liệu nhạy cảm, đáp ứng nghiệp vụ nhanh và đối phó các mối đe dọa nội bộ lẫn bên ngoài ngày càng tinh vi."},"chapters":[{"id":"phishing","persona":{"en":"Head of Information Security","vi":"Giám đốc An ninh thông tin"},"challenge":{"title":{"en":"Phishing and Ransomware Through Email","vi":"Phishing và Ransomware qua Email"},"body":{"en":"Email is one of the most common ways attackers enter financial organisations. Phishing emails, fake payment requests, and ransomware can steal employee credentials, trigger fraudulent transfers, and disrupt critical banking operations.","vi":"Email là con đường phổ biến nhất để tin tặc xâm nhập tổ chức tài chính. Email phishing, yêu cầu thanh toán giả mạo và ransomware có thể đánh cắp thông tin đăng nhập, kích hoạt chuyển tiền gian lận và làm gián đoạn hoạt động ngân hàng."}},"solutions":["email-security"],"response":{"title":{"en":"Stop it before it reaches the inbox","vi":"Chặn từ trước khi vào hộp thư"},"body":{"en":"Advanced email defense on VCLOUD stops phishing, executive spoofing and ransomware before they reach employees, while your data stays inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD chặn phishing, giả mạo lãnh đạo và ransomware trước khi tới nhân viên, trong khi dữ liệu vẫn nằm tại Việt Nam."},"points":[{"en":"Blocks phishing and executive spoofing","vi":"Chặn phishing và giả mạo lãnh đạo"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"}]},"scenario":{"en":"Monday, 08:47. An email that looks exactly like the CEO's asks the finance team to open an \"urgent\" attachment.","vi":"Sáng thứ Hai, 8:47. Một email giống hệt thư của Tổng giám đốc yêu cầu bộ phận tài chính mở tệp đính kèm \"khẩn\"."},"scene":{"kind":"gate","dest":{"en":"Employee inbox","vi":"Hộp thư nhân viên"},"bad":[{"en":"Fake CEO request","vi":"Giả mạo Tổng giám đốc"},{"en":"Credential phishing","vi":"Phishing lấy mật khẩu"},{"en":"Ransomware attachment","vi":"Tệp đính kèm ransomware"}],"good":[{"en":"Customer enquiry","vi":"Yêu cầu từ khách hàng"},{"en":"Branch report","vi":"Báo cáo chi nhánh"},{"en":"Regulator notice","vi":"Thư từ cơ quan quản lý"}]}},{"id":"fraud","persona":{"en":"Head of Operations & Payments","vi":"Giám đốc Vận hành & Thanh toán"},"challenge":{"title":{"en":"Fraudulent Payments and Transaction Changes","vi":"Thanh toán gian lận và thay đổi giao dịch"},"body":{"en":"Online banking and digital payments make it easier for criminals to use stolen identities, submit fraudulent payment requests, or alter transaction information. If not detected early, the bank faces direct financial loss, operational disruption, and customer complaints.","vi":"Ngân hàng số và thanh toán điện tử giúp tội phạm dễ dùng danh tính bị đánh cắp, gửi yêu cầu thanh toán gian lận hoặc sửa thông tin giao dịch. Nếu không phát hiện sớm, ngân hàng chịu tổn thất tài chính trực tiếp, gián đoạn vận hành và khiếu nại của khách hàng."}},"solutions":["email-security","database-security"],"response":{"title":{"en":"Close both doors: the request and the record","vi":"Đóng cả hai cửa: yêu cầu và dữ liệu"},"body":{"en":"Spoofed payment requests are filtered at the email layer, and sensitive SQL changes on Core Banking require approval, so a forged instruction cannot quietly become a changed transaction.","vi":"Yêu cầu thanh toán giả mạo bị lọc ở lớp email, còn các thay đổi SQL nhạy cảm trên Core Banking phải qua phê duyệt, nên một chỉ thị giả không thể âm thầm biến thành giao dịch bị sửa."},"points":[{"en":"Filters fake payment requests at the source","vi":"Lọc yêu cầu thanh toán giả từ nguồn"},{"en":"Approval workflow for sensitive SQL","vi":"Quy trình phê duyệt cho SQL nhạy cảm"},{"en":"Audit trail for every change","vi":"Nhật ký kiểm toán mọi thay đổi"}]},"scenario":{"en":"A familiar supplier writes that its bank account has changed. The payment is due today.","vi":"Một nhà cung cấp quen thuộc báo đã đổi tài khoản ngân hàng. Khoản thanh toán đến hạn ngay hôm nay."},"scene":{"kind":"gate","dest":{"en":"Payment desk","vi":"Bộ phận thanh toán"},"bad":[{"en":"Changed bank details","vi":"Đổi thông tin tài khoản"},{"en":"Fake invoice","vi":"Hoá đơn giả"},{"en":"Urgent transfer request","vi":"Yêu cầu chuyển tiền khẩn"}],"good":[{"en":"Verified invoice","vi":"Hoá đơn đã xác minh"},{"en":"Salary batch","vi":"Bảng lương"},{"en":"Vendor payment","vi":"Thanh toán nhà cung cấp"}]}},{"id":"core-access","persona":{"en":"Head of Core Banking / DBA Lead","vi":"Trưởng bộ phận Core Banking / DBA"},"challenge":{"title":{"en":"Uncontrolled Access to Core Banking Data","vi":"Truy cập không kiểm soát vào dữ liệu Core Banking"},"body":{"en":"Core banking databases are accessed by internal teams, administrators, developers, and external service providers. Without clear access control and monitoring, privileged users may view, copy, or change sensitive data without timely detection.","vi":"Cơ sở dữ liệu lõi được truy cập bởi đội nội bộ, quản trị viên, lập trình viên và nhà cung cấp bên ngoài. Thiếu kiểm soát và giám sát rõ ràng, người dùng đặc quyền có thể xem, sao chép hoặc sửa dữ liệu nhạy cảm mà không bị phát hiện kịp thời."}},"solutions":["database-security"],"response":{"title":{"en":"Every query seen, every secret masked","vi":"Mọi truy vấn đều được thấy, mọi bí mật đều được che"},"body":{"en":"Query-level access control and real-time data masking stop privileged admin abuse without slowing live transactions or flooding systems with junk logs.","vi":"Kiểm soát mức truy vấn và che giấu dữ liệu thời gian thực ngăn lạm quyền quản trị mà không làm chậm giao dịch hay tràn log rác."},"points":[{"en":"Proxy gateway restricts direct database access","vi":"Cổng proxy hạn chế truy cập trực tiếp CSDL"},{"en":"Account numbers and balances masked for unauthorized admins","vi":"Số tài khoản và số dư được che với quản trị viên không có quyền"},{"en":"No impact on live transactions","vi":"Không ảnh hưởng giao dịch trực tiếp"}]},"scenario":{"en":"02:10 a.m. A privileged account runs a broad query against the customer table. Nobody is watching.","vi":"2:10 sáng. Một tài khoản đặc quyền chạy truy vấn toàn bộ bảng khách hàng. Không ai theo dõi."},"scene":{"kind":"mask","table":{"en":"Core banking · customers","vi":"Core banking · khách hàng"}}},{"id":"leak","persona":{"en":"Chief Compliance Officer","vi":"Giám đốc Tuân thủ"},"challenge":{"title":{"en":"Customer Data Leakage and Compliance Pressure","vi":"Rò rỉ dữ liệu khách hàng và áp lực tuân thủ"},"body":{"en":"Banks hold highly sensitive data: customer identity, account details, card data, loan records, insurance documents. A single leak can create serious compliance issues under Decree 13, SBV requirements and PCI DSS, and lasting damage to customer trust.","vi":"Ngân hàng nắm giữ dữ liệu cực kỳ nhạy cảm: danh tính khách hàng, tài khoản, thẻ, hồ sơ vay, hợp đồng bảo hiểm. Một vụ rò rỉ có thể gây vi phạm nghiêm trọng theo Nghị định 13, yêu cầu của NHNN và PCI DSS, cùng tổn hại lâu dài đến niềm tin khách hàng."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive data wherever it tries to leave","vi":"Thấy dữ liệu nhạy cảm ở mọi nơi nó cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects customer records automatically, stopping insider fraud and leaks while supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ khách hàng, ngăn gian lận nội bộ và rò rỉ, hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects KYC and account records","vi":"Tự nhận diện dữ liệu KYC và tài khoản"},{"en":"Evidence ready for audits","vi":"Bằng chứng sẵn sàng cho kiểm toán"}]},"scenario":{"en":"Friday evening. An employee copies a customer list to a personal drive before the weekend.","vi":"Chiều thứ Sáu. Một nhân viên chép danh sách khách hàng vào ổ cá nhân trước kỳ nghỉ cuối tuần."},"scene":{"kind":"perimeter","asset":{"en":"Customer KYC data","vi":"Dữ liệu KYC khách hàng"}}},{"id":"legal","persona":{"en":"Head of Legal & Credit Operations","vi":"Trưởng bộ phận Pháp chế & Tín dụng"},"challenge":{"title":{"en":"Slow Legal and Compliance Reviews","vi":"Rà soát pháp lý và tuân thủ chậm"},"body":{"en":"Loan agreements, insurance contracts and regulatory documents need detailed manual review. This slows approvals, delays customer service, and makes it harder for legal and compliance teams to keep up with changing regulations.","vi":"Hợp đồng tín dụng, hợp đồng bảo hiểm và văn bản quy định cần rà soát thủ công chi tiết. Điều này làm chậm phê duyệt, trì hoãn phục vụ khách hàng và khiến đội pháp chế khó theo kịp quy định thay đổi."}},"solutions":["ai-legal"],"response":{"title":{"en":"Review in minutes, not days","vi":"Rà soát trong vài phút thay vì vài ngày"},"body":{"en":"An AI assistant trained on State Bank of Vietnam regulations automates loan and contract review, with an on-premise option so sensitive documents never leave your walls.","vi":"Trợ lý AI huấn luyện trên quy định của Ngân hàng Nhà nước tự động rà soát hợp đồng tín dụng, có tùy chọn on-premise để tài liệu nhạy cảm không rời khỏi hệ thống của bạn."},"points":[{"en":"Trained on SBV regulations","vi":"Huấn luyện trên quy định NHNN"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal teams for high-value work","vi":"Giải phóng đội pháp chế cho việc giá trị cao"}],"metric":{"value":"95%","label":{"en":"accuracy on SBV regulation","vi":"độ chính xác theo quy định NHNN"}}},"scenario":{"en":"A stack of loan contracts is waiting for review, and the deadline is tomorrow.","vi":"Một chồng hợp đồng tín dụng đang chờ rà soát, và hạn chót là ngày mai."},"scene":{"kind":"scan"}}],"outcomes":[{"title":{"en":"Protect Customer Data & Trust","vi":"Bảo vệ dữ liệu & niềm tin khách hàng"},"body":{"en":"Protect KYC data, account information and transaction records across email, users, infrastructure and Core Banking, reducing the risk of leakage and unauthorized access.","vi":"Bảo vệ dữ liệu KYC, thông tin tài khoản và giao dịch trên email, người dùng, hạ tầng và Core Banking, giảm rủi ro rò rỉ và truy cập trái phép."}},{"title":{"en":"Stay Ahead of Compliance","vi":"Đi trước yêu cầu tuân thủ"},"body":{"en":"VCLOUD infrastructure in Vietnam plus data protection and access controls help institutions prepare for data protection requirements, audits and industry regulations.","vi":"Hạ tầng VCLOUD tại Việt Nam cùng kiểm soát bảo vệ dữ liệu và truy cập giúp tổ chức chuẩn bị cho yêu cầu bảo vệ dữ liệu, kiểm toán và quy định ngành."}},{"title":{"en":"Optimize Operations & Cost","vi":"Tối ưu vận hành & chi phí"},"body":{"en":"Automate security controls, data monitoring and document review to reduce manual work, incident-response cost and IT effort.","vi":"Tự động hóa kiểm soát an ninh, giám sát dữ liệu và rà soát tài liệu để giảm công việc thủ công, chi phí ứng phó sự cố và tải cho IT."}}],"faq":[{"q":{"en":"How does the platform secure core banking databases from privileged internal accounts?","vi":"Nền tảng bảo vệ CSDL core banking khỏi tài khoản nội bộ đặc quyền như thế nào?"},"a":{"en":"DBSAFER DB restricts direct database access through proxy gateways, enforces approval workflows for sensitive SQL queries, and applies DATACRYPTO masking so account numbers and balances are unreadable to unauthorized administrators.","vi":"DBSAFER DB hạn chế truy cập trực tiếp qua cổng proxy, áp dụng quy trình phê duyệt cho truy vấn SQL nhạy cảm và che giấu bằng DATACRYPTO để số tài khoản, số dư không thể đọc được với quản trị viên không có quyền."}},{"q":{"en":"How does the AI Legal solution reduce compliance processing times?","vi":"Giải pháp AI Legal rút ngắn thời gian xử lý tuân thủ như thế nào?"},"a":{"en":"It reviews loan agreements and contracts automatically against State Bank of Vietnam regulations, cutting routine review workload by 42%. An on-premise option keeps all data private.","vi":"Giải pháp tự động rà soát hợp đồng tín dụng theo quy định của Ngân hàng Nhà nước, giảm 42% khối lượng rà soát thường nhật. Tùy chọn on-premise giữ toàn bộ dữ liệu riêng tư."}}],"newSolutions":[],"sources":["V-IT Alliance AI Studio mockup (BFSI page)"]},{"id":"education","order":8,"icon":"graduation-cap","name":{"en":"Education","vi":"Giáo dục"},"title":{"en":"Education: Universities, K-12 Groups and E-learning","vi":"Giáo dục: Đại học, Hệ thống phổ thông và Đào tạo trực tuyến"},"tagline":{"en":"Sovereign VCLOUD hosting, email defense, Data Loss Prevention and Database Security for campuses that cannot afford downtime or a student-data leak.","vi":"Hạ tầng VCLOUD chủ quyền, bảo mật email, chống thất thoát dữ liệu và bảo mật cơ sở dữ liệu cho các cơ sở đào tạo không thể gián đoạn hay lộ dữ liệu người học."},"bundle":["email-security","dlp","database-security"],"regulations":["Decree 13","Law on Cybersecurity","MOET"],"challengesIntro":{"en":"Schools and universities now run admissions, teaching, exams and finance on digital platforms, while holding the personal data of large numbers of students, many of them minors. Demand arrives in sharp peaks, budgets are tight and IT teams are small, yet an outage during enrollment or exams, or a leak of student records, becomes a public issue within hours.","vi":"Trường học và đại học nay vận hành tuyển sinh, giảng dạy, thi cử và tài chính trên nền tảng số, đồng thời nắm giữ dữ liệu cá nhân của rất nhiều người học, trong đó có trẻ vị thành niên. Nhu cầu dồn thành các đợt cao điểm, ngân sách hạn chế, đội IT mỏng; nhưng chỉ cần hệ thống sập đúng mùa tuyển sinh, mùa thi hoặc lộ hồ sơ người học là sự việc trở thành chuyện công chúng chỉ sau vài giờ."},"chapters":[{"id":"peak-availability","persona":{"en":"CIO / Head of IT","vi":"Giám đốc CNTT"},"challenge":{"title":{"en":"Enrollment and Exam Peaks Hit the LMS Hardest","vi":"Cao điểm tuyển sinh và thi cử đè nặng lên LMS"},"body":{"en":"Application deadlines, course registration and online exams send traffic from a quiet baseline to a spike within hours. An on-premise server room sized for the average day slows down or fails exactly when thousands of students and parents are watching.","vi":"Hạn nộp hồ sơ, đăng ký học phần và thi trực tuyến khiến lưu lượng tăng vọt trong vài giờ so với ngày thường. Phòng máy chủ tại chỗ được thiết kế cho ngày bình thường sẽ chậm hoặc sập đúng lúc hàng nghìn sinh viên và phụ huynh đang theo dõi."}},"solutions":["email-security"],"response":{"title":{"en":"Run critical academic systems on VCLOUD","vi":"Đưa hệ thống học vụ trọng yếu lên VCLOUD"},"body":{"en":"Hosting the admissions portal, LMS and registration systems on VCLOUD, a secure cloud inside Vietnam, replaces a fixed server room with infrastructure you can plan around peak periods, while data stays in the country.","vi":"Đặt cổng tuyển sinh, LMS và hệ thống đăng ký học phần trên VCLOUD, đám mây bảo mật đặt tại Việt Nam, thay cho phòng máy cố định bằng hạ tầng có thể hoạch định theo mùa cao điểm, trong khi dữ liệu vẫn ở trong nước."},"points":[{"en":"Hosting inside Vietnam for academic and student systems","vi":"Lưu trữ tại Việt Nam cho hệ thống học vụ và dữ liệu người học"},{"en":"Capacity planned around enrollment and exam calendars","vi":"Năng lực hạ tầng hoạch định theo lịch tuyển sinh, thi cử"},{"en":"Less on-premise hardware to buy and maintain","vi":"Giảm phần cứng tại chỗ phải mua sắm và bảo trì"}]},"scenario":{"en":"Registration day, 07:59. Thousands of students and parents open the portal at the same minute, and the on-premise server room starts to crawl.","vi":"Ngày đăng ký học phần, 7:59. Hàng nghìn sinh viên và phụ huynh cùng mở cổng đăng ký trong một phút, và phòng máy chủ tại trường bắt đầu chậm dần."},"scene":{"kind":"wave","capacity":{"en":"Capacity","vi":"Công suất"},"down":{"en":"Portal down","vi":"Cổng đăng ký lỗi"},"edge":{"en":"Capacity planned around exam calendars","vi":"Hạ tầng co giãn theo mùa tuyển sinh"},"before":{"en":"Overloaded","vi":"Quá tải"},"after":{"en":"Online","vi":"Ổn định"}}},{"id":"phishing","persona":{"en":"Head of Information Security","vi":"Giám đốc An ninh thông tin"},"challenge":{"title":{"en":"Phishing Aimed at Staff and Students","vi":"Phishing nhắm vào cán bộ, giảng viên và sinh viên"},"body":{"en":"Campus email is open, widely known and used by tens of thousands of people with uneven security awareness. Fake scholarship notices, tuition payment requests and spoofed messages from the president or finance office are an easy way to steal accounts and reach internal systems.","vi":"Email của trường là kênh mở, nhiều người biết và có hàng chục nghìn người dùng với mức nhận thức an toàn không đồng đều. Thông báo học bổng giả, yêu cầu đóng học phí giả hay thư mạo danh hiệu trưởng, phòng tài chính là cách dễ dàng để chiếm tài khoản và đi sâu vào hệ thống nội bộ."}},"solutions":["email-security"],"response":{"title":{"en":"Filter the threat before it reaches the inbox","vi":"Lọc mối đe dọa trước khi tới hộp thư"},"body":{"en":"Advanced email defense stops phishing, executive spoofing and ransomware at the gateway, so protection does not depend on every student and lecturer spotting the trap.","vi":"Bảo vệ email nâng cao chặn phishing, giả mạo lãnh đạo và ransomware ngay tại cổng, để an toàn không phụ thuộc vào việc mọi sinh viên, giảng viên đều tự nhận ra bẫy."},"points":[{"en":"Blocks phishing and impersonation of leadership","vi":"Chặn phishing và giả mạo lãnh đạo nhà trường"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Hosted on sovereign cloud in Vietnam","vi":"Triển khai trên đám mây chủ quyền tại Việt Nam"}]},"scenario":{"en":"Monday, 09:05. A message that looks like it comes from the president's office tells lecturers and students to confirm their accounts for a scholarship.","vi":"Sáng thứ Hai, 9:05. Một thư có vẻ gửi từ văn phòng hiệu trưởng yêu cầu giảng viên và sinh viên xác nhận tài khoản để nhận học bổng."},"scene":{"kind":"gate","dest":{"en":"Staff & student inbox","vi":"Hộp thư toàn trường"},"src":{"en":"Incoming email","vi":"Thư đến"},"bad":[{"en":"Fake scholarship notice","vi":"Thông báo học bổng giả"},{"en":"Tuition payment scam","vi":"Lừa đảo đóng học phí"},{"en":"Spoofed president email","vi":"Giả mạo hiệu trưởng"}],"good":[{"en":"Class schedule","vi":"Lịch học lớp"},{"en":"Grade notification","vi":"Thông báo điểm"},{"en":"Faculty circular","vi":"Công văn của khoa"}],"before":{"en":"Exposed","vi":"Rủi ro cao"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"student-data","persona":{"en":"Data Protection Officer / Registrar","vi":"Cán bộ bảo vệ dữ liệu / Trưởng phòng Đào tạo"},"challenge":{"title":{"en":"Student and Minors' Data Under Decree 13","vi":"Dữ liệu người học và trẻ em theo Nghị định 13"},"body":{"en":"Enrollment files, ID numbers, grades, health notes and family details sit in spreadsheets, chat groups and personal mailboxes across many departments. Decree 13 sets stricter handling for children's data, so one forwarded file can become a compliance incident.","vi":"Hồ sơ nhập học, số định danh, điểm số, thông tin sức khỏe và hoàn cảnh gia đình nằm rải rác trong bảng tính, nhóm chat và hộp thư cá nhân ở nhiều phòng ban. Nghị định 13 đặt ra yêu cầu chặt chẽ hơn với dữ liệu của trẻ em, nên chỉ một tệp bị chuyển tiếp cũng có thể thành sự cố tuân thủ."}},"solutions":["dlp"],"response":{"title":{"en":"Know where student data goes, and stop it leaving","vi":"Biết dữ liệu người học đi đâu và chặn khi bị đưa ra ngoài"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives automatically detects sensitive records, helping stop leaks and supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ nhạy cảm, giúp ngăn rò rỉ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB channels","vi":"Bao phủ kênh chat, webmail và USB"},{"en":"Auto-detects personal and student records","vi":"Tự nhận diện hồ sơ cá nhân và hồ sơ người học"},{"en":"Evidence ready for audits and incident reviews","vi":"Bằng chứng sẵn sàng cho kiểm toán và rà soát sự cố"}]},"scenario":{"en":"Friday, 16:30. A staff member forwards an enrollment spreadsheet with students' ID numbers and family details to a class chat group.","vi":"Chiều thứ Sáu, 16:30. Một cán bộ chuyển bảng tuyển sinh có số CCCD và thông tin gia đình của học sinh vào nhóm chat lớp."},"scene":{"kind":"perimeter","asset":{"en":"Student records","vi":"Hồ sơ người học"},"channels":[{"en":"Class chat group","vi":"Nhóm chat lớp","icon":"message-circle"},{"en":"Personal mailbox","vi":"Hộp thư cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"records-research","persona":{"en":"Vice President for Research / Head of Student Information Systems","vi":"Phó hiệu trưởng phụ trách nghiên cứu / Trưởng bộ phận hệ thống thông tin sinh viên"},"challenge":{"title":{"en":"Grades, Records and Research IP in Too Many Hands","vi":"Điểm số, hồ sơ và tài sản trí tuệ nghiên cứu qua quá nhiều tay"},"body":{"en":"Student information and research databases are touched by administrators, developers, outsourced vendors and visiting researchers. Without query-level control, altered grades or copied research data may go unnoticed until a complaint or a dispute surfaces.","vi":"Cơ sở dữ liệu sinh viên và dữ liệu nghiên cứu được quản trị viên, lập trình viên, nhà thầu ngoài và nhà nghiên cứu khách truy cập. Thiếu kiểm soát ở mức truy vấn, điểm bị sửa hay dữ liệu nghiên cứu bị sao chép có thể không ai biết cho đến khi có khiếu nại hoặc tranh chấp."}},"solutions":["database-security","dlp"],"response":{"title":{"en":"Control who touches the record, and mask what they see","vi":"Kiểm soát ai chạm vào dữ liệu và che những gì họ nhìn thấy"},"body":{"en":"Query-level access control and real-time masking limit privileged and vendor access to student and research databases, while data loss prevention watches for copies leaving through everyday channels.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực giới hạn quyền của quản trị viên và nhà thầu trên CSDL sinh viên, nghiên cứu; chống thất thoát dữ liệu theo dõi các bản sao bị đưa ra qua kênh thường ngày."},"points":[{"en":"Restricts and audits privileged and vendor access","vi":"Hạn chế và kiểm toán quyền đặc quyền, quyền nhà thầu"},{"en":"Masks sensitive fields from unauthorized admins","vi":"Che trường nhạy cảm với quản trị viên không có quyền"},{"en":"Flags research files copied out via chat, webmail or USB","vi":"Cảnh báo tệp nghiên cứu bị sao chép qua chat, webmail, USB"}]},"scenario":{"en":"End of semester, 23:40. An outsourced vendor account opens the grades database, and no one on campus can say what it changed.","vi":"Cuối học kỳ, 23:40. Một tài khoản nhà cung cấp thuê ngoài mở cơ sở dữ liệu điểm, và không ai trong trường biết nó đã sửa gì."},"scene":{"kind":"mask","table":{"en":"Student records · grades","vi":"Hồ sơ sinh viên · điểm"},"actor":{"en":"Outsourced vendor","vi":"Nhà cung cấp ngoài"},"rows":[{"k":{"en":"Student","vi":"Sinh viên"},"v":"Sample Student A"},{"k":{"en":"Student ID","vi":"Mã sinh viên"},"v":"SV-000123","s":1},{"k":{"en":"Grade","vi":"Điểm"},"v":"8.5","s":1},{"k":{"en":"Guardian phone","vi":"SĐT phụ huynh"},"v":"09xx xxx xxx","s":1}],"before":{"en":"Unwatched","vi":"Không kiểm soát"},"after":{"en":"Controlled","vi":"Được kiểm soát"}}},{"id":"budget-sovereignty","persona":{"en":"CFO / Vice President of Finance","vi":"Giám đốc Tài chính / Phó hiệu trưởng phụ trách tài chính"},"challenge":{"title":{"en":"Tight Budgets and the Question of Where Data Lives","vi":"Ngân sách eo hẹp và câu hỏi dữ liệu đặt ở đâu"},"body":{"en":"Tuition-funded budgets leave little room for separate security tools or for rebuilding a data center. At the same time the board asks where student data is stored and who can reach it, and a patchwork of vendors makes that hard to answer.","vi":"Ngân sách chủ yếu từ học phí khó có dư địa cho từng công cụ an ninh riêng lẻ hay xây lại trung tâm dữ liệu. Trong khi đó hội đồng trường hỏi dữ liệu người học lưu ở đâu, ai truy cập được, và một mớ nhà cung cấp rời rạc khiến câu trả lời khó thống nhất."}},"solutions":["email-security","dlp","database-security"],"response":{"title":{"en":"One integrated, sovereign stack instead of scattered tools","vi":"Một bộ giải pháp tích hợp, chủ quyền thay vì công cụ rời rạc"},"body":{"en":"VCLOUD hosting in Vietnam combined with email, data and database protection from one alliance gives finance a single partner and cost line, and gives the board a clear answer on data location.","vi":"Hạ tầng VCLOUD tại Việt Nam kết hợp bảo vệ email, dữ liệu và cơ sở dữ liệu từ cùng một liên minh giúp khối tài chính làm việc với một đầu mối, một khoản chi, và giúp hội đồng trường có câu trả lời rõ ràng về nơi lưu trữ dữ liệu."},"points":[{"en":"Operating-cost model instead of heavy upfront hardware","vi":"Mô hình chi phí vận hành thay vì đầu tư phần cứng lớn ban đầu"},{"en":"Data kept inside Vietnam","vi":"Dữ liệu được giữ tại Việt Nam"},{"en":"One accountable partner across the stack","vi":"Một đối tác chịu trách nhiệm xuyên suốt"}]},"scenario":{"en":"Budget meeting, Thursday. The board asks where student data is stored and who can reach it, and finance has no single answer.","vi":"Họp ngân sách chiều thứ Năm. Hội đồng trường hỏi dữ liệu sinh viên được lưu ở đâu và ai truy cập được, còn phòng tài chính chưa có một câu trả lời thống nhất."},"scene":{"kind":"gate","dest":{"en":"Student data, Vietnam","vi":"Dữ liệu SV trong nước"},"src":{"en":"Access requests","vi":"Yêu cầu truy cập"},"bad":[{"en":"Unvetted vendor access","vi":"Bên thứ ba chưa duyệt"},{"en":"Copy to offshore host","vi":"Sao chép ra nước ngoài"},{"en":"Shadow IT mailbox","vi":"Hộp thư tự lập ngoài IT"}],"good":[{"en":"Registrar lookup","vi":"Phòng đào tạo tra cứu"},{"en":"Board data review","vi":"Hội đồng trường rà soát"},{"en":"Approved vendor","vi":"Nhà cung cấp đã duyệt"}],"before":{"en":"Unclear","vi":"Mơ hồ"},"after":{"en":"Clear","vi":"Rõ ràng"}}}],"outcomes":[{"title":{"en":"Keep Learning Running","vi":"Giữ việc dạy và học không gián đoạn"},"body":{"en":"Run admissions, LMS and exam systems on infrastructure planned for peak periods, so critical dates are not lost to downtime.","vi":"Vận hành tuyển sinh, LMS và thi cử trên hạ tầng được hoạch định cho mùa cao điểm, để những mốc thời gian quan trọng không bị mất vì gián đoạn."}},{"title":{"en":"Protect Students and Meet Decree 13","vi":"Bảo vệ người học và đáp ứng Nghị định 13"},"body":{"en":"Reduce the risk of phishing, leaks and unauthorized access to student and minors' data, with audit evidence when regulators or parents ask.","vi":"Giảm rủi ro phishing, rò rỉ và truy cập trái phép vào dữ liệu người học, trẻ em, kèm bằng chứng kiểm toán khi cơ quan quản lý hoặc phụ huynh yêu cầu."}},{"title":{"en":"Spend Smarter, Keep Data Sovereign","vi":"Chi tiêu hiệu quả, giữ chủ quyền dữ liệu"},"body":{"en":"Replace scattered tools and server rooms with one integrated stack hosted in Vietnam, easier to budget and to explain to the board.","vi":"Thay các công cụ rời rạc và phòng máy chủ bằng một bộ giải pháp tích hợp đặt tại Việt Nam, dễ lập ngân sách và dễ giải trình với hội đồng trường."}}],"faq":[{"q":{"en":"Why host the LMS and admissions portal on a Vietnam-based cloud?","vi":"Vì sao nên đặt LMS và cổng tuyển sinh trên đám mây tại Việt Nam?"},"a":{"en":"VCLOUD keeps student data inside Vietnam and lets you plan capacity around enrollment and exam peaks instead of sizing a server room for them. Specific capacity and SLA terms are agreed per project with the V-Tech Foundry team.","vi":"VCLOUD giữ dữ liệu người học trong nước và cho phép hoạch định năng lực theo đợt tuyển sinh, thi cử thay vì thiết kế phòng máy cho đúng đỉnh tải. Năng lực và cam kết dịch vụ cụ thể được thống nhất theo từng dự án cùng đội ngũ V-Tech Foundry."}},{"q":{"en":"How does the stack help with children's data under Decree 13?","vi":"Bộ giải pháp hỗ trợ thế nào với dữ liệu trẻ em theo Nghị định 13?"},"a":{"en":"Data Loss Prevention detects sensitive student records across chat, webmail and USB, and Database Security controls and masks access to records at the source. Together they provide visibility and audit evidence; legal obligations such as consent remain the institution's responsibility.","vi":"Giải pháp chống thất thoát dữ liệu nhận diện hồ sơ nhạy cảm trên chat, webmail, USB, còn bảo mật cơ sở dữ liệu kiểm soát và che giấu truy cập ngay tại nguồn. Cùng nhau chúng tạo khả năng quan sát và bằng chứng kiểm toán; các nghĩa vụ pháp lý như sự đồng ý của chủ thể dữ liệu vẫn thuộc trách nhiệm của nhà trường."}},{"q":{"en":"Can a school start small given limited budget?","vi":"Trường có ngân sách hạn chế có thể bắt đầu nhỏ không?"},"a":{"en":"Yes. Many institutions begin with email defense and VCLOUD hosting for the most exposed systems, then add data and database protection in phases. Scope and pricing are assessed with the V-Tech Foundry team.","vi":"Có. Nhiều đơn vị bắt đầu từ bảo vệ email và VCLOUD cho các hệ thống dễ bị tấn công nhất, sau đó bổ sung bảo vệ dữ liệu và cơ sở dữ liệu theo từng giai đoạn. Phạm vi và chi phí được đánh giá cùng đội ngũ V-Tech Foundry."}}],"newSolutions":[],"sources":["Decree 13/2023/ND-CP on personal data protection (Government of Vietnam; children's data provisions)","Law on Cybersecurity 2018 and Decree 53/2022/ND-CP (data localization)","data/solutions.json (V-Tech Foundry solution registry)","Web research not performed; relied on well-known public regulatory facts"]},{"id":"government","order":2,"icon":"building-2","name":{"en":"Government & Public Sector","vi":"Chính phủ & Khu vực công"},"title":{"en":"Government & Public Sector","vi":"Chính phủ & Khu vực công"},"tagline":{"en":"Sovereign VCLOUD & Email Security, Data Loss Prevention, Database Security and AI Legal & Compliance for agencies serving citizens.","vi":"VCLOUD & Email Security chủ quyền, Chống thất thoát dữ liệu, Bảo mật cơ sở dữ liệu và AI Legal & Compliance cho cơ quan nhà nước phục vụ người dân."},"bundle":["email-security","dlp","database-security","ai-legal"],"regulations":["Law on Cybersecurity","Decree 53/2022","Decree 13/2023","Law on Data 2024","Decree 85/2016 & TCVN 11930"],"challengesIntro":{"en":"Digital government programmes are moving citizen records, public services and inter-agency data onto shared platforms. That raises the stakes: agencies must keep services running, protect personal and state data, and demonstrate compliance with a growing body of cybersecurity and data law, often with lean IT teams.","vi":"Chuyển đổi số trong cơ quan nhà nước đưa hồ sơ công dân, dịch vụ công và dữ liệu liên thông lên các nền tảng dùng chung. Rủi ro vì thế tăng lên: cơ quan phải giữ dịch vụ vận hành liên tục, bảo vệ dữ liệu cá nhân và dữ liệu nhà nước, đồng thời chứng minh tuân thủ hệ thống pháp luật về an ninh mạng và dữ liệu ngày càng đầy đủ, trong khi nguồn lực CNTT thường mỏng."},"chapters":[{"id":"phishing","persona":{"en":"Head of Information Security (agency CISO)","vi":"Lãnh đạo An toàn thông tin của cơ quan"},"challenge":{"title":{"en":"Spear-phishing against officials and civil servants","vi":"Email giả mạo nhắm vào lãnh đạo và cán bộ"},"body":{"en":"Official mail is a favourite entry point: a message that imitates a superior, a ministry or a document circular can steal credentials or drop malware. Once inside one mailbox, attackers move towards shared drives and administrative systems.","vi":"Email công vụ là cửa vào ưa thích của kẻ tấn công: một thư giả danh cấp trên, bộ ngành hoặc công văn có thể lấy cắp tài khoản hoặc cài mã độc. Khi đã vào được một hộp thư, chúng dễ dàng di chuyển sang ổ chia sẻ và các hệ thống quản trị."}},"solutions":["email-security"],"response":{"title":{"en":"Filter the threat before it reaches the civil servant","vi":"Chặn mối đe dọa trước khi tới cán bộ"},"body":{"en":"Advanced email defense on VCLOUD screens phishing, impersonation of leaders and ransomware at the gateway, while mail data stays on infrastructure inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD lọc phishing, giả mạo lãnh đạo và ransomware ngay tại cổng thư, trong khi dữ liệu thư nằm trên hạ tầng đặt tại Việt Nam."},"points":[{"en":"Blocks phishing and leader impersonation","vi":"Chặn phishing và giả mạo lãnh đạo"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng thư"},{"en":"Hosted inside Vietnam","vi":"Lưu trữ ngay tại Việt Nam"}]},"scenario":{"en":"Monday, 08:30. A message that looks like a circular from the ministry lands in the leadership office mailbox, and the sender's name matches a real superior.","vi":"Sáng thứ Hai, 8:30. Một thư trông như công văn của bộ vừa đến hộp thư văn phòng lãnh đạo, tên người gửi trùng với một cấp trên có thật."},"scene":{"kind":"gate","dest":{"en":"Official mailbox","vi":"Hộp thư công vụ"},"src":{"en":"Incoming mail","vi":"Thư đến"},"bad":[{"en":"Fake ministry circular","vi":"Công văn giả mạo"},{"en":"Leader impersonation","vi":"Giả mạo lãnh đạo"},{"en":"Malware attachment","vi":"Tệp đính kèm mã độc"}],"good":[{"en":"Official dispatch","vi":"Công văn chính thức"},{"en":"Inter-agency report","vi":"Báo cáo liên cơ quan"},{"en":"Citizen enquiry","vi":"Kiến nghị của người dân"}],"before":{"en":"Exposed","vi":"Rủi ro cao"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"citizen-data","persona":{"en":"Head of Department / Director of Public Service Delivery","vi":"Thủ trưởng đơn vị / Giám đốc trung tâm phục vụ hành chính công"},"challenge":{"title":{"en":"Citizen records leaking and public trust eroding","vi":"Hồ sơ công dân bị lộ, niềm tin xã hội suy giảm"},"body":{"en":"Agencies hold identity, tax, health, land and social-insurance records. A single officer copying files to a personal webmail, chat app or USB drive can expose thousands of citizens, trigger public complaints and put leadership accountable.","vi":"Cơ quan nhà nước nắm giữ dữ liệu định danh, thuế, y tế, đất đai, bảo hiểm xã hội. Chỉ một cán bộ sao chép tệp sang webmail cá nhân, ứng dụng chat hoặc USB cũng có thể làm lộ thông tin hàng nghìn người dân, dẫn đến phản ánh dư luận và trách nhiệm của người đứng đầu."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive records wherever they try to leave","vi":"Thấy hồ sơ nhạy cảm ở bất cứ nơi nào chúng cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives automatically recognises citizen records and stops leaks, whether accidental or deliberate.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ công dân và ngăn rò rỉ, dù vô ý hay cố ý."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects personal data","vi":"Tự nhận diện dữ liệu cá nhân"},{"en":"Incident evidence for investigation","vi":"Bằng chứng phục vụ điều tra sự cố"}]},"scenario":{"en":"Friday, 16:55. An officer in the service centre copies a batch of citizen files to a personal account before heading home.","vi":"Chiều thứ Sáu, 16:55. Một cán bộ ở trung tâm hành chính công chép một loạt hồ sơ công dân vào tài khoản cá nhân trước khi ra về."},"scene":{"kind":"perimeter","asset":{"en":"Citizen records","vi":"Hồ sơ công dân"},"channels":[{"en":"Chat apps","vi":"Ứng dụng chat","icon":"message-circle"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"privileged-access","persona":{"en":"Head of IT / Database Administration","vi":"Trưởng phòng CNTT / Quản trị cơ sở dữ liệu"},"challenge":{"title":{"en":"Who can see the national and sectoral databases?","vi":"Ai được xem các cơ sở dữ liệu quốc gia và chuyên ngành?"},"body":{"en":"Administrators, outsourced developers and integration partners often hold broad access to population, tax or licensing databases. Without query-level control, misuse of privileges is hard to detect and harder to prove.","vi":"Quản trị viên, đơn vị phát triển thuê ngoài và đối tác tích hợp thường có quyền rộng trên các cơ sở dữ liệu dân cư, thuế, cấp phép. Thiếu kiểm soát ở mức truy vấn, việc lạm quyền khó phát hiện và càng khó chứng minh."}},"solutions":["database-security"],"response":{"title":{"en":"Every query controlled, sensitive fields masked","vi":"Kiểm soát từng truy vấn, che giấu trường dữ liệu nhạy cảm"},"body":{"en":"Query-level access control and real-time masking limit what administrators and partners can read or change, without slowing live public services.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực giới hạn những gì quản trị viên và đối tác được đọc hoặc sửa, không làm chậm dịch vụ công đang vận hành."},"points":[{"en":"Restricts direct database access","vi":"Hạn chế truy cập trực tiếp vào CSDL"},{"en":"Masks ID numbers and personal fields","vi":"Che số định danh và trường dữ liệu cá nhân"},{"en":"Full audit trail of privileged activity","vi":"Nhật ký kiểm toán đầy đủ hoạt động đặc quyền"}]},"scenario":{"en":"02:15 a.m. An outsourced account with broad rights runs a full query on the population database, and nobody on the team is watching.","vi":"2:15 sáng. Một tài khoản thuê ngoài có quyền rộng chạy truy vấn toàn bộ cơ sở dữ liệu dân cư, và không ai trong đội đang theo dõi."},"scene":{"kind":"mask","table":{"en":"Population database","vi":"CSDL dân cư"},"actor":{"en":"Outsourced admin","vi":"Quản trị thuê ngoài"},"query":{"en":"SELECT *","vi":"SELECT *"},"approved":{"en":"Approved · masked","vi":"Đã duyệt · đã che"},"rows":[{"k":{"en":"Citizen","vi":"Công dân"},"v":"Nguyen Van A"},{"k":{"en":"ID number","vi":"Số định danh"},"v":"000 000 000 000","s":1},{"k":{"en":"Address","vi":"Địa chỉ"},"v":"00 Sample Street","s":1},{"k":{"en":"Tax code","vi":"Mã số thuế"},"v":"0000000000","s":1}],"before":{"en":"Unwatched","vi":"Buông lỏng"},"after":{"en":"Controlled","vi":"Có kiểm soát"}}},{"id":"compliance","persona":{"en":"CIO / Chief of Office","vi":"Giám đốc CNTT / Chánh Văn phòng"},"challenge":{"title":{"en":"Proving compliance with cybersecurity and data law","vi":"Chứng minh tuân thủ pháp luật về an ninh mạng và dữ liệu"},"body":{"en":"Agencies must classify systems by security level (Decree 85/2016, TCVN 11930), protect personal data (Decree 13/2023), and follow data rules under the Law on Cybersecurity, Decree 53/2022 and the Law on Data 2024. Inspectors expect evidence, not intentions.","vi":"Cơ quan phải xác định cấp độ an toàn hệ thống thông tin (Nghị định 85/2016, TCVN 11930), bảo vệ dữ liệu cá nhân (Nghị định 13/2023) và tuân thủ quy định về dữ liệu theo Luật An ninh mạng, Nghị định 53/2022 và Luật Dữ liệu 2024. Đoàn kiểm tra cần bằng chứng chứ không chỉ cam kết."}},"solutions":["email-security","dlp"],"response":{"title":{"en":"Data stays in Vietnam, controls leave evidence","vi":"Dữ liệu ở lại Việt Nam, kiểm soát để lại bằng chứng"},"body":{"en":"VCLOUD keeps data on infrastructure in Vietnam, while data-loss controls and logs give the CIO a record to support audits and Decree 13 obligations. Final classification and certification remain the agency's responsibility.","vi":"VCLOUD giữ dữ liệu trên hạ tầng tại Việt Nam, còn các kiểm soát chống thất thoát và nhật ký giúp CIO có hồ sơ phục vụ kiểm tra và nghĩa vụ theo Nghị định 13. Việc xác định cấp độ và thẩm định cuối cùng vẫn thuộc trách nhiệm của cơ quan."},"points":[{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền tại Việt Nam"},{"en":"Controls mapped to personal-data duties","vi":"Kiểm soát gắn với nghĩa vụ bảo vệ dữ liệu cá nhân"},{"en":"Audit-ready logs and reports","vi":"Nhật ký và báo cáo sẵn sàng cho kiểm tra"}]},"scenario":{"en":"The inspection team arrives next week, and the Chief of Office is asked to show where official mail is hosted and who has handled it.","vi":"Tuần sau đoàn kiểm tra đến làm việc, và Chánh Văn phòng được yêu cầu chỉ rõ thư công vụ đặt ở đâu và ai đã xử lý."},"scene":{"kind":"gate","dest":{"en":"Sovereign mail system","vi":"Hệ thống thư chủ quyền"},"src":{"en":"Mail traffic","vi":"Luồng thư"},"bad":[{"en":"Mail routed abroad","vi":"Thư đi ra nước ngoài"},{"en":"Spoofed ministry mail","vi":"Thư giả danh bộ ngành"},{"en":"Mail with no audit log","vi":"Thư không có nhật ký"}],"good":[{"en":"Logged official mail","vi":"Thư công vụ có nhật ký"},{"en":"Inspection request","vi":"Công văn kiểm tra"},{"en":"Archived dispatch","vi":"Công văn đã lưu trữ"}],"before":{"en":"Undocumented","vi":"Thiếu hồ sơ"},"after":{"en":"Audit-ready","vi":"Đủ hồ sơ"}}},{"id":"legal-ops","persona":{"en":"Head of Legal & Administrative Affairs","vi":"Trưởng phòng Pháp chế & Hành chính"},"challenge":{"title":{"en":"Legal documents multiplying faster than teams can read them","vi":"Văn bản pháp luật tăng nhanh hơn khả năng đọc của đội ngũ"},"body":{"en":"Decrees, circulars and internal procedures change constantly. Reviewing drafts, contracts and administrative decisions by hand is slow, and sending them to public AI tools risks exposing non-public information.","vi":"Nghị định, thông tư và quy trình nội bộ thay đổi liên tục. Rà soát dự thảo, hợp đồng và quyết định hành chính thủ công rất chậm, còn đưa tài liệu lên công cụ AI công cộng có nguy cơ lộ thông tin không công khai."}},"solutions":["ai-legal"],"response":{"title":{"en":"A legal assistant that stays inside your walls","vi":"Trợ lý pháp lý chạy trong hệ thống của bạn"},"body":{"en":"The AI Legal assistant supports document and contract review against regulation, with an on-premise option so sensitive documents never leave the agency.","vi":"Trợ lý AI Legal hỗ trợ rà soát văn bản, hợp đồng theo quy định hiện hành, có tùy chọn on-premise để tài liệu nhạy cảm không rời khỏi cơ quan."},"points":[{"en":"Speeds up routine review","vi":"Rút ngắn rà soát thường nhật"},{"en":"On-premise option for privacy","vi":"Tùy chọn on-premise bảo mật dữ liệu"},{"en":"Frees staff for judgement work","vi":"Giải phóng cán bộ cho công việc cần phán đoán"}]},"scenario":{"en":"Tuesday, 09:00. A draft decree and three amended circulars land on the desk of the legal office, and the leadership wants comments by the end of the day.","vi":"Sáng thứ Ba, 9:00. Một dự thảo nghị định và ba thông tư sửa đổi cùng đổ về phòng pháp chế, còn lãnh đạo cần ý kiến trước cuối ngày."},"scene":{"kind":"scan","doc":{"en":"Draft decree","vi":"Dự thảo nghị định"},"flags":[{"en":"Outdated citation","vi":"Viện dẫn lỗi thời"},{"en":"Article conflict","vi":"Trái quy định"},{"en":"Missing authority","vi":"Thiếu thẩm quyền"}],"timeBefore":{"en":"Days","vi":"Nhiều ngày"},"timeAfter":{"en":"Minutes","vi":"Vài phút"},"perDoc":{"en":"per draft review","vi":"mỗi dự thảo"},"before":{"en":"Manual","vi":"Thủ công"},"after":{"en":"Automated","vi":"Tự động"}}}],"outcomes":[{"title":{"en":"Protect Citizen Data & Public Trust","vi":"Bảo vệ dữ liệu công dân & niềm tin xã hội"},"body":{"en":"Cover email, endpoints and databases so citizen and state data is protected from external attack and internal misuse.","vi":"Bao phủ email, thiết bị đầu cuối và cơ sở dữ liệu để dữ liệu công dân và dữ liệu nhà nước được bảo vệ trước tấn công bên ngoài lẫn lạm dụng nội bộ."}},{"title":{"en":"Be Ready for Inspection","vi":"Sẵn sàng cho thanh tra, kiểm tra"},"body":{"en":"Hosting in Vietnam, access controls and audit logs help agencies prepare evidence for security-level and data-protection reviews.","vi":"Lưu trữ tại Việt Nam, kiểm soát truy cập và nhật ký kiểm toán giúp cơ quan chuẩn bị hồ sơ cho đánh giá cấp độ an toàn và bảo vệ dữ liệu."}},{"title":{"en":"Do More with Lean IT Teams","vi":"Làm nhiều hơn với đội CNTT tinh gọn"},"body":{"en":"One integrated package from a local partner reduces vendor sprawl, manual review and incident-response effort.","vi":"Một gói tích hợp từ đối tác trong nước giúp giảm số nhà cung cấp, rà soát thủ công và công sức xử lý sự cố."}}],"faq":[{"q":{"en":"Does data stay in Vietnam?","vi":"Dữ liệu có được lưu tại Việt Nam không?"},"a":{"en":"VCLOUD is hosted on infrastructure in Vietnam, and AI Legal offers an on-premise option. Confirm the exact deployment against your system's security level with the V-Tech Foundry team.","vi":"VCLOUD đặt trên hạ tầng tại Việt Nam, AI Legal có tùy chọn on-premise. Vui lòng xác nhận phương án triển khai cụ thể theo cấp độ an toàn hệ thống của đơn vị cùng đội ngũ V-Tech Foundry."}},{"q":{"en":"How does this support Decree 13/2023 on personal data?","vi":"Giải pháp hỗ trợ Nghị định 13/2023 về bảo vệ dữ liệu cá nhân thế nào?"},"a":{"en":"Data Loss Prevention detects personal data leaving via chat, webmail and USB, and Database Security masks sensitive fields and logs privileged access. These are technical controls that support, not replace, your own compliance process.","vi":"DLP phát hiện dữ liệu cá nhân bị đưa ra qua chat, webmail, USB; Database Security che trường nhạy cảm và ghi nhật ký truy cập đặc quyền. Đây là các biện pháp kỹ thuật hỗ trợ, không thay thế quy trình tuân thủ của đơn vị."}},{"q":{"en":"Can the bundle be adopted in stages?","vi":"Có thể triển khai theo từng giai đoạn không?"},"a":{"en":"Yes. Many agencies start with email protection or data-loss prevention and add database security and AI Legal as budgets and priorities allow.","vi":"Có. Nhiều cơ quan bắt đầu từ bảo vệ email hoặc chống thất thoát dữ liệu rồi bổ sung bảo mật cơ sở dữ liệu và AI Legal theo ngân sách và mức ưu tiên."}}],"newSolutions":[],"sources":["Public Vietnamese legal framework (Law on Cybersecurity 2018; Decree 85/2016/ND-CP; TCVN 11930:2017; Decree 53/2022/ND-CP; Decree 13/2023/ND-CP; Law on Data 2024) cited from general knowledge; vnetwork.vn blocked by egress proxy"]},{"id":"healthcare","order":3,"icon":"heart-pulse","name":{"en":"Healthcare","vi":"Y tế"},"title":{"en":"Healthcare: Hospitals, Clinics, Pharma & Health Insurance","vi":"Y tế: Bệnh viện, Phòng khám, Dược phẩm & Bảo hiểm sức khỏe"},"tagline":{"en":"VCLOUD & Email Security, Database Security, Data Loss Prevention and AI Legal & Compliance to protect patient records and keep care running.","vi":"VCLOUD & Email Security, Bảo mật cơ sở dữ liệu, Chống thất thoát dữ liệu và AI Legal & Compliance để bảo vệ hồ sơ bệnh nhân và giữ vận hành khám chữa bệnh liên tục."},"bundle":["email-security","database-security","dlp","ai-legal"],"regulations":["Decree 13/2023","Law on Data 2024","Law on Medical Examination and Treatment","MoH EMR rules"],"challengesIntro":{"en":"Health data is classed as sensitive personal data under Decree 13/2023, while hospitals digitise records, connect HIS, LIS and PACS systems and open online booking. Vietnamese hospitals have already been hit by ransomware and data-sale incidents, so the CIO now answers for both patient safety and legal exposure.","vi":"Dữ liệu sức khỏe là dữ liệu cá nhân nhạy cảm theo Nghị định 13/2023/NĐ-CP, trong khi bệnh viện số hóa hồ sơ, kết nối HIS, LIS, PACS và mở đặt lịch khám trực tuyến. Nhiều bệnh viện tại Việt Nam đã bị ransomware và rao bán dữ liệu, nên CIO giờ phải chịu trách nhiệm đồng thời về an toàn người bệnh và rủi ro pháp lý."},"chapters":[{"id":"ransomware","persona":{"en":"Hospital CIO / Head of IT","vi":"Giám đốc CNTT bệnh viện"},"challenge":{"title":{"en":"Ransomware That Stops the Wards","vi":"Ransomware làm tê liệt khoa phòng"},"body":{"en":"One phishing email opened at a reception desk can encrypt servers behind the hospital information system. Registration, lab results and billing stop, staff fall back to paper, and patients wait. Public reports describe Vietnamese hospitals suffering exactly this.","vi":"Chỉ một email phishing được mở ở quầy tiếp đón cũng có thể mã hóa máy chủ của hệ thống thông tin bệnh viện. Tiếp đón, kết quả xét nghiệm và viện phí dừng lại, nhân viên quay về giấy tờ, người bệnh phải chờ. Báo chí đã đưa tin một số bệnh viện tại Việt Nam gặp đúng tình huống này."}},"solutions":["email-security"],"response":{"title":{"en":"Stop the first click, keep data in Vietnam","vi":"Chặn cú click đầu tiên, giữ dữ liệu tại Việt Nam"},"body":{"en":"Advanced email defense on VCLOUD filters phishing and ransomware attachments before they reach clinical and admin staff, on infrastructure hosted inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD lọc phishing và tệp đính kèm ransomware trước khi tới nhân viên y tế và hành chính, trên hạ tầng đặt tại Việt Nam."},"points":[{"en":"Blocks phishing and spoofed senders","vi":"Chặn phishing và giả mạo người gửi"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Sovereign hosting inside Vietnam","vi":"Lưu trữ chủ quyền ngay tại Việt Nam"}]},"scenario":{"en":"Monday, 07:55. The waiting hall is filling up when a \"lab result\" email lands at reception, one click away from the hospital information system.","vi":"Sáng thứ Hai, 7:55. Sảnh chờ đang đông dần thì một email \"kết quả xét nghiệm\" đến quầy tiếp đón, chỉ cách hệ thống thông tin bệnh viện một cú click."},"scene":{"kind":"gate","dest":{"en":"Hospital mailboxes","vi":"Hộp thư bệnh viện"},"src":{"en":"Incoming mail","vi":"Thư đến"},"bad":[{"en":"Fake lab result","vi":"Kết quả XN giả mạo"},{"en":"Ransomware invoice","vi":"Hoá đơn chứa ransomware"},{"en":"Spoofed vendor sender","vi":"Giả mạo nhà cung cấp"}],"good":[{"en":"Clinic referral","vi":"Giấy chuyển tuyến"},{"en":"Appointment booking","vi":"Đặt lịch khám"},{"en":"Insurer reply","vi":"Phản hồi từ bảo hiểm"}],"before":{"en":"At risk","vi":"Có rủi ro"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"records-access","persona":{"en":"Head of HIS / EMR & DBA Lead","vi":"Trưởng phòng HIS / bệnh án điện tử & DBA"},"challenge":{"title":{"en":"Too Many People Can Open the Patient Record","vi":"Quá nhiều người có thể mở hồ sơ bệnh án"},"body":{"en":"Electronic medical records are touched by clinicians, administrators, software vendors and outsourced maintenance staff. Without query-level control, a privileged account can read or export diagnoses of staff, officials or public figures and nobody notices until it surfaces online.","vi":"Bệnh án điện tử được nhiều đối tượng truy cập: bác sĩ, quản trị viên, nhà cung cấp phần mềm và đơn vị bảo trì thuê ngoài. Thiếu kiểm soát ở mức truy vấn, một tài khoản đặc quyền có thể đọc hoặc xuất chẩn đoán của nhân viên, cán bộ hay người nổi tiếng mà không ai hay biết cho đến khi dữ liệu xuất hiện trên mạng."}},"solutions":["database-security"],"response":{"title":{"en":"Every query seen, every diagnosis masked","vi":"Mọi truy vấn đều được thấy, mọi chẩn đoán đều được che"},"body":{"en":"Query-level access control and real-time masking let each role see only what care requires, and leave an audit trail for vendor and admin sessions, without slowing the HIS.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực giúp mỗi vai trò chỉ thấy phần dữ liệu cần cho điều trị, đồng thời lưu nhật ký cho phiên của nhà cung cấp và quản trị viên mà không làm chậm HIS."},"points":[{"en":"Proxy gateway restricts direct database access","vi":"Cổng proxy hạn chế truy cập trực tiếp CSDL"},{"en":"Patient identity and diagnosis masked for unauthorized users","vi":"Che danh tính và chẩn đoán với người không có quyền"},{"en":"Full audit trail of vendor and admin sessions","vi":"Nhật ký đầy đủ phiên của nhà cung cấp và quản trị viên"}]},"scenario":{"en":"Saturday, 23:30. A vendor maintenance account runs a broad query on the patient record table, and the on-call DBA is asleep.","vi":"23:30 tối thứ Bảy. Một tài khoản bảo trì của nhà cung cấp chạy truy vấn rộng trên bảng bệnh án, còn DBA trực đang ngủ."},"scene":{"kind":"mask","table":{"en":"HIS · patient records","vi":"HIS · hồ sơ bệnh án"},"actor":{"en":"Vendor admin","vi":"Quản trị nhà cung cấp"},"rows":[{"k":{"en":"Patient","vi":"Bệnh nhân"},"v":"Nguyen Van A"},{"k":{"en":"Diagnosis","vi":"Chẩn đoán"},"v":"Type 2 diabetes","s":1},{"k":{"en":"Insurance no.","vi":"Số thẻ BHYT"},"v":"XX 0 00 0000000000","s":1},{"k":{"en":"ID number","vi":"Số CCCD"},"v":"001 234 567 890","s":1}],"before":{"en":"Unwatched","vi":"Không giám sát"},"after":{"en":"Controlled","vi":"Được kiểm soát"}}},{"id":"leak","persona":{"en":"Data Protection Officer / Head of Compliance","vi":"Cán bộ bảo vệ dữ liệu / Trưởng phòng tuân thủ"},"challenge":{"title":{"en":"Patient Data Walking Out the Door","vi":"Dữ liệu bệnh nhân bị mang ra ngoài"},"body":{"en":"Lab reports sent by personal chat apps, files copied to USB drives, records forwarded to private webmail: well-meaning staff create leaks daily. Health data is sensitive data under Decree 13/2023, and reported cases of patient records offered for sale show the reputational cost.","vi":"Kết quả xét nghiệm gửi qua ứng dụng chat cá nhân, tệp chép ra USB, hồ sơ chuyển sang webmail riêng: nhân viên có thiện chí vẫn tạo ra rò rỉ mỗi ngày. Dữ liệu sức khỏe là dữ liệu nhạy cảm theo Nghị định 13/2023/NĐ-CP, và các vụ hồ sơ bệnh nhân bị rao bán được đưa tin cho thấy thiệt hại về uy tín."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive records wherever they try to leave","vi":"Thấy hồ sơ nhạy cảm ở mọi nơi chúng cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects patient records automatically, stops insider leaks and supports Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ bệnh nhân, ngăn rò rỉ từ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects patient and insurance records","vi":"Tự nhận diện hồ sơ bệnh nhân và bảo hiểm"},{"en":"Evidence ready for audits and incident reports","vi":"Bằng chứng sẵn sàng cho kiểm toán và báo cáo sự cố"}]},"scenario":{"en":"Thursday, 17:40. A well-meaning technician sends lab results from a personal chat app so a family can see them tonight.","vi":"Chiều thứ Năm, 17:40. Một kỹ thuật viên có thiện chí gửi kết quả xét nghiệm qua ứng dụng chat cá nhân để gia đình bệnh nhân xem ngay tối nay."},"scene":{"kind":"perimeter","asset":{"en":"Patient lab results","vi":"Kết quả xét nghiệm"},"channels":[{"en":"Personal chat","vi":"Chat cá nhân","icon":"message-circle"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã kiểm soát"}}},{"id":"insurance-docs","persona":{"en":"Head of Health Insurance Claims / Legal","vi":"Trưởng bộ phận giám định bảo hiểm / Pháp chế"},"challenge":{"title":{"en":"Claims and Contracts Reviewed by Hand","vi":"Hợp đồng và hồ sơ bồi thường rà soát thủ công"},"body":{"en":"Insurance contracts, supplier agreements and consent forms must be read line by line against changing health, data and insurance rules. The backlog slows reimbursement and puts pressure on a small legal team.","vi":"Hợp đồng bảo hiểm, hợp đồng nhà cung cấp và mẫu đồng ý xử lý dữ liệu phải đọc từng điều khoản theo quy định y tế, dữ liệu và bảo hiểm luôn thay đổi. Tồn đọng làm chậm chi trả và tạo áp lực lên đội pháp chế vốn mỏng."}},"solutions":["ai-legal"],"response":{"title":{"en":"Review faster without moving documents out","vi":"Rà soát nhanh hơn mà không đưa tài liệu ra ngoài"},"body":{"en":"An AI assistant for contract and regulation review, with an on-premise option so sensitive documents stay inside your own environment. Regulatory coverage for health rules should be scoped with V-Tech Foundry during assessment.","vi":"Trợ lý AI rà soát hợp đồng và quy định, có tùy chọn on-premise để tài liệu nhạy cảm nằm trong hệ thống của bạn. Phạm vi quy định ngành y tế cần được xác nhận cùng V-Tech Foundry khi khảo sát."},"points":[{"en":"Automated contract and clause review","vi":"Tự động rà soát hợp đồng và điều khoản"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal staff for complex cases","vi":"Giải phóng pháp chế cho ca phức tạp"}]},"scenario":{"en":"Tuesday, 09:15. A pile of insurance contracts and consent forms waits on one legal desk while reimbursements queue behind it.","vi":"9:15 sáng thứ Ba. Một chồng hợp đồng bảo hiểm và mẫu đồng ý nằm chờ trên bàn pháp chế, còn các khoản chi trả xếp hàng phía sau."},"scene":{"kind":"scan","doc":{"en":"Insurance contract","vi":"Hợp đồng bảo hiểm"},"flags":[{"en":"Missing consent","vi":"Thiếu đồng ý"},{"en":"Coverage gap","vi":"Hở phạm vi chi trả"},{"en":"Rule conflict","vi":"Xung đột quy định"}],"timeBefore":{"en":"Days","vi":"Nhiều ngày"},"timeAfter":{"en":"Minutes","vi":"Vài phút"},"perDoc":{"en":"per claims file","vi":"mỗi hồ sơ bồi thường"},"before":{"en":"Manual","vi":"Thủ công"},"after":{"en":"Automated","vi":"Tự động"}}},{"id":"sovereignty","persona":{"en":"CFO / Board Sponsor","vi":"Giám đốc Tài chính / Lãnh đạo phụ trách"},"challenge":{"title":{"en":"Compliance Cost and Data Residency","vi":"Chi phí tuân thủ và vị trí lưu trữ dữ liệu"},"body":{"en":"The Law on Data 2024, Decree 13 and the Law on Medical Examination and Treatment all raise expectations on how health data is stored and protected. Leaders want one accountable partner instead of five vendors, and a clear budget line.","vi":"Luật Dữ liệu 2024, Nghị định 13 và Luật Khám bệnh, chữa bệnh đều nâng yêu cầu về cách lưu trữ và bảo vệ dữ liệu sức khỏe. Ban lãnh đạo cần một đối tác chịu trách nhiệm thay vì năm nhà cung cấp, và một khoản ngân sách rõ ràng."}},"solutions":["email-security","dlp","database-security"],"response":{"title":{"en":"One integrated package, hosted in Vietnam","vi":"Một gói tích hợp, đặt tại Việt Nam"},"body":{"en":"Email defense, data-loss prevention and database security work together on VCLOUD infrastructure in Vietnam, giving one partner, one audit story and a predictable scope.","vi":"Bảo vệ email, chống thất thoát dữ liệu và bảo mật cơ sở dữ liệu phối hợp trên hạ tầng VCLOUD tại Việt Nam, với một đối tác, một câu chuyện kiểm toán và phạm vi dự toán rõ ràng."},"points":[{"en":"Single accountable partner","vi":"Một đối tác chịu trách nhiệm"},{"en":"Data hosted inside Vietnam","vi":"Dữ liệu đặt tại Việt Nam"},{"en":"Consistent evidence across layers","vi":"Bằng chứng nhất quán trên mọi lớp"}]},"scenario":{"en":"Friday board meeting. The CFO asks who answers for patient data across five vendors, and where that data actually sits.","vi":"Họp ban lãnh đạo sáng thứ Sáu. Giám đốc Tài chính hỏi ai chịu trách nhiệm về dữ liệu bệnh nhân giữa năm nhà cung cấp, và dữ liệu đó thực sự nằm ở đâu."},"scene":{"kind":"gate","dest":{"en":"Mail and records","vi":"Thư và hồ sơ"},"src":{"en":"Outside senders","vi":"Người gửi bên ngoài"},"bad":[{"en":"Spoofed audit notice","vi":"Giả thông báo kiểm tra"},{"en":"Unvetted vendor mail","vi":"Thư nhà cung cấp lạ"},{"en":"Offshore data request","vi":"Yêu cầu dữ liệu ra ngoài"}],"good":[{"en":"Ministry circular","vi":"Công văn Bộ Y tế"},{"en":"Insurer reconciliation","vi":"Đối soát bảo hiểm"},{"en":"Auditor request","vi":"Yêu cầu kiểm toán"}],"before":{"en":"Scattered","vi":"Rời rạc"},"after":{"en":"Unified","vi":"Thống nhất"}}}],"outcomes":[{"title":{"en":"Keep Care Running","vi":"Giữ vận hành khám chữa bệnh liên tục"},"body":{"en":"Cut the most common entry points for ransomware so registration, labs and billing stay available to patients.","vi":"Giảm các cửa ngõ phổ biến của ransomware để tiếp đón, xét nghiệm và viện phí luôn sẵn sàng phục vụ người bệnh."}},{"title":{"en":"Protect Patient Trust","vi":"Bảo vệ niềm tin người bệnh"},"body":{"en":"Control who can see, copy or send patient records across email, devices and databases, with evidence for every access.","vi":"Kiểm soát ai được xem, sao chép hoặc gửi hồ sơ bệnh nhân qua email, thiết bị và cơ sở dữ liệu, có bằng chứng cho mọi lần truy cập."}},{"title":{"en":"Prepare for Compliance","vi":"Chuẩn bị cho tuân thủ"},"body":{"en":"Sovereign hosting and data controls help hospitals prepare for Decree 13, the Law on Data and sector audits.","vi":"Lưu trữ chủ quyền và các kiểm soát dữ liệu giúp bệnh viện chuẩn bị cho Nghị định 13, Luật Dữ liệu và các đợt kiểm tra ngành."}}],"faq":[{"q":{"en":"Is health data really treated as sensitive under Vietnamese law?","vi":"Dữ liệu sức khỏe có thực sự là dữ liệu nhạy cảm theo pháp luật Việt Nam?"},"a":{"en":"Yes. Decree 13/2023/NĐ-CP lists health and medical-record information as sensitive personal data, which requires stricter protection measures and impact assessment. Confirm exact obligations with your legal counsel.","vi":"Có. Nghị định 13/2023/NĐ-CP xếp thông tin sức khỏe, tình trạng bệnh án là dữ liệu cá nhân nhạy cảm, đòi hỏi biện pháp bảo vệ chặt chẽ hơn và đánh giá tác động xử lý dữ liệu. Nên xác nhận nghĩa vụ cụ thể với tư vấn pháp lý của đơn vị."}},{"q":{"en":"How do you protect the HIS and EMR database from vendor and admin accounts?","vi":"Làm sao bảo vệ CSDL HIS và bệnh án điện tử trước tài khoản nhà cung cấp và quản trị viên?"},"a":{"en":"Database Security restricts direct access through a proxy gateway, controls access per query, masks sensitive fields in real time and records every session for audit.","vi":"Giải pháp Bảo mật cơ sở dữ liệu hạn chế truy cập trực tiếp qua cổng proxy, kiểm soát theo từng truy vấn, che giấu trường nhạy cảm theo thời gian thực và ghi lại mọi phiên để kiểm toán."}},{"q":{"en":"Can patient data stay inside Vietnam?","vi":"Dữ liệu bệnh nhân có thể nằm hoàn toàn tại Việt Nam không?"},"a":{"en":"VCLOUD is hosted in Vietnam, and the AI Legal assistant offers an on-premise option for documents that must not leave your network.","vi":"VCLOUD đặt tại Việt Nam, và trợ lý AI Legal có tùy chọn on-premise cho tài liệu không được rời khỏi mạng nội bộ."}},{"q":{"en":"Where do we start if budget is limited?","vi":"Nên bắt đầu từ đâu nếu ngân sách hạn chế?"},"a":{"en":"Most hospitals start with email defense and the HIS database, the two most exposed layers, then add data-loss prevention. V-Tech Foundry can scope a phased plan.","vi":"Đa số bệnh viện bắt đầu từ bảo vệ email và CSDL HIS, hai lớp dễ bị tấn công nhất, rồi bổ sung chống thất thoát dữ liệu. V-Tech Foundry có thể xây dựng lộ trình theo giai đoạn."}}],"newSolutions":[],"sources":["https://vietnamnet.vn/nhieu-benh-vien-lon-bi-tan-cong-mang-du-lieu-benh-nhan-bi-rao-ban-2447913.html","https://redhotcyber.com/en/post/vietnam-hong-ngoc-hospital-on-breach-forums-112621-patient-and-doctor-profiles-compromised","Decree 13/2023/ND-CP (public text)","Law on Data 2024; Law on Medical Examination and Treatment 2023 (public text)"]},{"id":"logistics","order":6,"icon":"truck","name":{"en":"Logistics","vi":"Logistics - Vận tải - Kho vận"},"title":{"en":"Logistics: Freight Forwarding, Warehousing, Last Mile & Ports","vi":"Logistics: Giao nhận, Kho vận, Chặng cuối & Cảng"},"tagline":{"en":"VCLOUD & Email Security, Database Security, Data Loss Prevention and AI Legal & Compliance for supply chains that cannot stop moving.","vi":"VCLOUD & Email Security, Bảo mật cơ sở dữ liệu, Chống thất thoát dữ liệu và AI Legal & Compliance cho chuỗi cung ứng không được phép dừng."},"bundle":["email-security","database-security","dlp","ai-legal"],"regulations":["Decree 13","Cybersecurity Law","Data Law","Customs Law"],"challengesIntro":{"en":"Logistics runs on a chain of handoffs: shippers, forwarders, carriers, warehouses, ports, customs and drivers, all exchanging documents and payment instructions by email and apps. One forged invoice, one stalled tracking or WMS/TMS system, or one leaked customer list can stop cargo and cash at the same time.","vi":"Logistics vận hành bằng chuỗi bàn giao giữa chủ hàng, hãng giao nhận, hãng vận tải, kho, cảng, hải quan và tài xế, tất cả trao đổi chứng từ và chỉ thị thanh toán qua email và ứng dụng. Một hóa đơn giả, một hệ thống tracking hay WMS/TMS bị đình trệ, hoặc một danh sách khách hàng bị lộ đều có thể làm đứt cả dòng hàng lẫn dòng tiền."},"chapters":[{"id":"bec","persona":{"en":"CFO / Head of Finance","vi":"Giám đốc Tài chính (CFO) / Kế toán trưởng"},"challenge":{"title":{"en":"Fake Shipping and Invoice Emails Divert Payments","vi":"Email giả mạo hãng tàu, hóa đơn chuyển hướng thanh toán"},"body":{"en":"Forwarders handle a constant flow of freight invoices, booking confirmations and bank-detail updates. An email that imitates a carrier, agent or supplier and asks to pay a new account is easy to miss in a busy week, and a transfer is hard to recall once sent.","vi":"Doanh nghiệp giao nhận xử lý liên tục hóa đơn cước, xác nhận booking và thông báo đổi tài khoản ngân hàng. Một email giả danh hãng tàu, đại lý hay nhà cung cấp yêu cầu chuyển tiền sang tài khoản mới rất dễ lọt qua trong những tuần cao điểm, và khi tiền đã chuyển đi thì rất khó thu hồi."}},"solutions":["email-security"],"response":{"title":{"en":"Stop the fake request before finance sees it","vi":"Chặn yêu cầu giả trước khi đến tay kế toán"},"body":{"en":"Advanced email defense on VCLOUD filters phishing, executive and partner spoofing and ransomware before they reach employees, with data hosted inside Vietnam.","vi":"Bảo vệ email nâng cao trên VCLOUD lọc phishing, giả mạo lãnh đạo và đối tác cùng ransomware trước khi tới nhân viên, dữ liệu được lưu trữ tại Việt Nam."},"points":[{"en":"Blocks spoofed invoices and payment-change requests","vi":"Chặn hóa đơn và yêu cầu đổi tài khoản giả mạo"},{"en":"Stops ransomware at the mail gateway","vi":"Ngăn ransomware ngay tại cổng email"},{"en":"Pair with a call-back rule for any bank-detail change","vi":"Kết hợp quy tắc gọi xác minh với mọi thay đổi tài khoản"}]},"scenario":{"en":"Friday, 16:20. An email that looks like the shipping line's invoice arrives with a new bank account, and the payment run closes in an hour.","vi":"Chiều thứ Sáu, 16:20. Một email trông như hóa đơn của hãng tàu báo số tài khoản mới, và đợt chi trả chốt sau một giờ nữa."},"scene":{"kind":"gate","dest":{"en":"Finance mailbox","vi":"Hộp thư kế toán"},"src":{"en":"Carrier & agent mail","vi":"Thư hãng tàu, đại lý"},"bad":[{"en":"Fake carrier invoice","vi":"Hoá đơn cước giả mạo"},{"en":"New bank account notice","vi":"Báo đổi tài khoản giả"},{"en":"Spoofed agent booking","vi":"Booking giả danh đại lý"}],"good":[{"en":"Verified freight invoice","vi":"Hoá đơn cước đã xác minh"},{"en":"Booking confirmation","vi":"Xác nhận booking"},{"en":"Customs broker notice","vi":"Thư đại lý hải quan"}],"before":{"en":"Exposed","vi":"Dễ bị lừa"},"after":{"en":"Protected","vi":"Được bảo vệ"}}},{"id":"uptime","persona":{"en":"CIO / Head of IT Operations","vi":"Giám đốc Công nghệ thông tin (CIO) / Trưởng vận hành IT"},"challenge":{"title":{"en":"Tracking, WMS and TMS Cannot Afford to Go Dark","vi":"Tracking, WMS và TMS không thể ngừng hoạt động"},"body":{"en":"When the tracking portal, warehouse system or transport management system is down, trucks queue, pickers idle and customers call for status. Ransomware or an unmanaged server across several depots and sites turns an IT problem into a delivery problem.","vi":"Khi cổng tracking, hệ thống kho hay hệ thống quản lý vận tải ngừng, xe phải xếp hàng chờ, nhân viên kho đứng chờ và khách hàng gọi hỏi tình trạng. Ransomware hoặc một máy chủ thiếu quản lý ở nhiều kho, nhiều điểm khiến sự cố IT trở thành sự cố giao hàng."}},"solutions":["email-security"],"response":{"title":{"en":"Run core systems on sovereign cloud, keep the front door clean","vi":"Vận hành hệ thống lõi trên đám mây chủ quyền, giữ cửa vào sạch"},"body":{"en":"VCLOUD hosts business-critical applications inside Vietnam, while email defense closes the most common route for ransomware into your sites. Sizing and service levels are agreed with your V-Tech Foundry team.","vi":"VCLOUD lưu trữ các ứng dụng trọng yếu ngay tại Việt Nam, còn bảo vệ email chặn đường xâm nhập phổ biến nhất của ransomware vào các điểm của bạn. Quy mô và mức dịch vụ được thống nhất cùng đội ngũ V-Tech Foundry."},"points":[{"en":"Sovereign cloud hosting in Vietnam","vi":"Đám mây chủ quyền đặt tại Việt Nam"},{"en":"Ransomware blocked at the mail gateway","vi":"Ransomware bị chặn tại cổng email"},{"en":"One provider for hosting and email security","vi":"Một đầu mối cho hạ tầng và bảo mật email"}]},"scenario":{"en":"Peak season, 06:15. Trucks queue at the depot gate while the tracking portal and the warehouse system stop responding.","vi":"Mùa cao điểm, 6:15. Xe xếp hàng trước cổng kho trong lúc cổng tracking và hệ thống kho ngừng phản hồi."},"scene":{"kind":"wave","capacity":{"en":"Capacity","vi":"Công suất"},"down":{"en":"Tracking down","vi":"Tracking ngừng"},"edge":{"en":"Cloud nodes inside Vietnam","vi":"Nút đám mây tại Việt Nam"},"before":{"en":"Overloaded","vi":"Quá tải"},"after":{"en":"Online","vi":"Ổn định"}}},{"id":"core-data","persona":{"en":"Head of Warehouse / Transport Systems","vi":"Trưởng bộ phận Hệ thống Kho vận"},"challenge":{"title":{"en":"Too Many Hands on WMS and TMS Databases","vi":"Quá nhiều người có quyền trên CSDL WMS và TMS"},"body":{"en":"Administrators, developers, integration partners and customer-system vendors all touch order, inventory and rate data. Without query-level control, a privileged account can read tariffs, change a consignee or alter stock records without anyone noticing in time.","vi":"Quản trị viên, lập trình viên, đối tác tích hợp và nhà cung cấp hệ thống của khách hàng đều chạm vào dữ liệu đơn hàng, tồn kho và bảng giá. Thiếu kiểm soát mức truy vấn, một tài khoản đặc quyền có thể xem bảng giá, đổi người nhận hoặc sửa tồn kho mà không ai kịp phát hiện."}},"solutions":["database-security"],"response":{"title":{"en":"Every query controlled, sensitive fields masked","vi":"Mọi truy vấn được kiểm soát, trường nhạy cảm được che"},"body":{"en":"Query-level access control and real-time masking restrict who can see or change operational data, without slowing live order and dispatch transactions.","vi":"Kiểm soát truy cập mức truy vấn và che giấu dữ liệu thời gian thực hạn chế ai được xem hoặc sửa dữ liệu vận hành, mà không làm chậm giao dịch đơn hàng và điều phối trực tiếp."},"points":[{"en":"Proxy gateway limits direct database access","vi":"Cổng proxy hạn chế truy cập trực tiếp CSDL"},{"en":"Tariffs and customer details masked for unauthorized admins","vi":"Bảng giá, thông tin khách che với quản trị viên không có quyền"},{"en":"Audit trail of every change","vi":"Nhật ký kiểm toán mọi thay đổi"}]},"scenario":{"en":"Tuesday, 23:40. An integration vendor's account runs a broad query on the order and tariff tables while the dispatch team is offline.","vi":"Tối thứ Ba, 23:40. Tài khoản của nhà cung cấp tích hợp chạy truy vấn rộng trên bảng đơn hàng và bảng giá khi đội điều phối đã nghỉ."},"scene":{"kind":"mask","table":{"en":"WMS/TMS · orders","vi":"WMS/TMS · đơn hàng"},"actor":{"en":"Integration vendor","vi":"Nhà cung cấp tích hợp"},"rows":[{"k":{"en":"Order","vi":"Đơn hàng"},"v":"ORD-000123"},{"k":{"en":"Consignee","vi":"Người nhận"},"v":"Sample Trading Co.","s":1},{"k":{"en":"Phone","vi":"Điện thoại"},"v":"0900 000 000","s":1},{"k":{"en":"Tariff","vi":"Bảng giá"},"v":"0.00 / kg","s":1}],"before":{"en":"Unwatched","vi":"Bỏ ngỏ"},"after":{"en":"Controlled","vi":"Có kiểm soát"}}},{"id":"partner-data","persona":{"en":"Chief Compliance / Data Protection Officer","vi":"Giám đốc Tuân thủ / Phụ trách bảo vệ dữ liệu"},"challenge":{"title":{"en":"Partner, Driver and Customer Data Leaking Out","vi":"Dữ liệu đối tác, tài xế và khách hàng bị thất thoát"},"body":{"en":"Consignee addresses and phone numbers, driver records, customer lists and rate cards circulate through chat apps, personal webmail, USB drives and partner apps. A departing sales or operations employee can take a customer base with them, and a leak raises Decree 13 questions.","vi":"Địa chỉ, số điện thoại người nhận, hồ sơ tài xế, danh sách khách hàng và bảng giá lưu chuyển qua ứng dụng chat, webmail cá nhân, USB và ứng dụng của đối tác. Nhân viên kinh doanh hay vận hành nghỉ việc có thể mang theo cả tệp khách hàng, và một vụ lộ dữ liệu kéo theo vấn đề tuân thủ Nghị định 13."}},"solutions":["dlp"],"response":{"title":{"en":"See sensitive data wherever it tries to leave","vi":"Thấy dữ liệu nhạy cảm ở mọi nơi nó cố rời đi"},"body":{"en":"360-degree monitoring across chat apps, personal webmail and USB drives detects customer and personal records automatically, helping stop insider leaks and supporting Decree 13 compliance.","vi":"Giám sát 360° trên ứng dụng chat, webmail cá nhân và USB tự động nhận diện hồ sơ khách hàng và dữ liệu cá nhân, giúp ngăn rò rỉ nội bộ và hỗ trợ tuân thủ Nghị định 13."},"points":[{"en":"Covers chat, webmail and USB","vi":"Bao phủ chat, webmail và USB"},{"en":"Auto-detects customer and personal data","vi":"Tự nhận diện dữ liệu khách hàng và cá nhân"},{"en":"Evidence ready for audits and disputes","vi":"Bằng chứng sẵn sàng cho kiểm toán và tranh chấp"}]},"scenario":{"en":"Friday, 17:30. A sales manager who has just resigned copies the customer and rate-card files to a personal drive.","vi":"Chiều thứ Sáu, 17:30. Một trưởng nhóm kinh doanh vừa nộp đơn nghỉ việc chép tệp khách hàng và bảng giá vào ổ cá nhân."},"scene":{"kind":"perimeter","asset":{"en":"Customer & driver data","vi":"Dữ liệu khách, tài xế"},"channels":[{"en":"Group chats","vi":"Nhóm chat","icon":"message-circle"},{"en":"Personal webmail","vi":"Webmail cá nhân","icon":"mail"},{"en":"USB drive","vi":"Ổ USB","icon":"hard-drive"}],"before":{"en":"Leaking","vi":"Đang rò rỉ"},"after":{"en":"Contained","vi":"Đã ngăn chặn"}}},{"id":"contracts","persona":{"en":"Head of Legal / Customs & Documentation","vi":"Trưởng bộ phận Pháp chế / Chứng từ & Hải quan"},"challenge":{"title":{"en":"Contracts and Customs Documents Reviewed by Hand","vi":"Hợp đồng và chứng từ hải quan rà soát thủ công"},"body":{"en":"Freight contracts, carrier and warehouse agreements, bills of lading and customs declarations all need careful checking for liability clauses, terms and inconsistencies. Manual review slows quoting and clearance, and errors can mean penalties or disputes.","vi":"Hợp đồng vận chuyển, hợp đồng với hãng tàu và kho, vận đơn và tờ khai hải quan đều cần kiểm tra kỹ điều khoản trách nhiệm, điều kiện và điểm không nhất quán. Rà soát thủ công làm chậm báo giá và thông quan, còn sai sót có thể dẫn tới phạt hoặc tranh chấp."}},"solutions":["ai-legal"],"response":{"title":{"en":"Faster first-pass review, with people in control","vi":"Rà soát vòng đầu nhanh hơn, con người vẫn quyết định"},"body":{"en":"A specialized AI assistant reviews contracts and regulatory documents to flag clauses and gaps for your legal team, with an on-premise option so commercial documents stay in your environment. Scope for logistics and customs content is confirmed with V-Tech Foundry during assessment.","vi":"Trợ lý AI chuyên biệt rà soát hợp đồng và văn bản quy định, đánh dấu điều khoản và điểm thiếu cho đội pháp chế, có tùy chọn on-premise để tài liệu thương mại nằm trong môi trường của bạn. Phạm vi áp dụng cho nội dung logistics và hải quan được xác nhận cùng V-Tech Foundry khi khảo sát."},"points":[{"en":"Automates routine contract review","vi":"Tự động hóa rà soát hợp đồng thường nhật"},{"en":"On-premise option for total privacy","vi":"Tùy chọn on-premise bảo mật tuyệt đối"},{"en":"Frees legal and documentation staff for exceptions","vi":"Giải phóng pháp chế và chứng từ cho các trường hợp ngoại lệ"}]},"scenario":{"en":"Thursday, 16:30. A rate quote and a customs declaration both wait on the legal desk, and the cargo is already at the port.","vi":"Chiều thứ Năm, 16:30. Một bản báo giá và một tờ khai hải quan cùng chờ phòng pháp chế duyệt, trong khi hàng đã nằm tại cảng."},"scene":{"kind":"scan","doc":{"en":"Freight contract","vi":"Hợp đồng vận chuyển"},"flags":[{"en":"Liability gap","vi":"Trách nhiệm mơ hồ"},{"en":"Term conflict","vi":"Xung đột điều khoản"},{"en":"Penalty clause","vi":"Điều khoản phạt"}],"timeBefore":{"en":"Days","vi":"Nhiều ngày"},"timeAfter":{"en":"Minutes","vi":"Vài phút"},"perDoc":{"en":"per first-pass review","vi":"mỗi lượt rà soát đầu"},"before":{"en":"Manual","vi":"Thủ công"},"after":{"en":"Automated","vi":"Tự động"}}}],"outcomes":[{"title":{"en":"Protect Cash and Cargo Flow","vi":"Bảo vệ dòng tiền và dòng hàng"},"body":{"en":"Block fake invoices and ransomware at the email layer and keep core systems on sovereign cloud, so payments and shipments keep moving.","vi":"Chặn hóa đơn giả và ransomware ở lớp email, giữ hệ thống lõi trên đám mây chủ quyền để thanh toán và vận chuyển không bị gián đoạn."}},{"title":{"en":"Protect Customer, Partner and Driver Data","vi":"Bảo vệ dữ liệu khách hàng, đối tác và tài xế"},"body":{"en":"Control database access and monitor data leaving through chat, webmail and USB, reducing leak risk and helping prepare for Decree 13.","vi":"Kiểm soát truy cập CSDL và giám sát dữ liệu rời đi qua chat, webmail, USB, giảm rủi ro rò rỉ và giúp chuẩn bị cho Nghị định 13."}},{"title":{"en":"Cut Manual Document Work","vi":"Giảm công việc chứng từ thủ công"},"body":{"en":"Automate first-pass contract and document review so legal and operations teams spend time on exceptions, not routine checking.","vi":"Tự động hóa rà soát hợp đồng và chứng từ vòng đầu để đội pháp chế và vận hành tập trung vào ngoại lệ thay vì kiểm tra lặp lại."}}],"faq":[{"q":{"en":"How do we reduce the risk of paying a fake freight invoice?","vi":"Làm sao giảm rủi ro thanh toán nhầm hóa đơn cước giả?"},"a":{"en":"Email defense on VCLOUD filters spoofed carrier, partner and executive emails before they reach staff. We also recommend a process control: verify any bank-detail change by calling a known number.","vi":"Bảo vệ email trên VCLOUD lọc email giả danh hãng tàu, đối tác và lãnh đạo trước khi
